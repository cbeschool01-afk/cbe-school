   learners matched to the class list -> editable table -> checks (invalid, missing, unsure, unmatched, duplicates, would-overwrite)
   -> teacher confirms -> saved with who/when. Existing marks are never replaced unless the teacher explicitly confirms.
   Manual entry and Excel/CSV import are untouched. */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const MAXPAGES=4;
let S=null;
const ABS=/^(ab|abs|absent|a|x|-+|—|n\/?a|nil)$/i;
const MAPCH={O:'0',o:'0',D:'0',l:'1',I:'1',i:'1','|':'1',S:'5',s:'5',B:'8',Z:'2',z:'2'};
const hashStr=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(16); };
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function enhance(url){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d'); g.drawImage(im,0,0); const d=g.getImageData(0,0,c.width,c.height), p=d.data; let lo=255,hi=0; for(let i=0;i<p.length;i+=4){ const y=p[i]*.3+p[i+1]*.59+p[i+2]*.11; p[i]=p[i+1]=p[i+2]=y; if(y<lo)lo=y; if(y>hi)hi=y; } const k=255/Math.max(1,hi-lo); for(let i=0;i<p.length;i+=4){ const v=Math.max(0,Math.min(255,(p[i]-lo)*k)); p[i]=p[i+1]=p[i+2]=v; } g.putImageData(d,0,0); res(c.toDataURL('image/jpeg',0.92)); }catch(e){ res(url); } }; im.onerror=()=>res(url); im.src=url; }); }
/* ---------- parsing OCR lines ---------- */
function numTok(w){
  const t=w.replace(/[,;:]+$/,'');
  if(/^\d{1,3}(\.\d{1,2})?$/.test(t)) return {raw:t,unsure:false};
  if(ABS.test(t)) return {raw:'',absent:true,unsure:false};
  if(/^[0-9OolIiSsBZzD|]{1,3}$/.test(t) && /\d/.test(t)){ return {raw:t.replace(/[OolIiSsBZzD|]/g,ch=>MAPCH[ch]||ch),unsure:true}; }
  return null;
}
function parseLine(L){
  const text=String(L.text||'').replace(/[_\[\]{}~`^*=<>\\]/g,' ').replace(/\s+/g,' ').trim(); if(!text) return null;
  const toks=text.split(' '); const name=[], nums=[]; let adm='', seenMark=false;
  toks.forEach((w,i)=>{
    if(i===0 && /^\d{1,3}[\.\):\-]?$/.test(w) && toks.length>2 && /[A-Za-z]{2}/.test(toks[1])) return;                 // row number
    if(/^[A-Za-z]{0,3}\d{4,}([\/\-]\d+)?$/.test(w) || /^\d{2,}\/\d{2,}$/.test(w)){ if(!adm) adm=w; return; }       // admission number
    const alpha=w.replace(/^[^A-Za-z\u00C0-\u024F]+|[^A-Za-z\u00C0-\u024F'’\.\-]+$/g,'');
    const nt=numTok(w);
    if(nt && (name.length>0 || nums.length>0)){ nums.push(nt); seenMark=true; return; }
    if(alpha.length>=2 && !seenMark && /[A-Za-z\u00C0-\u024F]{2}/.test(alpha)) name.push(alpha);
  });
  return {name:name.join(' ').trim(),adm,nums,conf:Number(L.confidence)||0,text};
}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function headerCols(lines){
  const best={n:0,cols:[]};
  lines.forEach(L=>{
    const words=norm(L.text).split(' ').filter(Boolean), cols=[];
    words.forEach(w=>{ const s=S.subs.find(s=>norm(s.code)===w || (w.length>=3 && norm(s.name).split(' ')[0].startsWith(w.slice(0,Math.max(3,Math.min(w.length,5)))))); if(s && !cols.includes(s.id)) cols.push(s.id); });
    if(cols.length>best.n){ best.n=cols.length; best.cols=cols; }
  });
  return best.n>=2?best.cols:null;
}
function detectMax(lines){ const t=lines.map(l=>l.text).join(' '); const m=t.match(/(?:out\s*of|max(?:imum)?(?:\s*marks?)?)\s*[:=\-]?\s*(\d{2,3})/i); return m?Number(m[1]):null; }
function matchStudent(r){
  const studs=S.studs;
  if(r.adm){ const a=studs.find(s=>s.admNo && s.admNo.toLowerCase()===r.adm.toLowerCase()); if(a) return {s:a,type:'adm'}; }
  const nn=normName(r.name); if(!nn) return {s:null,type:'none'};
  const ex=studs.filter(s=>normName(s.name)===nn); if(ex.length===1) return {s:ex[0],type:'exact'};
  const sorted=n=>norm(n).split(' ').filter(Boolean).sort().join(' ');
  const same=studs.filter(s=>sorted(s.name)===sorted(r.name)); if(same.length===1) return {s:same[0],type:'fuzzy'};   // same names, different order
  const toks=norm(r.name).split(' ').filter(Boolean);
  if(toks.length>=2){ const sub=studs.filter(s=>{ const st=norm(s.name).split(' '); return toks.every(t=>st.some(x=>x===t||sim(x,t)>=.85)); }); if(sub.length===1) return {s:sub[0],type:'fuzzy'}; }
  const sc=studs.map(s=>({s,v:sim(norm(s.name),norm(r.name))})).sort((a,b)=>b.v-a.v);
  if(sc[0]&&sc[0].v>=.78&&(!sc[1]||sc[0].v-sc[1].v>=.08)) return {s:sc[0].s,type:'fuzzy'};
  return {s:null,type:'none'};
}
/* ---------- build rows ---------- */
function buildRows(lines){
  S.detectedMax=detectMax(lines);
  const parsed=lines.map(parseLine).filter(p=>p && p.name && p.name.length>=3 && (p.nums.length>0 || p.adm) && !/^(total|totals|mean|average|avg|grand|position|pos|out of|max|maximum|subject|name|names|class|exam|term)\b/i.test(p.name));
  const hdr=S.mode==='many'?headerCols(lines):null;
  if(S.mode==='one') S.cols=[S.subjectId];
  else if(hdr) S.cols=hdr.slice();
  else { const cnt={}; parsed.forEach(p=>{ cnt[p.nums.length]=(cnt[p.nums.length]||0)+1; }); const mode=Number(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0])||1; S.cols=S.subs.slice(0,Math.min(mode,S.subs.length)).map(s=>s.id); }
  S.rows=parsed.map(p=>{
    const m=matchStudent(p);
    const cells=S.cols.map((_,i)=>{ const n=p.nums[i]; return n?{raw:n.raw,unsure:!!n.unsure||p.conf<65,absent:!!n.absent}:{raw:'',unsure:false,absent:false}; });
    return {id:uid('pm'),readAs:p.name,adm:p.adm,studentId:m.s?m.s.id:'',match:m.type,cells,conf:p.conf,extra:S.mode==='one'&&p.nums.length>1,include:false,touched:false,state:'',msgs:[]};
  });
}
/* ---------- checks ---------- */
const exVal=(sid,sub)=>{ const v=S.exam.results&&S.exam.results[sid]&&S.exam.results[sid][sub]; return v==null||v===''?null:Number(v); };
function cellInfo(r,i){
  const c=r.cells[i], sub=S.cols[i]; if(!sub) return {st:'ignore'};
  const raw=String(c.raw).trim(); if(raw===''){ return {st:c.absent?'absent':'missing'}; }
  const n=Number(raw); const max=maxFor(S.exam,sub);
  if(isNaN(n)||n<0||n>max) return {st:'invalid',max};
  const ex=r.studentId?exVal(r.studentId,sub):null;
  if(ex!=null && ex===n) return {st:'same',n};
  if(ex!=null) return {st:'replace',n,ex};
  return {st:c.unsure&&!r._ok?'unsure':'ok',n};
}
function analyse(){
  const seen=new Map();
  S.rows.forEach((r,idx)=>{
    const m=[]; let st='ready';
    const up=(s,t)=>{ const o={ready:0,review:1,dup:2,unmatched:3}; if(o[s]>o[st]) st=s; if(t) m.push(t); };
    if(!r.studentId) up('unmatched','No learner matched — choose the right learner, or leave unticked to skip');
    else {
      if(seen.has(r.studentId)) up('dup','This learner is already on row '+(seen.get(r.studentId)+1)); else seen.set(r.studentId,idx);
      if(r.match==='fuzzy' && !r._okMatch) up('review','Matched by similar spelling — confirm it is the right learner');
    }
    let ok=0,inv=0,miss=0,uns=0,rep=0;
    r.cells.forEach((c,i)=>{ const ci=cellInfo(r,i); if(ci.st==='ok') ok++; else if(ci.st==='invalid'){ inv++; } else if(ci.st==='missing') miss++; else if(ci.st==='unsure'){ uns++; } else if(ci.st==='replace') rep++; });
    if(inv) up('review',inv+' invalid mark'+(inv>1?'s':'')+' (not a number, negative or above the maximum) — will not be saved');
    if(miss) up('review',miss+' mark'+(miss>1?'s':'')+' missing');
    if(uns) up('review',uns+' reading'+(uns>1?'s':'')+' uncertain — check against the sheet');
    if(rep) m.push(rep+' would replace an existing mark (needs your confirmation)');
    if(r.extra) up('review','More numbers than expected on this line — check which is the mark');
    r.state=st; r.msgs=m;
    if(st==='unmatched'||st==='dup') r.include=false;
  });
}
function autoInclude(){ S.rows.forEach(r=>{ r.include=(r.state==='ready'); }); }
/* ---------- UI shell ---------- */
function head(t){ return '<div class="modal-head"><h2>'+t+'</h2><button class="x" id="pm-x" aria-label="Close">✕</button></div>'; }
function shell(){ openModal('<div id="pm-root"></div>',true); const bg=$('modal-bg'); if(bg) bg.replaceWith(bg.cloneNode(true)); }
function cancel(){ if(S && S.step!=='done' && S.step!=='pick' && S.rows.length && !window.confirm('Cancel this import? No marks have been saved and the extracted marks will be discarded.')) return; S=null; closeModal(); }
function bindX(){ const x=$('pm-x'); if(x) x.onclick=cancel; }
function open(){
  const exam=examById(STATE.params.examId); if(!exam) return toast('Open an examination in Marks Entry first.');
  const subs=enterableSubjects(exam);
  if(!subs.length) return problem('You have no subjects to enter marks for in this examination.','Ask the Class Teacher to assign subjects to you.');
  const studs=examStudents(exam).slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(!studs.length) return problem('This examination has no learners yet.','Add learners to the class first (Students page).');
  S={exam,subs,studs,mode:'one',subjectId:(STATE.params.subjectId&&subs.find(s=>s.id===STATE.params.subjectId))?STATE.params.subjectId:subs[0].id,files:[],rows:[],cols:[],step:'pick',quality:'good',notes:[],detectedMax:null};
  shell(); drawPick();
}
function drawPick(msg){
  const e=S.exam, c=classById(e.classId)||{}, sch=schoolById(e.schoolId||c.schoolId)||{};
  $('pm-root').innerHTML=head('Import marks from a photo')+`
    <div class="small" style="margin-bottom:8px"><strong>${esc(e.name)}</strong> · ${esc(c.name||'')}${e.streamId?' · '+esc((streamById(e.streamId)||{}).name||''):''} · ${esc(e.term)} ${esc(e.year)} · ${esc(sch.name||'')}</div>
    <div class="field"><label>What does the sheet show?</label>
      <label style="display:block"><input type="radio" name="pm-mode" value="one" ${S.mode==='one'?'checked':''}> One subject — learner name and mark</label>
      <label style="display:block"><input type="radio" name="pm-mode" value="many" ${S.mode==='many'?'checked':''}> Several subjects — a column of marks for each subject</label></div>
    <div class="field" id="pm-subwrap" ${S.mode==='one'?'':'style="display:none"'}><label>Subject</label><select id="pm-sub">${S.subs.map(s=>`<option value="${esc(s.id)}" ${s.id===S.subjectId?'selected':''}>${esc(s.name)} (out of ${maxFor(e,s.id)})</option>`).join('')}</select></div>
    <div class="ph-drop" style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0"><button class="btn primary" id="pm-cam-b">📷 Take a photo</button><button class="btn" id="pm-up-b">🖼 Upload picture(s)</button>
      <input type="file" id="pm-cam" accept="image/*" capture="environment" hidden><input type="file" id="pm-up" accept="image/*,.heic,.heif" multiple hidden></div>
    <div class="ph-thumbs" id="pm-thumbs" style="display:flex;gap:8px;flex-wrap:wrap"></div><div id="pm-msg">${msg||''}</div>
    <div class="small">Tips: photograph the whole sheet flat and straight, in good light, with the marks columns clear. Printed or neatly written numbers read best — you will check every mark before it is saved.</div>
    <div class="ph-priv" style="font-size:11.5px;color:var(--ink-soft);margin-top:6px">🔒 The picture is read on this device and is not uploaded anywhere. (The reading tool downloads once, about 10 MB.)</div>
    <div class="modal-foot"><button class="btn" id="pm-cancel">Cancel</button><button class="btn primary" id="pm-read" ${S.files.length?'':'disabled'}>Read the marks</button></div>`;
  bindX(); $('pm-cancel').onclick=cancel;
  document.querySelectorAll('input[name=pm-mode]').forEach(r=>r.onchange=()=>{ S.mode=r.value; $('pm-subwrap').style.display=S.mode==='one'?'':'none'; });
  $('pm-sub').onchange=ev=>{ S.subjectId=ev.target.value; };
  $('pm-cam-b').onclick=()=>$('pm-cam').click(); $('pm-up-b').onclick=()=>$('pm-up').click();
  $('pm-cam').onchange=ev=>addFiles(ev.target.files); $('pm-up').onchange=ev=>addFiles(ev.target.files); $('pm-read').onclick=readAll; thumbs();
}
function thumbs(){ const t=$('pm-thumbs'); if(!t) return; t.innerHTML=S.files.map((f,i)=>`<div class="ph-thumb"><img src="${f.thumb}" alt="Page ${i+1}"><button data-rm="${i}" aria-label="Remove">×</button></div>`).join(''); t.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ S.files.splice(Number(b.dataset.rm),1); thumbs(); }); $('pm-read').disabled=!S.files.length; }
async function addFiles(list){
  const notes=[];
  for(const f of [...list]){
    if(S.files.length>=MAXPAGES){ notes.push('<div class="ph-warn">Only '+MAXPAGES+' pictures can be read at once.</div>'); break; }
    try{ const p=await window.cbeOcr.prep(f); S.files.push(p);
      if(Math.min(p.w,p.h)<700) notes.push('<div class="ph-warn">“'+esc(p.name)+'” is small ('+p.w+'×'+p.h+') — small photos make marks hard to read.</div>');
      if(p.lum<60) notes.push('<div class="ph-warn">“'+esc(p.name)+'” is very dark — retake it in better light.</div>');
      if(p.lum>238) notes.push('<div class="ph-warn">“'+esc(p.name)+'” has glare or is washed out — retake it if marks are missed.</div>');
    }catch(err){ notes.push('<div class="ph-bad">“'+esc(f.name||'picture')+'” could not be opened. '+(err.message==='big'?'It is larger than 25 MB.':'Use a JPG/PNG photo, or take a new photo with the camera button.')+'</div>'); }
  }
  thumbs(); const m=$('pm-msg'); if(m) m.innerHTML=notes.join('');
}
async function readAll(){
  const root=$('pm-root'); const lines=[]; let confs=[], failed=0;
  try{
    for(let i=0;i<S.files.length;i++){
      root.innerHTML=head('Reading the sheet…')+`<div style="display:flex;gap:14px;align-items:center;padding:24px 4px"><div class="cbe-spin"></div><div>Reading picture ${i+1} of ${S.files.length}<span id="pm-pc"></span><div class="small">The first read downloads the reading tool (about 10 MB).</div></div></div>`;
      try{
        const w=await window.cbeOcr.getWorker(pc=>{ const e=$('pm-pc'); if(e) e.textContent=' ('+pc+'%)'; });
        try{ await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'}); }catch(e){}
        const img=await enhance(S.files[i].thumb);
        const r=await w.recognize(img); const d=r.data||{};
        (d.lines||[]).forEach(l=>lines.push(l)); confs.push(Number(d.confidence)||0);
      }catch(e){ console.error(e); failed++; S.notes.push('Picture '+(i+1)+': '+(e&&e.message==='lib'?'the reading tool could not be downloaded — connect to the internet once and try again.':'could not be read.')); }
    }
  } finally { try{ await window.cbeOcr.killWorker(); }catch(e){} }
  const mc=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:0;
  S.quality=!confs.length?'unreadable':mc<45?'unreadable':mc<62?'poor':mc<78?'fair':'good';
  if(!lines.length||S.quality==='unreadable'){ drawPick('<div class="ph-bad"><strong>The sheet could not be read.</strong> '+(S.notes.join(' ')||'The picture is too blurry, dark or small.')+'<br>Retake it flat, in good light and closer — or use Excel/CSV import or type the marks in.</div>'); S.notes=[]; return; }
  buildRows(lines);
  if(!S.rows.length){ drawPick('<div class="ph-bad"><strong>No learner marks were found.</strong> The text was read but no “name + marks” lines were recognised. Make sure the whole table is in the picture, or use Excel/CSV import.</div>'); return; }
  analyse(); autoInclude(); S.step='review'; draw();
}
/* ---------- review ---------- */
function sumHtml(){
  const R=S.rows; let rdy=0,rev=0,um=0,dp=0,inv=0,mis=0,rep=0,sel=0;
  R.forEach(r=>{ if(r.state==='ready')rdy++; else if(r.state==='review')rev++; else if(r.state==='unmatched')um++; else if(r.state==='dup')dp++; if(r.include) sel++; r.cells.forEach((c,i)=>{ const x=cellInfo(r,i); if(x.st==='invalid')inv++; else if(x.st==='missing')mis++; else if(x.st==='replace')rep++; }); });
  return `<span>✅ ${rdy} ready</span><span>⚠ ${rev} to check</span><span>❓ ${um} unmatched</span><span>⛔ ${dp} duplicate</span><span>🔴 ${inv} invalid marks</span><span>⬜ ${mis} missing</span><span>🟠 ${rep} would replace</span><span><strong>${sel} rows ticked</strong></span>`;
}
function draw(){
  const e=S.exam, q=S.quality;
  const banner=(q==='poor'?'<div class="ph-bad"><strong>Poor image quality.</strong> Many marks may be wrong or missing — check every row against the sheet.</div>':q==='fair'?'<div class="ph-warn">The picture is only fairly clear — check highlighted cells.</div>':'')+
    (S.detectedMax?(()=>{ const bad=S.cols.filter(id=>maxFor(e,id)!==S.detectedMax).length; return bad?`<div class="ph-warn">The sheet seems to say “out of ${S.detectedMax}”, but this examination uses a different maximum for ${bad} of the subjects shown. Marks are checked against the examination’s maximum.</div>`:''; })():'')+
    S.notes.map(n=>'<div class="ph-warn">'+esc(n)+'</div>').join('');
  const subOpts=sel=>'<option value="">— ignore this column —</option>'+S.subs.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.name)} (/${maxFor(e,s.id)})</option>`).join('');
  $('pm-root').innerHTML=head('Check the marks')+banner+`<div class="small"><strong>${esc(e.name)}</strong> · ${esc((classById(e.classId)||{}).name||'')} · ${esc(e.term)} ${esc(e.year)}</div><div class="pm-sum" id="pm-sum"></div>
    <div class="ph-scroll" style="overflow:auto;max-height:50vh;border:1px solid var(--line);border-radius:8px"><table class="pm-table"><thead><tr><th style="width:34px">Save</th><th>Read from sheet</th><th style="min-width:170px">Learner in class</th>
      ${S.cols.map((id,i)=>`<th style="min-width:130px">${S.mode==='many'?`<select data-col="${i}">${subOpts(id)}</select>`:esc((subjectById(id)||{}).name||'')+' <span class="small">/'+maxFor(e,id)+'</span>'}</th>`).join('')}
      <th style="min-width:170px">Status</th><th style="width:30px"></th></tr></thead><tbody id="pm-tb"></tbody></table></div>
    <div class="actions" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="pm-add">+ Add a learner row</button><button class="btn sm" id="pm-allready">Tick all ready rows</button><button class="btn sm" id="pm-again">↩ Different photo</button></div>
    <div class="small" style="margin-top:6px">Yellow = uncertain (not ticked until you check it). Red = unmatched, duplicate or invalid. Blank = missing. Orange = would replace an existing mark — nothing is replaced unless you confirm on the next screen.</div>
    <div class="modal-foot"><button class="btn" id="pm-cancel">Cancel import</button><button class="btn primary" id="pm-go">Review &amp; save</button></div>`;
  bindX(); $('pm-cancel').onclick=cancel;
  const tb=$('pm-tb'); S.rows.forEach((r,i)=>tb.appendChild(rowEl(r,i)));
  document.querySelectorAll('[data-col]').forEach(s=>s.onchange=()=>{ const i=Number(s.dataset.col); const v=s.value; if(v&&S.cols.includes(v)&&S.cols[i]!==v){ toast('That subject is already used by another column.','error'); s.value=S.cols[i]; return; } S.cols[i]=v; refresh(); });
  tb.oninput=ev=>{ const tr=ev.target.closest('tr'); if(!tr) return; const r=S.rows[Number(tr.dataset.i)]; if(ev.target.dataset.c!==undefined){ const c=r.cells[Number(ev.target.dataset.c)]; c.raw=ev.target.value.replace(',','.').trim(); c.unsure=false; c.absent=false; r.touched=true; r._ok=true; } refresh(); };
  tb.onchange=ev=>{ const tr=ev.target.closest('tr'); if(!tr) return; const r=S.rows[Number(tr.dataset.i)];
    if(ev.target.dataset.inc!==undefined){ r.include=ev.target.checked; if(ev.target.checked){ r._ok=true; r._okMatch=true; } refresh(); }
    if(ev.target.dataset.stu!==undefined){ r.studentId=ev.target.value; r.match=r.studentId?'manual':'none'; r._okMatch=true; refresh(); } };
  tb.onclick=ev=>{ const b=ev.target.closest('[data-del]'); if(!b) return; S.rows.splice(Number(b.dataset.del),1); draw(); };
  $('pm-add').onclick=()=>{ S.rows.push({id:uid('pm'),readAs:'(added by you)',adm:'',studentId:'',match:'none',cells:S.cols.map(()=>({raw:'',unsure:false,absent:false})),conf:100,extra:false,include:false,touched:true,state:'',msgs:[]}); draw(); };
  $('pm-allready').onclick=()=>{ S.rows.forEach(r=>{ if(r.state==='ready') r.include=true; }); refresh(); };
  $('pm-again').onclick=()=>{ if(S.rows.some(r=>r.touched)&&!window.confirm('Use a different photo? Your corrections will be lost.')) return; S.rows=[]; S.files=[]; S.step='pick'; S.notes=[]; drawPick(); };
  $('pm-go').onclick=()=>{ const sel=S.rows.filter(r=>r.include&&r.studentId); if(!sel.length) return problem('No rows are ticked for saving.','Tick the rows you have checked. Fix yellow and red rows first.',null); S.step='confirm'; drawConfirm(); };
  refresh();
}
function rowEl(r,i){
  const tr=document.createElement('tr'); tr.dataset.i=i;
  tr.innerHTML=`<td><input type="checkbox" data-inc></td><td class="small">${esc(r.readAs)}${r.adm?'<br>'+esc(r.adm):''}</td>
    <td><select data-stu><option value="">— not matched —</option>${S.studs.map(s=>`<option value="${esc(s.id)}" ${s.id===r.studentId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td>
    ${r.cells.map((c,ci)=>`<td class="center"><input type="text" inputmode="decimal" class="mk" data-c="${ci}" value="${esc(c.raw)}" maxlength="6"></td>`).join('')}
    <td class="small ph-st"></td><td><button class="btn ghost sm" data-del="${i}" aria-label="Remove row">✕</button></td>`;
  return tr;
}
function refresh(){
  analyse();
  [...$('pm-tb').children].forEach((tr,i)=>{ const r=S.rows[i]; if(!r) return; tr.className='s-'+r.state;
    const cb=tr.querySelector('[data-inc]'); cb.checked=r.include; cb.disabled=(r.state==='unmatched'||r.state==='dup');
    tr.querySelectorAll('input[data-c]').forEach((inp,ci)=>{ const x=cellInfo(r,ci); const sub=S.cols[ci];
      inp.disabled=!sub; inp.className='mk '+({invalid:'c-bad',unsure:'c-unsure',missing:'c-miss',replace:'c-over'}[x.st]||''); inp.title=x.st==='replace'?('Existing mark: '+x.ex):(x.st==='invalid'?('Must be a number from 0 to '+x.max):''); });
    tr.querySelector('.ph-st').innerHTML='<strong>'+({ready:'Ready',review:'Check',dup:'Duplicate',unmatched:'Unmatched'})[r.state]+'</strong>'+(r.msgs.length?'<br>'+r.msgs.map(esc).join('<br>'):''); });
  $('pm-sum').innerHTML=sumHtml();
}
/* ---------- confirm ---------- */
function ops(){
  const out=[]; S.rows.forEach(r=>{ if(!r.include||!r.studentId||r.state==='dup') return; r.cells.forEach((c,i)=>{ const sub=S.cols[i]; if(!sub) return; const x=cellInfo(r,i); if(x.st==='ok'||x.st==='unsure'||x.st==='replace') out.push({sid:r.studentId,sub,n:x.n,ex:x.ex==null?null:x.ex,rep:x.st==='replace'}); }); }); return out;
}
function payloadHash(list){ const bySub={}; list.forEach(o=>{ (bySub[o.sub]=bySub[o.sub]||[]).push(o.sid+':'+o.n); }); return Object.keys(bySub).sort().map(s=>({sub:s,hash:hashStr(S.exam.id+'|'+s+'|'+bySub[s].sort().join(','))})); }
function drawConfirm(){
  const e=S.exam, list=ops(), reps=list.filter(o=>o.rep), news=list.filter(o=>!o.rep);
  const hashes=payloadHash(list), log=e.marksLog||[];
  const dups=hashes.map(h=>log.find(l=>l.hash===h.hash)).filter(Boolean);
  const bySub={}; list.forEach(o=>{ bySub[o.sub]=(bySub[o.sub]||0)+1; });
  const skippedSame=S.rows.reduce((n,r)=>n+(r.include?r.cells.filter((_,i)=>cellInfo(r,i).st==='same').length:0),0);
  $('pm-root').innerHTML=head('Confirm marks')+`
    <p>Save <strong>${list.length}</strong> mark${list.length===1?'':'s'} into <strong>${esc(e.name)}</strong> (${esc((classById(e.classId)||{}).name||'')}, ${esc(e.term)} ${esc(e.year)}).</p>
    <ul class="small">${Object.keys(bySub).map(id=>`<li>${esc((subjectById(id)||{}).name||'')}: ${bySub[id]} mark${bySub[id]===1?'':'s'}</li>`).join('')}</ul>
    ${skippedSame?`<div class="small">${skippedSame} mark${skippedSame===1?' is':'s are'} already saved with the same value — nothing to change.</div>`:''}
    ${reps.length?`<div class="ph-warn"><strong>${reps.length} existing mark${reps.length===1?'':'s'} would be replaced</strong> (e.g. ${reps.slice(0,3).map(o=>esc((studentById(o.sid)||{}).name||'')+' '+o.ex+' → '+o.n).join('; ')}).<br><label><input type="checkbox" id="pm-ow"> Yes, replace these ${reps.length} existing mark${reps.length===1?'':'s'}</label><div class="small">If you leave this unticked, existing marks are kept and only the new marks are saved.</div></div>`:''}
    ${dups.length?`<div class="ph-bad"><strong>Possible duplicate upload.</strong> The same marks were already imported from a photo on ${esc(new Date(dups[0].at).toLocaleString())} by ${esc(dups[0].byName||'someone')}.<br><label><input type="checkbox" id="pm-again2"> Import them again anyway</label></div>`:''}
    <div class="small">Saved with your name and the time. Learner, school, class, examination and subject are recorded with every mark.</div>
    <div class="modal-foot"><button class="btn" id="pm-back">← Back to edit</button><button class="btn primary" id="pm-conf">Confirm and save</button></div>`;
  bindX(); $('pm-back').onclick=()=>{ S.step='review'; draw(); };
  const conf=$('pm-conf'); const gate=()=>{ const ok=(!dups.length||($('pm-again2')&&$('pm-again2').checked))&&(list.length>0); conf.disabled=!ok; }; gate();
  if($('pm-again2')) $('pm-again2').onchange=gate;
  conf.onclick=()=>commit(list,hashes,!!($('pm-ow')&&$('pm-ow').checked));
}
async function commit(list,hashes,overwrite){
  const btn=$('pm-conf'); btn.disabled=true; btn.textContent='Saving…';     // blocks double submission
  const e=S.exam; const done=[], undo=[];
  try{
    const todo=list.filter(o=>!o.rep||overwrite);
    todo.forEach(o=>{ if(!canEnterSubject(o.sub,e.classId)) throw new Error('You are not allowed to enter marks for '+((subjectById(o.sub)||{}).name||'that subject')+'.'); });
    if(!todo.length) throw new Error('There is nothing new to save — the existing marks were kept.');
    e.results=e.results||{};
    const prevMeta=JSON.parse(JSON.stringify(e.marksMeta||{})), prevLog=JSON.parse(JSON.stringify(e.marksLog||[]));
    todo.forEach(o=>{ e.results[o.sid]=e.results[o.sid]||{}; undo.push({sid:o.sid,sub:o.sub,prev:e.results[o.sid][o.sub]}); e.results[o.sid][o.sub]=o.n; done.push(o); MARKS_DIRTY.add(markKey(e.id,o.sid,o.sub)); });
    const subs=[...new Set(todo.map(o=>o.sub))], now=new Date().toISOString();
    e.marksLog=e.marksLog||[];
    subs.forEach(sub=>{
      stampMarks(e,sub,'photo');
      const h=(hashes.find(x=>x.sub===sub)||{}).hash||'';
      e.marksLog.push({id:uid('ml'),at:now,by:CURRENT_USER.id,byName:CURRENT_USER.name,method:'photo',subjectId:sub,schoolId:e.schoolId,classId:e.classId,
        cells:todo.filter(o=>o.sub===sub).length,replaced:todo.filter(o=>o.sub===sub&&o.rep).length,hash:h});
    });
    if(e.marksLog.length>100) e.marksLog=e.marksLog.slice(-100);
    audit('marks_imported_photo',{schoolId:e.schoolId,classId:e.classId,examId:e.id,count:todo.length,replaced:todo.filter(o=>o.rep).length});
    try{ await saveMarksNow(e.classId); }
    catch(err){ undo.forEach(u=>{ if(u.prev===undefined) delete e.results[u.sid][u.sub]; else e.results[u.sid][u.sub]=u.prev; }); e.marksMeta=prevMeta; e.marksLog=prevLog; throw new Error('The marks could not be stored ('+(err&&err.message||'network or permission problem')+'). Nothing was changed.'); }
    done.forEach(o=>MARKS_DIRTY.delete(markKey(e.id,o.sid,o.sub))); updateSaveBar();
    const left=S.rows.filter(r=>!r.include||r.state==='unmatched'||r.state==='dup');
    S.result={saved:todo.length,replaced:todo.filter(o=>o.rep).length,keptExisting:list.length-todo.length,left}; S.step='done'; drawDone();
  }catch(err){
    S.step='review'; draw();
    $('pm-root').insertAdjacentHTML('afterbegin','<div class="ph-bad"><strong>Import failed.</strong> '+esc(err.message||'Something went wrong.')+' Your corrections are still here.</div>');
  }
}
function drawDone(){
  const R=S.result;
  $('pm-root').innerHTML=head('Marks saved')+`<div class="ph-ok"><strong>${R.saved} mark${R.saved===1?'':'s'} saved</strong>${R.replaced?` (${R.replaced} replaced)`:''}.${R.keptExisting?` ${R.keptExisting} existing mark${R.keptExisting===1?' was':'s were'} kept.`:''}</div>
    ${R.left.length?`<div class="ph-warn"><strong>${R.left.length} row${R.left.length===1?'':'s'} were not saved and need correction:</strong></div><div style="max-height:28vh;overflow:auto"><table class="pm-table" style="min-width:0"><tbody>${R.left.map(r=>`<tr class="s-${r.state}"><td>${esc(r.readAs)}</td><td class="small">${esc(r.msgs.join('; ')||'Not ticked')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="modal-foot">${R.left.length?'<button class="btn" id="pm-fix">Fix the remaining rows</button>':''}<button class="btn primary" id="pm-done">Done</button></div>`;
  bindX(); $('pm-done').onclick=()=>{ const id=S.exam.id; S=null; closeModal(); goto('marks',{examId:id,mode:'grid'}); toast('Marks saved'); };
  if($('pm-fix')) $('pm-fix').onclick=()=>{ S.rows=R.left; S.step='review'; draw(); };
}
window.cbeOpenPhotoMarks=open;
document.addEventListener('click',ev=>{ const b=ev.target.closest('[data-cbe="photo-marks"]'); if(b){ ev.preventDefault(); open(); } });
window.__pm_test={parseLine,numTok};
})();
</script>
