<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003B70">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>AMBROH — Online Examination Analysis System · Primary &amp; Junior School</title>
<style>
:root{
  --bg:#EAF6FF;
  --paper:#FFFFFF;
  --ink:#0E2A44;
  --ink-soft:#5A7791;
  --line:#C9E4F5;
  --line-soft:#EAF6FF;
  --primary:#003B70;
  --primary-light:#0056A6;
  --primary-soft:#E3F1FC;
  --accent:#00A86B;
  --accent-soft:#DFF7EB;
  --brightgreen:#39D353;
  --gold:#FFC107;
  --gold-soft:#FFF6DA;
  --good:#00A86B;
  --danger:#C0392B;
  --danger-soft:#FBE2DE;
  --up:#00A86B; --down:#C0392B;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  --topbar-h: 78px;
}
[data-theme="dark"]{
  --bg:#0B1B2B; --paper:#122539; --ink:#EAF3FB; --ink-soft:#93AEC4;
  --line:#1F3A54; --line-soft:#16293D; --accent-soft:#0F3B2C; --danger-soft:#3A2323; --up:#39D97A; --down:#E28B8B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B2B; --paper:#122539; --ink:#EAF3FB; --ink-soft:#93AEC4;
    --line:#1F3A54; --line-soft:#16293D; --accent-soft:#0F3B2C; --danger-soft:#3A2323; --up:#39D97A; --down:#E28B8B;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; overflow-x:hidden;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; margin:0 0 4px; color:var(--primary);}
h1{font-size:26px; letter-spacing:.2px;}
h2{font-size:19px;}
h3{font-size:15px;}
p{margin:0 0 10px;}
a{color:inherit;}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums;}
button{font-family:var(--sans); cursor:pointer;}
input,select,textarea{font-family:var(--sans); font-size:13.5px;}
::selection{background:var(--accent-soft);}
img,svg{max-width:100%;}

#shell{display:flex; flex-direction:column; min-height:100vh;}
#shell-body{display:flex; flex:1; min-height:0;}

/* Top brand bar */
#topbar{
  display:flex; align-items:center; gap:16px; padding:14px 26px; min-height:var(--topbar-h);
  background:linear-gradient(100deg, var(--primary) 0%, #00335F 45%, #00603F 88%, #00A86B 100%);
  color:#fff; position:sticky; top:0; z-index:40; overflow:hidden; box-shadow:0 2px 14px rgba(0,20,45,.22);
}
#topbar::after{content:''; position:absolute; right:0; top:0; height:100%; width:34%; background:radial-gradient(circle at 100% 0%, rgba(57,211,83,.55), transparent 70%);}
#topbar .brand-logo{flex:0 0 auto; position:relative; z-index:1;}
#topbar .brand-logo img{max-height:46px; max-width:100%; border-radius:8px; background:#fff; padding:4px; display:block;}
#topbar .brand-text{flex:1; min-width:0; position:relative; z-index:1;}
#topbar .mark{font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:.5px; color:#fff; line-height:1.1;}
#topbar .tagline{font-size:11.5px; color:#D6F3E6; margin-top:2px; letter-spacing:.3px;}
#topbar .school{font-size:11px; color:#BFE3FF; margin-top:3px;}
#topbar .flourish{
  flex:0 0 auto; font-family:'Brush Script MT', cursive, var(--serif); font-style:italic; text-align:right;
  color:#EAFBF1; font-size:15px; line-height:1.3; position:relative; z-index:1; opacity:.95;
}
#topbar .flourish .under{display:block; width:70%; height:2px; margin:3px 0 0 auto; background:linear-gradient(90deg, transparent, var(--brightgreen)); border-radius:2px;}
@media(max-width:640px){ #topbar .flourish{display:none;} #topbar{padding:12px 14px; gap:10px;} #topbar .mark{font-size:19px;} }

/* Sidebar toggle (hamburger) — hidden on desktop/tablet where the sidebar is
   always visible; only shown once the sidebar becomes an off-canvas drawer
   (see the max-width:860px block below). */
#sb-toggle{
  display:none; flex:0 0 auto; width:38px; height:38px; border-radius:9px; border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12); cursor:pointer; position:relative; z-index:1;
  align-items:center; justify-content:center; flex-direction:column; gap:4px; padding:0;
}
#sb-toggle span{display:block; width:18px; height:2px; background:#fff; border-radius:2px;}
#sb-toggle:hover{background:rgba(255,255,255,.22);}
#sidebar-backdrop{display:none;}

/* Sidebar */
#sidebar{
  width:220px; flex:0 0 220px; color:#F2FAFF;
  background:linear-gradient(190deg, var(--primary) 0%, #00294F 55%, #012B22 100%);
  padding:14px 0 0; display:flex; flex-direction:column; position:sticky; top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h));
  box-shadow:2px 0 18px rgba(0,20,45,.18);
}
#sidebar::before{content:''; position:absolute; top:0; right:0; width:4px; height:100%; background:linear-gradient(180deg, var(--brightgreen), var(--accent) 45%, var(--gold) 100%); opacity:.9;}
nav.navlist{flex:1; overflow-y:auto; padding:8px 12px;}
.navsec{font-size:10px; color:#7FB6D8; letter-spacing:.8px; padding:14px 6px 6px;}
.navitem{
  display:flex; align-items:center; gap:11px; padding:11px 14px; color:#DCEEFA; text-decoration:none;
  font-size:13.5px; cursor:pointer; border-left:0; border-radius:10px; margin-bottom:3px;
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:background .15s ease, box-shadow .15s ease, transform .1s ease;
}
nav.navlist .navitem:last-child{border-bottom:none;}
.navitem:hover{background:rgba(255,255,255,.08);}
.navitem.active{
  background:linear-gradient(90deg, #00A86B, #39D353 130%);
  box-shadow:inset 3px 0 0 var(--gold), 0 4px 12px rgba(0,168,107,.35);
  color:#fff; font-weight:700; border-bottom-color:transparent; transform:translateX(1px);
}
.navitem .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 auto;}
.sidebar-foot{padding:12px 18px; font-size:10.5px; color:#7FB6D8; border-top:1px solid rgba(255,255,255,.12);}

/* Sidebar footer: user card + decorative art */
.user-card{margin:8px 12px 0; padding:14px 14px 16px; border-top:1px solid rgba(255,255,255,.14);}
.user-card .u-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.user-card .u-avatar{
  width:34px; height:34px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--brightgreen), var(--accent)); color:#fff;
}
.user-card .u-avatar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.user-card .uname{font-weight:700; color:#fff; font-size:14.5px; display:block;}
.role-badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; letter-spacing:.2px; background:var(--accent-soft); color:#046A38;}
.role-badge.admin{background:var(--primary); color:#fff;}
.user-card .role-badge{display:block; width:100%; text-align:center; background:var(--gold); color:#5C3E00; font-size:12px; padding:7px 10px; border-radius:30px; box-shadow:0 3px 8px rgba(0,0,0,.18);}
.user-card .u-link{display:flex; align-items:center; gap:8px; width:100%; background:none; border:none; color:#DCEEFA; font-size:12.5px; font-weight:600; padding:9px 2px; cursor:pointer; text-align:left;}
.user-card .u-link svg{width:15px;height:15px;fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.85;}
.user-card .u-logout{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:6px;
  background:rgba(0,20,45,.5); border:1px solid rgba(255,255,255,.18); color:#fff; font-weight:700;
  font-size:13px; padding:10px 12px; border-radius:12px; cursor:pointer; transition:background .15s ease;
}
.user-card .u-logout:hover{background:rgba(0,20,45,.78);}
.user-card .u-logout svg{width:16px;height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.sidebar-art{
  height:150px; flex:0 0 auto; position:relative; overflow:hidden;
  background:linear-gradient(0deg, #012B22 0%, transparent 100%);
}
.sidebar-art svg{position:absolute; bottom:-6px; left:0; width:100%; height:100%;}

/* Main */
#main{flex:1; min-width:0; padding:26px 34px 60px; max-width:1180px;}
.pagehead{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:16px; flex-wrap:wrap; padding-bottom:14px; border-bottom:3px solid transparent; border-image:linear-gradient(90deg, var(--primary) 0%, var(--accent) 55%, var(--brightgreen) 100%) 1;}
.pagehead .sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}
.actions{display:flex; gap:8px; flex-wrap:wrap;}

.btn{
  border:1px solid var(--primary-light); background:var(--paper); color:var(--primary-light); padding:8px 14px;
  border-radius:var(--radius); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:background .16s ease, border-color .16s ease, color .16s ease, transform .1s ease, box-shadow .16s ease;
}
.btn:hover{border-color:var(--primary); background:var(--primary-soft); transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,59,112,.12);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{background:#00925C; border-color:#00925C; box-shadow:0 4px 12px rgba(0,168,107,.28);}
.btn.accent{background:var(--primary-light); border-color:var(--primary-light); color:#fff;}
.btn.accent:hover{background:var(--primary); border-color:var(--primary); box-shadow:0 4px 12px rgba(0,86,166,.28);}
.btn.danger{color:var(--danger); border-color:var(--danger-soft);}
.btn.ghost{border-color:transparent; background:transparent; padding:8px 10px;}
.btn.sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

.panel{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:18px; box-shadow:0 2px 12px rgba(0,59,112,.06);}
.panel-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line-soft);}
.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
.field{margin-bottom:12px;}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--paper); color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
textarea{resize:vertical; min-height:54px;}
.hint{font-size:11px; color:var(--ink-soft); margin-top:3px;}

table.data{font-size:13px;}
table.data th{
  text-align:left; font-size:10.5px; letter-spacing:.3px; color:var(--ink-soft); font-weight:700;
  padding:7px 10px; border-bottom:2px solid var(--primary); background:transparent;
}
table.data td{padding:8px 10px; border-bottom:1px solid var(--line-soft);}
table.data tbody tr:hover{background:var(--line-soft);}
table.data tfoot td{border-top:2px solid var(--primary); font-weight:700; border-bottom:none;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.center{text-align:center;}

.field-icon{position:relative;}
.field-icon .fi-ico{
  position:absolute; left:8px; top:29px; width:24px; height:24px; border-radius:7px;
  background:var(--primary-light); color:#fff; display:flex; align-items:center; justify-content:center; pointer-events:none;
}
.field-icon .fi-ico svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.field-icon input, .field-icon select{padding-left:42px;}

.nav-card{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-top:14px;
  background:linear-gradient(100deg, var(--primary), var(--primary-light)); color:#fff; border:none;
  padding:14px 16px; border-radius:14px; font-size:14.5px; font-weight:700; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,59,112,.25); transition:transform .12s ease, box-shadow .12s ease;
}
.nav-card:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,59,112,.32);}
.nav-card .nc-ico{width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.nav-card .nc-ico svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.nav-card .nc-label{flex:1;}
.nav-card .nc-chev{opacity:.85;}

.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.2px;}
.badge.good{background:var(--gold); color:#5C3E00;}
.badge.mid{background:var(--line-soft); color:var(--ink-soft);}
.badge.low{background:var(--danger-soft); color:var(--danger);}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
@media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:0 2px 12px rgba(0,59,112,.06);}
.stat .n{font-family:var(--serif); font-size:28px; font-weight:700; color:var(--primary);}
.stat .l{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.empty{padding:40px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:10px;}
.empty h3{color:var(--ink-soft); margin-bottom:6px;}

.searchbar{display:flex; gap:8px; margin-bottom:14px;}
.searchbar input{flex:1;}

/* Global instant search (sidebar) */
.gsearch{padding:0 18px 14px; position:relative; border-bottom:1px solid rgba(255,255,255,.16); margin-bottom:6px;}
.gsearch input{
  width:100%; padding:8px 10px; border-radius:var(--radius); border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.1); color:#fff; font-size:12.5px;
}
.gsearch input::placeholder{color:#BFE3FF;}
.gsearch input:focus{outline:none; border-color:var(--brightgreen); background:rgba(255,255,255,.16);}
.gsearch-results{
  position:absolute; left:18px; right:18px; top:calc(100% - 4px); background:var(--paper); color:var(--ink);
  border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 34px rgba(0,20,45,.28); z-index:60;
  max-height:70vh; overflow-y:auto; padding:6px 0;
}
.gsearch-group{padding:6px 14px 3px; font-size:10px; letter-spacing:.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase;}
.gsearch-item{padding:8px 14px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
.gsearch-item:hover, .gsearch-item.hi{background:var(--line-soft);}
.gsearch-item .gs-meta{font-size:11px; color:var(--ink-soft); white-space:nowrap;}
.gsearch-empty{padding:14px; font-size:12.5px; color:var(--ink-soft); text-align:center;}
.gsearch-hint{padding:8px 14px 2px; font-size:11px; color:var(--ink-soft);}

.tag{display:inline-flex; align-items:center; gap:6px; background:var(--line-soft); padding:4px 9px; border-radius:20px; font-size:12px; margin:2px 4px 2px 0;}
.tag button{border:none; background:none; color:var(--danger); font-size:13px; line-height:1; padding:0;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.tab{padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab.active{color:var(--primary); border-bottom-color:var(--accent);}

.modal-bg{position:fixed; inset:0; background:rgba(0,20,40,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50;}
.modal{background:var(--paper); border-radius:12px; width:100%; max-width:520px; padding:22px 24px; box-shadow:0 20px 50px rgba(0,20,45,.3);}
.modal.wide{max-width:760px;}
.modal.xl{max-width:960px;}
.report-preview{max-height:65vh; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:18px 22px; background:#fff; color:#111;}
.report-preview .pb{border-bottom:2px dashed #bbb; margin-bottom:26px; padding-bottom:26px;}
.report-preview .pb:last-child{border-bottom:none;}
.report-preview h1,.report-preview h2,.report-preview h3{color:#111;}
.report-preview table.data th, .report-preview table.data td{border-bottom:1px solid #ccc;}
.report-preview table.data th{border-bottom:2px solid #111;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head .x{cursor:pointer; font-size:18px; color:var(--ink-soft); border:none; background:none;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft);}

.toast{position:fixed; bottom:22px; right:22px; max-width:380px; background:var(--primary); color:#fff; padding:12px 16px 12px 14px; border-radius:10px; font-size:13px; z-index:99; box-shadow:0 8px 24px rgba(0,20,45,.3); display:flex; gap:10px; align-items:flex-start; border-left:5px solid var(--accent); cursor:pointer;}
.toast .ti{font-weight:800; flex:0 0 auto;}
.toast.success{border-left-color:var(--brightgreen);}
.toast.error{background:#8E2F2F; color:#fff; border-left-color:#FFB4B4;}
.toast.warn{border-left-color:var(--gold);}
.btn.danger-solid{background:var(--danger); border-color:var(--danger); color:#fff;}
.btn.danger-solid:hover{filter:brightness(1.1);}
.confirm-body{font-size:14px; line-height:1.6; padding:4px 0 2px;}
.navitem .ico{width:17px; height:17px; flex:0 0 auto; display:inline-flex; opacity:.85;}
.navitem .ico svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.navitem{font-size:13.5px; padding:10px 18px;}
.navitem:focus-visible{outline:2px solid var(--brightgreen); outline-offset:-2px;}
.hubtabs{margin-bottom:18px;}
.inline-error{background:var(--danger-soft); border:1px solid var(--danger); border-left:5px solid var(--danger); border-radius:8px; padding:10px 12px; margin:0 0 14px; font-size:13px; line-height:1.5;}
.inline-error .fix{margin-top:6px; font-weight:400;}
.bad-mark{border-color:var(--danger) !important; background:var(--danger-soft) !important;}
.banner-warn{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--gold-soft); border:1px solid var(--gold); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:13px; line-height:1.5;}
.banner-warn.demo{background:var(--primary-soft); border-color:var(--primary-light);}
.notice-list{margin:8px 0 0 18px; padding:0; font-size:12.5px; max-height:220px; overflow:auto;}

.chart-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:7px;}
.chart-bar-label{width:120px; flex:0 0 auto; font-size:12px; font-weight:700; color:var(--ink-soft); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chart-bar-track{flex:1; background:var(--line-soft); border-radius:3px; height:16px; overflow:hidden;}
.chart-bar-fill{height:100%; background:linear-gradient(90deg, var(--primary-light), var(--accent)); border-radius:3px;}
.chart-bar-n{width:32px; font-size:12px; color:var(--ink-soft);}

table.rk-table th.num{text-align:right;}
.rk{font-weight:700; font-variant-numeric:tabular-nums;}
.rk.tied{border-bottom:1px dotted var(--ink-soft); cursor:help;}
.delta{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.1px; margin-top:1px;}
.delta.up{color:var(--up);} .delta.down{color:var(--down);} .delta.flat{color:var(--ink-soft); font-weight:600;}
.stat-row.five{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.stat-row.five{grid-template-columns:repeat(2,1fr);}}
.stat .n.sm{font-size:20px;}
.stat .n .delta{font-size:19px; font-weight:700; margin:0;}
.cmp-pick{display:grid; grid-template-columns:1fr 1fr; gap:2px 18px;}
@media(max-width:900px){.cmp-pick{grid-template-columns:1fr;}}
.cmp-pick label{display:flex; align-items:center; gap:8px; padding:5px 0; font-weight:400; font-size:13px; color:var(--ink); margin:0;}
.tabs.wrap{flex-wrap:wrap;}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}

<script>
/* ============================= DATA LAYER (Supabase as the shared cloud store) =============================
   AMBROH used to keep its whole working DATA object in the browser's own
   IndexedDB, so nothing left that one device. dbGet/dbSet are now backed by
   a Supabase table instead, so the same 'data' and 'backups' records are
   shared by every device signed into this project — the rest of the app
   (thousands of call sites that read/write DATA and call persist()) is
   untouched, since it only ever talked to DATA through these two
   functions. */
const SUPABASE_URL='https://nikruwjtouvtjfejzvrc.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pa3J1d2p0b3V2dGpmZWp6dnJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMzA2OTEsImV4cCI6MjEwNTcwNjY5MX0.DERS6MdhpAnKJd9T83X_olV6oQy3qGG6QR1lzylCsiU';
const KV_TABLE='kv_store';
let dbHandle=null; // holds the Supabase client once connected (kept as the same truthy/falsy sentinel the rest of the app already checks)
function openDB(){
  return new Promise((resolve,reject)=>{
    try{
      if(!window.supabase || !window.supabase.createClient) throw new Error('Supabase client library did not load');
      const client=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      resolve(client);
    }catch(err){ reject(err); }
  });
}
async function dbGet(key){
  const {data,error}=await dbHandle.from(KV_TABLE).select('value').eq('key',key).maybeSingle();
  if(error) throw error;
  return data ? data.value : undefined;
}
async function dbSet(key,value){
  const {error}=await dbHandle.from(KV_TABLE).upsert({key,value,updated_at:new Date().toISOString()});
  if(error) throw error;
}
/* ---- Per-school storage split ----
   Each school's own academic records (classes, streams, subjects, students,
   exams) are saved under their OWN row: key = 'school_<schoolId>'. This
   means one school's save can never overwrite another school's rows, and
   each school's data is a physically separate record in Supabase.
   Platform-wide things that must be visible across every school (the schools
   registry itself, user accounts, audit log, teacher class access, school
   subscriptions, legacy settings) stay together in one shared row: key =
   'platform'. DATA in memory is still one combined object, assembled from
   the platform row + every school row at load time, so none of the
   thousands of existing DATA.* call sites need to change. */
const ACADEMIC_KEYS=['classes','streams','subjects','students','exams'];
function schoolRowKey(schoolId){ return 'school_'+schoolId; }
function buildPlatformPayload(){
  return {
    schools:DATA.schools||[],
    users:DATA.users||[],
    auditLogs:DATA.auditLogs||[],
    teacherClassAccess:DATA.teacherClassAccess||[],
    schoolClassSubs:DATA.schoolClassSubs||[],
    settings:DATA.settings||blankData().settings
  };
}
function buildSchoolPayload(schoolId){
  const out={};
  ACADEMIC_KEYS.forEach(k=>{ out[k]=(DATA[k]||[]).filter(r=>r&&r.schoolId===schoolId); });
  return out;
}
/** Writes the shared platform row plus every school's own row. */
function saveSplitData(){
  if(!dbHandle){ reportDbError({name:'Unavailable'}); return; }
  safeSave('platform', buildPlatformPayload());
  (DATA.schools||[]).forEach(sch=>{ safeSave(schoolRowKey(sch.id), buildSchoolPayload(sch.id)); });
}

/* ============================= APP STATE ============================= */
// AMBROH supports Primary (Grades 1–6), Junior (Grades 7–9), or Both.
// Fixed grade ids keep every fresh install consistent and let exams/analysis rely on them existing.
const SCHOOL_CLASSES=[1,2,3,4,5,6,7,8,9].map(n=>({id:'grade-'+n,name:'Grade '+n}));
// A school is registered for Primary only (Grades 1-6), Junior only (Grades 7-9) or both (Grades 1-9).
const SECTIONS={
  primary:{label:'Primary School',grades:[1,2,3,4,5,6]},
  junior:{label:'Junior School',grades:[7,8,9]},
  both:{label:'Primary and Junior School',grades:[1,2,3,4,5,6,7,8,9]}
};
function classesForSection(sec){ const g=(SECTIONS[sec]||SECTIONS.junior).grades; return SCHOOL_CLASSES.filter((c,i)=>g.includes(i+1)).map(c=>({id:c.id,name:c.name})); }
function classNamesText(){ return scopedClasses().map(c=>c.name).join(', '); }
// No grading scale ships by default — each school defines its own bands
// (e.g. CBC performance levels) from Settings before analysis will show grades.
// Teacher comments are configurable performance-based remarks (not pass/fail
// decisions) — a school can edit the bands or wording freely from Settings.
const DEFAULT_COMMENTS=[
  {min:80, max:100, text:'Excellent performance. Keep up the good work.'},
  {min:60, max:79,  text:'Good performance. Continue working hard.'},
  {min:40, max:59,  text:'Fair performance. More practice is needed.'},
  {min:0,  max:39,  text:'Needs significant improvement and additional support.'},
];
const DEFAULT_HEAD_COMMENTS=[
  {min:80, max:100, text:'Outstanding results. Keep aiming high.'},
  {min:60, max:79,  text:'Commendable effort. Keep it up.'},
  {min:40, max:59,  text:'Fair results. Work harder to improve.'},
  {min:0,  max:39,  text:'Results are below expectation. Seek extra support and put in more effort.'},
];
function blankData(){
  return {
    // Platform-level (Super Admin). Academic settings live per-school.
    schools:[],
    auditLogs:[],
    // Legacy global settings kept for migration; active school settings are on schools[i].settings
    settings:{schoolName:'Your School Name', motto:'', logo:'', currentYear:new Date().getFullYear(), currentTerm:'Term 1', section:'junior', scale:[], rankingEnabled:true, comments:JSON.parse(JSON.stringify(DEFAULT_COMMENTS))},
    classes:[], streams:[], subjects:[], students:[], exams:[], users:[],
    // Class-level teacher access: ONE paid class = ALL subjects in that class.
    teacherClassAccess:[],
    // School-level class subscriptions: a SCHOOL must pay per class, per term, before
    // that class's data is usable at all (separate from, and on top of, any individual
    // teacher class-access payment above).
    schoolClassSubs:[]
  };
}
function blankSchoolSettings(){
  return {
    schoolName:'Your School Name', motto:'', logo:'', headTeacher:'',
    currentYear:new Date().getFullYear(), currentTerm:'Term 1',
    scale:[], rankingEnabled:true,
    comments:JSON.parse(JSON.stringify(DEFAULT_COMMENTS)),
    headComments:JSON.parse(JSON.stringify(DEFAULT_HEAD_COMMENTS||DEFAULT_COMMENTS)),
    headCommentHandwritten:false, termDates:{}
  };
}
function blankSchool(partial){
  const id=(partial&&partial.id)||uid('sch');
  return Object.assign({
    id,
    name:'New School',
    code:'SCH-'+id.slice(-6).toUpperCase(),
    county:'', subCounty:'', schoolType:'Public',
    section:'junior', // primary | junior | both
    status:'active', // active | suspended | expired
    subscriptionStatus:'active', // active | expiring | expired | suspended | pending
    subscriptionStart:new Date().toISOString().slice(0,10),
    subscriptionExpiry:'',
    paymentStatus:'paid',
    paymentReference:'',
    plan:'standard',
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    settings:blankSchoolSettings()
  }, partial||{});
}
let DATA=blankData();
let STATE={ view:'dashboard', params:{} };
let CURRENT_USER=null;
let saveTimer=null;
function persist(){
  syncSettingsToCurrentSchool();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ saveSplitData(); },250);
}
/** Flush immediately (school registration, password changes) so login works after logout/refresh */
function persistNow(){
  syncSettingsToCurrentSchool();
  clearTimeout(saveTimer);
  saveSplitData();
}
/** DATA.settings is a per-session working copy built from the open school's own
 *  settings (see applySchoolContext). Any edit made through it — ranking, grading
 *  scale, comments, term/year, motto, etc. — must be written back onto that school's
 *  own record before saving, or it reverts to the old value the next time someone
 *  signs in and the working copy is rebuilt from scratch. */
function syncSettingsToCurrentSchool(){
  if(!DATA.schools || !DATA.schools.length) return; // pre-migration legacy mode: DATA.settings is already the source of truth
  const sch=currentSchool();
  if(!sch) return;
  sch.settings=Object.assign({}, blankSchoolSettings(), sch.settings, DATA.settings, {schoolName:sch.name, section:sch.section});
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* ============================= BACKUP HISTORY (stored in Supabase, alongside the live data) ============================= */
// Separate from the live "data" record so creating/restoring a manual backup
// never risks the autosave loop. Stored under its own key in the same local
// IndexedDB store used for everything else — still fully offline.
let BACKUPS=[];
async function loadBackups(){
  try{ BACKUPS=(await dbGet('backups'))||[]; }catch(err){ BACKUPS=[]; }
}
function persistBackups(){ safeSave('backups', BACKUPS); }
function snapshotSize(obj){ return new Blob([JSON.stringify(obj)]).size; }
function createManualBackup(label){
  const snapshot=JSON.parse(JSON.stringify(DATA));
  const bk={
    id:uid('bkp'),
    label:(label&&label.trim())?label.trim():'Manual backup',
    createdAt:new Date().toISOString(),
    size:snapshotSize(snapshot),
    counts:{
      students:snapshot.students.length, classes:snapshot.classes.length,
      streams:snapshot.streams.length, subjects:snapshot.subjects.length, exams:snapshot.exams.length
    },
    data:snapshot
  };
  BACKUPS.unshift(bk);
  if(BACKUPS.length>20) BACKUPS=BACKUPS.slice(0,20); // keep the device from filling up indefinitely
  persistBackups();
  return bk;
}
function backupById(id){ return BACKUPS.find(b=>b.id===id); }
function deleteBackupById(id){ BACKUPS=BACKUPS.filter(b=>b.id!==id); persistBackups(); }
function totalBackupsSize(){ return BACKUPS.reduce((n,b)=>n+(b.size||0),0); }
// Shared by "Restore backup" (from local history) and "Import backup" (from a
// file on disk) — both end up here once the replacement has been confirmed.
async function applyRestoredData(parsed){
  DATA=parsed; repairData();
  try{ dedupeClasses(); }catch(err){ console.warn(err); }
  DATA.users=DATA.users||[];
  await ensureDefaultAdmin();
  if(!CURRENT_USER || !userById(CURRENT_USER.id)){
    CURRENT_USER = DATA.users.find(u=>u.role==='superadmin') || DATA.users[0];
  }
  persist(); render(); toast('Backup restored');
}
// The one confirmation warning behind every restore path, since existing data
// in Supabase is always replaced by whatever is being restored.
function modalConfirmRestore(sourceLabel, onConfirm){
  openModal(`
    <div class="modal-head"><h2>Restore backup?</h2><button class="x" data-close>✕</button></div>
    <p class="warn-box">Restoring <strong>${esc(sourceLabel)}</strong> will replace the entire Ambroh database in Supabase — school setup, classes, streams, subjects, students, examinations and marks. Anything entered since will be lost. This cannot be undone.</p>
    <p class="small">If you're not sure, download a backup of the current data first (Backup & Restore → Export backup) before continuing.</p>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="confirm-restore-go">Yes, replace all data</button></div>
  `);
  document.getElementById('confirm-restore-go').onclick=()=>{ closeModal(); onConfirm(); };
}
function modalCreateBackup(){
  openModal(`
    <div class="modal-head"><h2>Create backup</h2><button class="x" data-close>✕</button></div>
    <div class="field"><label>Label (optional)</label><input id="m-bk-label" type="text" placeholder="e.g. End of Term 2 marks entered" autocomplete="off"></div>
    <p class="small">Saves a complete snapshot of the Ambroh database — school setup, classes, streams, subjects, students, examinations and marks — to Supabase. It stays there even if the live data changes afterwards, and can be restored any time from Backup & Restore.</p>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-bk-save">Create backup</button></div>
  `);
  document.getElementById('m-bk-save').onclick=()=>{
    const label=document.getElementById('m-bk-label').value;
    createManualBackup(label);
    closeModal(); render(); toast('Backup created');
  };
}

/* ============================= STAFF ACCOUNTS (no login required) ============================= */
// Staff records live inside DATA (same local store as everything else) so a
// device backup/restore carries them along with school records. There is no
// login requirement in AMBROH — anyone using this device has full access.
// CURRENT_USER simply tracks who the app treats as "acting as" super admin
// so the Staff Accounts page below works; it is not an authentication gate.
async function hashPassword(pw){
  // Always use the pure-JS SHA-256 so hashes match on file://, http, and https.
  // (crypto.subtle is unavailable on many file:// pages and would produce login failures.)
  const enc=new TextEncoder().encode(String(pw));
  return sha256Hex(enc);
}
function sha256Hex(bytes){
  const K=[], H=[]; let n=2, cnt=0;
  while(cnt<64){ let pr=true; for(let d=2;d*d<=n;d++) if(n%d===0){ pr=false; break; }
    if(pr){ K.push(Math.floor((Math.cbrt(n)%1)*4294967296)); if(cnt<8) H.push(Math.floor((Math.sqrt(n)%1)*4294967296)); cnt++; } n++; }
  const len=bytes.length, total=((len+9+63)>>6)<<6, m=new Uint8Array(total);
  m.set(bytes); m[len]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(total-8,Math.floor(len*8/4294967296)); dv.setUint32(total-4,(len*8)>>>0);
  const w=new Uint32Array(64), rotr=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<total;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3), s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

/** Refresh subscription flags from expiry dates */

  const today=new Date().toISOString().slice(0,10);

  allSchools().forEach(s=>{

/** Records visible to current user — school isolation */
const _scopeCache=new WeakMap();
function scopeBySchool(list){
  if(!list) return [];
  if(!CURRENT_USER) return list;                                   // start-up repairs, before anyone is signed in
  if(isSuperAdmin(CURRENT_USER) && !CURRENT_SCHOOL_ID) return list; // platform view: every school
  const sid=userSchoolId();
  if(!sid) return [];
  const c=_scopeCache.get(list);
  if(c && c.sid===sid && c.len===list.length) return c.out;
  const out=list.filter(x=>x.schoolId===sid);
  _scopeCache.set(list,{sid,len:list.length,out});
  return out;
}
/* ---- Section-scoped School Admins ----
   A school whose section is "both" (Primary 1–6 + Junior 7–9) can have a separate Primary School
   Admin and Junior Secondary School Admin, each restricted to their own grades. A schooladmin's
   adminSection is 'primary' | 'junior' | 'both'. The restriction only ever applies when the SCHOOL
   itself is a combined ('both') school — a school that only offers one section already limits its
   admin to that section by having no other grades to see. */
function schoolAdminAllowedGrades(u){
  u=u||CURRENT_USER;

  if(!sch || sch.section!=='both') return null;
  return (SECTIONS[u.adminSection]||{}).grades || null;
}
function gradeAllowedForCurrentUser(gradeNumber){

}

function scopedStreams(){ return scopeBySchool(DATA.streams).filter(s=>{ const c=anyClassById(s.classId); return !c||gradeAllowedForCurrentUser(gradeNumberOfClass(c)); }); }

function scopedStudents(){ return scopeBySchool(DATA.students).filter(s=>{ const c=anyClassById(s.classId); return !c||gradeAllowedForCurrentUser(gradeNumberOfClass(c)); }); }
function scopedExams(){ return scopeBySchool(DATA.exams).filter(e=>{ const c=anyClassById(e.classId); return !c||gradeAllowedForCurrentUser(gradeNumberOfClass(c)); }); }

/* ============================= TEACHER CLASS ACCESS (PAYMENT MODEL) ============================= */
// CORE RULE: ONE PAID CLASS = ACCESS TO ALL SUBJECTS IN THAT CLASS.
// Access path: Teacher → School → Section → Grade/Class → ALL subjects in that class.
// Super Admin grants/renews/suspends/revokes. Data is never deleted when access is suspended.
function isTeacher(u){ return !!u && u.role==='teacher'; }
/** A School Admin already has full teaching/marks-entry rights (see canEnterSubject / canAccessClass below) —
 *  this flag just lets them also be labelled/listed as a teacher when they personally teach a subject. */
function isTeachingStaff(u){ return !!u && (u.role==='teacher' || (isSchoolAdmin(u) && u.alsoTeacher===true)); }
/** Only a School Admin (or Super Admin) may create or delete examinations. Plain teachers cannot. */
function canManageExams(u){ u=u||CURRENT_USER; return isSuperAdmin(u) || isSchoolAdmin(u); }
/** A Class Teacher may create/delete examinations too, but ONLY for the class(es) they are
 *  formally recognised as Class Teacher of (see setClassTeacherFlag) — never any other class. */
function canCreateExamForClass(classId,u){
  u=u||CURRENT_USER;
  return canManageExams(u) || isClassTeacher(u,classId);
}
function canManageExamRecord(exam,u){
  u=u||CURRENT_USER;
  if(!exam) return false;
  return canManageExams(u) || isClassTeacher(u,exam.classId);
}
function teacherClassAccessList(){ return DATA.teacherClassAccess || []; }
function accessById(id){ return teacherClassAccessList().find(a=>a.id===id); }
function accessRecordsForTeacher(teacherId){
  return teacherClassAccessList().filter(a=>a.teacherId===teacherId);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
/** Active = status active AND payment paid/active AND not past expiry */
function isAccessActive(rec){
  if(!rec) return false;
  if(rec.status!=='active') return false;
  if(rec.paymentStatus && !['paid','active'].includes(rec.paymentStatus)) return false;
  if(rec.expiryDate && rec.expiryDate < todayISO()) return false;
  return true;
}
/** Refresh expired records (status only — never delete data) */
function refreshAccessExpiry(){
  let changed=false;
  teacherClassAccessList().forEach(a=>{
    if(a.status==='active' && a.expiryDate && a.expiryDate < todayISO()){
      a.status='expired'; a.updatedAt=new Date().toISOString(); changed=true;
    }
  });
  if(changed) persist();
}
/* ============================= CLASS TEACHER (administrative designation) =============================
 * "Class Teacher" is a formal recognition — set by a School Admin (or Super Admin) — that a
 * particular teacher is in charge of a particular class: adding/managing its students, creating
 * and managing its examinations, and printing its reports. It rides on top of the EXISTING paid
 * Class Access record for that teacher+class (a School Admin can never create or unlock a new
 * paid class themselves — only Super Admin can grant Class Access/payment). The flag simply marks
 * WHICH already-paid teacher is recognised as that class's Class Teacher, and unlocks the limited
 * school-settings access described below for that teacher. */
function classTeacherRecordsFor(teacherId){
  return accessRecordsForTeacher(teacherId).filter(a=>a.classTeacher===true && isAccessActive(a));
}
function isClassTeacher(u,classId){
  u=u||CURRENT_USER;
  if(!u || !isTeacher(u)) return false;
  const recs=classTeacherRecordsFor(u.id);
  return classId ? recs.some(a=>a.classId===classId) : recs.length>0;
}
function classTeacherClassIds(u){ return new Set(classTeacherRecordsFor((u||CURRENT_USER).id).map(a=>a.classId)); }
/** Only an admin who can already manage this teacher may set/unset the flag, and only on a
 *  record that is currently active (paid) — so this can never bypass payment. */
function setClassTeacherFlag(recordId,on){
  const rec=accessById(recordId);
  if(!rec) return false;
  const t=userById(rec.teacherId);
  if(!t || !canManageUser(t)) return false;
  if(on && !isAccessActive(rec)) return false; // cannot designate a Class Teacher on an unpaid/inactive class
  rec.classTeacher=!!on;
  rec.updatedAt=new Date().toISOString();
  audit('class_teacher_'+(on?'set':'unset'),{teacherId:t.id,teacher:t.name,classId:rec.classId,className:(anyClassById(rec.classId)||{}).name});
  persist();
  return true;
}
/** Class IDs the current user may access. Super admin → all. School admin/teacher → only
 *  classes the SCHOOL has an active, paid class subscription for this term (see the
 *  School Class Subscription block below), and — for teachers only — that they were
 *  additionally granted individually. */
function accessibleClassIds(){
  if(!CURRENT_USER) return new Set();
  const sid=userSchoolId();
  const schoolClasses=(scopedClasses()||[]).filter(c=>!sid || c.schoolId===sid);
  if(isSuperAdmin(CURRENT_USER)){
    return new Set(schoolClasses.map(c=>c.id));
  }
  // The school itself must have paid for a class this term before anyone at that
  // school — school admin or teacher — can touch it.
  const paidClasses=new Set(schoolClasses.filter(c=>schoolCanAccessClass(c.id)).map(c=>c.id));
  if(isSchoolAdmin(CURRENT_USER)){
    return paidClasses;
  }
  // Teacher: only paid active classes within their school, and only if the school itself has paid for them
  refreshAccessExpiry();
  const ids=new Set();
  accessRecordsForTeacher(CURRENT_USER.id).forEach(a=>{
    if(isAccessActive(a) && (!sid || a.schoolId===sid || !a.schoolId) && paidClasses.has(a.classId)) ids.add(a.classId);
  });
  teachingClassIds(CURRENT_USER).forEach(cid=>{ if(paidClasses.has(cid)) ids.add(cid); });   // classes the School Admin gave them (marks entry)
  return ids;
}
function canAccessClass(classId){
  if(!CURRENT_USER) return false;
  if(isSuperAdmin(CURRENT_USER)) return true;
  return accessibleClassIds().has(classId);
}
/** Subjects are never gated individually — if the class is paid, all its subjects are allowed. */
function canAccessSubjectInClass(classId, subjectId){

}

}

}
function sectionForClassId(classId){
  const c=classById(classId);
  if(!c) return '';
  const n=parseInt(String(c.name).replace(/\D/g,''),10) || (c.grade_number||0);
  return sectionForGrade(n);
}
function grantClassAccess(payload){
  // payload: {teacherId, classId, paymentStatus, amountPaid, paymentReference, startDate, expiryDate, status}
  const existing=teacherClassAccessList().find(a=>
    a.teacherId===payload.teacherId && a.classId===payload.classId && a.status!=='revoked'
  );
  const now=new Date().toISOString();
  if(existing){
    Object.assign(existing, {
      paymentStatus: payload.paymentStatus || existing.paymentStatus || 'paid',
      amountPaid: payload.amountPaid!=null ? payload.amountPaid : existing.amountPaid,
      paymentReference: payload.paymentReference!=null ? payload.paymentReference : existing.paymentReference,
      schoolName: payload.schoolName!=null ? payload.schoolName : existing.schoolName,
      startDate: payload.startDate || existing.startDate || todayISO(),
      expiryDate: payload.expiryDate!=null ? payload.expiryDate : existing.expiryDate,
      status: payload.status || 'active',
      section: sectionForClassId(payload.classId),
      updatedAt: now
    });
    persist();
    return existing;
  }
  const rec={
    id:uid('tca'),
    teacherId: payload.teacherId,
    schoolId: (userById(payload.teacherId)||{}).schoolId || userSchoolId() || null,
    classId: payload.classId,
    section: sectionForClassId(payload.classId),
    paymentStatus: payload.paymentStatus || 'paid',
    amountPaid: payload.amountPaid!=null ? Number(payload.amountPaid) : null,
    paymentReference: payload.paymentReference || '',
    schoolName: payload.schoolName || '',
    startDate: payload.startDate || todayISO(),
    expiryDate: payload.expiryDate || null,
    status: payload.status || 'active',
    createdAt: now,
    updatedAt: now
  };
  DATA.teacherClassAccess=DATA.teacherClassAccess||[];
  DATA.teacherClassAccess.push(rec);
  persist();
  return rec;
}
function setAccessStatus(accessId, status){
  const a=accessById(accessId);
  if(!a) return null;
  a.status=status;
  a.updatedAt=new Date().toISOString();
  if(status==='revoked') a.revokedAt=a.updatedAt;
  persist();
  return a;
}
function subjectsForClassLabel(classId){

  // in AMBROH a paid class unlocks every subject the school has configured.

/* ============================= SCHOOL CLASS SUBSCRIPTION (PER-CLASS, PER-TERM PAYMENT) ============================= */
// CORE RULE: a SCHOOL must pay for each class, every term, before that class's data —
// marks entry, analysis, ranking, reports — is usable by anyone at that school (school
// admin or teacher). This is separate from, and sits on top of, the individual
// Teacher Class Access payments above, and separate from the school's overall account
// subscription (Subscriptions page). Super Admin (only) records payment. Standard fee:
// 100 per class per term. Nothing is ever deleted when a class lapses — it only locks.
const CLASS_SUB_FEE=100;
function schoolClassSubsList(){ return DATA.schoolClassSubs||[]; }
function classSubRecord(schoolId,classId){
  return schoolClassSubsList().find(r=>r.schoolId===schoolId && r.classId===classId);
}
function schoolCurrentTermYear(schoolId){
  const sch=schoolById(schoolId);
  const s=(sch&&sch.settings)||{};
  return { term:s.currentTerm||'Term 1', year:Number(s.currentYear)||new Date().getFullYear() };
}
/** A paid class subscription only ever covers ONE term. It auto-lapses once its expiry
 *  date passes, or once the school moves on to a different term/year — whichever comes
 *  first — so a new term always requires a fresh payment. */
function refreshSchoolClassSubs(){
  const today=todayISO();
  let changed=false;
  schoolClassSubsList().forEach(r=>{
    if(r.paymentStatus==='paid'){
      const cur=schoolCurrentTermYear(r.schoolId);
      if((r.expiryDate && r.expiryDate<today) || r.term!==cur.term || r.year!==cur.year){
        r.paymentStatus='unpaid'; r.updatedAt=new Date().toISOString(); changed=true;
      }
    }
  });
  if(changed) persist();
}
function isClassSubActive(schoolId,classId){
  refreshSchoolClassSubs();
  const cur=schoolCurrentTermYear(schoolId);
  const r=classSubRecord(schoolId,classId);
  if(!r || r.paymentStatus!=='paid') return false;
  if(r.term!==cur.term || r.year!==cur.year) return false;
  if(r.expiryDate && r.expiryDate<todayISO()) return false;
  return true;
}
/** Whether the SCHOOL (not an individual teacher) currently has this class unlocked. */
function schoolCanAccessClass(classId){
  const c=anyClassById(classId);
  if(!c) return false;
  return isClassSubActive(c.schoolId,classId);
}
/** Super Admin records a term's payment (default 100) for one class of one school. */
function payClassSubscription(schoolId,classId,payload){
  payload=payload||{};
  const cur=schoolCurrentTermYear(schoolId);
  let r=classSubRecord(schoolId,classId);
  const now=new Date().toISOString();
  if(!r){
    r={id:uid('scs'), schoolId, classId, createdAt:now};
    DATA.schoolClassSubs=DATA.schoolClassSubs||[];
    DATA.schoolClassSubs.push(r);
  }
  Object.assign(r,{
    term:cur.term, year:cur.year,
    amountDue:CLASS_SUB_FEE,
    amountPaid: payload.amountPaid!=null ? Number(payload.amountPaid) : CLASS_SUB_FEE,
    paymentReference: payload.paymentReference!=null ? payload.paymentReference : (r.paymentReference||''),
    paymentStatus:'paid',
    paidAt: now,
    expiryDate: payload.expiryDate!=null ? payload.expiryDate : (r.expiryDate||''),
    updatedAt: now
  });
  persist();
  audit('class_subscription_paid',{schoolId,classId,term:cur.term,year:cur.year,amount:r.amountPaid});
  return r;
}
/** Super Admin locks a class again (e.g. correcting a mistaken payment) without deleting history. */
function markClassSubUnpaid(schoolId,classId){
  const r=classSubRecord(schoolId,classId);
  if(!r) return null;
  r.paymentStatus='unpaid'; r.updatedAt=new Date().toISOString();
  persist();
  audit('class_subscription_locked',{schoolId,classId});
  return r;
}



function superAdminCount(){ return DATA.users.filter(u=>u.role==='superadmin').length; }
async function ensureDefaultAdmin(){
  DATA.users = DATA.users || [];
  let admin = DATA.users.find(u => u && u.role === 'superadmin' && String(u.username||'').toLowerCase() === 'admin');
  if(!admin){
    // Prefer any superadmin; otherwise create the default one
    admin = DATA.users.find(u => u && u.role === 'superadmin');
  }
  if(!admin){
    const passwordHash = await hashPassword('admin123');
    admin = {
      id: uid('usr'), username: 'admin', name: 'AMBROH Super Admin', role: 'superadmin', schoolId: null,
      passwordHash, createdAt: new Date().toISOString()
    };
    DATA.users.push(admin);
    persistNow();
    return;
  }
  // Repair broken superadmin records so login never bricks the platform
  let repaired = false;
  if(!admin.username){ admin.username = 'admin'; repaired = true; }
  if(admin.role !== 'superadmin'){ admin.role = 'superadmin'; repaired = true; }
  if(admin.schoolId){ admin.schoolId = null; repaired = true; } // platform super has no school
  if(!admin.passwordHash){
    admin.passwordHash = await hashPassword('admin123');
    repaired = true;
  }
  if(repaired) persistNow();
}

/** Once a super admin passes AMBROH's own username/password check, we also
 *  sign them into Supabase Auth with the same password, so their session
 *  carries the app_role: "superadmin" JWT claim the RLS policies on
 *  `schools` and `users` check for. This requires a Supabase Auth user to
 *  already exist with email = username + '@ambroh.local' and
 *  app_metadata {"app_role":"superadmin"} (set once, in the dashboard).
 *  If that hasn't been set up yet, AMBROH itself still logs the person in
 *  as normal — only the superadmin-only Supabase writes stay blocked. */
function usernameToAuthEmail(username){ return String(username||'').trim().toLowerCase()+'@ambroh.local'; }
async function syncSupabaseAuthSession(u, plainPassword){
  if(!dbHandle || !dbHandle.auth) return;
  try{
    const {error}=await dbHandle.auth.signInWithPassword({ email: usernameToAuthEmail(u.username), password: plainPassword });
    if(error){
      console.warn('Supabase Auth sign-in failed for super admin "'+u.username+'" — the schools/users tables will stay read-only until a matching Supabase Auth user is created with app_metadata {"app_role":"superadmin"}.', error.message);
      toast('Signed in, but not yet linked to Supabase Auth — platform-level changes may be blocked until that\'s set up.', 'error');
    }
  }catch(err){ console.warn('Supabase Auth sign-in error', err); }
}
async function syncSupabaseAuthSignOut(){
  try{ if(dbHandle && dbHandle.auth) await dbHandle.auth.signOut(); }catch(err){}
}

// Session is kept in sessionStorage so a refresh stays signed in until the tab is closed.
const SESSION_KEY='ambroh_session_user_id';
function saveSession(userId){
  try{ sessionStorage.setItem(SESSION_KEY, userId); }catch(err){}
}
function clearSession(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(err){}
}
function readSessionUserId(){

}
async function verifyLogin(username, password){
  const u=userByUsername(username);
  if(!u) return {ok:false, msg:'Unknown username. Check the spelling and try again.'};
  if(u.disabled) return {ok:false, msg:'This account has been disabled. Contact your administrator.'};
  const hash=await hashPassword(password);
  if(!u.passwordHash){
    // Repair accounts that were saved without a hash
    u.passwordHash = hash;
    persistNow();
    return {ok:true, user:u};
  }
  if(hash===u.passwordHash) return {ok:true, user:u};
  // One-time recovery for the default Super Admin if an older hash algorithm left them locked out
  const isDefaultAdmin = String(u.username||'').toLowerCase()==='admin' && u.role==='superadmin' && password==='admin123';
  if(isDefaultAdmin){
    u.passwordHash = hash;
    persistNow();
    return {ok:true, user:u};
  }
  return {ok:false, msg:'Incorrect password. Try again.'};
}
function showLoginGate(){
  CURRENT_USER=null;
  const gate=document.getElementById('login-gate');
  const shell=document.getElementById('shell');
  if(gate) gate.classList.remove('hidden');
  if(shell) shell.classList.add('locked');
  const err=document.getElementById('login-error');
  if(err){ err.classList.remove('show'); err.textContent=''; }
  const userInp=document.getElementById('login-user');
  const passInp=document.getElementById('login-pass');
  // Always re-arm the Sign in button — it stays disabled after a successful sign-in otherwise,
  // which made every later login (school admin, teacher) impossible until the page was refreshed.
  const lbtn=document.getElementById('login-btn');
  if(lbtn){ lbtn.disabled=false; lbtn.textContent='Sign in'; }
  if(userInp) userInp.value='';
  if(passInp) passInp.value='';
  if(userInp){ userInp.focus(); }
}
function hideLoginGate(){
  const gate=document.getElementById('login-gate');
  const shell=document.getElementById('shell');
  if(gate) gate.classList.add('hidden');
  if(shell) shell.classList.remove('locked');
}
function doLogout(){
  const wasSuperAdmin=isSuperAdmin(CURRENT_USER);
  clearSession();
  CURRENT_USER=null;
  if(wasSuperAdmin) syncSupabaseAuthSignOut();
  showLoginGate();
  // Clear main content for privacy
  const main=document.getElementById('main');
  if(main) main.innerHTML='';
  closeModal();
  resetNavAnchor('dashboard'); // fresh history anchor so Back can't reveal the previous user's section
  toast('Signed out');
}
async function attemptLogin(username, password){
  const res=await verifyLogin(username, password);
  if(!res.ok) return res;
  const u=res.user;
  if(!isSuperAdmin(u)){
    const sch=schoolById(u.schoolId);
    if(!sch) return {ok:false, msg:'This account is not linked to a school. Contact Super Admin.'};
    if(sch.status==='suspended' || sch.subscriptionStatus==='suspended'){
      return {ok:false, msg:'School "'+sch.name+'" is suspended. Access will restore after payment and reactivation by Super Admin.'};
    }
    if(sch.status==='expired'){
      return {ok:false, msg:'School account is expired. Contact Super Admin.'};
    }
    // pending/expiring still allow login so the school can operate while payment is arranged
    if(sch.subscriptionStatus==='expired' && sch.status!=='active'){
      return {ok:false, msg:'School subscription has expired. Contact Super Admin.'};
    }
    applySchoolContext(u.schoolId);
  } else {
    CURRENT_SCHOOL_ID=null;
    await syncSupabaseAuthSession(u, password);
  }
  CURRENT_USER=u;
  saveSession(u.id);
  audit('login',{schoolId:u.schoolId||null});
  hideLoginGate();
  resetNavAnchor(isSuperAdmin(u)?'superDash':'dashboard');
  render();
  toast('Welcome, '+u.name);
  return {ok:true};
}
function bindLoginForm(){
  const form=document.getElementById('login-form');
  if(!form || form.dataset.bound) return;
  form.dataset.bound='1';
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn=document.getElementById('login-btn');
    const err=document.getElementById('login-error');
    const username=document.getElementById('login-user').value.trim().toLowerCase();
    const password=document.getElementById('login-pass').value;
    if(!username || !password){
      err.textContent='Enter your username and password.';
      err.classList.add('show');
      return;
    }
    btn.disabled=true; btn.textContent='Signing in…';
    err.classList.remove('show');
    try{
      const res=await attemptLogin(username, password);
      if(res.ok){ btn.disabled=false; btn.textContent='Sign in'; }
      if(!res.ok){
        err.textContent=res.msg||'Sign-in failed.';
        err.classList.add('show');
        btn.disabled=false; btn.textContent='Sign in';
        document.getElementById('login-pass').value='';
        document.getElementById('login-pass').focus();
      }
    }catch(ex){
      console.error(ex);
      err.textContent=(ex&&ex.message)||'Something went wrong. Please try again.';
      err.classList.add('show');
      btn.disabled=false; btn.textContent='Sign in';
    }
  });
}



/* ============================= GRADING ============================= */
// The grading scale is fully school-defined (see Settings → Grading
// scale): each band is {grade, min, max, points, description}. Nothing
// about grade names, ranges, points or count is hard-coded — schools can
// use CBC-style bands (EE1/EE2/ME1…), 8-4-4 letter grades (A/B/C…), or
// anything else, with as many bands as they like.
const NO_GRADE={grade:'—',points:null,description:''};
function hasScale(){ return DATA.settings.scale && DATA.settings.scale.length>0; }
function scaleSorted(){ return [...DATA.settings.scale].sort((a,b)=>b.min-a.min); }
function gradeForPct(pct){
  if(!hasScale()) return NO_GRADE;
  const s=scaleSorted();
  // Prefer an exact match against the band's min–max range.
  for(const g of s){
    const max = (g.max!=null && g.max!=='') ? Number(g.max) : Infinity;
    if(pct>=g.min && pct<=max) return g;
  }
  // Fallback (gaps/overlaps in a school's custom bands, or legacy scales
  // saved before "maximum mark" existed): highest band whose minimum is met.
  for(const g of s){ if(pct>=g.min) return g; }
  return s[s.length-1];
}
function pointsForPct(pct){ return gradeForPct(pct).points; }
function meanGradeFromPoints(avg){
  if(!hasScale() || avg==null || isNaN(avg)) return NO_GRADE;
  const s=[...DATA.settings.scale];
  let closest=s[0], diff=Infinity;
  for(const g of s){ const d=Math.abs(g.points-avg); if(d<diff){diff=d; closest=g;} }
  return closest;
}
function gradeBadgeClass(grade){
  if(!hasScale() || grade==='—') return 'mid';
  const scale=[...DATA.settings.scale].sort((a,b)=>b.points-a.points);
  const top=scale[0]?scale[0].points:1, bottom=scale[scale.length-1]?scale[scale.length-1].points:0;
  const pts=(DATA.settings.scale.find(g=>g.grade===grade)||{}).points;
  if(pts==null) return 'mid';
  const span=Math.max(1, top-bottom);
  const rel=(pts-bottom)/span;
  if(rel>=0.66) return 'good'; if(rel>=0.33) return 'mid'; return 'low';
}
function gradeDescription(grade){
  const g=DATA.settings.scale.find(x=>x.grade===grade);
  return g&&g.description?g.description:'';
}
function gradeBadgeHTML(grade){
  const d=gradeDescription(grade);
  return `<span class="badge ${gradeBadgeClass(grade)}"${d?` title="${esc(d)}"`:''}>${esc(grade)}</span>`;
}

/* ============================= TEACHER COMMENTS ============================= */
// Performance-based remarks only — never a pass/fail decision. Bands are
// school-editable from Settings → Teacher Comments; DEFAULT_COMMENTS is
// just the starting set. A learner's mean % picks the matching band's text,
// which the teacher can still freely rewrite per report before printing.
function commentBands(){ return (DATA.settings.comments && DATA.settings.comments.length) ? DATA.settings.comments : DEFAULT_COMMENTS; }
function commentForPct(pct){
  if(pct==null) return '';
  const bands=[...commentBands()].sort((a,b)=>b.min-a.min);
  for(const b of bands){ const max=(b.max!=null && b.max!=='')?Number(b.max):Infinity; if(pct>=b.min && pct<=max) return b.text; }
  for(const b of bands){ if(pct>=b.min) return b.text; }
  return bands.length? bands[bands.length-1].text : '';
}

function headCommentBands(){ return (DATA.settings.headComments && DATA.settings.headComments.length) ? DATA.settings.headComments : DEFAULT_HEAD_COMMENTS; }
function headCommentForPct(pct){
  if(pct==null) return '';
  const bands=[...headCommentBands()].sort((a,b)=>b.min-a.min);
  for(const b of bands){ const max=(b.max!=null && b.max!=='')?Number(b.max):Infinity; if(pct>=b.min && pct<=max) return b.text; }
  for(const b of bands){ if(pct>=b.min) return b.text; }
  return bands.length? bands[bands.length-1].text : '';
}
function headCommentHandwritten(){ return !!DATA.settings.headCommentHandwritten; }
// When handwriting is chosen in Settings the head teacher's comment is not filled in from the bands.
function defaultHeadComment(pct){ return headCommentHandwritten()?'':headCommentForPct(pct); }

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function toast(msg,type){
  // type: 'success' | 'error' | 'warn'. Validation-style messages are shown as errors automatically.
  if(!type) type = /^(enter |choose |add at least|only |no |password|that |at least|could not|this examination needs|.*cannot be)|looks empty|no matching/i.test(String(msg)) ? 'error' : 'success';

// A subject with no explicit class assignments is treated as available to every
// class (keeps subjects created before this feature working everywhere, unchanged).
function subjectAssignments(subject){ return subject.assignments||[]; }
function subjectAvailableForClass(subject,classId){
  const a=subjectAssignments(subject);
  if(!a.length) return true;

/* ---- Who may enter / upload marks, and who may analyse / print reports ----
   • Super Admin and School Admin: every subject, every class of their school, all reports.
   • Teacher whose class has ACTIVE PAID Class Access: ALL subjects in that class — marks upload, analysis and report printing.
   • Teacher assigned by the School Admin (Staff Accounts → Subjects): marks upload only, for the subjects and classes
     they were given. No analysis or report printing for those classes unless the class is also paid. */
function teacherHasPaidClass(classId,u){
  u=u||CURRENT_USER;
  if(!u) return false;
  return accessRecordsForTeacher(u.id).some(a=>a.classId===classId && isAccessActive(a));
}
function teacherClassSubjectRecord(u,classId){ return (u && u.classSubjects) ? u.classSubjects[classId] : null; }
function teachingClassIds(u){
  u=u||CURRENT_USER;
  const ids=new Set();
  if(!u || !isTeacher(u) || !u.schoolId) return ids;
  if(u.allSubjects===true && u.allClasses===true){
    (DATA.classes||[]).filter(c=>c.schoolId===u.schoolId).forEach(c=>ids.add(c.id));
    return ids;
  }
  const cs=u.classSubjects||{};
  (DATA.classes||[]).filter(c=>c.schoolId===u.schoolId).forEach(c=>{
    const rec=cs[c.id];
    if(rec && (rec.all===true || (Array.isArray(rec.subjects) && rec.subjects.length>0))) ids.add(c.id);
  });
  return ids;
}
function canEnterSubject(subjectId,classId,u){
  u=u||CURRENT_USER;
  if(!u || !isTeacher(u)) return true;
  if(teacherHasPaidClass(classId,u)) return true;
  if(u.allSubjects===true && u.allClasses===true) return true;
  const rec=teacherClassSubjectRecord(u,classId);
  if(!rec) return false;
  if(rec.all===true) return true;
  return Array.isArray(rec.subjects) && rec.subjects.includes(subjectId);
}
/** Classes whose analysis and reports the current user may open / print. */
function reportClassIds(){
  if(!CURRENT_USER) return new Set();
  if(isSuperAdmin(CURRENT_USER) || isSchoolAdmin(CURRENT_USER)) return accessibleClassIds();
  refreshAccessExpiry();
  const ids=new Set(), sid=userSchoolId();
  accessRecordsForTeacher(CURRENT_USER.id).forEach(a=>{ if(isAccessActive(a) && (!sid || a.schoolId===sid || !a.schoolId)) ids.add(a.classId); });
  return ids;
}
function canReportClass(classId){ return isSuperAdmin(CURRENT_USER) || reportClassIds().has(classId); }
function reportExams(){
  if(isSuperAdmin(CURRENT_USER)) return scopedExams().slice();

}
function reportClasses(){

function enterableSubjects(exam){ return (exam.subjects||[]).map(subjectById).filter(Boolean).filter(s=>canEnterSubject(s.id,exam.classId)); }
function studentById(id){ return scopedStudents().find(s=>s.id===id); }
function examById(id){ return scopedExams().find(e=>e.id===id); }
function streamsForClass(classId){ return scopedStreams().filter(s=>s.classId===classId); }
// Learners who have graduated (completed Grade 9) are kept for the record but are not active.
function activeStudents(){

  return scopedStudents().filter(s=>!s.graduated && (isSuperAdmin(CURRENT_USER) || allowed.has(s.classId)));

function studentsForClass(classId,streamId){

// Learners for analysing an examination: the class as it is now, plus anyone who has marks
// in this examination but has since been promoted or graduated — so past results stay complete.
function examStudents(exam){
  const list=studentsForClass(exam.classId, exam.streamId);
  const ids=new Set(list.map(s=>s.id));
  Object.keys(exam.results||{}).forEach(id=>{
    if(ids.has(id)) return;
    const st=studentById(id);
    if(st && Object.values(exam.results[id]||{}).some(v=>v!=null&&v!=='')){ ids.add(id); list.push(st); }

// Keeps DATA.classes in step with the school's registered section, in Grade order.
// A class outside the section is kept only if it already holds learners or examinations (never lose data).
function syncClassesToSection(){
  if(DATA.schools&&DATA.schools.length) return; // multi-school: each school's classes are managed by syncSchoolClasses()
  const want=classesForSection(DATA.settings.section).map(c=>c.id), have=new Map(DATA.classes.map(c=>[c.id,c]));
  const used=id=>DATA.students.some(s=>s.classId===id)||DATA.exams.some(e=>e.classId===id);
  const out=SCHOOL_CLASSES.filter(sc=>want.includes(sc.id)||(have.has(sc.id)&&used(sc.id))).map(sc=>have.get(sc.id)||{id:sc.id,name:sc.name});
  DATA.classes.forEach(c=>{ if(!SCHOOL_CLASSES.some(s=>s.id===c.id)) out.push(c); });
  DATA.classes=out;
}
function changeSection(sec){
  if(!SECTIONS[sec]||sec===DATA.settings.section) return;
  if(DATA.schools&&DATA.schools.length){
    // Multi-school: change only the open school and only its own classes
    const sch=currentSchool(); if(!sch) return;
    const g=new Set(SECTIONS[sec].grades);
    const blocked=DATA.classes.filter(c=>c.schoolId===sch.id && !g.has(gradeNumberOfClass(c)) && (DATA.students.some(s=>s.classId===c.id)||DATA.exams.some(e=>e.classId===c.id)));
    if(blocked.length){ render(); return problem(blocked.map(c=>c.name).join(', ')+(blocked.length>1?' still have':' still has')+' learners or examinations, so that section cannot be switched off.','Delete those learners and examinations first, or keep the section switched on.',null,'Section not changed'); }
    sch.section=sec; if(sch.settings) sch.settings.section=sec;
    syncSchoolClasses(sch); applySchoolContext(sch.id); audit('school_section_changed',{schoolId:sch.id,section:sec});
    persist(); render(); toast('School section updated: '+SECTIONS[sec].label); return;
  }
  const keep=classesForSection(sec).map(c=>c.id);
  const blocked=DATA.classes.filter(c=>!keep.includes(c.id)&&(DATA.students.some(s=>s.classId===c.id)||DATA.exams.some(e=>e.classId===c.id)));
  if(blocked.length){ render(); return problem(blocked.map(c=>c.name).join(', ')+(blocked.length>1?' still have':' still has')+' learners or examinations, so that section cannot be switched off.','Delete those learners and examinations first, or keep the section switched on.',null,'Section not changed'); }
  DATA.classes=DATA.classes.filter(c=>keep.includes(c.id));
  DATA.streams=DATA.streams.filter(s=>keep.includes(s.classId));
  DATA.settings.section=sec; syncClassesToSection(); persist(); render(); toast('School section updated: '+SECTIONS[sec].label);
}

function avg(nums){ const v=nums.filter(n=>n!=null && !isNaN(n)); if(!v.length) return null; return v.reduce((a,b)=>a+b,0)/v.length; }

/* ============================= RANKING HELPERS ============================= */
// Ranking is optional: an administrator can switch it off in Settings.
// When off, positions / top-bottom lists / the Ranking page are hidden and
// learner lists are shown alphabetically instead of by score.
function rankingOn(){ return DATA.settings.rankingEnabled!==false; }
function ordinal(n){
  const v=n%100; if(v>=11 && v<=13) return n+'th';
  return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');
}
function posText(n){ return n==null?'-':ordinal(n); }
// Ties are judged on the exact value to 2 decimal places (removes float noise
// such as 66.66666666 vs 66.66666667 without merging genuinely different means).
function tieKey(v){ return Math.round(Number(v)*100); }
// COMPETITION RANKING ("1224"): equal values share the same position and the
// following position(s) are skipped — 1st, 2nd, 2nd, 4th. Sorts `rows` best-first
// in place; rows with no value are left unranked (rank null) at the bottom.
function assignCompetitionRanks(rows,getVal,key){
  rows.sort((a,b)=>{
    const x=getVal(a), y=getVal(b), xn=(x==null||isNaN(x)), yn=(y==null||isNaN(y));
    if(xn&&yn) return 0; if(xn) return 1; if(yn) return -1;
    return y-x;
  });
  let prevKey=null, prevRank=0; const size={};
  rows.forEach((r,i)=>{
    const v=getVal(r);
    if(v==null||isNaN(v)){ r[key]=null; return; }
    const k=tieKey(v);
    if(k!==prevKey){ prevRank=i+1; prevKey=k; }
    r[key]=prevRank; size[prevRank]=(size[prevRank]||0)+1;
  });
  rows.forEach(r=>{ r[key+'Tied']= r[key]!=null && size[r[key]]>1; });
  return rows;
}
// Position of each learner inside their own stream (same competition rule).
function withStreamRanks(rows,getVal,key){
  const g={};
  rows.forEach(r=>{ const k=r.student.streamId||'_'; (g[k]=g[k]||[]).push(r); });
  Object.values(g).forEach(a=>assignCompetitionRanks(a,getVal,key));
}
function rankHTML(n,tied){
  if(n==null) return '—';
  return `<span class="rk${tied?' tied':''}"${tied?' title="Tied — equal score, shared position"':''}>${ordinal(n)}</span>`;
}
function orderedStudentRows(stats){
  return rankingOn()? stats.studentRows : [...stats.studentRows].sort((a,b)=>a.student.name.localeCompare(b.student.name));
}

// Friendly confirmation dialog (replaces the browser's plain confirm box).
function askConfirm(message,onYes,opts){
  opts=opts||{};
  openModal(`
    <div class="modal-head"><h2>${esc(opts.title||'Please confirm')}</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="confirm-body">${esc(message).replace(/\n/g,'<br>')}</div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn ${opts.danger===false?'primary':'danger-solid'}" id="ask-yes">${esc(opts.yes||'Yes, continue')}</button></div>
  `);
  const y=document.getElementById('ask-yes');
  y.onclick=()=>{ closeModal(); onYes(); };
  y.focus();
}
/** Stronger "double check" confirmation for destructive actions: the person must type the
 *  exact expected text (e.g. the item's name) before the confirm button is enabled. */
function askConfirmTyped(message,expectedText,onYes,opts){
  opts=opts||{};
  openModal(`
    <div class="modal-head"><h2>${esc(opts.title||'Please confirm')}</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="confirm-body">${esc(message).replace(/\n/g,'<br>')}</div>
    <div class="field" style="margin-top:12px;">
      <label>Type <strong>${esc(expectedText)}</strong> to confirm</label>
      <input type="text" id="ask-typed-input" autocomplete="off">
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger-solid" id="ask-yes" disabled>${esc(opts.yes||'Yes, delete')}</button></div>
  `);
  const input=document.getElementById('ask-typed-input');
  const y=document.getElementById('ask-yes');
  const matches=()=>input.value.trim().toLowerCase()===String(expectedText).trim().toLowerCase();
  input.addEventListener('input',()=>{ y.disabled=!matches(); });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter' && matches()){ closeModal(); onYes(); } });
  y.onclick=()=>{ if(!matches()) return; closeModal(); onYes(); };
  input.focus();
}

/* ============================= GLOBAL INSTANT SEARCH ============================= */
// Entirely local/in-memory — matches straight against DATA already held in the
// browser, so results appear as the user types with no network involved.
const GS_LIMIT=6;
function gsMatch(hay,q){ return String(hay||'').toLowerCase().includes(q); }
function computeGlobalSearch(qRaw){
  const q=String(qRaw||'').trim().toLowerCase();
  if(!q) return null;
  const students=activeStudents().filter(s=>gsMatch(s.name,q)).slice(0,GS_LIMIT)
    .map(s=>({type:'student', id:s.id, label:s.name, meta:[classById(s.classId)?.name, streamById(s.streamId)?.name].filter(Boolean).join(' · ')||'—'}));
  const classes=scopedClasses().filter(c=>gsMatch(c.name,q)).slice(0,GS_LIMIT)
    .map(c=>({type:'class', id:c.id, label:c.name, meta:activeStudents().filter(s=>s.classId===c.id).length+' students'}));
  const streams=scopedStreams().filter(s=>gsMatch(s.name,q) || gsMatch(classById(s.classId)?.name+' '+s.name,q)).slice(0,GS_LIMIT)
    .map(s=>({type:'stream', id:s.id, label:(classById(s.classId)?.name||'—')+' — '+s.name, meta:activeStudents().filter(x=>x.streamId===s.id).length+' students'}));
  const subjects=scopedSubjects().filter(s=>gsMatch(s.name,q) || gsMatch(s.code,q)).slice(0,GS_LIMIT)
    .map(s=>({type:'subject', id:s.id, label:s.name, meta:s.code||''}));
  const exams=accessibleExams().filter(e=>gsMatch(e.name,q) || gsMatch(e.term,q) || gsMatch(String(e.year),q)).slice(0,GS_LIMIT)
    .map(e=>({type:'exam', id:e.id, label:e.name, meta:(e.term||'')+' '+(e.year||'')}));
  const groups=[
    {key:'student', title:'Students', items:students},
    {key:'class', title:'Classes', items:classes},
    {key:'stream', title:'Streams', items:streams},
    {key:'subject', title:'Subjects', items:subjects},
    {key:'exam', title:'Examinations', items:exams},
  ].filter(g=>g.items.length);
  return {q, groups, total:groups.reduce((n,g)=>n+g.items.length,0)};
}
function renderGlobalSearch(qRaw){
  const box=document.getElementById('gs-results');
  if(!box) return;
  const res=computeGlobalSearch(qRaw);
  if(!res){ box.style.display='none'; box.innerHTML=''; return; }
  if(!res.total){
    box.innerHTML=`<div class="gsearch-empty">No matches for "${esc(res.q)}"</div>`;
    box.style.display='block'; return;
  }
  box.innerHTML = res.groups.map(g=>`
    <div class="gsearch-group">${esc(g.title)}</div>
    ${g.items.map(it=>`
      <div class="gsearch-item" data-gs-type="${it.type}" data-gs-id="${esc(it.id)}">
        <span>${esc(it.label)}</span><span class="gs-meta">${esc(it.meta)}</span>
      </div>
    `).join('')}
  `).join('');
  box.style.display='block';
}
function closeGlobalSearch(){
  const box=document.getElementById('gs-results'); const inp=document.getElementById('gs-input');
  if(box){ box.style.display='none'; box.innerHTML=''; }
  if(inp) inp.value='';
}
function goToGlobalSearchResult(type,id){
  if(type==='student'){ goto('studentDetail',{studentId:id}); }
  else if(type==='class'){ goto('students',{classId:id, streamId:null}); }
  else if(type==='stream'){ const st=scopedStreams().find(s=>s.id===id); goto('students',{classId:st?st.classId:null, streamId:id}); }
  else if(type==='subject'){ goto('subjectAnalysis',{subjectId:id, examId:null}); }
  else if(type==='exam'){ goto('analysis',{examId:id}); }
  closeGlobalSearch();
}

// True whenever a modal (add/edit form, etc.) is open — used to warn before
// losing unsaved input to in-app navigation, the phone Back button, or a
// browser refresh/close.
function hasOpenUnsavedForm(){
  const root=document.getElementById('modal-root');
  return !!(root && root.innerHTML.trim());
}
// Establishes a clean "anchor" history entry (login, logout, switching schools
// as Super Admin, restoring a session on load). Uses replaceState so the phone
// Back button, from this point, behaves like leaving the app rather than
// hopping to some earlier in-app section.
function resetNavAnchor(view,params){
  STATE.view=view; STATE.params=params||{};
  try{ history.replaceState({view:STATE.view,params:STATE.params},'','#'+view); }catch(err){}
}
function goto(view,params,_fromHistory){
  const doNav=()=>{
    STATE.view=view; STATE.params=params||{};
    if(!_fromHistory){
      try{ history.pushState({view:STATE.view,params:STATE.params},'','#'+view); }catch(err){}
    }
    render(); window.scrollTo(0,0);
  };
  if(!_fromHistory && hasOpenUnsavedForm()){
    askConfirm('You have a form open with unsaved changes. Leaving now will discard them.',()=>{ closeModal(); doNav(); },{title:'Discard unsaved changes?',yes:'Discard and continue'});
    return;
  }
  doNav();
}
// Phone/browser Back and Forward buttons: return to the previous in-app
// section instead of leaving or reloading the app. If a form is open with
// unsaved changes, confirm before discarding it; if the person cancels, the
// current section is restored so the URL doesn't drift ahead of the app.
window.addEventListener('popstate',(e)=>{
  const target=(e.state&&e.state.view)?e.state:{view:'dashboard',params:{}};
  if(hasOpenUnsavedForm()){
    const restore={view:STATE.view,params:STATE.params};
    try{ history.pushState({view:restore.view,params:restore.params},'','#'+restore.view); }catch(err){}
    askConfirm('You have a form open with unsaved changes. Going back will discard them.',()=>{
      closeModal();
      try{ history.replaceState({view:target.view,params:target.params},'','#'+target.view); }catch(err){}
      goto(target.view,target.params,true);
    },{title:'Discard unsaved changes?',yes:'Discard and go back'});
    return;
  }
  goto(target.view,target.params,true);
});
window.addEventListener('beforeunload',(e)=>{
  if(hasOpenUnsavedForm()){ e.preventDefault(); e.returnValue=''; }
});
