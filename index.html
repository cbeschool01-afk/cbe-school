/* ============================= SCHOOL-WIDE STATS (for Dashboard) ============================= */
// Aggregates every mark ever entered, across all examinations, using each
// student's current class/stream — consistent with how per-exam analysis works.
function computeSchoolStats(){
  const entries=[]; // {studentId, classId, subjectId, pct}
  scopedExams().forEach(exam=>{
    const students=examStudents(exam);
    exam.results=exam.results||{};
    students.forEach(st=>{
      (exam.subjects||[]).forEach(subId=>{
        const v=exam.results[st.id]?exam.results[st.id][subId]:null;
        if(v!=null && v!==''){
          entries.push({studentId:st.id, classId:exam.classId, subjectId:subId, pct:Number(v)/exam.outOf*100});
        }
      });
    });
  });

  const gradeCounts={};
  if(hasScale()){
    DATA.settings.scale.forEach(g=>gradeCounts[g.grade]=0);
    entries.forEach(e=>{ const g=gradeForPct(e.pct).grade; gradeCounts[g]=(gradeCounts[g]||0)+1; });
  }

  const overallMean = entries.length? avg(entries.map(e=>e.pct)) : null;
  const overallMeanPoints = (entries.length && hasScale())? avg(entries.map(e=>pointsForPct(e.pct))) : null;

  const bySubject={};
  entries.forEach(e=>{ (bySubject[e.subjectId]=bySubject[e.subjectId]||[]).push(e.pct); });
  const subjectPerf=Object.keys(bySubject).map(id=>({subject:subjectById(id), mean:avg(bySubject[id]), n:bySubject[id].length}))
    .filter(s=>s.subject).sort((a,b)=>b.mean-a.mean);
  const bestSubject=subjectPerf.length?subjectPerf[0]:null;
  const weakestSubject=subjectPerf.length?subjectPerf[subjectPerf.length-1]:null;

  const byClass={};
  entries.forEach(e=>{ (byClass[e.classId]=byClass[e.classId]||[]).push(e.pct); });
  const classPerf=scopedClasses().map(c=>{
    const pcts=byClass[c.id]||[];
    return {cls:c, mean: pcts.length?avg(pcts):null, meanPoints: (pcts.length&&hasScale())?avg(pcts.map(pointsForPct)):null, n:pcts.length};
  });

  const byStudent={};
  entries.forEach(e=>{ (byStudent[e.studentId]=byStudent[e.studentId]||[]).push(e.pct); });
  const studentPerf=Object.keys(byStudent).map(id=>{
    const st=studentById(id); const pcts=byStudent[id];
    return {student:st, mean:avg(pcts), meanPoints:hasScale()?avg(pcts.map(pointsForPct)):null, n:pcts.length};
  }).filter(s=>s.student).sort((a,b)=>b.mean-a.mean);

  assignCompetitionRanks(studentPerf,s=>s.mean,'rank');
  return {entries, gradeCounts, overallMean, overallMeanPoints, subjectPerf, bestSubject, weakestSubject, classPerf, studentPerf};
}

  if(DATA.settings.demoData) wrap.appendChild(el(`<div class="banner-warn demo no-print"><div><strong>You are looking at demo data.</strong> All learners are fictional — explore freely: enter marks, view analysis, ranking and reports, compare the two examinations, and try Backup & Restore.</div><button class="btn sm" id="clear-demo">Clear demo data</button></div>`));
  wrap.appendChild(el(`
    <div class="stat-row">
      <div class="stat"><div class="n">${totalStudents}</div><div class="l">Total students</div></div>
      <div class="stat"><div class="n">${totalClasses}</div><div class="l">Total classes</div></div>
      <div class="stat"><div class="n">${totalSubjects}</div><div class="l">Total subjects</div></div>
      <div class="stat"><div class="n">${totalExams}</div><div class="l">Examinations recorded</div></div>
    </div>

  if(totalStudents===0){
    wrap.appendChild(el(`

        <h3>Let's set AMBROH up for your school</h3>

          <button class="btn" id="load-demo">Try with demo data</button>
        </div>
      </div>
    `));
    return wrap;
  }

  const s=computeSchoolStats();

  // Overall performance snapshot (recomputed fresh on every render, so it
  // always reflects the latest marks the moment this page is opened).
  wrap.appendChild(el(`
    <div class="stat-row">
      <div class="stat"><div class="n">${s.overallMean==null?'—':round1(s.overallMean)}</div><div class="l">Overall mean score</div></div>
      <div class="stat"><div class="n">${s.overallMean==null?'—':meanGradeFromPoints(s.overallMeanPoints).grade}</div><div class="l">Overall mean grade</div></div>
      <div class="stat"><div class="n" style="font-size:18px;">${s.bestSubject?esc(s.bestSubject.subject.name):'—'}</div><div class="l">Best-performing subject ${s.bestSubject?'· '+round1(s.bestSubject.mean)+'%':''}</div></div>
      <div class="stat"><div class="n" style="font-size:18px;">${s.weakestSubject?esc(s.weakestSubject.subject.name):'—'}</div><div class="l">Weakest-performing subject ${s.weakestSubject?'· '+round1(s.weakestSubject.mean)+'%':''}</div></div>
    </div>
  `));

  if(!s.entries.length){
    wrap.appendChild(el(`<div class="empty"><h3>No marks recorded yet</h3><p>Create an examination and enter marks to see performance analysis here.</p></div>`));
  } else {
    // Top-performing students (hidden when ranking is switched off)
    if(rankingOn()){
    const panelTop=el(`<div class="panel"></div>`);
    panelTop.appendChild(el(`<div class="panel-title"><h2>Top-performing students</h2><div class="small">Across all examinations recorded</div></div>`));
    const tbl=el(`<table class="data"><thead><tr><th class="num">Rank</th><th>Student</th><th>Class</th><th class="num">Mean %</th><th class="num">Mean grade</th></tr></thead><tbody></tbody></table>`);
    const tb=tbl.querySelector('tbody');
    s.studentPerf.slice(0,5).forEach(r=>{
      const mg=meanGradeFromPoints(r.meanPoints).grade;
      tb.appendChild(el(`<tr><td class="num">${rankHTML(r.rank,r.rankTied)}</td><td>${esc(r.student.name)}</td><td>${esc(classById(r.student.classId)?.name||'—')}</td><td class="num">${round1(r.mean)}</td><td class="num">${gradeBadgeHTML(mg)}</td></tr>`));
    });
    panelTop.appendChild(tbl);
    wrap.appendChild(panelTop);

    // Class performance & Subject performance, side by side
    const grid=el(`<div class="grid cols-2"></div>`);
    const classPanel=el(`<div class="panel"></div>`);
    classPanel.appendChild(el(`<div class="panel-title"><h2>Class performance</h2></div>`));
    classPanel.appendChild(renderPctBarChart(s.classPerf.filter(c=>c.n>0).map(c=>({label:c.cls.name, value:c.mean}))));
    if(!s.classPerf.some(c=>c.n>0)) classPanel.appendChild(el(`<p class="small">No marks recorded yet.</p>`));
    grid.appendChild(classPanel);

    const subjPanel=el(`<div class="panel"></div>`);
    subjPanel.appendChild(el(`<div class="panel-title"><h2>Subject performance</h2></div>`));
    subjPanel.appendChild(renderPctBarChart(s.subjectPerf.map(sp=>({label:sp.subject.name, value:sp.mean, accent:sp.subject.id===(s.bestSubject&&s.bestSubject.subject.id)}))));
    grid.appendChild(subjPanel);
    wrap.appendChild(grid);

    // Grade distribution
    const gdPanel=el(`<div class="panel"></div>`);
    gdPanel.appendChild(el(`<div class="panel-title"><h2>Grade distribution</h2><div class="small">All examinations combined</div></div>`));
    gdPanel.appendChild(renderGradeBarChart(s.gradeCounts));
    wrap.appendChild(gdPanel);
  }

  // Classes overview table
  const panel2=el(`<div class="panel"><div class="panel-title"><h2>Classes overview</h2></div></div>`);
  const tbl2=el(`<table class="data"><thead><tr><th>Class</th><th>Streams</th><th class="num">Students</th><th class="num">Mean %</th></tr></thead><tbody></tbody></table>`);

  });
  panel2.appendChild(tbl2);
  wrap.appendChild(panel2);

  return wrap;
}
function renderGradeBarChart(gradeCounts){
  const wrap=el(`<div></div>`);
  if(!hasScale()){
    wrap.appendChild(el(`<p class="small">Set up a grading scale in Settings to see the grade distribution.</p>`));
    return wrap;
  }
  const scale=[...DATA.settings.scale].sort((a,b)=>b.points-a.points);
  const max=Math.max(1,...scale.map(g=>gradeCounts[g.grade]||0));
  scale.forEach(g=>{
    const n=gradeCounts[g.grade]||0;
    const pct=Math.round((n/max)*100);
    wrap.appendChild(el(`
      <div class="chart-bar-row">
        <div class="chart-bar-label">${esc(g.grade)}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%"></div></div>
        <div class="chart-bar-n">${n}</div>
      </div>
    `));
  });
  return wrap;
}

/* ============================= INDIVIDUAL STUDENT PERFORMANCE ============================= */
function viewStudentDetail(){
  const wrap=el(`<div></div>`);
  const st=studentById(STATE.params.studentId);
  if(!st){
    wrap.appendChild(el(`<div class="pagehead"><div><h1>Student not found</h1></div></div>`));
    wrap.appendChild(el(`<button class="btn" data-nav="students">← Back to Students</button>`));
    return wrap;
  }
  wrap.appendChild(el(`
    <div class="pagehead">
      <div><h1>${esc(st.name)}</h1><div class="sub">${esc(classById(st.classId)?.name||'—')}${st.streamId?' · '+esc(streamById(st.streamId)?.name||''):''} — individual academic performance</div></div>
      <div class="actions"><button class="btn" data-nav="students">← Back to Students</button></div>
    </div>
  `));

  // Gather every examination this student has at least one recorded mark in.
  const history=[];
  scopedExams().forEach(exam=>{
    const row=exam.results && exam.results[st.id];
    if(!row) return;
    const subjects=exam.subjects.map(subjectById).filter(Boolean);
    const pcts=[];
    subjects.forEach(sub=>{
      const v=row[sub.id];
      if(v!=null && v!==''){ pcts.push(Number(v)/exam.outOf*100); }
    });
    if(!pcts.length) return;
    const meanPct=avg(pcts);
    const meanPoints=hasScale()?avg(pcts.map(pointsForPct)):null;
    // position within this exam's own cohort
    const stats=computeExamStats(exam);
    const rankRow=stats.studentRows.find(r=>r.student.id===st.id);
    history.push({exam, meanPct, meanPoints, sat:pcts.length, total:rankRow?rankRow.total:null, position:rankRow?rankRow.position:null, of:stats.candidateCount});
  });
  history.sort((a,b)=> a.exam.year-b.exam.year || (a.exam.term<b.exam.term?-1:1));

  if(!history.length){
    wrap.appendChild(el(`<div class="empty"><h3>No marks recorded for this student yet</h3><p>Once marks are entered in an examination, their performance history appears here.</p></div>`));
    return wrap;
  }

  const overallMean=avg(history.map(h=>h.meanPct));
  const overallPoints=hasScale()?avg(history.map(h=>h.meanPoints).filter(v=>v!=null)):null;
  wrap.appendChild(el(`
    <div class="stat-row">
      <div class="stat"><div class="n">${history.length}</div><div class="l">Examinations sat</div></div>
      <div class="stat"><div class="n">${round1(overallMean)}</div><div class="l">Average mean % (all exams)</div></div>
      <div class="stat"><div class="n">${meanGradeFromPoints(overallPoints).grade}</div><div class="l">Average mean grade</div></div>
      <div class="stat"><div class="n">${round1(history[history.length-1].meanPct)}</div><div class="l">Most recent mean %</div></div>
    </div>
  `));

  const trendPanel=el(`<div class="panel"></div>`);
  trendPanel.appendChild(el(`<div class="panel-title"><h2>Performance over time</h2><div class="small">Mean % per examination, oldest to newest</div></div>`));
  trendPanel.appendChild(renderPctBarChart(history.map(h=>({label:h.exam.name+' · '+h.exam.term+' '+h.exam.year, value:h.meanPct}))));
  wrap.appendChild(trendPanel);

  const panel=el(`<div class="panel"></div>`);
  panel.appendChild(el(`<div class="panel-title"><h2>Examination history</h2></div>`));
  const tbl=el(`<table class="data"><thead><tr><th>Examination</th><th>Term / Year</th><th class="num">Subjects sat</th><th class="num">Total marks</th><th class="num">Mean %</th><th class="num">Mean grade</th>${rankingOn()?'<th class="num">Position</th>':''}</tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector('tbody');
  history.forEach(h=>{
    const mg=meanGradeFromPoints(h.meanPoints).grade;
    tb.appendChild(el(`<tr>
      <td>${esc(h.exam.name)}</td>
      <td>${esc(h.exam.term)} · ${esc(h.exam.year)}</td>
      <td class="num">${h.sat}</td>
      <td class="num">${h.total==null?'—':h.total}</td>
      <td class="num">${round1(h.meanPct)}</td>
      <td class="num">${gradeBadgeHTML(mg)}</td>
      ${rankingOn()?`<td class="num">${h.position?ordinal(h.position)+' of '+h.of:'—'}</td>`:''}
    </tr>`));
  });
  panel.appendChild(tbl);
  wrap.appendChild(panel);

  // Per-subject breakdown across all exams sat
  const bySubject={};
  scopedExams().forEach(exam=>{
    const row=exam.results && exam.results[st.id];
    if(!row) return;
    exam.subjects.forEach(subId=>{
      const v=row[subId];
      if(v==null || v==='') return;
      const sub=subjectById(subId); if(!sub) return;
      (bySubject[subId]=bySubject[subId]||{subject:sub, pcts:[]}).pcts.push(Number(v)/exam.outOf*100);
    });
  });
  const subjRows=Object.values(bySubject).map(s=>({subject:s.subject, mean:avg(s.pcts), n:s.pcts.length})).sort((a,b)=>b.mean-a.mean);
  if(subjRows.length){
    const subjPanel=el(`<div class="panel"></div>`);
    subjPanel.appendChild(el(`<div class="panel-title"><h2>Average performance by subject</h2><div class="small">Across all examinations sat</div></div>`));
    subjPanel.appendChild(renderPctBarChart(subjRows.map(s=>({label:s.subject.name, value:s.mean}))));
    wrap.appendChild(subjPanel);

    // Raw marks, subject by examination — the actual score sat in each sitting.
    const matrixPanel=el(`<div class="panel"></div>`);
    matrixPanel.appendChild(el(`<div class="panel-title"><h2>Subject marks</h2><div class="small">Raw mark scored in each examination sat</div></div>`));
    const matTbl=el(`<table class="data"><thead><tr><th>Subject</th>${history.map(h=>`<th class="num">${esc(h.exam.name)}<div class="small" style="font-weight:400;">${esc(h.exam.term)} ${esc(h.exam.year)}</div></th>`).join('')}</tr></thead><tbody></tbody></table>`);
    const matTb=matTbl.querySelector('tbody');
    subjRows.map(s=>s.subject).forEach(sub=>{
      const cells=history.map(h=>{
        const v=h.exam.results && h.exam.results[st.id] ? h.exam.results[st.id][sub.id] : null;
        return `<td class="num">${v==null||v===''?'—':v+' / '+h.exam.outOf}</td>`;
      }).join('');
      matTb.appendChild(el(`<tr><td>${esc(sub.name)}</td>${cells}</tr>`));
    });
    matrixPanel.appendChild(matTbl);
    wrap.appendChild(matrixPanel);
  }

  return wrap;
}

/* ============================= MARKS ENTRY ============================= */
function markCellTotal(exam,studentId,subjectIds){
  let total=0, cnt=0;
  subjectIds.forEach(subId=>{
    const v=exam.results[studentId]?.[subId];
    if(v!=null && v!==''){ total+=Number(v); cnt++; }
  });
  return {total, cnt, mean: cnt? total/cnt : null};
}
function sortStudentsForMarks(students, exam, subjectIds, sort){
  const withTotals=students.map(st=>({st, ...markCellTotal(exam,st.id,subjectIds)}));
  switch(sort){
    case 'name_desc': withTotals.sort((a,b)=>b.st.name.localeCompare(a.st.name)); break;
    case 'total_desc': withTotals.sort((a,b)=>(b.mean??-1)-(a.mean??-1)); break;
    case 'total_asc': withTotals.sort((a,b)=>(a.mean??999999)-(b.mean??999999)); break;
    default: withTotals.sort((a,b)=>a.st.name.localeCompare(b.st.name));
  }
  return withTotals.map(w=>w.st);
}

  actions.appendChild(el(`<button class="btn ghost sm" id="mk-clear-all">Clear all marks (this examination)</button>`));
  panel.appendChild(actions);

  let visibleStudents=allStudents.filter(st=>!q || st.name.toLowerCase().includes(q));

  if(mode==='subject'){
    if(!subjectPicker){
      panel.appendChild(el(`<div class="empty"><h3>Choose a subject</h3><p>Pick a subject above to enter marks for every student in one column.</p></div>`));

    });
    panel.appendChild(tbl);
    wrap.appendChild(panel);
    return wrap;
  }

  if(mode==='student'){
    if(!studentPicker){
      panel.appendChild(el(`<div class="empty"><h3>Choose a student</h3><p>Pick a student above to enter all their subject marks in one place.</p></div>`));
      wrap.appendChild(panel);

    }
    exam.results[studentPicker.id]=exam.results[studentPicker.id]||{};
    const rowActions=el(`<div class="actions" style="margin-bottom:10px;"></div>`);
    rowActions.appendChild(el(`<button class="btn ghost sm" data-mk-clear-row="${studentPicker.id}">Clear marks for ${esc(studentPicker.name)}</button>`));
    panel.appendChild(rowActions);
    const tbl=el(`<table class="data" id="marks-grid"><thead><tr><th>Subject</th><th class="center">Mark (out of ${exam.outOf})</th></tr></thead><tbody></tbody></table>`);
    const tb=tbl.querySelector('tbody');
    subjects.forEach(sub=>{
      const v=exam.results[studentPicker.id][sub.id];

    });
    panel.appendChild(tbl);
    wrap.appendChild(panel);
    return wrap;
  }

  // grid mode (whole class, all subjects — minus any filtered out)
  const shownSubjects=subjects.filter(s=>!hiddenSubjects.has(s.id));
  visibleStudents=sortStudentsForMarks(visibleStudents, exam, shownSubjects.map(s=>s.id), sort);
  const tbl=el(`<table class="data" id="marks-grid"><thead><tr><th style="min-width:160px;">Student</th>${shownSubjects.map(s=>{
    const t=subjectTeacherFor(s,exam.classId);
    return `<th class="center">${esc(s.code||s.name)}${t?`<div class="small" style="font-weight:400;">${esc(t)}</div>`:''}<div><button class="btn ghost sm" data-mk-clear-col="${s.id}" style="font-size:10px; padding:2px 6px;">clear</button></div></th>`;
  }).join('')}<th class="center">Total</th><th class="center">Mean %</th><th></th></tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector('tbody');
  if(!visibleStudents.length){
    tb.appendChild(el(`<tr><td colspan="${shownSubjects.length+4}" class="center small" style="padding:16px;">No students match "${esc(STATE.params.q||'')}"</td></tr>`));
  }
  visibleStudents.forEach(st=>{
    exam.results[st.id]=exam.results[st.id]||{};
    const row=document.createElement('tr');
    let cells=`<td>${esc(st.name)}</td>`;
    let total=0, cnt=0;
    shownSubjects.forEach(sub=>{
      const v=exam.results[st.id][sub.id];
      if(v!=null && v!==''){ total+=Number(v); cnt++; }
      cells+=`<td class="center"><input type="number" min="0" max="${exam.outOf}" style="width:64px; text-align:center;" data-mk-student="${st.id}" data-mk-subject="${sub.id}" value="${v==null?'':v}"></td>`;
    });
    const mean = cnt? (total/cnt) : null;
    cells+=`<td class="num total-cell">${cnt?total:'—'}</td><td class="num mean-cell">${mean==null?'—':round1(mean)}</td><td class="center"><button class="btn ghost sm" data-mk-clear-row="${st.id}" style="font-size:10px; padding:2px 6px;">clear</button></td>`;
    row.innerHTML=cells;
    tb.appendChild(row);
  });
  panel.appendChild(tbl);
  wrap.appendChild(panel);
  return wrap;
}

/* ============================= ANALYSIS ============================= */
// Examinations matching an optional class / stream pick — used to drive the
// Class → Stream → Examination cascading selectors on Class Analysis.
// An exam with no streamId (a whole-class sitting) still matches any stream pick.
function examsFor(classId,streamId){
  return reportExams().filter(x=> (!classId || x.classId===classId) && (!streamId || !x.streamId || x.streamId===streamId));
}
// Every examination (any class) that included a given subject, oldest first.
function examsWithSubject(subjectId){
  return reportExams().filter(x=>x.subjects.includes(subjectId))
    .sort((a,b)=> a.year-b.year || (a.date||'').localeCompare(b.date||'') || (a.term<b.term?-1:1));
}
// Full breakdown of one subject within one examination: every student's mark,
// grade distribution and stream comparison — the detail behind
// the Subject Analysis page's "this examination" section.
function computeSubjectDetail(exam, subjectId){
  const sub=subjectById(subjectId);
  const students=examStudents(exam);
  exam.results=exam.results||{};
  const rows=students.map(st=>{
    const v=exam.results[st.id]?.[subjectId];
    if(v==null||v==='') return null;
    const mark=Number(v), pct=mark/exam.outOf*100;
    return {student:st, mark, pct, grade:gradeForPct(pct).grade};
  }).filter(Boolean);
  assignCompetitionRanks(rows,r=>r.pct,'rank');          // competition ranking (ties share a rank)
  withStreamRanks(rows,r=>r.pct,'streamRank');
  const pcts=rows.map(r=>r.pct);
  const mean=avg(pcts);
  const highest=pcts.length?Math.max(...pcts):null;
  const lowest=pcts.length?Math.min(...pcts):null;
  const dist={}; DATA.settings.scale.forEach(g=>dist[g.grade]=0);
  rows.forEach(r=>{ dist[r.grade]=(dist[r.grade]||0)+1; });
  const streamStats=streamsForClass(exam.classId).map(str=>{
    const strRows=rows.filter(r=>r.student.streamId===str.id);
    return {stream:str, mean: strRows.length?avg(strRows.map(r=>r.pct)):null, n:strRows.length};
  }).filter(s=>s.n>0);
  const noStreamRows=rows.filter(r=>!r.student.streamId);
  if(noStreamRows.length) streamStats.push({stream:null, mean:avg(noStreamRows.map(r=>r.pct)), n:noStreamRows.length});
  return {subject:sub, rows, mean, highest, lowest, dist, entries:rows.length, streamStats};
}
// Average performance in a subject, grouped by class, across every examination
// on record that included it — "class comparison" for Subject Analysis.
function subjectClassComparison(subjectId){
  const byClass={};
  scopedExams().forEach(exam=>{
    if(!exam.subjects.includes(subjectId)) return;
    const stats=computeExamStats(exam).subjectStats.find(s=>s.subject.id===subjectId);
    if(!stats || stats.mean==null) return;
    (byClass[exam.classId]=byClass[exam.classId]||[]).push(stats.mean);
  });
  return scopedClasses().map(c=>({cls:c, mean: byClass[c.id]&&byClass[c.id].length?avg(byClass[c.id]):null, n:(byClass[c.id]||[]).length}));
}

function computeExamStats(exam){
  const students=examStudents(exam);
  const subjects=exam.subjects.map(subjectById).filter(Boolean);
  exam.results=exam.results||{};
  const gradeCounts={}; DATA.settings.scale.forEach(g=>gradeCounts[g.grade]=0);

  const subjectStats=subjects.map(sub=>{
    const scores=students.map(st=>{
      const v=exam.results[st.id]?.[sub.id];
      return (v==null||v==='')?null:Number(v);
    }).filter(v=>v!=null);
    const pcts=scores.map(v=>v/exam.outOf*100);
    const mean=avg(pcts);
    const dist={}; DATA.settings.scale.forEach(g=>dist[g.grade]=0);
    pcts.forEach(p=>{ dist[gradeForPct(p).grade]++; });
    const highest = pcts.length? Math.max(...pcts) : null;
    const lowest = pcts.length? Math.min(...pcts) : null;
    return {subject:sub, entries:scores.length, mean, dist, highest, lowest};
  }).sort((a,b)=>(b.mean??-1)-(a.mean??-1));
  assignCompetitionRanks(subjectStats,s=>s.mean,'rank'); // subject ranking, best mean first, ties share a rank

  const studentRows=students.map(st=>{
    const pcts=[]; let total=0; let totalPoints=0;
    subjects.forEach(sub=>{
      const v=exam.results[st.id]?.[sub.id];
      if(v!=null && v!==''){
        const num=Number(v); const p=num/exam.outOf*100;
        pcts.push(p); total+=num; if(hasScale()) totalPoints+=pointsForPct(p); gradeCounts[gradeForPct(p).grade]++;
      }
    });
    const meanPct=avg(pcts);
    const meanPoints = pcts.length? avg(pcts.map(p=>pointsForPct(p))) : null;
    return {student:st, meanPct, meanPoints, totalPoints:hasScale()?totalPoints:null, sat:pcts.length, total};
  }).filter(r=>r.sat>0);

  studentRows.sort((a,b)=> (b.meanPct||0)-(a.meanPct||0));
  assignCompetitionRanks(studentRows,r=>r.meanPct,'position'); // student ranking (1st, 2nd, 2nd, 4th …)
  withStreamRanks(studentRows,r=>r.meanPct,'streamPosition');

  const overallMean=avg(studentRows.map(r=>r.meanPct));
  const overallMeanPoints=avg(studentRows.map(r=>r.meanPoints));
  const highestScore = studentRows.length? Math.max(...studentRows.map(r=>r.meanPct)) : null;
  const lowestScore = studentRows.length? Math.min(...studentRows.map(r=>r.meanPct)) : null;

  // Stream mean — only meaningful when the examination spans more than one stream
  const streamStats = streamsForClass(exam.classId).map(str=>{
    const rows=studentRows.filter(r=>r.student.streamId===str.id);
    return {stream:str, mean: rows.length?avg(rows.map(r=>r.meanPct)):null, n:rows.length};
  }).filter(s=>s.n>0);
  const noStreamRows=studentRows.filter(r=>!r.student.streamId);
  if(noStreamRows.length) streamStats.push({stream:null, mean:avg(noStreamRows.map(r=>r.meanPct)), n:noStreamRows.length});

  return {subjectStats, studentRows, gradeCounts, overallMean, overallMeanPoints, candidateCount:studentRows.length,
    highestScore, lowestScore, streamStats};
}

      <div class="stat"><div class="n">${stats.lowestScore==null?'—':round1(stats.lowestScore)}</div><div class="l">Lowest score (mean %)</div></div>
    </div>
  `));

  if(rankingOn() && stats.studentRows.length){

    });
    topPanel.appendChild(topTbl);
    rankGrid.appendChild(topPanel);

    const lowPanel=el(`<div class="panel"></div>`);

    const lowTb=lowTbl.querySelector('tbody');

}
function meritTableHTML(exam, stats){
  // Class merit list laid out like a marksheet: S/NO, name, then Mark + PL (performance level) for every subject,
  // learner Total / Mean / PL, and summary rows for subject totals, means, levels and how many learners hold each rubric level.
  const subjects=exam.subjects.map(subjectById).filter(Boolean);
  const rk=rankingOn(), sc=hasScale(), w=sc?2:1, lead=rk?3:2;
  const rows=orderedStudentRows(stats);
  const ssOf=sub=>stats.subjectStats.find(x=>x.subject.id===sub.id);
  const code=sub=>esc(sub.code||sub.short||sub.name);
  const plOf=pct=>sc?gradeBadgeHTML(gradeForPct(pct).grade):'';
  const head=`<tr><th rowspan="2">S/NO</th>${rk?'<th rowspan="2">Pos</th>':''}<th rowspan="2" style="text-align:left;">Name of the learner</th>${subjects.map(s=>`<th colspan="${w}" class="center">${code(s)}</th>`).join('')}<th rowspan="2" class="num">Total</th><th rowspan="2" class="num">Mean %</th>${sc?'<th rowspan="2" class="center">PL</th>':''}</tr>`
    +`<tr>${subjects.map(()=>`<th class="center">Mark</th>${sc?'<th class="center">PL</th>':''}`).join('')}</tr>`;
  const body=rows.map((r,i)=>{
    const cells=subjects.map(sub=>{
      const v=exam.results?.[r.student.id]?.[sub.id];
      if(v==null||v==='') return `<td class="num"></td>${sc?'<td class="center"></td>':''}`;
      const pct=Number(v)/exam.outOf*100;
      return `<td class="num">${esc(v)}</td>${sc?`<td class="center">${plOf(pct)}</td>`:''}`;
    }).join('');
    const mg=r.meanPoints==null?'':meanGradeFromPoints(r.meanPoints).grade;
    return `<tr><td class="center">${i+1}</td>${rk?`<td class="center">${rankHTML(r.position,r.positionTied)}</td>`:''}<td style="text-align:left;">${esc(r.student.name)}</td>${cells}<td class="num">${r.total}</td><td class="num">${round1(r.meanPct)}</td>${sc?`<td class="center">${gradeBadgeHTML(mg)}</td>`:''}</tr>`;
  }).join('');
  const sumMarks=sub=>rows.reduce((n,r)=>{ const v=exam.results?.[r.student.id]?.[sub.id]; return (v==null||v==='')?n:n+Number(v); },0);
  const lab=t=>`<td colspan="${lead}" style="text-align:left;font-weight:700;">${t}</td>`;
  const totalRow=`<tr>${lab('TOTAL')}${subjects.map(s=>`<td colspan="${w}" class="center">${round1(sumMarks(s))}</td>`).join('')}<td class="num">${rows.reduce((n,r)=>n+(r.total||0),0)}</td><td></td>${sc?'<td></td>':''}</tr>`;
  const meanRow=`<tr>${lab('MEAN %')}${subjects.map(s=>{ const ss=ssOf(s); return `<td colspan="${w}" class="center">${ss&&ss.mean!=null?round1(ss.mean):''}</td>`; }).join('')}<td></td><td class="num">${stats.overallMean==null?'':round1(stats.overallMean)}</td>${sc?`<td class="center">${stats.overallMean==null?'':gradeBadgeHTML(meanGradeFromPoints(stats.overallMeanPoints).grade)}</td>`:''}</tr>`;
  const plRow=sc?`<tr>${lab('PL')}${subjects.map(s=>{ const ss=ssOf(s); return `<td colspan="${w}" class="center">${ss&&ss.mean!=null?gradeBadgeHTML(meanGradeFromPoints(pointsForPct(ss.mean)).grade):''}</td>`; }).join('')}<td></td><td></td><td></td></tr>`:'';
  let rubric='';
  if(sc){
    const bands=[...DATA.settings.scale].sort((a,b)=>b.points-a.points);
    const overall={}; rows.forEach(r=>{ if(r.meanPoints!=null){ const g=meanGradeFromPoints(r.meanPoints).grade; overall[g]=(overall[g]||0)+1; } });
    rubric=`<tr><th colspan="${lead}" style="text-align:left;">RUBRICS · RANGE · POINTS</th>${subjects.map(s=>`<th colspan="${w}" class="center">${code(s)}</th>`).join('')}<th colspan="3" class="center">Mean PL</th></tr>`
      +bands.map(g=>`<tr><td colspan="${lead}" style="text-align:left;"><strong>${esc(g.grade)}</strong> &nbsp; ${esc(g.min)}–${esc(g.max)} &nbsp; ${esc(g.points)} pt${g.points===1?'':'s'}</td>${subjects.map(s=>{ const ss=ssOf(s); return `<td colspan="${w}" class="center">${ss?(ss.dist[g.grade]||0):0}</td>`; }).join('')}<td colspan="3" class="center">${overall[g.grade]||0}</td></tr>`).join('');
  }
  return `<table class="data merit" data-landscape="1"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${totalRow}${meanRow}${plRow}${rubric}</tfoot></table>`;
}
function renderAnalysisTab(tab, body, exam, stats){
  body.innerHTML='';
  if(tab==='subject'){
    const tbl=el(`<table class="data"><thead><tr>${rankingOn()?'<th class="num">Rank</th>':''}<th>Subject</th><th class="num">Entries</th><th class="num">Mean %</th><th class="num">Mean grade</th><th class="num">Highest</th><th class="num">Lowest</th><th>Distribution (A → E)</th></tr></thead><tbody></tbody></table>`);
    const tb=tbl.querySelector('tbody');

/* ============================= PERFORMANCE COMPARISON ============================= */
// Five comparison modes share one engine: each mode groups every learner's
// results into "items" (examinations, terms, subjects, classes or streams),
// builds one row per learner per item, and derives the same five measures —
// mean score, mean grade, highest and lowest score — so the
// table, the change columns and the charts read identically in every mode.
const CMP_MODES=[
  {id:'exam',    label:'Examination vs examination', chrono:true,  noun:'examination'},
  {id:'term',    label:'Term vs term',               chrono:true,  noun:'term'},
  {id:'subject', label:'Subject vs subject',         chrono:false, noun:'subject'},
  {id:'class',   label:'Class vs class',             chrono:false, noun:'class'},
  {id:'stream',  label:'Stream vs stream',           chrono:false, noun:'stream'},
];
function periodKey(x){ return x.year+'|'+x.term; }
function periodLabel(k){ const i=k.indexOf('|'); return k.slice(i+1)+' '+k.slice(0,i); }
function periodCmp(a,b){
  const ia=a.indexOf('|'), ib=b.indexOf('|'), ya=Number(a.slice(0,ia)), yb=Number(b.slice(0,ib));
  if(ya!==yb) return ya-yb;
  const ta=a.slice(ia+1), tb=b.slice(ib+1); return ta<tb?-1:ta>tb?1:0;
}
function examNameKey(x){ return String(x.name||'').trim().toLowerCase(); }
function examChrono(a,b){ return a.year-b.year || (a.term<b.term?-1:a.term>b.term?1:0) || (a.date||'').localeCompare(b.date||''); }
function examFullLabel(x){
  return `${x.name} — ${classById(x.classId)?.name||'—'}${x.streamId?' '+(streamById(x.streamId)?.name||''):''} · ${x.term} ${x.year}`;
}

// One row per learner: if a learner has several results inside one item
// (e.g. three exams in a term) their results are averaged first, so a learner
// counts once in candidates and highest/lowest.
function dedupeRows(entries){
  const m=new Map();
  entries.forEach(e=>{ if(!m.has(e.id)) m.set(e.id,[]); m.get(e.id).push(e); });
  return [...m.entries()].map(([id,arr])=>({id, pct:avg(arr.map(a=>a.pct)), points:hasScale()?avg(arr.map(a=>a.points)):null}));
}
// rows: [{pct, points}]. fromMean=true derives the grade from the mean % (the way
// Subject Analysis does); otherwise from the average of learners' grade points
// (the way Class Analysis does), so figures match those pages.
function metricsFromRows(rows,opts){
  const n=rows.length, pcts=rows.map(r=>r.pct).filter(v=>v!=null);
  const mean=avg(pcts);
  let points=null;
  if(hasScale() && n && mean!=null) points = (opts&&opts.fromMean) ? pointsForPct(mean) : avg(rows.map(r=>r.points));
  return {
    n, mean, points,
    grade: points==null ? '—' : meanGradeFromPoints(points).grade,
    highest: pcts.length? Math.max(...pcts) : null,
    lowest:  pcts.length? Math.min(...pcts) : null,
  };
}

// Only the filters that make sense for the mode take effect (the mode's own
// dimension is what gets compared, so it can't also be a filter).
function cmpFilters(params,mode){
  const f={classId:params.classId||'', streamId:params.streamId||'', period:params.period||'', name:params.name||'', subjectId:params.subjectId||''};
  if(mode==='class') f.classId='';
  if(mode==='stream') f.streamId='';
  if(mode==='term') f.period='';
  if(mode==='subject') f.subjectId='';
  if(mode==='exam') f.name='';
  return f;
}
function cmpBuildItems(mode,f){
  const exams=reportExams().filter(x=>
    (!f.classId || x.classId===f.classId) &&
    (!f.streamId || !x.streamId || x.streamId===f.streamId) &&
    (!f.period || periodKey(x)===f.period) &&
    (!f.name || examNameKey(x)===f.name));
  const groups=new Map();
  const grp=(key,label,short,extra)=>{ if(!groups.has(key)) groups.set(key,Object.assign({key,label,short,entries:[]},extra||{})); return groups.get(key); };
  exams.forEach(x=>{
    const stats=computeExamStats(x);
    stats.studentRows.forEach(r=>{
      const st=r.student;
      if(f.streamId && st.streamId!==f.streamId) return;
      const marks={};
      x.subjects.forEach(sid=>{ const v=x.results?.[st.id]?.[sid]; if(v!=null && v!=='') marks[sid]=Number(v)/x.outOf*100; });
      if(mode==='subject'){
        Object.keys(marks).forEach(sid=>{
          const sub=subjectById(sid); if(!sub) return;
          grp(sid,sub.name,sub.name,{sortKey:sub.name.toLowerCase()})
            .entries.push({id:st.id, pct:marks[sid], points:hasScale()?pointsForPct(marks[sid]):null, marks});
        });
        return;
      }
      if(f.subjectId && marks[f.subjectId]==null) return;
      let g;
      if(mode==='exam'){
        g=grp(x.id, examFullLabel(x), `${x.name} · ${classById(x.classId)?.name||'—'}${x.streamId?' '+(streamById(x.streamId)?.name||''):''} · ${x.term.replace('Term ','T')} ${x.year}`, {exam:x});
      } else if(mode==='term'){
        const k=periodKey(x); g=grp(k, periodLabel(k), periodLabel(k), {periodKey:k});
      } else if(mode==='class'){
        const c=classById(x.classId); if(!c) return;
        g=grp(c.id, c.name, c.name, {sortKey:scopedClasses().indexOf(c)});
      } else {
        if(!st.streamId) return;
        const sm=streamById(st.streamId); if(!sm) return;
        const c=classById(sm.classId), lbl=`${c?c.name+' ':''}${sm.name}`;
        g=grp(sm.id, lbl, lbl, {sortKey:String(scopedClasses().indexOf(c)+100)+'|'+sm.name.toLowerCase()});
      }
      const pct=f.subjectId? marks[f.subjectId] : r.meanPct;
      const points=hasScale()? (f.subjectId? pointsForPct(pct) : r.meanPoints) : null;
      g.entries.push({id:st.id, pct, points, marks});
    });
  });
  const fromMean = mode==='subject' || !!f.subjectId;
  const items=[...groups.values()].map(g=>{
    const rows=dedupeRows(g.entries);
    return Object.assign(g,{rows, m:metricsFromRows(rows,{fromMean})});
  });
  items.sort((a,b)=>{
    if(mode==='exam') return examChrono(a.exam,b.exam);
    if(mode==='term') return periodCmp(a.periodKey,b.periodKey);
    if(typeof a.sortKey==='number') return a.sortKey-b.sortKey;
    return String(a.sortKey).localeCompare(String(b.sortKey));
  });
  return items;
}
function cmpCompute(params){
  const mode=CMP_MODES.some(m=>m.id===params.mode)?params.mode:'exam';
  const def=CMP_MODES.find(m=>m.id===mode);
  const f=cmpFilters(params,mode);
  const available=cmpBuildItems(mode,f);
  const keys=new Set(available.map(i=>i.key));
  const ids=Array.isArray(params.ids)? params.ids.filter(k=>keys.has(k)) : available.slice(0,8).map(i=>i.key);
  const selected=available.filter(i=>ids.includes(i.key));
  const baseKey=(!def.chrono && selected.some(i=>i.key===params.base)) ? params.base : (selected[0]?selected[0].key:null);
  return {mode,def,f,available,selected,baseKey};
}
// What each row's "change" is measured against: the previous item for
// time-ordered modes (exam, term); the chosen baseline item otherwise.
// Examinations from different classes/streams aren't the same cohort, so an
// examination's change is measured against the previous selected examination
// for the SAME class (and stream) — never against another class's paper.
function cohortKey(it){ return it.exam ? it.exam.classId+'|'+(it.exam.streamId||'') : ''; }
function cmpRefFor(C,i){
  if(C.mode==='exam'){
    for(let j=i-1;j>=0;j--) if(cohortKey(C.selected[j])===cohortKey(C.selected[i])) return C.selected[j];
    return null;
  }
  if(C.def.chrono) return i>0 ? C.selected[i-1] : null;
  const b=C.selected.find(x=>x.key===C.baseKey);
  return (b && b.key!==C.selected[i].key) ? b : null;
}
function deltaHTML(cur,ref,unit){
  if(cur==null||ref==null) return '<span class="delta flat">—</span>';
  const d=cur-ref;
  if(Math.abs(d)<0.05) return `<span class="delta flat">● 0.0${unit||''}</span>`;
  return `<span class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)}${unit||''}</span>`;
}

function renderLineChart(labels,series){
  const W=640,H=250,pl=40,pr=16,pt=14,pb=46, iw=W-pl-pr, ih=H-pt-pb, n=labels.length;
  const X=i=> pl+iw/n*(i+0.5);   // band layout keeps end labels inside the chart
  const Y=v=> pt+ih*(1-Math.max(0,Math.min(100,v))/100);
  let svg=`<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">`;
  [0,25,50,75,100].forEach(g=>{
    svg+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-width="1"/>`+
         `<text x="${pl-6}" y="${Y(g)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-soft)">${g}</text>`;
  });
  labels.forEach((l,i)=>{
    const maxc=Math.max(6,Math.floor((iw/n)/6.2)), t=l.length>maxc? l.slice(0,maxc-1)+'…' : l;
    svg+=`<text x="${X(i)}" y="${H-pb+16}" text-anchor="middle" font-size="10" fill="var(--ink-soft)"><title>${esc(l)}</title>${esc(t)}</text>`;
  });
  series.forEach(se=>{
    let d='', open=false;
    se.values.forEach((v,i)=>{
      if(v==null){ open=false; return; }
      d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; open=true;
    });
    svg+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"${se.dash?` stroke-dasharray="${se.dash}"`:''}/>`;
    se.values.forEach((v,i)=>{
      if(v==null) return;
      svg+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="${se.color}"><title>${esc(se.name)} · ${esc(labels[i])}: ${round1(v)}</title></circle>`;
    });
  });
  svg+='</svg>';
  const legend=`<div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`;
  return el(`<div>${svg}${legend}</div>`);
}

function viewCompare(){
  const wrap=el(`<div></div>`);
  wrap.appendChild(el(`<div class="pagehead">
    <div><h1>Performance Comparison</h1><div class="sub">Compare examinations, terms, subjects, classes or streams — mean score, mean grade, highest and lowest score.</div></div>
    <div class="actions no-print"><button class="btn" id="cmp-export">Export (CSV)</button><button class="btn" id="cmp-print">Print</button></div>
  </div>`));

  if(!scopedExams().length){
    wrap.appendChild(el(`<div class="empty"><h3>No examinations yet</h3><p>Create examinations and enter marks, then come back to compare performance.</p></div>`));
    return wrap;
  }
  const C=cmpCompute(STATE.params);
  const {mode,def,f,available,selected}=C;

  const tabs=el(`<div class="tabs wrap no-print">${CMP_MODES.map(m=>`<div class="tab ${m.id===mode?'active':''}" data-cmp-mode="${m.id}">${m.label}</div>`).join('')}</div>`);
  wrap.appendChild(tabs);

  // ---- Filters (narrow what is compared) ----
  const P=STATE.params;
  const periods=[...new Set(scopedExams().map(periodKey))].sort(periodCmp);
  const nameMap=new Map(); scopedExams().forEach(x=>{ const k=examNameKey(x); if(k && !nameMap.has(k)) nameMap.set(k,x.name); });
  const subjIds=new Set(); scopedExams().forEach(x=>x.subjects.forEach(i=>subjIds.add(i)));
  const streamOpts=(P.classId? streamsForClass(P.classId) : scopedStreams());
  const sel=(id,label,opts,val)=>`<div class="field mb0"><label>${label}</label><select data-cmpf="${id}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(val||'')===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  const fields=[];
  if(mode!=='class')   fields.push(sel('classId','Class',[['','All classes'],...scopedClasses().map(c=>[c.id,c.name])],P.classId));
  if(mode!=='stream')  fields.push(sel('streamId','Stream',[['','All streams'],...streamOpts.map(s=>[s.id,(P.classId?'':(classById(s.classId)?.name||'')+' ')+s.name])],P.streamId));
  if(mode!=='term')    fields.push(sel('period','Term',[['','All terms'],...periods.map(k=>[k,periodLabel(k)])],P.period));
  if(mode!=='exam')    fields.push(sel('name','Examination name',[['','All examinations'],...[...nameMap.entries()].map(([k,n])=>[k,n])],P.name));
  if(mode!=='subject') fields.push(sel('subjectId','Subject',[['','All subjects (overall)'],...[...subjIds].map(subjectById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.id,s.name])],P.subjectId));
  const fp=el(`<div class="panel no-print"><div class="panel-title"><h2>Scope</h2><div class="small">Narrow the comparison, then choose what to compare</div></div><div class="grid cols-3">${fields.join('')}</div></div>`);
  wrap.appendChild(fp);

  // ---- Item picker ----
  const pick=el(`<div class="panel no-print"></div>`);
  pick.appendChild(el(`<div class="panel-title"><h2>Choose ${def.noun==='class'?'classes':def.noun+'s'} to compare</h2><div class="small">Tick two or more</div></div>`));
  if(!available.length){
    pick.appendChild(el(`<p class="small" style="margin:0;">Nothing to compare with this scope yet — ${mode==='stream'?'streams need learners assigned to them and marks entered.':'enter marks, or widen the scope above.'}</p>`));
  } else {
    const chosen=new Set(selected.map(i=>i.key));
    pick.appendChild(el(`<div class="cmp-pick">${available.map(it=>`<label><input type="checkbox" class="cmp-chk" value="${esc(it.key)}" ${chosen.has(it.key)?'checked':''}> <span>${esc(it.label)} <span class="small">· ${it.m.n} ${mode==='subject'?'learners':'learners'}</span></span></label>`).join('')}</div>`));
    if(!def.chrono && selected.length>=2){
      pick.appendChild(el(`<div class="field" style="margin:12px 0 0; max-width:320px;"><label>Measure changes against (baseline)</label>
        <select id="cmp-base">${selected.map(it=>`<option value="${esc(it.key)}" ${it.key===C.baseKey?'selected':''}>${esc(it.label)}</option>`).join('')}</select></div>`));
    }
  }
  wrap.appendChild(pick);

  if(selected.length<2){
    wrap.appendChild(el(`<div class="empty"><h3>Select at least two ${def.noun==='class'?'classes':def.noun+'s'}</h3><p>${available.length<2?'There are fewer than two with marks under this scope.':'Tick another one above to see the comparison.'}</p></div>`));
    return wrap;
  }

  const scopeBits=[];
  if(f.classId) scopeBits.push(classById(f.classId)?.name);
  if(f.streamId) scopeBits.push(streamById(f.streamId)?.name);
  if(f.period) scopeBits.push(periodLabel(f.period));
  if(f.name) scopeBits.push(nameMap.get(f.name));
  scopeBits.push(mode==='subject' ? 'each subject' : (f.subjectId? (subjectById(f.subjectId)?.name||'subject') : 'all subjects'));
  const cohorts=new Set(selected.map(cohortKey));
  const mixed = mode==='exam' && cohorts.size>1;
  const refNote = mode==='exam'
    ? 'Changes (▲ ▼) are measured against the previous selected examination for the same class and stream; the first examination of each class has no change.'
    : def.chrono
    ? 'Changes (▲ ▼) are measured against the previous item in time order.'
    : `Changes (▲ ▼) are measured against the baseline: ${esc(selected.find(i=>i.key===C.baseKey)?.label||'')}.`;

  // ---- Headline cards ----
  const last=selected[selected.length-1];
  const first= mode==='exam' ? selected.find(it=>it!==last && cohortKey(it)===cohortKey(last)) : selected[0];
  let cards;
  if(def.chrono && !first){
    cards=el(`<div class="small" style="margin:-4px 0 12px;">Select two examinations from the same class to see the overall change in the headline cards.</div>`);
  } else if(def.chrono){
    const c=(lbl,a,b,unit)=>`<div class="stat"><div class="n sm">${deltaHTML(a,b,unit).replace('delta ','delta big ')}</div><div class="l">${lbl}</div></div>`;
    cards=el(`<div class="stat-row five">
      ${c('Mean score',last.m.mean,first.m.mean,'')}
      ${c('Mean grade (grade points)',last.m.points,first.m.points,' pts')}
      ${c('Highest score',last.m.highest,first.m.highest,'')}
      ${c('Lowest score',last.m.lowest,first.m.lowest,'')}
    </div>`);
    wrap.appendChild(el(`<div class="small" style="margin:0 0 8px;">Overall change from <strong>${esc(first.short)}</strong> to <strong>${esc(last.short)}</strong></div>`));
  } else {
    const byMean=[...selected].filter(i=>i.m.mean!=null).sort((a,b)=>b.m.mean-a.m.mean);
    const hi=byMean[0], lo=byMean[byMean.length-1];
    cards=el(`<div class="stat-row">
      <div class="stat"><div class="n sm">${hi?esc(hi.short):'—'}</div><div class="l">Highest mean${hi?' · '+round1(hi.m.mean)+'%':''}</div></div>
      <div class="stat"><div class="n sm">${lo?esc(lo.short):'—'}</div><div class="l">Lowest mean${lo?' · '+round1(lo.m.mean)+'%':''}</div></div>
      <div class="stat"><div class="n">${hi&&lo?round1(hi.m.mean-lo.m.mean):'—'}</div><div class="l">Gap between highest and lowest mean</div></div>
    </div>`);
  }
  wrap.appendChild(cards);

  // ---- Comparison table ----
  const tp=el(`<div class="panel"></div>`);
  tp.appendChild(el(`<div class="panel-title"><h2>${def.label}</h2><div class="small">${esc(scopeBits.filter(Boolean).join(' · '))}</div></div>`));
  const thead=`<thead><tr><th>${def.noun.charAt(0).toUpperCase()+def.noun.slice(1)}</th><th class="num">Learners</th><th class="num">Mean score %</th><th class="num">Mean grade</th><th class="num">Highest %</th><th class="num">Lowest %</th></tr></thead>`;
  const cell=(v,ref,isBase,unit)=>`<td class="num">${v==null?'—':round1(v)}<div>${isBase?'<span class="delta flat">baseline</span>':deltaHTML(v,ref,unit)}</div></td>`;
  let body='';
  selected.forEach((it,i)=>{
    const ref=cmpRefFor(C,i), r=ref?ref.m:null, m=it.m;
    const isBase=!def.chrono && it.key===C.baseKey;
    body+=`<tr><td>${esc(it.label)}</td><td class="num">${m.n}</td>
      ${cell(m.mean,r&&r.mean,isBase)}
      <td class="num">${gradeBadgeHTML(m.grade)}<div>${isBase?'<span class="delta flat">baseline</span>':(m.points!=null&&r&&r.points!=null?deltaHTML(m.points,r.points,' pts'):'<span class="delta flat">—</span>')}</div></td>
      ${cell(m.highest,r&&r.highest,isBase)}
      ${cell(m.lowest,r&&r.lowest,isBase)}</tr>`;
  });
  tp.appendChild(el(`<div style="overflow-x:auto;"><table class="data rk-table">${thead}<tbody>${body}</tbody></table></div>`));
  tp.appendChild(el(`<div class="hint" style="margin-top:10px;">${refNote} Changes are in percentage points; grade change is in grade points. ${f.subjectId||mode==='subject'?'Highest / lowest are the best and weakest learner marks in the subject.':'Highest / lowest are the best and weakest learner mean %.'} ${def.chrono&&mode==='term'?'A learner with several examinations in a term is counted once, using their average.':''}</div>`));
  wrap.appendChild(tp);

  // ---- Charts ----
  if(def.chrono && !mixed){
    const cp=el(`<div class="panel"></div>`);
    cp.appendChild(el(`<div class="panel-title"><h2>Trend</h2><div class="small">Mean, highest and lowest across ${def.noun}s, oldest to newest</div></div>`));
    cp.appendChild(renderLineChart(selected.map(i=>i.short),[
      {name:'Mean score %',values:selected.map(i=>i.m.mean),color:'var(--primary)'},
      {name:'Highest %',values:selected.map(i=>i.m.highest),color:'var(--up)',dash:'5 4'},
      {name:'Lowest %',values:selected.map(i=>i.m.lowest),color:'var(--down)',dash:'5 4'},
    ]));
    wrap.appendChild(cp);
  }
  if(mixed) wrap.appendChild(el(`<div class="hint" style="margin:-6px 0 12px;">Trend line and subject/learner change columns are shown when the selected examinations belong to one class. Bars below compare every selected examination.</div>`));
  const g2=el(`<div class="grid cols-2"></div>`);
  [['Mean score %','mean'],['Highest score %','highest'],['Lowest score %','lowest']].forEach(([title,key])=>{
    const p=el(`<div class="panel"><div class="panel-title"><h2>${title}</h2></div></div>`);
    p.appendChild(renderPctBarChart(selected.map(i=>({label:i.short,value:i.m[key]})),{labelWidth:130}));
    g2.appendChild(p);
  });
  wrap.appendChild(g2);

  // ---- Subject matrix (overall modes) ----
  if(mode!=='subject' && !f.subjectId){
    const per=selected.map(it=>{
      const by={};
      it.entries.forEach(e=>Object.keys(e.marks||{}).forEach(sid=>{ (by[sid]=by[sid]||[]).push({id:e.id,pct:e.marks[sid]}); }));
      const out={}; Object.keys(by).forEach(sid=>{ out[sid]=avg(dedupeRows(by[sid]).map(r=>r.pct)); });
      return out;
    });
    const sids=[...new Set(per.flatMap(o=>Object.keys(o)))].map(subjectById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
    if(sids.length){
      const sp=el(`<div class="panel"></div>`);
      sp.appendChild(el(`<div class="panel-title"><h2>Subject mean % by ${def.noun}</h2><div class="small">${def.chrono?'Change column: last vs first':'Change column: vs baseline'}</div></div>`));
      const bi=def.chrono?0:Math.max(0,selected.findIndex(i=>i.key===C.baseKey));
      const li=def.chrono?selected.length-1:null;
      let rows='';
      sids.forEach(sub=>{
        const vals=per.map(o=>o[sub.id]);
        const cells=vals.map(v=>`<td class="num">${v==null?'—':round1(v)}</td>`).join('');
        let chg='<span class="delta flat">—</span>';
        if(def.chrono){ const pres=vals.filter(v=>v!=null); if(pres.length>=2 && !mixed) chg=deltaHTML(pres[pres.length-1],pres[0],''); }
        else { const nonBase=vals.map((v,i)=>({v,i})).filter(x=>x.i!==bi&&x.v!=null); chg=nonBase.length&&vals[bi]!=null? nonBase.map(x=>deltaHTML(x.v,vals[bi],'')).join(' ') : chg; }
        rows+=`<tr><td>${esc(sub.name)}</td>${cells}<td class="num">${chg}</td></tr>`;
      });
      sp.appendChild(el(`<div style="overflow-x:auto;"><table class="data rk-table"><thead><tr><th>Subject</th>${selected.map(i=>`<th class="num">${esc(i.short)}</th>`).join('')}<th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table></div>`));
      wrap.appendChild(sp);
    }
  }

  // ---- Learner progress (time-ordered modes) ----
  if(def.chrono){
    const by=new Map();
    selected.forEach((it,idx)=>it.rows.forEach(r=>{ if(r.pct==null) return; if(!by.has(r.id)) by.set(r.id,{}); by.get(r.id)[idx]=r.pct; }));
    const list=[...by.entries()].filter(([,o])=>Object.keys(o).length>=2)
      .map(([id,o])=>({st:studentById(id),o})).filter(x=>x.st).sort((a,b)=>a.st.name.localeCompare(b.st.name));
    if(list.length){
      const lp=el(`<div class="panel"></div>`);
      lp.appendChild(el(`<div class="panel-title"><h2>Learner progress</h2><div class="small">Learners with results in two or more of the selected ${def.noun}s · mean %</div></div>`));
      let rows='';
      list.forEach(({st,o})=>{
        const cells=selected.map((_,i)=>`<td class="num">${o[i]==null?'—':round1(o[i])}</td>`).join('');
        const idxs=Object.keys(o).map(Number).sort((a,b)=>a-b);
        rows+=`<tr><td>${esc(st.name)}</td>${cells}<td class="num">${deltaHTML(o[idxs[idxs.length-1]],o[idxs[0]],'')}</td></tr>`;
      });
      lp.appendChild(el(`<div style="overflow-x:auto;"><table class="data rk-table"><thead><tr><th>Learner</th>${selected.map(i=>`<th class="num">${esc(i.short)}</th>`).join('')}<th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table></div>`));
      wrap.appendChild(lp);
    }
  }
  return wrap;
}

/* ============================= RANKING ============================= */
// Optional feature (Settings → Ranking). All positions use competition
// ranking: equal scores share a position and the next positions are skipped.
const RK_MODES=[
  {id:'overall', label:'Overall performance'},
  {id:'subject', label:'Subject'},
  {id:'class',   label:'Class'},
  {id:'stream',  label:'Stream'},
];
function examSeriesKey(x){ return [examNameKey(x), x.term, x.year].join('|'); }
// An examination "series" = the same examination set in several classes/streams
// (same name, term and year), which is what makes classes and streams comparable.
function examSeriesList(){
  const map=new Map();
  scopedExams().forEach(x=>{
    const k=examSeriesKey(x);
    if(!map.has(k)) map.set(k,{key:k,label:`${x.name} — ${x.term} ${x.year}`,year:x.year,term:x.term,exams:[]});
    map.get(k).exams.push(x);
  });
  return [...map.values()].sort((a,b)=>b.year-a.year || (a.term<b.term?1:a.term>b.term?-1:0));
}
function rankTable(cols,rows){
  return `<div style="overflow-x:auto;"><table class="data rk-table"><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function viewRanking(){
  const wrap=el(`<div></div>`);
  wrap.appendChild(el(`<div class="pagehead"><div><h1>Ranking</h1><div class="sub">Competition ranking — learners or groups with equal scores share a position and the next position is skipped: 1st, 2nd, 2nd, 4th.</div></div></div>`));
  if(!rankingOn()){
    wrap.appendChild(el(`<div class="empty"><h3>Ranking is switched off</h3><p>An administrator can enable it under Settings → Ranking.</p><button class="btn" data-nav="school">Go to Settings →</button></div>`));
    return wrap;
  }
  if(!scopedExams().length){
    wrap.appendChild(el(`<div class="empty"><h3>No examinations yet</h3><p>Create an examination and enter marks to see rankings.</p></div>`));
    return wrap;
  }
  const P=STATE.params;
  const mode=RK_MODES.some(m=>m.id===P.mode)?P.mode:'overall';
  wrap.appendChild(el(`<div class="tabs wrap no-print">${RK_MODES.map(m=>`<div class="tab ${m.id===mode?'active':''}" data-rk-mode="${m.id}">${m.label}</div>`).join('')}</div>`));

  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${String(cur||'')===String(v)?'selected':''}>${esc(l)}</option>`;
  const selPanel=el(`<div class="panel no-print"></div>`);
  const grid=el(`<div class="grid cols-3"></div>`);
  let exam=null, series=null;

  if(mode==='overall' || mode==='subject'){
    const exams=[...scopedExams()].sort((a,b)=>examChrono(b,a));
    grid.appendChild(el(`<div class="field mb0"><label>Examination</label><select data-rkparam="examId"><option value="">— Choose examination —</option>${exams.map(x=>opt(x.id,examFullLabel(x),P.examId)).join('')}</select></div>`));
    exam=P.examId?examById(P.examId):null;
    if(exam){
      const streams=streamsForClass(exam.classId).filter(s=>!exam.streamId||s.id===exam.streamId);
      if(streams.length>1) grid.appendChild(el(`<div class="field mb0"><label>Rank within</label><select data-rkparam="streamId"><option value="">Whole class (all streams)</option>${streams.map(s=>opt(s.id,'Stream: '+s.name,P.streamId)).join('')}</select></div>`));
      if(mode==='subject') grid.appendChild(el(`<div class="field mb0"><label>Subject</label><select data-rkparam="subjectId"><option value="">— Choose subject —</option>${exam.subjects.map(subjectById).filter(Boolean).map(s=>opt(s.id,s.name,P.subjectId)).join('')}</select></div>`));
    }
  } else {
    const list=examSeriesList();
    series=list.find(x=>x.key===P.seriesKey)||list[0];
    grid.appendChild(el(`<div class="field mb0"><label>Examination (same exam across classes)</label><select data-rkparam="seriesKey">${list.map(x=>opt(x.key,x.label+` (${x.exams.length} class sitting${x.exams.length>1?'s':''})`,series.key)).join('')}</select></div>`));
    if(mode==='stream') grid.appendChild(el(`<div class="field mb0"><label>Class</label><select data-rkparam="classId"><option value="">All classes</option>${scopedClasses().map(c=>opt(c.id,c.name,P.classId)).join('')}</select></div>`));
  }
  selPanel.appendChild(grid);
  wrap.appendChild(selPanel);

  const tieNote=rows=>{
    const t=rows.filter(r=>r.posTied||r.rankTied).length;
    return t?`<div class="hint" style="margin-top:10px;">${t} entr${t>1?'ies share':'y shares'} a position with an equal score (dotted underline). The position after a tie is skipped.</div>`:'';
  };

  // ---------- Learners: overall or by subject ----------
  if(mode==='overall' || mode==='subject'){
    if(!exam){ wrap.appendChild(el(`<div class="empty"><h3>Choose an examination</h3><p>Pick an examination above to rank its learners.</p></div>`)); return wrap; }
    const stats=computeExamStats(exam);
    let rows, valFn, cols, rowHTML, title, sub;
    const filterStream=r=>!P.streamId || r.student.streamId===P.streamId;
    const multiStream=stats.streamStats.length>1;

    if(mode==='overall'){
      rows=stats.studentRows.filter(filterStream).map(r=>({...r}));
      valFn=r=>r.meanPct; title='Overall performance'; sub=`${exam.name} · mean % across all subjects`;
    } else {
      if(!P.subjectId || !exam.subjects.includes(P.subjectId)){
        wrap.appendChild(el(`<div class="empty"><h3>Choose a subject</h3><p>Pick a subject above to rank learners in it.</p></div>`)); 
        // still show the subject league for the exam
        addSubjectLeague(wrap,stats);
        return wrap;
      }
      const d=computeSubjectDetail(exam,P.subjectId);
      rows=d.rows.filter(filterStream).map(r=>({...r, position:r.rank, positionTied:r.rankTied, streamPosition:r.streamRank, streamPositionTied:r.streamRankTied}));
      valFn=r=>r.pct; title=`${subjectById(P.subjectId)?.name||'Subject'} ranking`; sub=`${exam.name} · mark %`;
    }
    if(!rows.length){ wrap.appendChild(el(`<div class="empty"><h3>No results to rank</h3><p>No marks are recorded for this selection.</p></div>`)); return wrap; }
    assignCompetitionRanks(rows,valFn,'pos');
    const filtered=!!P.streamId;
    const extra = filtered ? {h:'Class position',fn:r=>rankHTML(r.position,r.positionTied)}
                : (multiStream ? {h:'Stream position',fn:r=>rankHTML(r.streamPosition,r.streamPositionTied)} : null);
    cols=[{h:filtered?'Stream position':'Position',num:true}];
    if(extra) cols.push({h:extra.h,num:true});
    cols.push({h:'Learner'},{h:'Stream'});
    if(mode==='overall') cols.push({h:'Subjects sat',num:true},{h:'Mean %',num:true},{h:'Mean grade',num:true});
    else cols.push({h:'Mark',num:true},{h:'%',num:true},{h:'Grade',num:true});
    const trs=rows.map(r=>{
      const sm=r.student.streamId?streamById(r.student.streamId)?.name:'—';
      let tds=`<td class="num">${rankHTML(r.pos,r.posTied)}</td>`;
      if(extra) tds+=`<td class="num">${extra.fn(r)}</td>`;
      tds+=`<td>${esc(r.student.name)}</td><td>${esc(sm||'—')}</td>`;
      if(mode==='overall'){
        const mg=r.meanPoints==null?'—':meanGradeFromPoints(r.meanPoints).grade;
        tds+=`<td class="num">${r.sat}</td><td class="num">${r.meanPct.toFixed(2)}</td><td class="num">${gradeBadgeHTML(mg)}</td>`;
      } else {
        tds+=`<td class="num">${round1(r.mark)}</td><td class="num">${r.pct.toFixed(2)}</td><td class="num">${gradeBadgeHTML(r.grade)}</td>`;
      }
      return `<tr>${tds}</tr>`;
    });
    const p=el(`<div class="panel"></div>`);
    p.appendChild(el(`<div class="panel-title"><h2>${esc(title)}</h2><div class="small">${esc(sub)} · ${rows.length} learner${rows.length>1?'s':''}</div></div>`));
    p.appendChild(el(rankTable(cols,trs)));
    p.appendChild(el(`<div>${tieNote(rows)}</div>`));
    wrap.appendChild(p);
    if(mode==='subject') addSubjectLeague(wrap,stats);
    return wrap;
  }

  // ---------- Groups: class or stream ----------
  const entries=[]; // {gk,label,sortKey,e}
  series.exams.forEach(x=>{
    if(mode==='stream' && P.classId && x.classId!==P.classId) return;
    computeExamStats(x).studentRows.forEach(r=>{
      if(mode==='class'){
        const c=classById(x.classId); if(!c) return;
        entries.push({gk:c.id,label:c.name,e:{id:r.student.id,pct:r.meanPct,points:r.meanPoints}});
      } else {
        const sm=r.student.streamId?streamById(r.student.streamId):null; if(!sm) return;
        const c=classById(sm.classId);
        entries.push({gk:sm.id,label:`${c?c.name+' ':''}${sm.name}`,e:{id:r.student.id,pct:r.meanPct,points:r.meanPoints}});
      }
    });
  });
  const groups=new Map();
  entries.forEach(x=>{ if(!groups.has(x.gk)) groups.set(x.gk,{label:x.label,list:[]}); groups.get(x.gk).list.push(x.e); });
  const gRows=[...groups.values()].map(g=>({label:g.label, m:metricsFromRows(dedupeRows(g.list))}));
  if(!gRows.length){
    wrap.appendChild(el(`<div class="empty"><h3>Nothing to rank</h3><p>${mode==='stream'?'No learners in this examination are assigned to a stream.':'No marks are recorded for this examination.'}</p></div>`));
    return wrap;
  }
  assignCompetitionRanks(gRows,g=>g.m.mean,'pos');
  const trs=gRows.map(g=>`<tr><td class="num">${rankHTML(g.pos,g.posTied)}</td><td>${esc(g.label)}</td><td class="num">${g.m.n}</td><td class="num">${g.m.mean==null?'—':g.m.mean.toFixed(2)}</td><td class="num">${gradeBadgeHTML(g.m.grade)}</td><td class="num">${round1(g.m.highest)}</td><td class="num">${round1(g.m.lowest)}</td></tr>`);
  const p=el(`<div class="panel"></div>`);
  p.appendChild(el(`<div class="panel-title"><h2>${mode==='class'?'Class':'Stream'} ranking</h2><div class="small">${esc(series.label)} · ranked by mean %</div></div>`));
  p.appendChild(renderPctBarChart(gRows.map(g=>({label:ordinal(g.pos)+' · '+g.label,value:g.m.mean})),{labelWidth:170}));
  p.appendChild(el(`<div style="height:12px;"></div>`));

function gradingKeyHTML(){
  if(!hasScale()) return '';
  const bands=[...DATA.settings.scale].sort((a,b)=>b.points-a.points);
  const parts=bands.map(g=>{
    const range = (g.max!=null && g.max!=='') ? `${g.min}–${g.max}` : `${g.min}+`;
    return `${esc(g.grade)} (${range}%${g.description?', '+esc(g.description):''})`;
  });
  return `<div style="margin-top:14px; font-size:10.5px; color:#555;"><strong>Grading key:</strong> ${parts.join('  ·  ')}</div>`;
}
// Simple, print-safe bar chart: every style is inline, so it renders correctly
// in the separate print window (which carries only a minimal stylesheet).
function printBarChartHTML(items,opts){
  opts=opts||{};
  const vals=items.map(i=>i.value).filter(v=>v!=null);
  const max = opts.max!=null? opts.max : Math.max(1, ...vals);
  const labelWidth = opts.labelWidth||120;
  const color = opts.color||'#1C3D2E';
  return `<div style="margin:10px 0;">${items.map(i=>{
    const pct = (i.value!=null && max)? Math.max(0,Math.min(100,i.value/max*100)) : 0;
    return `<div style="display:flex; align-items:center; gap:8px; margin-bottom:5px;">
      <div style="width:${labelWidth}px; flex:0 0 auto; font-size:10.5px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(i.label)}</div>
      <div style="flex:1; background:#eee; border-radius:2px; height:12px; overflow:hidden;"><div style="width:${pct}%; background:${color}; height:100%;"></div></div>
      <div style="width:46px; flex:0 0 auto; font-size:10.5px; text-align:right;">${i.value==null?'—':round1(i.value)}</div>
    </div>`;
  }).join('')}</div>`;
}

    pi.appendChild(el(`<div class="actions"><label class="btn" style="margin:0;">Choose backup file…<input type="file" id="import-json" accept="application/json" style="display:none;"></label></div>`));
    wrap.appendChild(pi);
  }

  // ---- Local backup history ----
  const ph=el(`<div class="panel"></div>`);
  ph.appendChild(el(`<div class="panel-title"><h2>Saved backups (Supabase)</h2><div class="small">${BACKUPS.length} saved</div></div>`));
  if(!BACKUPS.length){
    ph.appendChild(el(`<p class="small">No backups yet. Use "Create backup" above to save a restore point.</p>`));
  } else {
    const tbl=el(`<table class="data"><thead><tr><th>Label</th><th>Created</th><th class="num">Students</th><th class="num">Exams</th><th class="num">Size</th><th></th></tr></thead><tbody></tbody></table>`);
    const tb=tbl.querySelector('tbody');

      tb.appendChild(el(`<tr>

        <td class="num">${fmtBytes(b.size||0)}</td>
        <td style="text-align:right; white-space:nowrap;">
          <button class="btn ghost sm" data-export-backup="${b.id}">Export</button>
          ${isSuperAdmin(CURRENT_USER)?`<button class="btn ghost sm" data-restore-backup="${b.id}">Restore</button>
          <button class="btn ghost sm danger" data-del-backup="${b.id}">Delete</button>`:''}
        </td>

  }
  wrap.appendChild(ph);

  // ---- Storage summary ----
  const p2=el(`<div class="panel"></div>`);
  p2.appendChild(el(`<div class="panel-title"><h2>Storage summary</h2></div>`));
  const size=snapshotSize(DATA);
  p2.appendChild(el(`<table class="data">
    <tbody>
      <tr><td>Students</td><td class="num">${scopedStudents().length}</td></tr>
      <tr><td>Classes</td><td class="num">${scopedClasses().length}</td></tr>

  if(isSuperAdmin(CURRENT_USER)){

    p3.appendChild(el(`<div class="panel-title"><h2>Danger zone</h2></div>`));

    p3.appendChild(el(`<button class="btn danger" id="erase-all">Erase all data</button>`));
    wrap.appendChild(p3);
  }

  return wrap;
}

/* ============================= STAFF ACCOUNTS (SUPER ADMIN + SCHOOL ADMIN) ============================= */
// Super Admin: every account. School Admin: creates and manages the teachers of their own school only.
function canManageStaff(u){ u=u||CURRENT_USER; return isSuperAdmin(u)||isSchoolAdmin(u); }
function canManageUser(target){
  if(!CURRENT_USER||!target) return false;
  if(isSuperAdmin(CURRENT_USER)) return true;
  if(!isSchoolAdmin(CURRENT_USER) || target.role!=='teacher' || !target.schoolId || target.schoolId!==CURRENT_USER.schoolId) return false;
  const grades=schoolAdminAllowedGrades(CURRENT_USER);
  if(!grades) return true;
  const cls=Object.keys(target.classSubjects||{}).map(anyClassById).filter(Boolean);
  const paid=accessRecordsForTeacher(target.id).map(a=>anyClassById(a.classId)).filter(Boolean);
  const allCls=[...cls,...paid];
  if((target.allSubjects===true && target.allClasses===true) || !allCls.length) return true;
  return allCls.some(c=>grades.includes(gradeNumberOfClass(c)));
}
function teacherSubjectsLabel(u){
  if(!u || !isTeachingStaff(u)) return '—';
  if(u.allSubjects===true && u.allClasses===true) return 'All subjects — all classes';
  const cs=u.classSubjects||{};
  const classIds=Object.keys(cs).filter(cid=>cs[cid] && (cs[cid].all===true || (Array.isArray(cs[cid].subjects)&&cs[cid].subjects.length)));
  if(!classIds.length) return 'No subjects assigned yet';
  const rows=classIds.map(cid=>({c:(DATA.classes||[]).find(x=>x.id===cid), rec:cs[cid]})).filter(r=>r.c)
    .sort((a,b)=>gradeNumberOfClass(a.c)-gradeNumberOfClass(b.c));
  return rows.map(r=>{
    const subjLabel=r.rec.all===true?'All subjects':(r.rec.subjects||[]).map(id=>(DATA.subjects||[]).find(x=>x.id===id)).filter(Boolean).map(x=>x.name).join(', ');
    return r.c.name+': '+(subjLabel||'—');
  }).join(' · ');
}

      <td class="small">${esc(teacherSubjectsLabel(u))}${(u.role==='teacher'?accessRecordsForTeacher(u.id).filter(a=>a.status!=='revoked'&&isAccessActive(a)):[]).length?`<div style="margin-top:4px;"><span class="small">Paid classes:</span> ${accessRecordsForTeacher(u.id).filter(a=>a.status!=='revoked'&&isAccessActive(a)).map(a=>teacherClassBadgeHtml(u.id,a)).join('')}</div>`:''}</td>
      <td style="text-align:right;white-space:nowrap;">
        ${isTeachingStaff(u)&&(canManageUser(u)||isSelf)?`<button class="btn sm" data-teacher-subjects="${u.id}">Subjects</button>`:''}
        ${u.role==='teacher'&&canManageUser(u)&&accessRecordsForTeacher(u.id).some(isAccessActive)?`<button class="btn sm" data-class-teacher="${u.id}">Class Teacher</button>`:''}
        ${canManageUser(u)||isSelf?`<button class="btn ghost sm" data-edit-user="${u.id}">Edit</button>`:''}
        ${canManageUser(u)?`<button class="btn ghost sm" data-reset-user="${u.id}">Reset password</button>`:''}
        ${(canManageUser(u) && !isSelf && !(u.role==='superadmin' && superAdminCount()<=1)) ? `<button class="btn ghost sm danger" data-del-user="${u.id}">Delete</button>` : ''}
      </td>
    </tr>`));
  });
  const p=el(`<div class="panel"></div>`); p.appendChild(tbl); wrap.appendChild(p);
  return wrap;

/** Subjects and classes a teacher teaches, assigned PER CLASS — ticking English for Grade 7 does not
 *  give that teacher English in Grade 8. A class the teacher has PAID for opens all its subjects
 *  regardless of this grid. */
function modalTeacherSubjects(teacherId){
  const t=userById(teacherId);
  const isSelfEdit = CURRENT_USER && t && CURRENT_USER.id===t.id;
  if(!t || !isTeachingStaff(t) || !(canManageUser(t) || isSelfEdit)){ toast('You cannot change this teacher'); return; }
  const subs=(DATA.subjects||[]).filter(x=>x.schoolId===t.schoolId).sort((a,b)=>a.name.localeCompare(b.name));
  const classes=(DATA.classes||[]).filter(c=>c.schoolId===t.schoolId && gradeAllowedForCurrentUser(gradeNumberOfClass(c))).sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b));
  if(!subs.length){
    openModal(`<div class="modal-head"><h2>Subjects — ${esc(t.name)}</h2><button class="x" data-close>✕</button></div>
      <div class="confirm-body">This school has no subjects yet. Add subjects under <strong>Subjects</strong> first, then come back and tick the ones ${esc(t.name)} teaches.</div>
      <div class="modal-foot"><button class="btn" data-close>Close</button></div>`);
    return;
  }
  const masterOn = t.allSubjects===true && t.allClasses===true;
  const cs = t.classSubjects || {};
  const classBlock = !classes.length ? `<p class="small">No classes yet.</p>` : classes.map(c=>{
    const rec=cs[c.id]||{};
    const allOn=rec.all===true;
    const selSet=new Set(Array.isArray(rec.subjects)?rec.subjects:[]);
    const rows=subs.map(s=>`<div class="checkline"><input type="checkbox" class="cs-sub" data-class="${c.id}" value="${s.id}" ${allOn||selSet.has(s.id)?'checked':''} ${allOn?'disabled':''}><span>${esc(s.name)}${s.code?' <span class="small">('+esc(s.code)+')</span>':''}</span></div>`).join('');
    return `<div class="panel" style="margin-bottom:10px;padding:12px 14px;">
      <h3 style="margin:0 0 8px;font-size:14px;">${esc(c.name)}</h3>
      <div class="checkline" style="margin-bottom:6px;"><input type="checkbox" class="cs-all" data-class="${c.id}" ${allOn?'checked':''}><strong>All subjects in ${esc(c.name)}</strong></div>
      <div style="max-height:18vh; overflow:auto;">${rows}</div>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h2>Subjects and classes — ${esc(t.name)}</h2><button class="x" data-close>✕</button></div>
    <div class="hint">Tick exactly which subjects ${esc(t.name)} teaches, class by class. A subject ticked for one class does not carry over to another class. If a class is <strong>paid</strong> for this teacher (Class Access), they get <strong>all subjects</strong> in that class — for marks upload and report printing — regardless of what's ticked here.</div>
    <div class="checkline" style="margin:10px 0;"><input type="checkbox" id="ts-master" ${masterOn?'checked':''}><strong>No restriction — this teacher can access every class and subject</strong></div>
    <div id="ts-grid" style="${masterOn?'display:none;':''}">${classBlock}</div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ts-save">Save</button></div>
  `);
  const master=document.getElementById('ts-master'), grid=document.getElementById('ts-grid');
  master.addEventListener('change',()=>{ grid.style.display=master.checked?'none':''; });
  classes.forEach(c=>{
    const m=document.querySelector(`.cs-all[data-class="${c.id}"]`);
    if(!m) return;
    m.addEventListener('change',()=>{
      document.querySelectorAll(`.cs-sub[data-class="${c.id}"]`).forEach(b=>{ b.checked=m.checked||b.checked; b.disabled=m.checked; });
    });
  });
  document.getElementById('ts-save').onclick=()=>{
    if(master.checked){
      t.allSubjects=true; t.allClasses=true;
    } else {
      t.allSubjects=false; t.allClasses=false;
      const newCS={};
      classes.forEach(c=>{
        const allChk=document.querySelector(`.cs-all[data-class="${c.id}"]`);
        const subChks=[...document.querySelectorAll(`.cs-sub[data-class="${c.id}"]`)].filter(b=>b.checked).map(b=>b.value);
        if(allChk && allChk.checked) newCS[c.id]={all:true};
        else if(subChks.length) newCS[c.id]={all:false, subjects:subChks};
      });
      t.classSubjects=newCS;
    }
    const classCount=master.checked?classes.length:Object.keys(t.classSubjects||{}).length;
    audit('teacher_subjects_set',{schoolId:t.schoolId,teacherId:t.id,teacher:t.name,allSubjects:t.allSubjects,allClasses:t.allClasses,classCount});
    persistNow(); closeModal(); render();
    if(!classCount) toast('Saved — '+t.name+' needs at least one subject ticked in a class (or a paid class) to enter marks');
    else toast('Subjects and classes saved for '+t.name);
  };
}
/** Lets a School Admin (or Super Admin) mark WHICH of a teacher's already-paid classes they
 *  are formally the Class Teacher of. Only classes with an active (paid) Class Access record
 *  for this teacher are listed — this can never create or unlock a new paid class. */
function modalClassTeacher(teacherId){
  const t=userById(teacherId);
  if(!t || !canManageUser(t)){ toast('You cannot change this teacher'); return; }
  const paidRecords=accessRecordsForTeacher(t.id).filter(isAccessActive);
  if(!paidRecords.length){ toast(t.name+' has no active paid class access yet'); return; }
  const rows=paidRecords.map(a=>{
    const cls=anyClassById(a.classId);
    return `<label class="checkline" style="margin-bottom:6px;"><input type="checkbox" class="ct-rec" value="${a.id}" ${a.classTeacher?'checked':''}><span><strong>${esc(cls?cls.name:'(missing class)')}</strong> <span class="small">— paid, active</span></span></label>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h2>Class Teacher — ${esc(t.name)}</h2><button class="x" data-close>✕</button></div>
    <div class="hint">Tick the class(es) ${esc(t.name)} should be formally recognised as Class Teacher for. Only classes they already have active, paid Class Access to are listed. As Class Teacher they can add/manage students, create examinations, enter marks, analyse results and print reports for that class, and get limited access to School Settings (logo and motto) — all restricted to this class and this school.</div>
    <div style="margin:12px 0;">${rows}</div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ct-save">Save</button></div>
  `);
  document.getElementById('ct-save').onclick=()=>{
    const checked=new Set([...document.querySelectorAll('.ct-rec:checked')].map(b=>b.value));
    let changed=false;
    paidRecords.forEach(a=>{ if(setClassTeacherFlag(a.id, checked.has(a.id))) changed=true; });
    closeModal(); render();
    toast(changed?'Class Teacher assignment saved for '+t.name:'No changes made');
  };
}

    if(existing){

      const role= (isEditingSelf||lastSuperAdmin||!roleEl||!isSuperAdmin(CURRENT_USER)) ? existing.role : roleEl.value;

      const pass=document.getElementById('m-u-pass').value;
      const pass2=document.getElementById('m-u-pass2').value;
      if(!pass || pass.length<4) return problem('The password is too short.','Use at least 4 characters. A mix of letters and numbers is best.');
      if(pass!==pass2) return problem('The two passwords are not the same.','Type the same password in both boxes.');
      // Teachers must belong to a school or login will be rejected
      let sid=userSchoolId();
      if(!sid && isSuperAdmin(CURRENT_USER)){
        const pick=document.getElementById('m-u-school');
        sid=pick ? pick.value : null;
      }
      if(!sid){
        return problem('No school is selected for this teacher.',
          isSuperAdmin(CURRENT_USER)
            ? 'Open the school first (Schools → Open), or choose a school in the form, then add the teacher.'
            : 'Your account is not linked to a school. Contact Super Admin.');
      }
      const passwordHash=await hashPassword(pass);
      if(!passwordHash) return problem('Could not secure the password.','Try again.');
      const uname=username.trim().toLowerCase();
      const newTeacher={
        id:uid('usr'), name, username:uname, role:'teacher', schoolId:sid,
        subjectIds:[], allSubjects:false,
        passwordHash, createdAt:new Date().toISOString()
      };
      DATA.users.push(newTeacher);
      audit('teacher_created',{schoolId:sid, username:uname});
      persistNow(); // immediate save so the teacher can sign in right away
      closeModal(); render();
      toast('Teacher created. They can sign in as “'+uname+'” with the password you set.');
      modalTeacherSubjects(newTeacher.id); // choose the subjects this teacher teaches
    }
  };
}

/* ============================= CSV HELPERS ============================= */
function parseCSV(text){
  const rows=[]; let row=[]; let cur=''; let inQ=false;
  // Excel in some regions saves CSV with semicolons or tabs — detect that from the heading row.
  const first=text.split(/\r?\n/,1)[0]||'';
  const delim = first.split(',').length>1 ? ',' : (first.split(';').length>1 ? ';' : (first.split('\t').length>1 ? '\t' : ','));
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"'; i++;} else inQ=false; } else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===delim){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function toCSV(rows){
  return rows.map(r=>r.map(v=>{
    v=String(v==null?'':v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\n');
}
function downloadFile(filename,content,type){
  const blob=new Blob([content],{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

// Super Admin only. ONE paid class → ALL subjects in that class.
function viewClassAccess(){
  const wrap=el(`<div></div>`);
  if(!isSuperAdmin(CURRENT_USER)){
    wrap.appendChild(el(`<div class="empty"><h3>Not available</h3><p>Only a super admin can manage teacher class access and payments.</p></div>`));

  }
  CURRENT_SCHOOL_ID=null; // this is a platform-wide page — leave any school being inspected, same as the other Super Admin pages
  refreshAccessExpiry();
  wrap.appendChild(el(`
    <div class="pagehead">
      <div>
        <h1>Class Access</h1>
        <div class="sub">Teachers pay per class — not per subject. One active payment unlocks <strong>all subjects</strong> in that grade.</div>
      </div>
      <div class="actions"><button class="btn primary" id="grant-class-access">+ Grant class access</button></div>

  const allTeachers=(DATA.users||[]).filter(u=>u.role==='teacher').sort((a,b)=>a.name.localeCompare(b.name));
