/* ============================= SQLITE DATABASE STRUCTURE ============================= */
// CBE.School keeps working data in the browser, but its data follows this normalized SQLite design.
// "Export SQLite database" writes a .sql file that builds the full database in any SQLite tool.
const SCHEMA_SQL = `-- CBE.School database schema (SQLite 3)
-- Students are identified only by their internal id. There are no admission
-- numbers, gender, parent/guardian tables or stored pass/fail data:
-- grades and pass rates are always calculated from marks + grading_system.
PRAGMA foreign_keys = ON;

CREATE TABLE IF NOT EXISTS schools (
  id            INTEGER PRIMARY KEY AUTOINCREMENT,
  name          TEXT    NOT NULL,
  motto         TEXT    NOT NULL DEFAULT '',
  logo          TEXT,
  current_year  INTEGER NOT NULL,
  current_term  TEXT    NOT NULL
);

CREATE TABLE IF NOT EXISTS classes (
  id           INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id    INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name         TEXT    NOT NULL,
  level_order  INTEGER NOT NULL DEFAULT 0,
  UNIQUE (school_id, name)
);

CREATE TABLE IF NOT EXISTS streams (
  id        INTEGER PRIMARY KEY AUTOINCREMENT,
  class_id  INTEGER NOT NULL REFERENCES classes(id) ON DELETE CASCADE,
  name      TEXT    NOT NULL,
  UNIQUE (class_id, name)
);

CREATE TABLE IF NOT EXISTS students (
  id               INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id        INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name             TEXT    NOT NULL,
  class_id         INTEGER NOT NULL REFERENCES classes(id),
  stream_id        INTEGER REFERENCES streams(id) ON DELETE SET NULL,
  is_graduated     INTEGER NOT NULL DEFAULT 0 CHECK (is_graduated IN (0,1)),
  graduation_year  INTEGER
);

CREATE TABLE IF NOT EXISTS subjects (
  id         INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id  INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name       TEXT    NOT NULL,
  code       TEXT    NOT NULL DEFAULT '',
  UNIQUE (school_id, name)
);

-- Which subjects a class takes, and who teaches it. A subject with no rows
-- here is treated by CBE.School as available to every class.
CREATE TABLE IF NOT EXISTS class_subjects (
  class_id      INTEGER NOT NULL REFERENCES classes(id)  ON DELETE CASCADE,
  subject_id    INTEGER NOT NULL REFERENCES subjects(id) ON DELETE CASCADE,
  teacher_name  TEXT    NOT NULL DEFAULT '',
  PRIMARY KEY (class_id, subject_id)
);

CREATE TABLE IF NOT EXISTS examinations (
  id          INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id   INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name        TEXT    NOT NULL,
  class_id    INTEGER NOT NULL REFERENCES classes(id),
  stream_id   INTEGER REFERENCES streams(id) ON DELETE SET NULL,
  term        TEXT    NOT NULL,
  year        INTEGER NOT NULL,
  out_of      REAL    NOT NULL DEFAULT 100 CHECK (out_of > 0),
  exam_date   TEXT
);

CREATE TABLE IF NOT EXISTS examination_subjects (
  examination_id  INTEGER NOT NULL REFERENCES examinations(id) ON DELETE CASCADE,
  subject_id      INTEGER NOT NULL REFERENCES subjects(id)     ON DELETE CASCADE,
  PRIMARY KEY (examination_id, subject_id)
);

-- One raw mark per student, per subject, per examination.
CREATE TABLE IF NOT EXISTS marks (
  id              INTEGER PRIMARY KEY AUTOINCREMENT,
  examination_id  INTEGER NOT NULL,
  student_id      INTEGER NOT NULL REFERENCES students(id) ON DELETE CASCADE,
  subject_id      INTEGER NOT NULL,
  mark            REAL    NOT NULL CHECK (mark >= 0),
  UNIQUE (examination_id, student_id, subject_id),
  FOREIGN KEY (examination_id, subject_id)
    REFERENCES examination_subjects(examination_id, subject_id) ON DELETE CASCADE
);

CREATE TABLE IF NOT EXISTS grading_system (
  id           INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id    INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  grade        TEXT    NOT NULL,
  min_mark     REAL    NOT NULL,
  max_mark     REAL,
  points       REAL,
  description  TEXT    NOT NULL DEFAULT '',
  sort_order   INTEGER NOT NULL DEFAULT 0,
  UNIQUE (school_id, grade)
);

-- Comment wording by percentage range (kind: 'teacher' or 'head').
CREATE TABLE IF NOT EXISTS comment_bands (
  id         INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id  INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  kind       TEXT    NOT NULL CHECK (kind IN ('teacher','head')),
  min_mark   REAL    NOT NULL,
  max_mark   REAL,
  comment    TEXT    NOT NULL
);

-- Comments a teacher edited by hand on report cards.
CREATE TABLE IF NOT EXISTS subject_comments (
  examination_id  INTEGER NOT NULL REFERENCES examinations(id) ON DELETE CASCADE,
  student_id      INTEGER NOT NULL REFERENCES students(id)     ON DELETE CASCADE,
  subject_id      INTEGER NOT NULL REFERENCES subjects(id)     ON DELETE CASCADE,
  comment         TEXT    NOT NULL,
  PRIMARY KEY (examination_id, student_id, subject_id)
);

CREATE TABLE IF NOT EXISTS report_comments (
  examination_id  INTEGER NOT NULL REFERENCES examinations(id) ON DELETE CASCADE,
  student_id      INTEGER NOT NULL REFERENCES students(id)     ON DELETE CASCADE,
  comment         TEXT    NOT NULL,
  PRIMARY KEY (examination_id, student_id)
);

CREATE TABLE IF NOT EXISTS term_dates (
  school_id     INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  year          INTEGER NOT NULL,
  term          TEXT    NOT NULL,
  closing_date  TEXT,
  opening_date  TEXT,
  PRIMARY KEY (school_id, year, term)
);


CREATE TABLE IF NOT EXISTS teacher_class_access (
  id                 INTEGER PRIMARY KEY AUTOINCREMENT,
  teacher_id         INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
  school_id          INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  class_id           INTEGER NOT NULL REFERENCES classes(id) ON DELETE CASCADE,
  section            TEXT,
  payment_status     TEXT NOT NULL DEFAULT 'pending',
  amount_paid        REAL,
  payment_reference  TEXT,
  start_date         TEXT,
  expiry_date        TEXT,
  status             TEXT NOT NULL DEFAULT 'pending',
  created_at         TEXT,
  updated_at         TEXT,
  revoked_at         TEXT
);
-- CORE RULE: one row per teacher+class. ALL subjects in that class are included.

CREATE TABLE IF NOT EXISTS users (
  id             INTEGER PRIMARY KEY AUTOINCREMENT,
  username       TEXT NOT NULL UNIQUE,
  full_name      TEXT NOT NULL,
  role           TEXT NOT NULL CHECK (role IN ('superadmin','teacher')),
  email          TEXT,
  clerk_user_id  TEXT,
  created_at     TEXT
);

CREATE TABLE IF NOT EXISTS settings (
  school_id  INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  key        TEXT    NOT NULL,
  value      TEXT,
  PRIMARY KEY (school_id, key)
);

CREATE TABLE IF NOT EXISTS backups (
  id             INTEGER PRIMARY KEY AUTOINCREMENT,
  label          TEXT    NOT NULL,
  created_at     TEXT    NOT NULL,
  size_bytes     INTEGER NOT NULL DEFAULT 0,
  student_count  INTEGER NOT NULL DEFAULT 0,
  class_count    INTEGER NOT NULL DEFAULT 0,
  stream_count   INTEGER NOT NULL DEFAULT 0,
  subject_count  INTEGER NOT NULL DEFAULT 0,
  exam_count     INTEGER NOT NULL DEFAULT 0,
  snapshot       TEXT
);

CREATE INDEX IF NOT EXISTS idx_students_class   ON students(class_id, stream_id);
CREATE INDEX IF NOT EXISTS idx_exams_class_term ON examinations(class_id, year, term);
CREATE INDEX IF NOT EXISTS idx_marks_exam       ON marks(examination_id);
CREATE INDEX IF NOT EXISTS idx_marks_student    ON marks(student_id);
`;

const DB_TABLES=[
  ['schools','School name, motto, logo, current year and term'],
  ['classes','Grade 1 to Grade 9 (those enabled for the school section)'],
  ['streams','Streams inside each class'],
  ['students','Learner name, class and stream (internal ID only)'],
  ['subjects','Subject names and codes'],
  ['class_subjects','Which class takes which subject, and the teacher'],
  ['examinations','Each examination: term, year, class, total marks'],
  ['examination_subjects','Subjects sat in each examination'],
  ['marks','Every mark scored'],
  ['grading_system','Grade bands and points'],
  ['comment_bands','Automatic comment wording by mark range'],
  ['subject_comments','Subject comments edited by hand'],
  ['report_comments','Report card comments edited by hand'],
  ['term_dates','Closing and opening dates for each term'],
  ['users','Staff accounts'],
  ['settings','Other school settings'],
  ['backups','List of saved backups']
];
function buildDbRows(){
  const S=DATA.settings, T={}, skipped={students:0,marks:0};
  DB_TABLES.forEach(t=>T[t[0]]=[]);
  const ids={cls:{},stm:{},stu:{},sub:{},exm:{}};
  const nid=(m,k)=>{ if(!(k in m)) m[k]=Object.keys(m).length+1; return m[k]; };
  const has=(m,k)=>k!=null && k in m;
  T.schools.push({id:1,name:S.schoolName||'School',motto:S.motto||'',logo:S.logo||null,current_year:Number(S.currentYear)||new Date().getFullYear(),current_term:S.currentTerm||'Term 1'});
  scopedClasses().forEach((c,i)=>T.classes.push({id:nid(ids.cls,c.id),school_id:1,name:c.name,level_order:i+1}));
  scopedStreams().forEach(st=>{ if(has(ids.cls,st.classId)) T.streams.push({id:nid(ids.stm,st.id),class_id:ids.cls[st.classId],name:st.name}); });
  scopedStudents().forEach(st=>{
    if(!has(ids.cls,st.classId)){ skipped.students++; return; }
    T.students.push({id:nid(ids.stu,st.id),school_id:1,name:st.name,class_id:ids.cls[st.classId],stream_id:has(ids.stm,st.streamId)?ids.stm[st.streamId]:null,is_graduated:st.graduated?1:0,graduation_year:st.graduationYear!=null?Number(st.graduationYear):null});
  });
  scopedSubjects().forEach(su=>T.subjects.push({id:nid(ids.sub,su.id),school_id:1,name:su.name,code:su.code||''}));
  scopedSubjects().forEach(su=>(su.assignments||[]).forEach(a=>{
    if(has(ids.cls,a.classId)) T.class_subjects.push({class_id:ids.cls[a.classId],subject_id:ids.sub[su.id],teacher_name:a.teacher||''});
  }));
  scopedExams().forEach(e=>{
    if(!has(ids.cls,e.classId)) return;
    const eid=nid(ids.exm,e.id);
    T.examinations.push({id:eid,school_id:1,name:e.name,class_id:ids.cls[e.classId],stream_id:has(ids.stm,e.streamId)?ids.stm[e.streamId]:null,term:e.term,year:Number(e.year),out_of:Number(e.outOf)||100,exam_date:e.date||null});
    const subs=new Set((e.subjects||[]).filter(x=>has(ids.sub,x)));
    subs.forEach(x=>T.examination_subjects.push({examination_id:eid,subject_id:ids.sub[x]}));
    Object.keys(e.results||{}).forEach(stuId=>{
      if(!has(ids.stu,stuId)) return;
      const row=e.results[stuId]||{};
      Object.keys(row).forEach(subId=>{
        const v=row[subId];
        if(v==null||v==='') return;
        const n=Number(v);
        if(!subs.has(subId)||!isFinite(n)||n<0){ skipped.marks++; return; }
        T.marks.push({id:T.marks.length+1,examination_id:eid,student_id:ids.stu[stuId],subject_id:ids.sub[subId],mark:n});
      });
    });
    const putC=(src,withSubject)=>Object.keys(src||{}).forEach(stuId=>{
      if(!has(ids.stu,stuId)) return;
      if(withSubject){
        Object.keys(src[stuId]||{}).forEach(subId=>{
          const t=src[stuId][subId];
          if(t!=null && subs.has(subId)) T.subject_comments.push({examination_id:eid,student_id:ids.stu[stuId],subject_id:ids.sub[subId],comment:String(t)});
        });
      } else if(src[stuId]!=null){
        T.report_comments.push({examination_id:eid,student_id:ids.stu[stuId],comment:String(src[stuId])});
      }
    });
    putC(e.subjectComments,true); putC(e.comments,false);
  });
  [...(S.scale||[])].sort((a,b)=>b.min-a.min).forEach((g,i)=>T.grading_system.push({id:i+1,school_id:1,grade:g.grade,min_mark:Number(g.min),max_mark:g.max!=null?Number(g.max):null,points:g.points!=null?Number(g.points):null,description:g.description||'',sort_order:i+1}));
  (S.comments||[]).forEach(b=>T.comment_bands.push({id:T.comment_bands.length+1,school_id:1,kind:'teacher',min_mark:Number(b.min),max_mark:b.max!=null?Number(b.max):null,comment:b.text}));
  (S.headComments||[]).forEach(b=>T.comment_bands.push({id:T.comment_bands.length+1,school_id:1,kind:'head',min_mark:Number(b.min),max_mark:b.max!=null?Number(b.max):null,comment:b.text}));
  Object.keys(S.termDates||{}).forEach(k=>{
    const i=k.indexOf('|'), d=S.termDates[k]||{};
    T.term_dates.push({school_id:1,year:Number(k.slice(0,i)),term:k.slice(i+1),closing_date:d.closing||null,opening_date:d.opening||null});
  });
  (DATA.users||[]).forEach((u,i)=>T.users.push({id:i+1,username:u.username,full_name:u.name,role:u.role==='superadmin'?'superadmin':'teacher',email:u.email||u.username||null,clerk_user_id:u.authUserId||null,created_at:u.createdAt||null}));

function clear(key){ls.del(key);}
function friendly(err){
  const c=ecode(err), m=(err&&err.errors&&err.errors[0]&&(err.errors[0].longMessage||err.errors[0].message))||(err&&err.message)||'';
  if(c==='too_many_requests'||(err&&err.status===429)) return 'Too many requests. Please wait a minute and try again.';
  if(c==='form_identifier_exists') return 'That email is already registered. Sign in, or use "Forgot password".';
  return m||'Something went wrong. Please try again.';
}

/* ---- screens ---- */
const F={step:'',email:'',t:null};
function card(){let c=$('auth-card'); if(!c){c=document.createElement('div');c.className='login-card';c.id='auth-card';c.style.display='none';const m=$('login-card-main');m.parentNode.insertBefore(c,m.nextSibling);c.addEventListener('submit',onSubmit);c.addEventListener('click',onClick);} return c;}
function msg(t,ok){const e=$('auth-msg'); if(!e)return; e.textContent=t; e.className='login-error show'+(ok?' auth-ok':'');}
const fld=(id,l,type,x)=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="${type}" ${x||''}></div>`;
const head=(t,s)=>`<div class="brand"><div class="mark">CBE.School</div><div class="tagline">${s}</div></div><h2 style="text-align:center;margin-bottom:10px">${t}</h2><div class="login-error" id="auth-msg" role="alert"></div>`;
const back='<div class="auth-links"><a href="#" data-act="login">Back to sign in</a></div>';
const codeBox=fld('auth-code','Verification code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Enter the code from your email" required');
function openFlow(step,ctx){
  Object.assign(F,{step},ctx||{}); const c=card(); $('login-card-main').style.display='none'; c.style.display='block';
  clearInterval(F.t); let h='';
  if(step==='register') h=head('Teacher registration','Create your teacher account')+`<form data-f="register">${fld('rg-name','Full name','text','required autocomplete="name"')}${fld('rg-email','Email address','email','required autocomplete="email"')}${fld('rg-phone','Phone number (optional)','tel','autocomplete="tel" placeholder="07XX XXX XXX"')}${fld('rg-school','School name (optional)','text','placeholder="Leave blank if you teach independently"')}<div class="field"><label for="rg-level">Level you teach</label><select id="rg-level"><option value="primary">Primary (Grades 1–6)</option><option value="junior" selected>Junior (Grades 7–9)</option><option value="both">Both (Grades 1–9)</option></select></div>${fld('rg-pass','Password (8+ characters, letters and a number)','password','required minlength="8" autocomplete="new-password"')}${fld('rg-pass2','Confirm password','password','required autocomplete="new-password"')}<div id="clerk-captcha"></div><button class="btn primary" type="submit">Create account</button></form>${back}`;
  if(step==='verify'||step==='recover') h=head(step==='verify'?'Verify your email':'Enter reset code','We sent a code to '+esc(F.email))+`<form data-f="code">${codeBox}<button class="btn primary" type="submit">${step==='verify'?'Verify and continue':'Continue'}</button></form><div class="auth-links"><button type="button" class="linkbtn" id="auth-resend" data-act="resend">Resend code</button> · <a href="#" data-act="${step==='verify'?'register':'forgot'}">Wrong email?</a> · <a href="#" data-act="login">Sign in</a></div><p class="small" style="text-align:center">The code expires after about 10 minutes. Check your spam folder if it does not arrive.</p>`;
  if(step==='forgot') h=head('Reset password','Enter your account email')+`<form data-f="forgot">${fld('fg-email','Email address','email','required autocomplete="email"')}<button class="btn primary" type="submit">Send reset code</button></form>${back}`;
  if(step==='newpass') h=head('Choose a new password','Almost done')+`<form data-f="newpass">${fld('np-pass','New password','password','required minlength="8" autocomplete="new-password"')}${fld('np-pass2','Confirm new password','password','required autocomplete="new-password"')}<button class="btn primary" type="submit">Update password</button></form>`;
  c.innerHTML=h; const first=c.querySelector('input'); if(first) first.focus();
  if($('auth-resend')) timer();
}
function closeFlow(note){const c=card(); clearInterval(F.t); c.style.display='none'; $('login-card-main').style.display='block'; const e=$('login-error'); if(e){e.textContent=note||'';e.classList.toggle('show',!!note);} const u=$('login-user'); if(u) u.focus();}
function left(email){return Math.max(0,Math.ceil((Number(ls.get('cbe_rs_'+email)||0)+RESEND_SECS*1000-Date.now())/1000));}
function timer(){const b=$('auth-resend'); if(!b)return; const tick=()=>{const s=left(F.email); b.disabled=s>0; b.textContent=s>0?'Resend code in '+s+'s':'Resend code'; if(s<=0)clearInterval(F.t);}; tick(); F.t=setInterval(tick,1000);}
async function resend(){
  if(left(F.email)>0) return; ls.set('cbe_rs_'+F.email,String(Date.now()));
  try{
    const Cl=await loadClerk();
    if(F.step==='verify') await Cl.client.signUp.prepareEmailAddressVerification({strategy:'email_code'});
    else await Cl.client.signIn.create({strategy:'reset_password_email_code',identifier:F.email});
    msg('A new code has been sent to '+F.email+'.',true);
  }catch(e){ msg(friendly(e)); }
  timer();
}
function onClick(e){const a=e.target.closest('[data-act]'); if(!a)return; e.preventDefault(); const k=a.dataset.act; if(k==='login')closeFlow(); else if(k==='resend')resend(); else openFlow(k,k==='register'||k==='forgot'?{email:''}:null);}
const strong=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);

async function onSubmit(e){
  e.preventDefault(); const f=e.target.dataset.f, btn=e.target.querySelector('button[type=submit]'); if(btn)btn.disabled=true;
  try{
    if(f==='register') await doRegister(); else if(f==='code') await doCode(); else if(f==='forgot') await doForgot(); else if(f==='newpass') await doNewPass();
  }catch(ex){console.error(ex); msg(friendly(ex));}
  finally{ if(btn)btn.disabled=false; }
}
async function doRegister(){
  const name=$('rg-name').value.trim(), email=norm($('rg-email').value), phone=$('rg-phone').value.trim(), school=$('rg-school').value.trim(), level=$('rg-level').value, p=$('rg-pass').value;
  if(name.length<3) return msg('Enter your full name.');
  if(!validEmail(email)) return msg('Enter a valid email address.');
  if(phone&&!/^\+?[0-9 ()-]{9,16}$/.test(phone)) return msg('Enter a valid phone number, or leave it blank.');
  if(!strong(p)) return msg('Password must be at least 8 characters with letters and a number.');
  if(p!==$('rg-pass2').value) return msg('The two passwords do not match.');
  if((DATA.users||[]).some(u=>isClerkId(u.authUserId)&&(norm(u.email)===email||norm(u.username)===email))) return msg('That email is already registered. Sign in, or use "Forgot password".');
  const Cl=await loadClerk(); if(Cl.session) await Cl.signOut();
  const su=await Cl.client.signUp.create({emailAddress:email,password:p,unsafeMetadata:{full_name:name,phone,school_name:school,section:level}});
  if(su.status==='complete') { await Cl.signOut(); return msg('Email verification is switched off in Clerk. In the Clerk dashboard require "Verify at sign-up" with an email code.'); }
  if(su.status==='missing_requirements'&&su.missingFields&&su.missingFields.length) return msg('Clerk is asking for extra fields ('+su.missingFields.join(', ')+'). Make them optional in the Clerk dashboard.');
  await su.prepareEmailAddressVerification({strategy:'email_code'});
  ls.set('cbe_rs_'+email,String(Date.now())); openFlow('verify',{email}); msg('Account created. Enter the code we emailed you.',true);
}
async function doCode(){
  const code=$('auth-code').value.replace(/\s/g,''), key='cbe_otp_'+F.email;
  if(!/^\d{6,10}$/.test(code)) return msg('Enter the numeric code from your email.');
  const lm=lockMsg(key); if(lm) return msg(lm);
  const Cl=await loadClerk(); let r;
  try{
    r=F.step==='verify'?await Cl.client.signUp.attemptEmailAddressVerification({code}):await Cl.client.signIn.attemptFirstFactor({strategy:'reset_password_email_code',code});
  }catch(e){ if(ecode(e)==='too_many_requests') return msg(friendly(e)); if(F.step==='verify'){ try{ window.cbeAuthEvent('verification_failed',F.email); }catch(_){} } fail(key); return msg(lockMsg(key)||'That code is wrong or has expired. Check it, or request a new code.'); }
  clear(key);
  if(F.step==='recover') return r.status==='needs_new_password'?openFlow('newpass'):msg('Could not verify the reset code. Request a new one.');
  if(r.status!=='complete') return msg('Verification did not complete. Please try again.');
  if(F.step==='verify'){ try{ window.cbeAuthEvent('verification_succeeded',F.email); }catch(_){} }
  await Cl.setActive({session:r.createdSessionId});
  const x=await finishLogin(toAu(Cl.user)); if(!x.ok){ await Cl.signOut(); closeFlow(x.msg); }
}
async function doForgot(){
  const email=norm($('fg-email').value); if(!validEmail(email)) return msg('Enter a valid email address.');
  const Cl=await loadClerk();
  try{ if(Cl.session) await Cl.signOut(); await Cl.client.signIn.create({strategy:'reset_password_email_code',identifier:email}); }
  catch(e){ if(ecode(e)==='too_many_requests') return msg(friendly(e)); }
  ls.set('cbe_rs_'+email,String(Date.now())); openFlow('recover',{email}); msg('If that email is registered, a reset code has been sent.',true);
}
async function doNewPass(){
  const p=$('np-pass').value; if(!strong(p)) return msg('Password must be at least 8 characters with letters and a number.');
  if(p!==$('np-pass2').value) return msg('The two passwords do not match.');
  const Cl=await loadClerk(); const r=await Cl.client.signIn.resetPassword({password:p});
  if(r.status!=='complete') return msg('Could not update the password. Request a new reset code.');
  await Cl.setActive({session:r.createdSessionId}); await Cl.signOut();
  closeFlow('Password updated. Sign in with your new password.'); const e=$('login-error'); if(e)e.classList.add('auth-ok');
}

/* ---- sign-in: Clerk confirms who you are (verified email), THEN your school data is loaded ----
   Nothing is read from Supabase before this point. What each person can load is decided by the database
   (row-level security), not by this page. */
const busy=t=>{ let b=$('cbe-busy'); if(!b){ b=document.createElement('div'); b.id='cbe-busy'; b.className='no-print'; document.body.appendChild(b); } b.innerHTML='<div class="cbe-busy-box"><div class="cbe-spin"></div><div>'+esc(t)+'</div></div>'; b.style.display='flex'; };
const unbusy=()=>{ const b=$('cbe-busy'); if(b) b.style.display='none'; };
window.cbeBusy=busy; window.cbeUnbusy=unbusy;
function provisionOwner(au){
  /* the platform owner is whoever has a row in the database table platform_admins (set by you in SQL) */
  const m=au.meta||{};
  const u={id:uid('usr'),name:String(m.full_name||'Platform Owner'),username:norm(au.email),email:norm(au.email),role:'superadmin',schoolId:null,authUserId:au.id,emailVerified:true,createdAt:new Date().toISOString()};
  DATA.users.push(u); return u;
}
function memberRecord(au){
  /* signed-in member whose display record is missing (e.g. data restored from a backup) */
  const sid=Object.keys(MY_SCHOOL_ROLE).find(id=>schoolById(id)); if(!sid) return null;
  const m=au.meta||{};
  const u={id:uid('usr'),name:String(m.full_name||au.email).trim(),username:norm(au.email),email:norm(au.email),role:MY_SCHOOL_ROLE[sid]==='school_admin'?'schooladmin':'teacher',schoolId:sid,authUserId:au.id,emailVerified:true,
    allSubjects:false,allClasses:false,subjectIds:[],classSubjects:{},createdAt:new Date().toISOString()};
  DATA.users.push(u); return u;
}
function enterApp(u){
  const su=isSuperAdmin(u);
  if(!su){
    const sch=schoolById(u.schoolId); if(!sch) return {ok:false,msg:'This account is not linked to a school. Contact the platform owner.'};
    if(!schoolIsAccessible(sch)) return {ok:false,msg:'School "'+sch.name+'" is suspended or expired. Contact the platform owner.'};
    applySchoolContext(u.schoolId);
  } else CURRENT_SCHOOL_ID=null;
  CURRENT_USER=u; saveSession(u.id);
  /* Module 2: an owner who created a school profile but has not registered a class yet is taken straight to class registration */
  if(!su && isTeacher(u) && MY_SCHOOL_ROLE[u.schoolId]==='owner' && scopedClasses().length===0 && !window.__cbeSkipClassStep && window.cbeResumeClassStep){
    window.cbeResumeClassStep(u); return {ok:true,deferred:true};
  }
  audit('login',{schoolId:u.schoolId||null});
  hideLoginGate(); const c=$('auth-card'); if(c)c.style.display='none'; $('login-card-main').style.display='block';
  if(window.cbeHideSetup) window.cbeHideSetup();
  resetNavAnchor(su?'superDash':'dashboard'); render(); toast('Welcome, '+u.name); return {ok:true};
}
window.cbeEnterApp=enterApp;
async function finishLogin(au){
  if(!au.verified) return {ok:false,msg:'Verify your email before signing in.'};
  busy('Loading your school data…');
  let info;
  try{ info=await loadDataAfterSignIn(au); }
  catch(e){ unbusy(); console.error(e); return {ok:false,msg:'You are signed in, but your school data could not be loaded ('+friendly(e)+'). Check your connection, and that Supabase third-party sign-in with Clerk is switched on.'}; }
  unbusy();
  let u=DATA.users.find(x=>x.authUserId===au.id);
  if(IS_PLATFORM_ADMIN && (!u || u.role!=='superadmin')){ DATA.users=DATA.users.filter(x=>x.authUserId!==au.id); u=provisionOwner(au); }   // the platform owner always enters as owner
  if(!u && info.schools>0) u=memberRecord(au);
  if(!u){
    if(info.memberships>0) return {ok:false,msg:'Your school is currently suspended or has expired. Contact the platform owner.'};
    CURRENT_USER=null; return window.cbeStartOnboarding(au);   // Module 2: brand-new teacher creates a school profile and registers a class
  }
  if(u.disabled) return {ok:false,msg:'This account has been disabled. Contact your administrator.'};
  CURRENT_USER=u;
  const r=enterApp(u);
  if(r.ok && !r.deferred && u.role==='superadmin') persistNow();
  return r;
}
window.cbeEmailLogin=async function(email,password){
  email=norm(email); let Cl; try{Cl=await loadClerk();}catch(e){return {ok:false,msg:e.message};}
  const key='cbe_login_'+email, lm=lockMsg(key); if(lm) return {ok:false,msg:lm};
  if(Cl.session) await Cl.signOut();
  let si; try{ si=await Cl.client.signIn.create({identifier:email,password}); }
  catch(e){ const c=ecode(e); if(c==='form_password_incorrect'||c==='form_identifier_not_found'||c==='form_param_format_invalid'){ fail(key); return {ok:false,msg:lockMsg(key)||'Incorrect email or password. If you registered but never entered your code, register again to get a new one.'}; } return {ok:false,msg:friendly(e)}; }
  if(si.status!=='complete') return {ok:false,msg:'This account needs an extra sign-in step that CBE.School does not support yet. Contact the platform owner.'};
  await Cl.setActive({session:si.createdSessionId}); clear(key);
  const r=await finishLogin(toAu(Cl.user)); if(!r.ok) await Cl.signOut(); return r;
};
window.authSessionOk=async function(u){
  try{ const Cl=await loadClerk(); return !!(Cl.session&&Cl.user&&Cl.user.id===u.authUserId&&toAu(Cl.user).verified); }catch(e){return false;}
};
window.cbeClerkSignOut=async function(){ try{ if(window.Clerk&&window.Clerk.session) await window.Clerk.signOut(); }catch(e){} };
window.cbeChangePassword=async function(current,next){ const Cl=await loadClerk(); await Cl.user.updatePassword({currentPassword:current,newPassword:next}); };
window.cbeErrorText=friendly;

/* ---- wire into the existing login card ---- */
function wire(){
  const m=$('login-card-main'); if(!m||m.dataset.cbe) return; m.dataset.cbe='1';
  const d=document.createElement('div'); d.className='auth-links';
  d.innerHTML='<a href="#" data-go="register">Teacher? Create an account</a> · <a href="#" data-go="forgot">Forgot password?</a>';
  m.appendChild(d); d.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); openFlow(a.dataset.go,{email:''});}});
}
wire();
/* keep the person signed in across page refreshes (Clerk restores its own session), and sign out of the app if that session ends */
loadClerk().then(async Cl=>{
  Cl.addListener(({session})=>{ if(!session&&CURRENT_USER&&CURRENT_USER.authUserId) doLogout(); });
  if(Cl.session&&Cl.user&&!CURRENT_USER){
    const x=await finishLogin(toAu(Cl.user));
    if(!x.ok){ try{await Cl.signOut();}catch(e){} const e=$('login-error'); if(e&&x.msg){e.textContent=x.msg;e.classList.add('show');} }
  }
}).catch(()=>{});
})();
</script>

.cbe-spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:cbespin .8s linear infinite}@keyframes cbespin{to{transform:rotate(360deg)}}

.prog{height:8px;background:var(--line-soft);border-radius:6px;overflow:hidden;min-width:90px}.prog>i{display:block;height:100%;background:var(--accent)}

<script>
/* ===== CBE.School — Module 2: teacher creates a school and registers a class =====
   • School profile (name, location, contact) with duplicate detection — done in the database, which only ever returns names/counties.
   • Class registration (grade, class/stream, academic year, subjects taught, learners). The registrant becomes Class Teacher automatically
     (the database does this, so it cannot be faked from the page).
   • INDEPENDENT CLASS MANAGEMENT MODE: one teacher + one class works on its own. No School Administrator, no approval, no extra classes,
     no grouping, no platform-owner activation (the school is created free-access). School administration stays optional. */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const nm=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
const COUNTIES=['Baringo','Bomet','Bungoma','Busia','Elgeyo-Marakwet','Embu','Garissa','Homa Bay','Isiolo','Kajiado','Kakamega','Kericho','Kiambu','Kilifi','Kirinyaga','Kisii','Kisumu','Kitui','Kwale','Laikipia','Lamu','Machakos','Makueni','Mandera','Marsabit','Meru','Migori','Mombasa','Murang\u2019a','Nairobi','Nakuru','Nandi','Narok','Nyamira','Nyandarua','Nyeri','Samburu','Siaya','Taita-Taveta','Tana River','Tharaka-Nithi','Trans Nzoia','Turkana','Uasin Gishu','Vihiga','Wajir','West Pokot'];
const SUBJ={
  lower:['English','Kiswahili','Mathematics','Environmental Activities','Hygiene and Nutrition','Religious Education','Movement and Creative Activities'],
  upper:['English','Kiswahili','Mathematics','Science and Technology','Social Studies','Agriculture and Nutrition','Creative Arts','Religious Education','Physical and Health Education'],
  junior:['English','Kiswahili','Mathematics','Integrated Science','Health Education','Pre-Technical Studies','Social Studies','Religious Education','Business Studies','Agriculture','Life Skills','Sports and Physical Education','Creative Arts']
};
const subjectsFor=g=>g<=3?SUBJ.lower:(g<=6?SUBJ.upper:SUBJ.junior);
const codeOf=n=>String(n).replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'SUB';
const gate=()=>{let g=$('setup-gate');if(!g){g=document.createElement('div');g.id='setup-gate';g.className='no-print';document.body.appendChild(g);}return g;};
function show(step,html){
  const g=gate(), steps=['School','Class','Done'];
  g.innerHTML='<div class="setup-card"><div class="brand"><div class="mark">CBE.School</div></div>'+
    (step>=0?'<div class="setup-steps">'+steps.map((s,i)=>'<span class="'+(i<step?'done':i===step?'on':'')+'">'+(i+1)+'. '+s+'</span>').join('')+'</div>':'')+
    '<div class="err" id="su-err" role="alert"></div>'+html+'</div>';
  g.style.display='flex'; g.scrollTop=0;
}
function hide(){const g=$('setup-gate'); if(g){g.style.display='none'; g.innerHTML='';}}
window.cbeHideSetup=hide;
const err=t=>{const e=$('su-err'); if(e){e.textContent=t; e.classList.toggle('show',!!t); e.scrollIntoView({block:'nearest'});}};
const val=id=>{const e=$(id); return e?e.value.trim().replace(/\s+/g,' '):'';};

/* ---------------- Step 1: school profile ---------------- */
function stepSchool(ctx){
  const v=ctx.vals||{}, au=ctx.au;
  show(0,`<h2>Create your school profile</h2><p class="lead">Your email is verified. Tell us about your school.</p>
  <form id="su-school" autocomplete="off">
    <div class="field"><label for="s-name">School name *</label><input id="s-name" type="text" required maxlength="120" value="${esc(v.name||'')}" placeholder="e.g. Mwangaza Primary School"></div>
    <div class="row2">
      <div class="field"><label for="s-county">County *</label><select id="s-county" required><option value="">Select county…</option>${COUNTIES.map(c=>`<option ${v.county===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label for="s-sub">Sub-county / ward / town</label><input id="s-sub" type="text" maxlength="80" value="${esc(v.subCounty||'')}"></div>
    </div>
    <div class="field"><label for="s-addr">Physical address / P.O. Box (optional)</label><input id="s-addr" type="text" maxlength="160" value="${esc(v.address||'')}"></div>
    <div class="row2">
      <div class="field"><label for="s-phone">School phone (optional)</label><input id="s-phone" type="tel" maxlength="20" value="${esc(v.phone||'')}" placeholder="07XX XXX XXX"></div>
      <div class="field"><label for="s-email">School email (optional)</label><input id="s-email" type="email" maxlength="120" value="${esc(v.email||'')}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="s-level">Level offered *</label><select id="s-level"><option value="primary" ${v.level==='primary'?'selected':''}>Primary (Grades 1–6)</option><option value="junior" ${(v.level||'junior')==='junior'?'selected':''}>Junior (Grades 7–9)</option><option value="both" ${v.level==='both'?'selected':''}>Both (Grades 1–9)</option></select></div>
      <div class="field"><label for="s-type">School type</label><select id="s-type">${['Public','Private','Faith-based','Community'].map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="note">You do <strong>not</strong> need a School Administrator to use CBE.School. You can manage your own class straight away.</div>
    <div class="actions"><button type="button" class="btn" id="su-out">Sign out</button><button class="btn primary" type="submit" id="su-go">Continue</button></div>
  </form>`);
  $('su-out').onclick=signOutNow;
  $('su-school').onsubmit=async e=>{
    e.preventDefault(); err('');
    const vals={name:val('s-name'),county:$('s-county').value,subCounty:val('s-sub'),address:val('s-addr'),phone:val('s-phone'),email:val('s-email').toLowerCase(),level:$('s-level').value,type:$('s-type').value};
    if(vals.name.length<3) return err('Enter the school name.');
    if(!vals.county) return err('Select the school\u2019s county.');
    if(vals.phone && !/^\+?[0-9 ()-]{9,16}$/.test(vals.phone)) return err('Enter a valid phone number, or leave it blank.');
    if(vals.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(vals.email)) return err('Enter a valid school email, or leave it blank.');
    ctx.vals=vals; $('su-go').disabled=true; $('su-go').textContent='Checking…';
    try{ await createSchool(ctx,false,null); }catch(ex){ console.error(ex); err(msgOf(ex)); $('su-go').disabled=false; $('su-go').textContent='Continue'; }

}
async function createSchool(ctx,ack,dupOf){
  const v=ctx.vals, au=ctx.au, sid=ctx.sid||(ctx.sid=uid('sch'));
  const m=au.meta||{}, email=String(au.email||'').toLowerCase();
  const school=blankSchool({id:sid,name:v.name,county:v.county,subCounty:v.subCounty,address:v.address,contactPhone:v.phone,contactEmail:v.email,schoolType:v.type,section:v.level,
    code:'IND-'+sid.slice(-6).toUpperCase(),status:'active',subscriptionStatus:'active',paymentStatus:'paid',plan:'independent',freeAccess:true,independent:true});
  school.settings.schoolName=v.name; school.settings.section=v.level;
  const user={id:uid('usr'),name:String(m.full_name||email).trim(),username:email,email,phone:m.phone||'',role:'teacher',schoolId:sid,authUserId:au.id,emailVerified:true,independent:true,
    subjectIds:[],allSubjects:false,allClasses:false,classSubjects:{},createdAt:new Date().toISOString()};
  if(!dbHandle) dbHandle=await openDB();
  const res=await sbOk(dbHandle.rpc('create_school',{p_id:sid,p_value:{school,users:[user]},p_acknowledge_duplicates:!!ack,p_duplicate_of:dupOf||null}));
  if(res&&res.status==='duplicate') return showDuplicates(ctx,res.matches||[]);
  window.cbeBusy('Opening your school…');
  try{ await loadDataAfterSignIn(au); } finally { window.cbeUnbusy(); }
  const u=DATA.users.find(x=>x.authUserId===au.id); if(!u) throw new Error('Your school was created but could not be opened. Please sign in again.');
  CURRENT_USER=u; applySchoolContext(sid);
  stepClass({user:u,school:schoolById(sid),first:true});
}
function showDuplicates(ctx,matches){
  const exact=matches.some(x=>x.match==='exact');
  show(0,`<h2>${exact?'This school may already be registered':'Similar schools found'}</h2>
  <p class="lead">To avoid duplicate records, please check whether your school is one of these.</p>
  ${matches.map(x=>`<div class="dup"><strong>${esc(x.name)}</strong> · ${esc(x.county||'')}${x.sub_county?', '+esc(x.sub_county):''} <em>(${x.match==='exact'?'looks like the same school':'similar name'})</em><br>
    <button class="btn sm" data-join="${esc(x.id)}" data-jn="${esc(x.name)}">This is my school — ask to join</button></div>`).join('')}
  <div class="note">Not the same school? You can carry on with your own profile right away — no approval needed.</div>
  <div class="actions"><button class="btn" id="su-back">← Edit details</button><button class="btn primary" id="su-cont">No, mine is a different school — continue</button></div>`);
  $('su-back').onclick=()=>stepSchool(ctx);
  $('su-cont').onclick=async()=>{ $('su-cont').disabled=true; try{ await createSchool(ctx,true,(matches[0]||{}).id||null); }catch(ex){ err(msgOf(ex)); $('su-cont').disabled=false; } };
  document.querySelectorAll('[data-join]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ await sbOk(dbHandle.rpc('request_join_school',{p_school_id:b.dataset.join,p_name:(ctx.au.meta||{}).full_name||ctx.au.email,p_message:''})); showWaiting(ctx,b.dataset.jn); }
    catch(ex){ err(msgOf(ex)); b.disabled=false; }
  });
}
function showWaiting(ctx,name){
  show(-1,`<h2>Request sent</h2><p class="lead">The administrator of <strong>${esc(name||'that school')}</strong> has been asked to approve you. Once approved, sign in again to register your class there.</p>
  <div class="note">You don\u2019t have to wait. You can start using CBE.School now with your own school profile and class.</div>
  <div class="actions"><button class="btn" id="su-out">Sign out</button><button class="btn primary" id="su-own">Continue with my own school profile</button></div>`);
  $('su-out').onclick=signOutNow; $('su-own').onclick=()=>stepSchool(ctx);

window.cbeStartOnboarding=async function(au){
  const m=au.meta||{};
  const ctx={au,vals:{name:m.school_name||'',level:['primary','junior','both'].includes(m.section)?m.section:'junior',email:'',phone:m.phone||''}};
  try{
    if(!dbHandle) dbHandle=await openDB();
    const p=await sbOk(dbHandle.from('app_join_requests').select('school_id').eq('user_id',au.id).eq('status','pending'));
    if(p&&p.length){ showWaiting(ctx,'the school you asked to join'); return {ok:true,deferred:true}; }
  }catch(e){ console.warn(e); }
  stepSchool(ctx); return {ok:true,deferred:true};
};

/* ---------------- Step 2: class registration ---------------- */
function stepClass(ctx){
  const u=ctx.user, sch=ctx.school, grades=(SECTIONS[sch.section]||SECTIONS.junior).grades;
  const yr=Number((sch.settings||{}).currentYear)||new Date().getFullYear();
  const g0=ctx.vals&&ctx.vals.grade||grades[0];
  show(ctx.first?1:-1,`<h2>Register ${ctx.first?'your class':'a class'}</h2><p class="lead">${esc(sch.name)} · ${esc(sch.county||'')}</p>
  <form id="su-class" autocomplete="off">
    <div class="row2">
      <div class="field"><label for="c-grade">Grade *</label><select id="c-grade">${grades.map(g=>`<option value="${g}" ${g===g0?'selected':''}>Grade ${g}</option>`).join('')}</select></div>
      <div class="field"><label for="c-stream">Class name / stream (if any)</label><input id="c-stream" type="text" maxlength="30" placeholder="e.g. Blue, East, A"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="c-year">Academic year *</label><select id="c-year">${[yr-1,yr,yr+1].map(y=>`<option ${y===yr?'selected':''}>${y}</option>`).join('')}</select></div>
      <div class="field"><label>Your role</label><input type="text" value="Class Teacher (automatic)" disabled></div>
    </div>
    <div class="field"><label>Subjects you teach in this class</label><div class="chips" id="c-subjects"></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="c-newsub" type="text" maxlength="50" placeholder="Add another subject"><button type="button" class="btn sm" id="c-addsub">Add</button></div></div>
    <div class="field"><label for="c-learners">Learners (optional — one name per line, you can paste a list)</label><textarea id="c-learners" placeholder="Amina Wanjiru&#10;Brian Otieno&#10;…"></textarea>
      <div class="hint">You can add or change learners later from the Students page.</div></div>
    <div class="note">You manage this class on your own: register learners, create examinations, enter or upload marks, invite subject teachers, monitor marks, see analytics and print reports. No School Administrator is needed.</div>
    <div class="actions">${ctx.first?'<button type="button" class="btn" id="c-later">Do this later</button>':'<button type="button" class="btn" id="c-cancel">Cancel</button>'}<button class="btn primary" type="submit" id="c-go">Register class</button></div>
  </form>`);
  const box=$('c-subjects');
  const addChip=(n,checked)=>{ if([...box.querySelectorAll('input')].some(i=>nm(i.value)===nm(n))) return; const l=document.createElement('label'); l.className='chip'; l.innerHTML='<input type="checkbox" '+(checked?'checked':'')+'> <span></span>'; l.querySelector('input').value=n; l.querySelector('span').textContent=n; box.appendChild(l); };
  const fill=()=>{ const keep=[...box.querySelectorAll('input')].filter(i=>!subjectsFor(Number($('c-grade').value)).includes(i.value)&&i.checked).map(i=>i.value); box.innerHTML=''; subjectsFor(Number($('c-grade').value)).forEach(s=>addChip(s,true)); keep.forEach(s=>addChip(s,true)); };
  fill(); $('c-grade').onchange=fill;
  $('c-addsub').onclick=()=>{ const n=val('c-newsub'); if(n){ addChip(n,true); $('c-newsub').value=''; } };
  $('c-newsub').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('c-addsub').click(); } };
  if($('c-later')) $('c-later').onclick=()=>{ window.__cbeSkipClassStep=true; const r=window.cbeEnterApp(u); if(!r.ok) toast(r.msg,'error'); };
  if($('c-cancel')) $('c-cancel').onclick=hide;
  $('su-class').onsubmit=async e=>{
    e.preventDefault(); err('');
    const g=Number($('c-grade').value), stream=val('c-stream'), year=Number($('c-year').value);
    const chosen=[...box.querySelectorAll('input')].filter(i=>i.checked).map(i=>i.value);
    if(DATA.classes.some(c=>c.schoolId===sch.id && gradeNumberOfClass(c)===g && nm(c.stream)===nm(stream) && Number(c.academicYear||yr)===year))
      return err('You have already registered Grade '+g+(stream?' '+stream:'')+' for '+year+'. Add a stream name if this is a different class.');
    const names=[], seen=new Set();
    $('c-learners').value.split(/\r?\n/).forEach(l=>{ const n=l.replace(/^\s*\d+[\.\)\-]\s*/,'').replace(/\s+/g,' ').trim(); if(n && !seen.has(nm(n))){ seen.add(nm(n)); names.push(n.slice(0,80)); } });
    $('c-go').disabled=true; $('c-go').textContent='Registering…';
    try{ await registerClass(ctx,{g,stream,year,chosen,names}); }
    catch(ex){ console.error(ex); err(msgOf(ex)); $('c-go').disabled=false; $('c-go').textContent='Register class'; }
  };
}
async function registerClass(ctx,f){
  const u=ctx.user, sch=ctx.school, sid=sch.id, now=new Date().toISOString();
  const cid=uid('cls'), snap={subjects:DATA.subjects.length};
  const cls={id:cid,schoolId:sid,name:'Grade '+f.g+(f.stream?' '+f.stream:''),grade_number:f.g,stream:f.stream,academicYear:f.year,classTeacherId:u.id,classTeacherName:u.name,createdAt:now};
  const touched=[], created=[];
  f.chosen.forEach(n=>{
    let s=DATA.subjects.find(x=>x.schoolId===sid && nm(x.name)===nm(n));
    if(s){ s.assignments=s.assignments||[]; if(!s.assignments.some(a=>a.classId===cid)){ s.assignments.push({classId:cid,teacher:u.name}); touched.push(s); } }
    else { s={id:uid('sub'),schoolId:sid,name:n,code:codeOf(n),assignments:[{classId:cid,teacher:u.name}]}; DATA.subjects.push(s); created.push(s); }
    u.subjectIds=u.subjectIds||[]; if(!u.subjectIds.includes(s.id)) u.subjectIds.push(s.id);
  });
  u.classSubjects=u.classSubjects||{}; u.classSubjects[cid]={all:true};
  DATA.classes.push(cls);
  f.names.forEach(n=>DATA.students.push({id:uid('stu'),schoolId:sid,name:n,classId:cid,streamId:''}));
  if(!DATA.classes.some(c=>c.schoolId===sid&&c.id!==cid)){ sch.settings=sch.settings||{}; sch.settings.currentYear=f.year; DATA.settings.currentYear=f.year; }
  audit('class_registered',{schoolId:sid,classId:cid,name:cls.name,learners:f.names.length});
  await persistNow();
  if(!KNOWN.classes.has(cid)){   // the database refused: roll back what we added locally
    DATA.classes=DATA.classes.filter(c=>c.id!==cid); DATA.students=DATA.students.filter(s=>s.classId!==cid);
    created.forEach(s=>{ DATA.subjects=DATA.subjects.filter(x=>x.id!==s.id); });
    touched.forEach(s=>{ s.assignments=s.assignments.filter(a=>a.classId!==cid); });
    delete u.classSubjects[cid];
    throw new Error('The class could not be saved. Check your connection and try again.');
  }
  window.__cbeSkipClassStep=false;
  if(ctx.first){ const r=window.cbeEnterApp(u); if(!r.ok) toast(r.msg,'error'); else toast('Grade '+f.g+(f.stream?' '+f.stream:'')+' registered — you are its Class Teacher'); }
  else { hide(); render(); toast(cls.name+' registered — you are its Class Teacher'); }
}
window.cbeResumeClassStep=function(u){ stepClass({user:u,school:schoolById(u.schoolId),first:true}); };
window.cbeRegisterClass=function(){ const u=CURRENT_USER, s=u&&schoolById(u.schoolId); if(!u||!s) return; stepClass({user:u,school:s,first:false}); };

window.cbeGrantSave=async function(exam){
  if(MY_CLASS_ROLE[exam.classId]==='class_teacher'||IS_PLATFORM_ADMIN||MY_SCHOOL_ROLE[exam.schoolId]==='school_admin') return false;
  const gs=MY_GRANTS.filter(g=>g.class_id===exam.classId&&(g.exam_id===exam.id||g.exam_id==='*')); if(!gs.length) return false;
  for(const g of gs){
    const marks={}; MARKS_DIRTY.forEach(k=>{ const [e,st,su]=String(k).split('|'); if(e===exam.id&&su===g.subject_id){ const v=((exam.results||{})[st]||{})[su]; marks[st]=(v===''||v==null)?null:v; } });
    const done=examStudents(exam).every(s=>{ const v=((exam.results||{})[s.id]||{})[g.subject_id]; return v!=null&&v!==''; });
    if(Object.keys(marks).length){ await sbOk(dbHandle.rpc('submit_subject_marks',{p_class:exam.classId,p_exam:exam.id,p_subject:g.subject_id,p_marks:marks,p_final:done})); if(done) g.submitted_at=new Date().toISOString(); }
  }
  return true;
};

<script>
/* ===== CBE.School — Module 3: learner registration from a picture =====
   Photo/upload -> resized on this device -> read by the extract-learners Edge Function (vision OCR) -> editable review table
   -> duplicate / incomplete / uncertain checks -> teacher confirms -> import. Nothing is saved until the teacher confirms,
   and uncertain rows are never ticked for import automatically. Manual entry, Excel/CSV import and all other methods are untouched. */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const MAXPX=1800, MAX_PAGES=6;
let S=null;
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|[\s'’\-])([a-z\u00C0-\u024F])/g,(m,a,b)=>a+b.toUpperCase());
const clean=s=>String(s||'').replace(/^\s*\d{1,3}\s*[\.\)\-:]\s+/,'').replace(/[\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim();
const years=()=>[...new Set(accessibleClasses().map(c=>String(c.academicYear||(DATA.settings||{}).currentYear||new Date().getFullYear())))].sort();
const clsYear=c=>String(c.academicYear||(DATA.settings||{}).currentYear||new Date().getFullYear());
const classesIn=y=>accessibleClasses().filter(c=>clsYear(c)===y);
const curClass=()=>classById(S.classId);

function openPhoto(){
  const cl=accessibleClasses();
  if(!cl.length) return problem('There is no class to add learners to yet.','Register or open a class first, then import learners from a photo.');
  const pre=cl.find(c=>c.id===(STATE.params||{}).classId)||cl[0];
  S={step:'pick',files:[],rows:[],classId:pre.id,year:clsYear(pre),stream:'',quality:'',qnotes:[],dirty:false,result:null};

function drawThumbs(){

function setMsg(html){ const m=$('ph-msg'); if(m) m.innerHTML=html||''; }
function prep(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp|gif|bmp)$/i.test(file.name||'')) return rej(new Error('type'));
    if(file.size>25*1024*1024) return rej(new Error('big'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const k=Math.min(1,MAXPX/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      let lum=128; try{ const s=g.getImageData(0,0,c.width,c.height,{}).data; let t=0,n=0; for(let i=0;i<s.length;i+=160){ t+=s[i]*.3+s[i+1]*.59+s[i+2]*.11; n++; } lum=t/n; }catch(e){}
      URL.revokeObjectURL(url);
      const d=c.toDataURL('image/jpeg',0.85);
      res({data:d.split(',')[1],thumb:d,w:img.width,h:img.height,lum,name:file.name||'photo'});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src=url;
  });
}
async function addFiles(list){
  const arr=[...list]; if(!arr.length) return; const notes=[];
  for(const f of arr){
    if(S.files.length>=MAX_PAGES){ notes.push(`<div class="ph-warn">Only ${MAX_PAGES} pictures can be read at once — extra pictures were ignored.</div>`); break; }
    try{
      const p=await prep(f); S.files.push(p);
      if(Math.min(p.w,p.h)<600) notes.push(`<div class="ph-warn">“${esc(p.name)}” is small (${p.w}×${p.h}). Small pictures are hard to read — move closer and retake if names are missed.</div>`);
      if(p.lum<60) notes.push(`<div class="ph-warn">“${esc(p.name)}” looks very dark. Retake it in better light for more accurate reading.</div>`);
      if(p.lum>238) notes.push(`<div class="ph-warn">“${esc(p.name)}” looks washed out (glare or too bright). Retake it if names are missed.</div>`);
    }catch(e){
      notes.push(`<div class="ph-bad">“${esc(f.name||'picture')}” could not be opened. ${e.message==='big'?'It is larger than 25 MB — take a new photo instead.':e.message==='type'?'Please choose a picture (JPG, PNG, WebP or a phone photo).':'The picture may be damaged or in a format this browser cannot show (some HEIC photos). Take a new photo with the camera button or save it as JPG and try again.'}</div>`);
    }
  }
  drawThumbs(); setMsg(notes.join(''));
}
/* ---------- reading ---------- */

/* Which reader to use:  'browser' = free, on this device (Tesseract.js, no key, nothing leaves the phone)
                          'server'  = AI reader via the extract-learners Edge Function (needs a paid API key; best for handwriting)
                          'auto'    = try the server reader, fall back to the browser reader if it is not set up */
const OCR_ENGINE='browser';
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessWorker=null;
function loadScript(u){ return new Promise((res,rej)=>{ if(window.Tesseract) return res(); const s=document.createElement('script'); s.src=u; s.onload=res; s.onerror=()=>rej(new Error('lib')); document.head.appendChild(s); }); }
async function getWorker(onProgress){
  if(tessWorker) return tessWorker;
  await loadScript(TESS_URL);
  tessWorker=await window.Tesseract.createWorker('eng',1,{logger:m=>{ if(m&&m.status==='recognizing text'&&onProgress) onProgress(Math.round((m.progress||0)*100)); }});
  return tessWorker;
}
async function killWorker(){ try{ if(tessWorker) await tessWorker.terminate(); }catch(e){} tessWorker=null; }
const HEADER=/^(no|nos|name|names|adm|admission|class|grade|gender|sex|total|teacher|term|school|list|register|date|year|signature|stream|upi|dob)\b/i;
/** turns OCR text lines into learner rows; never fills in anything that was not read */
function parseOcrLines(lines){
  const rows=[];
  (lines||[]).forEach(L=>{
    let t=String(L.text||'').replace(/[|_\[\]{}~`^*=<>\\]/g,' ').replace(/\s+/g,' ').trim(); if(!t) return;
    if((t.match(/[A-Za-z]/g)||[]).length<3) return;
    const toks=t.split(' '); let adm='';
    const keep=[];
    toks.forEach((w,i)=>{
      if(/^[A-Za-z]{0,3}\d{3,}([\/\-]\d+)?$/.test(w) && !adm){ adm=w; return; }
      if(i===0 && /^\d{1,3}[\.\):\-]?$/.test(w) && toks.length>1) return;            // row number
      const c=w.replace(/^[^A-Za-z\u00C0-\u024F]+|[^A-Za-z\u00C0-\u024F'’\.\-]+$/g,'');
      if(c.length>=1 && /[A-Za-z\u00C0-\u024F]/.test(c)) keep.push(c);
    });
    const name=keep.join(' ').trim();
    if(name.length<3) return;
    if(HEADER.test(name) && !adm) return;
    const conf=Number(L.confidence)||0;
    rows.push({name,admission_no:adm,details:'',confidence:conf>=80?'high':'low',note:conf>=80?'':'on-device reader was unsure'});
  });
  return rows;
}
async function viaBrowser(i,progressEl){
  const w=await getWorker(pc=>{ if(progressEl) progressEl.textContent=' ('+pc+'%)'; });
  const r=await w.recognize(S.files[i].thumb);
  const d=r.data||{}, mc=Number(d.confidence)||0;
  const q=mc<45?'unreadable':mc<62?'poor':mc<78?'fair':'good';
  const note=q==='good'?'':'On-device reading is least accurate on handwriting and small or blurry print — check every row.';
  return {ok:true,quality:q,quality_note:note,rows:parseOcrLines(d.lines)};
}
async function viaServer(i){
  const token=await window.Clerk.session.getToken();
  const r=await fetch(SUPABASE_URL+'/functions/v1/extract-learners',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,apikey:SUPABASE_ANON_KEY},
    body:JSON.stringify({class_id:S.classId,image:{media_type:'image/jpeg',data:S.files[i].data}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok){ const e=new Error(j.message||'The picture could not be read.'); e.status=r.status; throw e; }

}
const privText=()=>OCR_ENGINE==='browser'?'🔒 The picture is read on this device and is not uploaded anywhere. (The reading tool downloads once, about 10 MB, so the first read needs internet.)':'🔒 The picture is sent securely to a text-reading service only to read the list, and is not stored.';
async function readAll(){
  if(!S.files.length) return;
  const c=curClass(); if(!c) return;
  const root=$('ph-root'); const total=S.files.length; S.rows=[]; S.quality='good'; S.qnotes=[];
  const rank={good:0,fair:1,poor:2,unreadable:3}; let worst='good', failed=0, lastErr='';
  for(let i=0;i<total;i++){
    root.innerHTML=head('Reading the list…')+`<div style="display:flex;gap:14px;align-items:center;padding:24px 4px"><div class="cbe-spin"></div><div>Reading picture ${i+1} of ${total}…<div class="small">This usually takes 5–20 seconds.</div></div></div>`;
    try{
      const prog=document.createElement('span'); const holder=root.querySelector('.small'); if(holder) holder.prepend(prog);
      let j;
      if(OCR_ENGINE==='server') j=await viaServer(i);
      else if(OCR_ENGINE==='auto'){ try{ j=await viaServer(i); }catch(e){ if([404,503,502].includes(e.status)||!e.status) j=await viaBrowser(i,prog); else throw e; } }
      else j=await viaBrowser(i,prog);
      if((rank[j.quality]||0)>rank[worst]) worst=j.quality;
      if(j.quality_note) S.qnotes.push(`Picture ${i+1}: ${j.quality_note}`);
      (j.rows||[]).forEach(x=>S.rows.push(mkRow(x,i+1)));
    }catch(e){
      console.error(e); failed++;
      lastErr=e.message==='lib'?'The on-device reading tool could not be downloaded. Connect to the internet once and try again.':(e.status===429?e.message:(e.status===403?'You do not have permission to add learners to this class.':(e.status?e.message:'The picture could not be read on this device. Try a clearer photo.')));
      S.qnotes.push(`Picture ${i+1}: ${lastErr}`);
    }
  }

  S.quality=worst;
  if(!S.rows.length){
    drawPick(`<div class="ph-bad"><strong>No learner names could be read.</strong> ${esc(failed===total?lastErr:(worst==='unreadable'?'The picture is not readable.':'The pictures contain no recognisable learner list.'))}<br>Retake the photo closer, flat and well lit — for handwritten lists, typing names or using the Excel/CSV import is more reliable.</div>`);
    drawThumbs(); return;
  }

}
function mkRow(x,page){
  const name=clean(x.name), adm=String(x.admission_no||'').replace(/\s+/g,'').slice(0,30), det=clean(x.details).slice(0,120);
  return {id:uid('ph'),name,adm,details:det,conf:x.confidence==='high'?'high':'low',note:clean(x.note).slice(0,100),page,reviewed:false,include:false,state:'ready',msgs:[]};
}
/* ---------- checks ---------- */
function analyseRow(r,i){
  const m=[]; let st='ready'; const c=curClass(), nn=normName(r.name);
  const bump=(s,t)=>{ const o={ready:0,dupother:1,review:2,dup:3,incomplete:4}; if(o[s]>o[st]) st=s; if(t) m.push(t); };
  if(!nn) bump('incomplete','Name is missing or unreadable — type it in, or remove the row');
  else {
    if(/\d/.test(r.name)) bump('review','Name contains numbers — check it');
    if(/[^A-Za-z\u00C0-\u024F\s'’\-\.]/.test(r.name.replace(/\d/g,''))) bump('review','Unusual characters — check spelling');
    if(nn.split(' ').length<2) bump('review','Only one name — is a surname missing?');
    if(r.name.length<3) bump('review','Very short name');
    const prior=S.rows.findIndex((o,j)=>j<i && normName(o.name)===nn && (!r.adm||!o.adm||o.adm===r.adm));
    if(prior>=0) bump('dup','Duplicate of row '+(prior+1)+' in this list');
    const ex=scopedStudents().filter(s=>!s.graduated && normName(s.name)===nn);
    const same=ex.find(s=>s.classId===S.classId && (!S.stream||normName((streamById(s.streamId)||{}).name)===normName(S.stream)||!s.streamId));
    if(same) bump('dup','Already in '+c.name);
    else if(ex.length) bump('dupother','Same name already in '+(classById(ex[0].classId)||{name:'another class'}).name+' — possible duplicate');
  }
  if(r.adm){
    const a=scopedStudents().find(s=>s.admNo && s.admNo.toLowerCase()===r.adm.toLowerCase());
    if(a) bump('dup','Admission no. '+r.adm+' already belongs to '+a.name);
    const dl=S.rows.findIndex((o,j)=>j<i && o.adm && o.adm.toLowerCase()===r.adm.toLowerCase());
    if(dl>=0) bump('dup','Admission no. repeats row '+(dl+1));
  }
  if(r.conf==='low' && !r.reviewed && nn) bump('review',r.note?('Hard to read: '+r.note):'Not certain this was read correctly — check it');

}
function analyseAll(initial){
  S.rows.forEach((r,i)=>{ const before=r.state; analyseRow(r,i); if(initial!==false && r.state==='ready' && !r._touched) r.include=true; });
}
const LBL={ready:'Ready',review:'Check',dup:'Duplicate',dupother:'Possible duplicate',incomplete:'Incomplete'};
function counts(){ const c={ready:0,review:0,dup:0,dupother:0,incomplete:0,sel:0}; S.rows.forEach(r=>{ c[r.state]++; if(r.include) c.sel++; }); return c; }
/* ---------- step 2: review ---------- */
function drawReview(){
  const r=$('ph-root'), q=S.quality;

    S.qnotes.map(n=>`<div class="ph-warn">${esc(n)}</div>`).join('');
  r.innerHTML=head('Check the learners')+`${assignHtml()}${banner}<div class="ph-sum" id="ph-sum"></div>
    <div class="ph-scroll"><table class="ph-table"><thead><tr><th style="width:34px">Import</th><th style="width:30px">#</th><th>Learner name</th><th style="width:130px">Admission no.</th><th style="width:150px">Other details <span class="small">(not saved)</span></th><th style="width:190px">Status</th><th style="width:34px"></th></tr></thead><tbody id="ph-tb"></tbody></table></div>
    <div class="actions" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">

}
function trFor(row,i){

function refreshRows(){

/* ---------- step 3: confirm ---------- */
function drawConfirm(){
  const c=curClass(), sch=schoolById(c.schoolId), sel=S.rows.filter(r=>r.include), warn=sel.filter(r=>r.state==='review'||r.state==='dupother'), skip=S.rows.filter(r=>!r.include);

    <div class="modal-foot"><button class="btn" id="ph-back">← Back to edit</button><button class="btn primary" id="ph-conf">Confirm and import ${sel.length}</button></div>`;

async function doImport(){

  try{
    let str=null;
    if(S.stream){ str=scopedStreams().find(x=>x.classId===c.id && normName(x.name)===normName(S.stream)); if(!str){ str={id:uid('str'),classId:c.id,name:S.stream.replace(/\s+/g,' ')}; newStream=str; } }
    good.forEach(r=>{ const st={id:uid('stu'),schoolId:c.schoolId,name:r.name.replace(/\s+/g,' ').trim(),classId:c.id,streamId:str?str.id:''}; if(r.adm) st.admNo=r.adm; st.importSource='photo'; added.push(st); });
    if(newStream) DATA.streams.push(newStream);
    added.forEach(s=>DATA.students.push(s));
    audit('learners_imported_photo',{schoolId:c.schoolId,classId:c.id,count:added.length});
    await persistNow();
    if(IS_PLATFORM_ADMIN===false && LAST['class:'+c.id]!==JSON.stringify(buildClassRowPayload(c.id))) throw new Error('save');
  }catch(e){
    console.error(e);
    DATA.students=DATA.students.filter(s=>!added.includes(s)); if(newStream) DATA.streams=DATA.streams.filter(s=>s!==newStream);
    S.step='review'; drawReview();
    const r=$('ph-root'); r.insertAdjacentHTML('afterbegin','<div class="ph-bad"><strong>Import failed — nothing was saved.</strong> '+(e.message==='save'?'The records could not be stored (check your connection or permission for this class).':esc(e.message||'Something went wrong.'))+' Your corrections are still here, so you can try again.</div>');

}
/* ---------- step 4: result ---------- */
function drawDone(){
  const R=S.result, left=R.bad;
  $('ph-root').innerHTML=head('Import finished')+`<div class="ph-ok"><strong>${R.imported} learner${R.imported===1?'':'s'} imported</strong> into ${esc(R.cls)}.</div>
    ${left.length?`<div class="ph-warn"><strong>${left.length} record${left.length===1?'':'s'} need correction</strong> and were not imported:</div>
      <div class="ph-scroll" style="max-height:30vh"><table class="ph-table" style="min-width:0"><tbody>${left.map(r=>`<tr class="s-${r.state}"><td>${esc(r.name||'(no name)')}</td><td class="ph-st">${esc(r.msgs.join('; ')||'Not ticked for import')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="modal-foot">${left.length?'<button class="btn" id="ph-fix">Fix the remaining records</button>':''}<button class="btn primary" id="ph-done">Done</button></div>`;
  bindClose(); $('ph-done').onclick=()=>{ S=null; closeModal(); render(); };
  if($('ph-fix')) $('ph-fix').onclick=()=>{ S.step='review'; S.dirty=true; analyseAll(false); drawReview(); };
}
window.cbeOpenPhotoImport=openPhoto;
window.cbeOcr={prep,getWorker,killWorker};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-cbe="photo-import"]'); if(b){ e.preventDefault(); openPhoto(); } });
})();
</script>
<style>
.pm-sum{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pm-sum span{padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);background:var(--paper)}

</style>
<script>
/* ===== CBE.School — Module 5: marks from a picture of a marks sheet =====
