function gradeNumberOfClass(c){
  if(c.grade_number) return c.grade_number;
  return parseInt(String(c.name||'').replace(/\D/g,''),10)||0;
}
/** Merge duplicate classes (e.g. two "Grade 7" in one school) into one, moving learners, exams,
 *  streams, subject assignments and teacher access across so nothing is lost. Returns number merged. */
function nm_(x){ return String(x||'').trim().toLowerCase(); }
function dedupeClasses(){
  const classes=DATA.classes||[]; if(!classes.length) return 0;
  const usage=id=>(DATA.students||[]).filter(x=>x.classId===id).length+(DATA.exams||[]).filter(x=>x.classId===id).length;
  const groups=new Map();
  classes.forEach(c=>{ const g=gradeNumberOfClass(c); if(!g) return; const k=(c.schoolId||'')+'|'+g+'|'+nm_(c.stream)+'|'+(c.academicYear||''); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(c); });
  let merged=0; const drop=new Set();
  groups.forEach(list=>{
    if(list.length<2) return;
    list.sort((a,b)=>usage(b.id)-usage(a.id));           // keep the one that already holds learners / exams
    const keep=list[0];
    if(!keep.grade_number) keep.grade_number=gradeNumberOfClass(keep);
    list.slice(1).forEach(dup=>{
      (DATA.students||[]).forEach(x=>{ if(x.classId===dup.id) x.classId=keep.id; });
      (DATA.exams||[]).forEach(x=>{ if(x.classId===dup.id) x.classId=keep.id; });
      (DATA.streams||[]).forEach(x=>{ if(x.classId===dup.id) x.classId=keep.id; });
      (DATA.subjects||[]).forEach(sub=>{
        if(!Array.isArray(sub.assignments)) return;
        sub.assignments.forEach(a=>{ if(a.classId===dup.id) a.classId=keep.id; });
        const seen=new Set(); sub.assignments=sub.assignments.filter(a=>{ if(seen.has(a.classId)) return false; seen.add(a.classId); return true; });
      });
      (DATA.teacherClassAccess||[]).forEach(a=>{ if(a.classId===dup.id) a.classId=keep.id; });
      (DATA.schoolClassSubs||[]).forEach(r=>{ if(r.classId===dup.id) r.classId=keep.id; });
      drop.add(dup.id); merged++;
    });
    // de-dupe any class-subscription record left doubled up on the kept class
    const seenSub=new Set();
    DATA.schoolClassSubs=(DATA.schoolClassSubs||[]).filter(r=>{
      const k=r.schoolId+'|'+r.classId;
      if(r.classId!==keep.id) return true;
      if(seenSub.has(k)) return false;
      seenSub.add(k); return true;
    });
    // streams of the kept class that now share a name: merge them too
    const byName=new Map();
    (DATA.streams||[]).filter(x=>x.classId===keep.id).forEach(st=>{
      const n=String(st.name||'').trim().toLowerCase();
      if(!byName.has(n)){ byName.set(n,st); return; }
      const first=byName.get(n);
      (DATA.students||[]).forEach(x=>{ if(x.streamId===st.id) x.streamId=first.id; });
      (DATA.exams||[]).forEach(x=>{ if(x.streamId===st.id) x.streamId=first.id; });
      st.__drop=true;
    });
    DATA.streams=(DATA.streams||[]).filter(x=>!x.__drop);
  });
  if(!merged) return 0;
  DATA.classes=classes.filter(c=>!drop.has(c.id));
  // one access record per teacher+class: keep the active / newest one
  const seenAcc=new Map();
  (DATA.teacherClassAccess||[]).slice().sort((a,b)=>(isAccessActive(b)-isAccessActive(a))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).forEach(a=>{
    if(a.status==='revoked') return;
    const k=a.teacherId+'|'+a.classId;
    if(seenAcc.has(k)) a.__drop=true; else seenAcc.set(k,a);
  });
  DATA.teacherClassAccess=(DATA.teacherClassAccess||[]).filter(a=>!a.__drop);
  DATA.classes.sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b));
  return merged;
}
function syncSchoolClasses(sch){
  if(sch.independent){ dedupeClasses(); DATA.classes.sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b)); return; }   // independent schools hold only the classes their teacher registered
  const want=new Set((SECTIONS[sch.section]||SECTIONS.junior).grades);
  const have=DATA.classes.filter(c=>c.schoolId===sch.id);
  have.forEach(c=>{
    if(!want.has(gradeNumberOfClass(c))){
      const used=DATA.students.some(s=>s.classId===c.id)||DATA.exams.some(e=>e.classId===c.id);
      if(!used) DATA.classes=DATA.classes.filter(x=>x.id!==c.id);
    }
  });
  want.forEach(g=>{
    if(!DATA.classes.some(c=>c.schoolId===sch.id && gradeNumberOfClass(c)===g)){
      DATA.classes.push({id:uid('cls'), schoolId:sch.id, name:'Grade '+g, grade_number:g});
    }
  });
  dedupeClasses();
  // keep Grade order
  DATA.classes.sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b));
}

function canOpenClassAsAdmin(cls){
  if(!cls||!CURRENT_USER) return false;
  if(isSuperAdmin(CURRENT_USER)) return true;
  if(!isSchoolAdmin(CURRENT_USER) || cls.schoolId!==CURRENT_USER.schoolId) return false;
  return gradeAllowedForCurrentUser(gradeNumberOfClass(cls));

/** Find the class + school behind a teacher's grant, repairing older records that lack a school. */
function resolveTeacherClass(teacherId,classId){
  const t=userById(teacherId);
  const rec=accessRecordsForTeacher(teacherId).find(a=>a.classId===classId) || null;
  let cls=(DATA.classes||[]).find(c=>c.id===classId) || null;
  let schoolId=(cls&&cls.schoolId)||(rec&&rec.schoolId)||(t&&t.schoolId)||null;
  if(!schoolId && (DATA.schools||[]).length===1) schoolId=DATA.schools[0].id;
  if(cls && !cls.schoolId && schoolId){ cls.schoolId=schoolId; persist(); }   // older record: attach it to its school
  return {t,rec,cls,schoolId,sch:schoolId?schoolById(schoolId):null};
}
function modalOpenTeacherClass(teacherId,classId){
  const r=resolveTeacherClass(teacherId,classId);
  if(!r.sch){ toast('The school for this class could not be found. Open the school from Schools and check its classes.'); return; }
  if(!r.cls){
    // The class row is gone (merged / removed). Still let the admin into the school so they can carry on.
    openModal(`<div class="modal-head"><h2>Class not found</h2><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="confirm-body">The class this grant points to no longer exists in <strong>${esc(r.sch.name)}</strong> (it may have been merged with another class). Open the school's Classes page to see the current classes, then grant access again if needed.</div>
      <div class="modal-foot"><button class="btn" data-close>Close</button><button class="btn primary" data-sa-go="classes" data-sch="${esc(r.sch.id)}" data-cls="" data-tch="${esc(teacherId)}">Open school classes</button></div>`);
    return;
  }
  if(!canOpenClassAsAdmin(r.cls)){ toast('You can only open classes in your own school'); return; }
  const cls=r.cls, sch=r.sch, t=r.t;
  const go=(v,label)=>`<button class="btn ${v==='students'?'primary':''}" data-sa-go="${v}" data-sch="${esc(sch.id)}" data-cls="${esc(cls.id)}" data-tch="${esc(teacherId)}">${label}</button>`;
  openModal(`
    <div class="modal-head"><h2>${esc(cls.name)} — ${esc(sch.name)}</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="confirm-body">Class granted to <strong>${esc(t?t.name:'this teacher')}</strong>. Choose what you want to see. Use “← Platform” in the menu to come back.</div>
    <div class="sa-go-grid">
      ${go('students','Students')}${go('analysis','Class Analysis')}
      ${go('exams','Examinations')}${go('marks','Marks Entry')}
      ${go('reports','Reports')}${go('dashboard','School Dashboard')}
    </div>
    <div class="modal-foot"><button class="btn" data-close>Close</button></div>
  `);
}
function openTeacherClassAsSuper(view,schoolId,classId,teacherId){
  const sch=schoolById(schoolId);
  if(!sch){ toast('That school could not be found'); return; }
  const cls=classId?(DATA.classes||[]).find(c=>c.id===classId):null;
  if(cls && !canOpenClassAsAdmin(cls)) return;
  if(!cls && !(isSuperAdmin(CURRENT_USER) || (isSchoolAdmin(CURRENT_USER) && CURRENT_USER.schoolId===schoolId))) return;
  const t=userById(teacherId);
  // Switch into the school (Super Admin). Open the class exactly as it is — no re-syncing that could merge or drop classes.
  if(isSuperAdmin(CURRENT_USER)) applySchoolContext(schoolId);
  audit('admin_opened_teacher_class',{schoolId,teacherId,teacher:t?t.name:'',classId:classId||null,className:cls?cls.name:'',view});
  closeModal();
  const params=(cls && (view==='students'||view==='analysis'))?{classId:cls.id}:{};
  try{
    goto(view,params);
  }catch(err){
    console.error(err);
    toast('Could not open that page: '+(err&&err.message?err.message:'unknown error'),'error');
    goto('dashboard');
    return;
  }
  toast('Viewing '+(cls?cls.name:'school')+(isSuperAdmin(CURRENT_USER)?' · '+sch.name:'')+(t?' (paid by '+t.name+')':''));
}

/* ============================= SUPER ADMIN: DELETING (ALWAYS DOUBLE-CHECKED) ============================= */
// Step 1: a plain confirmation that spells out what will be lost.
// Step 2: the Super Admin must type the exact name/username shown before the delete button unlocks.
function askDoubleConfirm(o){
  askConfirm(o.summary,()=>{
    openModal(`
      <div class="modal-head"><h2>${esc(o.title)} — final check</h2><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="confirm-body">This cannot be undone. To confirm, type <strong>${esc(o.typeText)}</strong> exactly as shown.</div>
      <div class="field"><input id="dc-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(o.typeText)}"></div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger-solid" id="dc-yes" disabled>${esc(o.yes||'Delete permanently')}</button></div>
    `);
    const inp=document.getElementById('dc-input'), yes=document.getElementById('dc-yes');
    const norm=x=>String(x||'').trim().replace(/\s+/g,' ').toLowerCase();
    const ok=()=>norm(inp.value)===norm(o.typeText);
    inp.addEventListener('input',()=>{ yes.disabled=!ok(); });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(ok()) yes.click(); } });
    yes.onclick=()=>{ if(!ok()) return; closeModal(); o.onYes(); };
    inp.focus();
  },{title:o.title+' — step 1 of 2', yes:'Continue'});
}
async function cbeRemoveMember(u){
  if(!u||!u.schoolId) return;
  try{ await saveChain.catch(()=>{});
    if(u.authUserId){ await sbOk(dbHandle.from('app_class_members').delete().eq('school_id',u.schoolId).eq('user_id',u.authUserId)); await sbOk(dbHandle.from('app_school_members').delete().eq('school_id',u.schoolId).eq('user_id',u.authUserId)); }
    if(u.email) await sbOk(dbHandle.from('app_invites').delete().eq('school_id',u.schoolId).eq('email',String(u.email).toLowerCase()));
  }catch(e){ console.warn('member removal failed',e); }
}
function requestDeleteUser(id){
  const u=userById(id); if(!u) return;
  if(!canManageUser(u)) return toast('You are not allowed to delete this account');
  if(u.id===CURRENT_USER.id) return toast('You cannot delete the account you are signed in with');
  if(u.role==='superadmin' && superAdminCount()<=1) return toast('At least one super admin is required');
  const isSA=u.role==='superadmin', isAdm=isSchoolAdmin(u);
  const roleTxt=isSA?((IS_PLATFORM_ADMIN && CURRENT_USER && u.id===CURRENT_USER.id)?'Platform Owner':'Super Admin'):(isAdm?'School Admin':'Teacher');
  const sch=schoolById(u.schoolId);
  const grants=accessRecordsForTeacher(u.id).length;
  const lines=[`You are about to delete the ${roleTxt} account for ${u.name} (${u.username})${sch?' at '+sch.name:''}.`,''];
  lines.push('• Their login is removed and they can no longer sign in.');
  if(u.role==='teacher') lines.push(`• ${grants} class access record(s) granted to this teacher are removed.`);
  if(isAdm) lines.push('• The school will have no School Admin until you register a new one.');
  lines.push('• Learners, marks and examinations are NOT deleted.');
  askDoubleConfirm({
    title:'Delete '+roleTxt.toLowerCase()+' account',
    summary:lines.join('\n'),
    typeText:u.username,
    yes:'Delete account',
    onYes:()=>{
      DATA.teacherClassAccess=(DATA.teacherClassAccess||[]).filter(a=>a.teacherId!==id);
      cbeRemoveMember(u);   // also removes their database access, not just the login record
      DATA.users=DATA.users.filter(x=>x.id!==id);
      audit('user_deleted',{schoolId:u.schoolId||null,name:u.name,username:u.username,role:u.role});
      persistNow(); render(); toast(roleTxt+' account deleted');
    }
  });
}
function schoolDeleteCounts(id){
  const c=k=>(DATA[k]||[]).filter(x=>x.schoolId===id).length;
  const staff=(DATA.users||[]).filter(u=>u.schoolId===id && u.role!=='superadmin');
  return {classes:c('classes'),streams:c('streams'),subjects:c('subjects'),students:c('students'),exams:c('exams'),
          teachers:staff.filter(u=>u.role==='teacher').length, admins:staff.filter(u=>u.role!=='teacher').length};
}
function requestDeleteSchool(id){
  if(!isSuperAdmin(CURRENT_USER)) return toast('Only a Super Admin can delete a school');
  const sch=schoolById(id); if(!sch) return;
  const n=schoolDeleteCounts(id);
  askDoubleConfirm({
    title:'Delete school',
    summary:`You are about to delete "${sch.name}" (${sch.code||'no code'}) and EVERYTHING in it:\n\n• ${n.students} learner(s)\n• ${n.exams} examination(s) with all marks\n• ${n.classes} class(es), ${n.streams} stream(s), ${n.subjects} subject(s)\n• ${n.admins} School Admin and ${n.teachers} teacher account(s), with their class access\n• the school's grading scale, settings and logo\n\nTo only stop the school signing in, use Suspend instead — that keeps all data.\nA backup of the whole platform is saved automatically before deleting.`,
    typeText:sch.name,
    yes:'Delete school permanently',
    onYes:()=>deleteSchoolCascade(id)
  });
}
function deleteSchoolCascade(id){
  if(!isSuperAdmin(CURRENT_USER)) return;
  const sch=schoolById(id); if(!sch) return;
  const n=schoolDeleteCounts(id);
  try{ createManualBackup('Before deleting '+sch.name); }
  catch(err){ toast('Could not save the safety backup, so nothing was deleted'); return; }
  const staffIds=new Set((DATA.users||[]).filter(u=>u.schoolId===id && u.role!=='superadmin').map(u=>u.id));
  ['students','exams','streams','subjects','classes'].forEach(k=>{ DATA[k]=(DATA[k]||[]).filter(x=>x.schoolId!==id); });
  DATA.teacherClassAccess=(DATA.teacherClassAccess||[]).filter(a=>a.schoolId!==id && !staffIds.has(a.teacherId));
  DATA.schoolClassSubs=(DATA.schoolClassSubs||[]).filter(r=>r.schoolId!==id);
  DATA.users=(DATA.users||[]).filter(u=>!staffIds.has(u.id));
  DATA.schools=(DATA.schools||[]).filter(x=>x.id!==id);
  if(CURRENT_SCHOOL_ID===id) CURRENT_SCHOOL_ID=null;
  if(window.__caSchool===id) window.__caSchool='';
  if(window.__scsSchool===id) window.__scsSchool='';
  audit('school_deleted',{schoolId:null,deletedSchoolId:id,name:sch.name,code:sch.code,counts:n});
  persistNow(); render(); toast('School "'+sch.name+'" deleted');
}

function modalStream(classId){

    <div class="modal-head"><h2>Add stream</h2><button class="x" data-close>✕</button></div>
    <div class="field"><label>Stream name</label><input id="m-stream-name" type="text" placeholder="e.g. East / Blue / A"></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-stream-save">Save</button></div>
  `);
  document.getElementById('m-stream-save').onclick=()=>{
    const name=document.getElementById('m-stream-name').value.trim();
    if(!name) return problem('The stream name is empty.','Type a name such as East, West or Blue, then press Save.','m-stream-name');
    if(scopedStreams().some(s=>s.classId===classId && normName(s.name)===normName(name))) return problem(`${(classById(classId)||{}).name||'This class'} already has a stream called “${name}”.`,'A stream name can be used only once in the same class. Type a different name, or Cancel if that stream is already what you want.','m-stream-name');

function modalSubject(existing){

      teacherInput.style.display=chk.checked?'':'none';
      if(!chk.checked) teacherInput.value='';
    });
  });
  document.getElementById('m-sub-save').onclick=()=>{
    const name=document.getElementById('m-sub-name').value.trim();

    }).join('');
  }

  document.getElementById('m-ex-class').onchange=onClassChange;

  }
  document.getElementById('m-ex-maxes').oninput=e=>{ if(e.target.dataset.mxs){ touched.add(e.target.dataset.mxs); maxState[e.target.dataset.mxs]=e.target.value; } };
  document.getElementById('m-ex-subjects').addEventListener('change',renderMaxes);

    if(existing){

      if(bad.length) return problem('Some marks already saved are higher than the new maximum for: '+bad.join(', ')+'.','Raise that subject\u2019s maximum, or correct the marks in Marks Entry first.',null);

    else { const nx={id:uid('exm'),schoolId:userSchoolId()||(classById(classId)||{}).schoolId,name,classId,streamId,term,year,outOf,maxBySubject,date,subjects,results:{},createdBy:CURRENT_USER.id,createdByName:CURRENT_USER.name,createdAt:nowIso}; DATA.exams.push(nx); audit('exam_created',{schoolId:nx.schoolId,examId:nx.id}); }
    persist(); closeModal(); render(); toast('Examination saved');

function marksTemplateRows(exam){
  const subjects=enterableSubjects(exam);
  const students=studentsForClass(exam.classId, exam.streamId).sort((a,b)=>a.name.localeCompare(b.name));
  const header=['Student Name','Class','Stream',...subjects.map(s=>s.name)];
  const rows=[header];
  exam.results=exam.results||{};
  students.forEach(st=>{
    const existing=exam.results[st.id]||{};
    rows.push([
      st.name,
      classById(exam.classId)?.name||'',
      st.streamId?(streamById(st.streamId)?.name||''):'',
      ...subjects.map(s=>{ const v=existing[s.id]; return v==null?'':v; })
    ]);
  });
  return rows;
}
function modalImportMarks(examId){
  const exam=examById(examId);
  if(!exam) return;
  const subjects=enterableSubjects(exam);
  const skippedSubjects=(exam.subjects||[]).map(subjectById).filter(Boolean).filter(s=>!canEnterSubject(s.id,exam.classId));
  const classStudents=studentsForClass(exam.classId, exam.streamId);
  if(!subjects.length || !classStudents.length){ toast('This examination needs subjects and students before importing'); return; }

  openModal(`
    <div class="modal-head"><h2>Import marks — ${esc(exam.name)}</h2><button class="x" data-close>✕</button></div>
    <p class="hint">Expected columns: <strong>Student Name, Class, Stream</strong>, then one column per subject — e.g. ${esc(subjects.slice(0,3).map(s=>s.name).join(' | '))}${subjects.length>3?' | …':''}. Class/Stream are shown for reference; marks are matched to students already recorded in ${esc(classById(exam.classId)?.name||'this class')}${exam.streamId?', '+esc(streamById(exam.streamId)?.name||''):''}.</p>
    <p class="hint">You can choose an Excel workbook (.xlsx) or a CSV file. Excel files are read from their first sheet, and the first row should hold the column headings. Everything is read on this device — no internet needed.</p>
    <div class="field"><label>Marks must be between 0 and each subject's maximum (${examMaxText(exam)}) — anything else is flagged as invalid.</label>
      <input type="file" id="m-imp-marks-file" accept=".xlsx,.xlsm,.csv,text/csv"></div>
    ${skippedSubjects.length?`<p class="hint">You teach ${esc(subjects.map(s=>s.name).join(', '))}. Columns for other subjects (${esc(skippedSubjects.map(s=>s.name).join(', '))}) are ignored.</p>`:''}
    <div id="imp-marks-preview"></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-imp-marks-go" disabled>Import valid marks</button></div>
  `, true);

  let parsed=null;

  function matchSubject(header){
    const norm=String(header||'').trim().toLowerCase();
    return subjects.find(s=>s.name.toLowerCase()===norm || (s.code&&s.code.toLowerCase()===norm));
  }
  function matchStudent(name){
    const hits=classStudents.filter(s=>normName(s.name)===normName(name));
    return hits.length===1 ? hits[0] : null;   // if two learners share a name, the teacher picks the right one in the preview
  }
  function validateCell(raw,sub){
    if(raw==null || String(raw).trim()===''){ return {value:null, status:'missing'}; }
    const n=Number(String(raw).trim());
    if(isNaN(n)) return {value:null, status:'invalid'};
    if(n<0 || n>maxFor(exam,sub.id)) return {value:null, status:'invalid'};
    return {value:n, status:'ok'};
  }
  function counts(){
    let ok=0, invalid=0, missing=0, unmatched=0;
    parsed.rows.forEach(r=>{
      if(!r.student) unmatched++;
      r.cells.forEach(c=>{
        if(c.status==='ok' && r.student) ok++;
        else if(c.status==='invalid') invalid++;
        else if(c.status==='missing') missing++;
      });
    });
    return {ok, invalid, missing, unmatched};
  }
  function renderPreview(){
    const box=document.getElementById('imp-marks-preview');
    box.innerHTML='';
    if(!parsed){ document.getElementById('m-imp-marks-go').disabled=true; return; }
    const c=counts();
    box.appendChild(el(`<div class="grid cols-4" style="margin:12px 0;">
      <div class="stat"><div class="n">${c.ok}</div><div class="l">Valid marks ready</div></div>
      <div class="stat"><div class="n">${c.invalid}</div><div class="l">Invalid marks</div></div>
      <div class="stat"><div class="n">${c.missing}</div><div class="l">Blank / missing</div></div>
      <div class="stat"><div class="n">${c.unmatched}</div><div class="l">Unmatched students</div></div>
    </div>`));
    if(c.unmatched){ box.appendChild(el(`<p class="hint" style="color:var(--danger);">Rows highlighted below need a student picked from the dropdown, or they will be skipped.</p>`)); }
    if(c.invalid){ box.appendChild(el(`<p class="hint" style="color:var(--danger);">Cells highlighted below are outside 0 – the subject’s maximum or not numbers — correct them here or leave blank to skip.</p>`)); }
    const tbl=el(`<table class="data"><thead><tr><th>Row</th><th>Student</th>${parsed.subjectCols.map(c=>`<th class="center">${esc(c.subject.name)}</th>`).join('')}</tr></thead><tbody></tbody></table>`);
    const tb=tbl.querySelector('tbody');
    parsed.rows.forEach((r,ri)=>{
      const tr=document.createElement('tr');
      let studentCell;
      if(r.student){
        studentCell=`<td>${esc(r.student.name)}</td>`;
      } else {
        studentCell=`<td style="background:var(--danger-soft);"><div class="small">"${esc(r.name)}" — not found</div>
          <select data-imp-remap="${ri}"><option value="">— skip this row —</option>${classStudents.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></td>`;
      }
      let rowHtml=studentCell;
      r.cells.forEach((cell,ci)=>{
        const bg = cell.status==='invalid' ? 'background:var(--danger-soft);' : '';
        rowHtml+=`<td class="center" style="${bg}"><input type="number" style="width:64px; text-align:center;" data-imp-row="${ri}" data-imp-cell="${ci}" value="${cell.raw==null?'':cell.raw}"></td>`;
      });
      tr.innerHTML=rowHtml;
      tb.appendChild(tr);
    });
    box.appendChild(tbl);
    document.getElementById('m-imp-marks-go').disabled = counts().ok===0;
    box.querySelectorAll('[data-imp-remap]').forEach(sel=>{
      sel.onchange=()=>{
        const ri=Number(sel.dataset.impRemap);
        parsed.rows[ri].student = sel.value ? classStudents.find(s=>s.id===sel.value) : null;
        renderPreview();
      };
    });
    box.querySelectorAll('[data-imp-row]').forEach(inp=>{
      inp.oninput=()=>{
        const ri=Number(inp.dataset.impRow), ci=Number(inp.dataset.impCell);
        const v=validateCell(inp.value,parsed.rows[ri].cells[ci].subject);
        parsed.rows[ri].cells[ci]={...parsed.rows[ri].cells[ci], raw:inp.value, value:v.value, status:v.status};
        inp.closest('td').style.background = v.status==='invalid' ? 'var(--danger-soft)' : '';
        document.getElementById('m-imp-marks-go').disabled = counts().ok===0;
      };
    });
  }

  document.getElementById('m-imp-marks-file').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    readCsvFile(f, rows=>{
      const header=rows[0];
      let subjectCols=[];
      header.forEach((h,idx)=>{ if(idx<3) return; const sub=matchSubject(h); if(sub) subjectCols.push({idx, subject:sub}); });
      if(!subjectCols.length){
        header.forEach((h,idx)=>{ if(idx===0) return; const sub=matchSubject(h); if(sub && !subjectCols.find(c=>c.idx===idx)) subjectCols.push({idx, subject:sub}); });
      }
      if(!subjectCols.length){
        parsed=null; document.getElementById('m-imp-marks-go').disabled=true; document.getElementById('imp-marks-preview').innerHTML='';
        return problem('None of the column headings match the subjects in this examination.',`Row 1 of the file must contain the subject names: ${subjects.map(x=>x.name).join(', ')}. The easiest way is to use "Download template (CSV)" on the Marks Entry page, fill it in, and import that file.`);
      }
      const dataRows=rows.slice(1).filter(r=>r[0]&&r[0].trim());
      if(!dataRows.length){
        parsed=null; document.getElementById('m-imp-marks-go').disabled=true; document.getElementById('imp-marks-preview').innerHTML='';
        return problem('The file has column headings but no learners underneath.','Add one learner per row — the name in column A, then their marks — and try again.');
      }
      const parsedRows=dataRows.map(r=>{
        const name=r[0].trim();
        const student=matchStudent(name);
        const cells=subjectCols.map(c=>{
          const raw=r[c.idx];
          const v=validateCell(raw,c.subject);
          return {subject:c.subject, raw: raw==null?'':raw, value:v.value, status:v.status};
        });
        return {name, student, cells};
      });
      parsed={rows:parsedRows, subjectCols};
      document.querySelectorAll('#modal-root .inline-error').forEach(x=>x.remove());
      renderPreview();
      const seenIds={}, dups=[];
      parsedRows.forEach(r=>{ if(!r.student) return; if(seenIds[r.student.id]) dups.push(r.name); seenIds[r.student.id]=1; });
      if(dups.length) problem(`These learners appear more than once in the file: ${[...new Set(dups)].join(', ')}.`,'Only the last row for each learner will be kept. Delete the extra rows and re-import if that is not what you want.');
    }, (what,fix)=>{
      parsed=null; document.getElementById('m-imp-marks-go').disabled=true; document.getElementById('imp-marks-preview').innerHTML='';
      problem(what,fix);
    });
  };

  document.getElementById('m-imp-marks-go').onclick=()=>{
    if(!parsed) return;
    exam.results=exam.results||{};
    let imported=0; const students=new Set();
    parsed.rows.forEach(r=>{
      if(!r.student) return;
      exam.results[r.student.id]=exam.results[r.student.id]||{};
      r.cells.forEach(c=>{
        if(c.status==='ok'){ exam.results[r.student.id][c.subject.id]=c.value; stampMarks(exam,c.subject.id,'file'); imported++; students.add(r.student.id); }
      });
    });
    persist(); closeModal();
    goto('marks',{examId:exam.id, mode:'grid'});
    toast(`${imported} mark(s) imported for ${students.size} student(s)`);
  };
}
function modalImportStudents(){
  openModal(`
    <div class="modal-head"><h2>Import students (Excel / CSV)</h2><button class="x" data-close>✕</button></div>
    <p class="hint">Columns: <strong>Name, Class, Stream</strong> (Stream optional). Class must be one of ${esc(classNamesText())}. Streams that don't exist yet will be created automatically.</p>
    <p class="hint">You can choose an Excel workbook (.xlsx) or a CSV file. Excel files are read from their first sheet, and the first row should hold the column headings. Everything is read on this device — no internet needed.</p>
    <div class="field"><input type="file" id="m-imp-file" accept=".xlsx,.xlsm,.csv,text/csv"></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-imp-go">Import</button></div>
  `);
  document.getElementById('m-imp-go').onclick=()=>{
    const f=document.getElementById('m-imp-file').files[0];
    readCsvFile(f, rows=>{
      let start=0;
      if(rows[0] && /name/i.test(rows[0][0]||'')) start=1;
      if(rows.length<=start) return problem('The file has column headings but no learners underneath.','Put one learner on each row — Name in column A, Class in column B, Stream in column C (optional) — save as CSV and try again.');
      let added=0; const issues=[], seen=new Set(), newStreams=[];
      for(let i=start;i<rows.length;i++){
        const [name,className,streamName]=rows[i]; const rowNo=i+1;
        if(!name||!name.trim()){ issues.push(`Row ${rowNo}: the name is empty`); continue; }
        const nm=name.trim();
        const norm=String(className||'').toLowerCase().replace(/[^a-z0-9]/g,'');
        const digits=String(className||'').replace(/\D/g,'');
        const cls=scopedClasses().find(c=>{
          const cn=c.name.toLowerCase().replace(/[^a-z0-9]/g,'');
          return cn===norm || (digits!=='' && c.name.replace(/\D/g,'')===digits);
        });
        if(!cls){ issues.push(`Row ${rowNo}: ${nm} — class “${(className||'').trim()||'(blank)'}” is not one of ${classNamesText()}`); continue; }
        let str=null;
        if(streamName && streamName.trim()){
          str=scopedStreams().find(x=>x.classId===cls.id && normName(x.name)===normName(streamName));
          if(!str){ str={id:uid('str'),classId:cls.id,name:streamName.trim().replace(/\s+/g,' ')}; newStreams.push(str); }
        }
        const key=normName(nm)+'|'+cls.id+'|'+(str?str.id:'');
        const exists=seen.has(key) || scopedStudents().some(x=>normName(x.name)===normName(nm) && x.classId===cls.id && (x.streamId||'')===(str?str.id:''));
        if(exists){ issues.push(`Row ${rowNo}: ${nm} is already in ${cls.name}${str?' '+str.name:''} — skipped`); continue; }
        seen.add(key);
        if(str && !scopedStreams().includes(str)) DATA.streams.push(str);
        DATA.students.push({id:uid('stu'),schoolId:userSchoolId()||cls.schoolId,name:nm.replace(/\s+/g,' '),classId:cls.id,streamId:str?str.id:''});
        added++;
      }
      if(!added){
        return problem('No learners were imported.',`Nothing in the file could be used. ${issues.slice(0,4).join('; ')}${issues.length>4?'; …':''}. Correct the file — Class must be one of ${classNamesText()} — and try again.`);
      }
      persist(); closeModal(); render();
      if(issues.length){
        showNotice(`${added} learner${added===1?'':'s'} imported — ${issues.length} row${issues.length===1?'':'s'} skipped`,
          `<p>The rows below were <strong>not</strong> imported.</p><ul class="notice-list">${issues.slice(0,50).map(x=>`<li>${esc(x)}</li>`).join('')}${issues.length>50?`<li>…and ${issues.length-50} more</li>`:''}</ul><p><strong>How to fix it:</strong> correct those rows in your file (or add the learners one by one with “Add student”) and import again. Learners already imported will be recognised and skipped, so nobody is added twice.</p>`);
      } else toast(added+' learner'+(added===1?'':'s')+' imported');
    }, (what,fix)=>problem(what,fix));
  };
}

  if(e.target.id==='cm-save'){
    const rows=[...document.querySelectorAll('#comment-table tbody tr')];
    const comments=rows.map(r=>{
      const maxRaw=r.querySelector('.cm-max').value;
      return {
        min:Number(r.querySelector('.cm-min').value),
        max:maxRaw===''?null:Number(maxRaw),
        text:r.querySelector('.cm-text').value.trim()
      };
    }).filter(b=>b.text);
    if(!comments.length) return toast('Add at least one comment band');
    for(const b of comments){
      if(b.max!=null && b.max<b.min) return toast('A comment band\'s maximum cannot be less than its minimum');
    }
    DATA.settings.comments=comments; persist(); toast('Teacher comments saved'); render();
    return;
  }
  if(e.target.classList && e.target.classList.contains('promo-all')){
    const on=e.target.dataset.on==='1';

    return;
  }
  if(e.target.dataset && e.target.dataset.restoreGrad){
    if(!(isSuperAdmin(CURRENT_USER)||isSchoolAdmin(CURRENT_USER))) return toast('Only a School Admin or Super Admin can do this');
    const st=studentById(e.target.dataset.restoreGrad);
    if(st){ st.graduated=false; delete st.graduationYear; persist(); render(); toast(st.name+' restored'); }
    return;
  }
  if(e.target.id==='promo-run'){
    if(!(isSuperAdmin(CURRENT_USER)||isSchoolAdmin(CURRENT_USER))) return toast('Only a School Admin or Super Admin can promote learners');
    const ids=[...document.querySelectorAll('.promo-stu:checked')].map(b=>b.value);
    if(!ids.length) return toast('No learners selected');
    const advance=document.getElementById('promo-advance').checked;
    const summary=scopedClasses().map(c=>{
      const n=ids.filter(id=>studentById(id)?.classId===c.id).length;
      const nx=nextClassOf(c.id);
      return n?`${c.name} → ${nx?nx.name:'Graduated'}: ${n}`:null;
    }).filter(Boolean).join('\n');
    askConfirm(`Promote ${ids.length} learner(s)?\n\n${summary}${advance?`\n\nThe school will move to Term 1, ${Number(DATA.settings.currentYear)+1}.`:''}\n\nA backup is saved first.`,()=>{
    createManualBackup(`Before promotion ${DATA.settings.currentYear}`);
    let noStream=0;
    ids.forEach(id=>{
      const st=studentById(id); if(!st) return;
      const nx=nextClassOf(st.classId);
      if(!nx){ st.graduated=true; st.graduationYear=DATA.settings.currentYear; return; }
      const oldName=(streamById(st.streamId)?.name||'').trim().toLowerCase();
      const match=oldName?streamsForClass(nx.id).find(x=>x.name.trim().toLowerCase()===oldName):null;
      st.classId=nx.id; st.streamId=match?match.id:'';
      if(oldName && !match) noStream++;
    });
    if(advance){ DATA.settings.currentYear=Number(DATA.settings.currentYear)+1; DATA.settings.currentTerm='Term 1'; }
    persist(); render();
    toast(`${ids.length} learner(s) promoted${noStream?` — ${noStream} need a stream assigned`:''}`);
    },{title:'Promote learners',yes:'Promote',danger:false});
    return;
  }
  if(e.target.id==='hm-handwrite'){
    DATA.settings.headCommentHandwritten=e.target.checked; persist(); render();
    toast(e.target.checked?'Head teacher comment will be left for handwriting':'Head teacher comment will be filled from the ranges');
    return;
  }
  if(e.target.id==='hm-add'){
    const tb=document.querySelector('#head-comment-table tbody');
    tb.appendChild(el(`<tr>
      <td><input type="number" class="hm-min" value="0" style="width:70px"></td>
      <td><input type="number" class="hm-max" value="" style="width:70px"></td>
      <td><input type="text" class="hm-text" value="" style="width:100%; min-width:220px;" placeholder="e.g. Commendable effort. Keep it up."></td>
      <td><button class="btn ghost sm hm-del">Remove</button></td>
    </tr>`));
    return;
  }
  if(e.target.closest('.hm-del')){ e.target.closest('tr').remove(); return; }
  if(e.target.id==='hm-save'){
    const rows=[...document.querySelectorAll('#head-comment-table tbody tr')];
    const bands=rows.map(r=>{
      const maxRaw=r.querySelector('.hm-max').value;
      return { min:Number(r.querySelector('.hm-min').value), max:maxRaw===''?null:Number(maxRaw), text:r.querySelector('.hm-text').value.trim() };
    }).filter(b=>b.text);
    if(!bands.length) return toast('Add at least one head teacher comment band');
    for(const b of bands){ if(b.max!=null && b.max<b.min) return toast('A comment band\'s maximum cannot be less than its minimum'); }
    DATA.settings.headComments=bands; persist(); toast('Head teacher comments saved'); render();
    return;
  }
  if(e.target.id==='td-save'){
    DATA.settings.termDates=DATA.settings.termDates||{};
    document.querySelectorAll('#term-dates-table tbody tr').forEach(r=>{
      DATA.settings.termDates[DATA.settings.currentYear+'|'+r.dataset.term]={closing:r.querySelector('.td-closing').value, opening:r.querySelector('.td-opening').value};
    });
    persist(); toast('Term dates saved');
    return;
  }
  if(e.target.id==='save-school'){
    const isCTOnly = isTeacher(CURRENT_USER) && isClassTeacher(CURRENT_USER);
    DATA.settings.motto=document.getElementById('f-motto').value.trim();
    if(!isCTOnly){
      DATA.settings.schoolName=document.getElementById('f-name').value.trim()||'Your School Name';
      DATA.settings.headTeacher=document.getElementById('f-head').value.trim();
      DATA.settings.currentYear=Number(document.getElementById('f-year').value)||new Date().getFullYear();
      DATA.settings.currentTerm=document.getElementById('f-term').value;
    }
    persist(); render(); toast('School details saved');
    return;
  }
  if(e.target.id==='remove-logo'){
    if(!(isSuperAdmin(CURRENT_USER)||isSchoolAdmin(CURRENT_USER)||isClassTeacher(CURRENT_USER))) return;
    DATA.settings.logo=''; persist(); render(); toast('Logo removed');
    return;
  }

  if(e.target.id==='print-classsheet'){
    const exam=examById(STATE.params.examId); const stats=computeExamStats(exam);
    previewReport('Class Report — '+exam.name, buildClassSheetHTML(exam,stats));
    return;
  }
  if(e.target.id==='print-examreport'){
    const exam=examById(STATE.params.examId);
    previewReport('Examination Analysis Report — '+exam.name, buildExaminationAnalysisReportHTML(exam));
    return;
  }
  if(e.target.id==='print-subjectreport'){
    const exam=examById(STATE.params.examId);
    const subjectId=STATE.params.subjectId;
    if(!subjectId) return toast('Choose a subject');
    previewReport('Subject Analysis Report — '+(subjectById(subjectId)?.name||''), buildSubjectAnalysisReportHTML(exam,subjectId));
    return;
  }
  if(e.target.id==='print-all-reports' || e.target.id==='download-all-reports'){
    const exam=examById(STATE.params.examId); const stats=computeExamStats(exam);
    if(!stats.studentRows.length) return toast('No learners in this class');
    const clsName=(classById(exam.classId)?.name||'Class')+(exam.streamId?' '+(streamById(exam.streamId)?.name||''):'');
    const html=buildAllReportCardsHTML(exam,stats);
    if(e.target.id==='print-all-reports'){ previewReport('All report cards — '+clsName, html); return; }
    downloadReportPdf(html,'Report cards - '+clsName+' - '+exam.name+' '+exam.term+' '+exam.year);
    return;
  }
  if(e.target.id==='print-report'){
    const exam=examById(STATE.params.examId); const stats=computeExamStats(exam);
    const sid=document.getElementById('rep-student-select').value;
    if(!sid) return toast('Choose a student');
    const box=document.getElementById('rep-comment');
    const comment = box ? box.value : undefined;
    previewReport('Student Report — '+(studentById(sid)?.name||''), `<div class="pb">${buildReportCardHTML(exam,stats,sid,comment)}</div>`);
    return;
  }
  if(e.target.id==='preview-pdf'){ if(PENDING_PRINT_HTML) downloadReportPdf(PENDING_PRINT_HTML,PENDING_TITLE); return; }
  if(e.target.id==='preview-print'){
    if(PENDING_PRINT_HTML){ printHTML(PENDING_PRINT_HTML); }
    closeModal();
    return;
  }
  if(e.target.id==='export-csv'){
    const exam=examById(STATE.params.examId); const stats=computeExamStats(exam);
    const subjects=exam.subjects.map(subjectById).filter(Boolean);
    const header=[...(rankingOn()?['Position']:[]),'Name',...subjects.map(s=>s.name),'Mean %','Mean Grade'];
    const rows=[header];
    orderedStudentRows(stats).forEach(r=>{
      const line=[...(rankingOn()?[r.position]:[]), r.student.name];
      subjects.forEach(sub=>{ const v=exam.results[r.student.id]?.[sub.id]; line.push(v==null?'':v); });
      line.push(round1(r.meanPct), meanGradeOfRow(r).grade);
      rows.push(line);
    });
    downloadFile(exam.name.replace(/[^a-z0-9]+/gi,'_')+'_results.csv', toCSV(rows), 'text/csv');
    return;
  }

  if(e.target.id==='load-demo'){ loadDemoData(); return; }
  if(e.target.id==='clear-demo'){ clearDemoData(); return; }
  if(e.target.id==='export-sql'){
    const r=buildSqlDump();
    downloadFile('cbe_school_database_'+new Date().toISOString().slice(0,10)+'.sql', r.sql, 'application/sql');
    const sk=r.skipped.marks+r.skipped.students;
    toast(sk?`Database exported — ${sk} unusable record(s) left out`:'Database exported', sk?'warn':'success');
    return;
  }
  if(e.target.id==='export-schema'){
    downloadFile('cbe_school_schema.sql', SCHEMA_SQL, 'application/sql');
    toast('Schema downloaded');
    return;
  }
  if(e.target.id==='export-json'){
    downloadFile('cbe_school_backup_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(DATA,null,2), 'application/json');
    toast('Backup downloaded');
    return;
  }
  if(e.target.id==='create-backup'){ modalCreateBackup(); return; }
  if(e.target.closest('[data-export-backup]')){
    const b=backupById(e.target.closest('[data-export-backup]').dataset.exportBackup);
    if(!b) return;
    downloadFile('cbe_school_backup_'+b.createdAt.slice(0,10)+'_'+b.label.replace(/[^a-z0-9]+/gi,'_')+'.json', JSON.stringify(b.data,null,2), 'application/json');
    toast('Backup downloaded');
    return;
  }
  if(e.target.closest('[data-restore-backup]')){
    if(!isSuperAdmin(CURRENT_USER)) return toast('Only a super admin can restore a backup');
    const b=backupById(e.target.closest('[data-restore-backup]').dataset.restoreBackup);
    if(!b) return;
    modalConfirmRestore(b.label+' ('+fmtDateTime(b.createdAt)+')', ()=>{
      applyRestoredData(JSON.parse(JSON.stringify(b.data)));
    });
    return;
  }
  if(e.target.closest('[data-del-backup]')){
    if(!isSuperAdmin(CURRENT_USER)) return toast('Only a super admin can delete a backup');
    const id=e.target.closest('[data-del-backup]').dataset.delBackup;
    const b=backupById(id);
    if(b) askConfirm('Delete the backup "'+b.label+'"? This only removes the saved copy — it will not affect current data.',()=>{
      deleteBackupById(id); render(); toast('Backup deleted');
    },{title:'Delete backup',yes:'Delete backup'});
    return;
  }
  if(e.target.id==='erase-all'){
    if(!isSuperAdmin(CURRENT_USER)) return toast('Only a super admin can erase all data');
    askConfirm('This will permanently erase ALL data in Supabase — for every device and user — including staff accounts. Continue?',()=>{
      askConfirm('Are you absolutely sure? This cannot be undone.',()=>{
        const me=CURRENT_USER; DATA=blankData(); DATA.users=[me];
        persist(); render(); toast('All data erased');
      },{title:'Final warning',yes:'Erase everything'});
    },{title:'Erase all data',yes:'Continue'});
    return;
  }
});

document.addEventListener('change',(e)=>{
  if(e.target.id==='filt-class'){ goto('students',{...STATE.params, classId:e.target.value||null, streamId:null}); return; }
  if(e.target.id==='filt-stream'){ goto('students',{...STATE.params, streamId:e.target.value||null}); return; }
  if(e.target.id==='marks-exam-select'){ goto('marks',{examId:e.target.value||null}); return; }
  if(e.target.id==='mk-sort'){ goto('marks',{...STATE.params, sort:e.target.value}); return; }
  if(e.target.id==='mk-subject-select'){ goto('marks',{...STATE.params, subjectId:e.target.value||null}); return; }
  if(e.target.id==='mk-student-select'){ goto('marks',{...STATE.params, studentId:e.target.value||null}); return; }
  if(e.target.id==='mk-subject-filter'){
    const shown=new Set([...e.target.selectedOptions].map(o=>o.value));
    const hideSubjects=[...e.target.options].map(o=>o.value).filter(id=>!shown.has(id));
    goto('marks',{...STATE.params, hideSubjects}); return;
  }
  if(e.target.id==='an-class-select'){ goto('analysis',{classId:e.target.value||null, streamId:null, examId:null}); return; }
  if(e.target.id==='an-stream-select'){
    const classId=document.getElementById('an-class-select').value||null;
    goto('analysis',{classId, streamId:e.target.value||null, examId:null}); return;
  }
  if(e.target.id==='an-exam-select'){
    const classId=document.getElementById('an-class-select').value||null;
    const streamId=document.getElementById('an-stream-select').value||null;
    goto('analysis',{classId, streamId, examId:e.target.value||null}); return;
  }
  if(e.target.id==='sa-subject-select'){ goto('subjectAnalysis',{subjectId:e.target.value||null, examId:null}); return; }
  if(e.target.id==='sa-exam-select'){
    const subjectId=document.getElementById('sa-subject-select').value||null;
    goto('subjectAnalysis',{subjectId, examId:e.target.value||null}); return;
  }
  if(e.target.id==='rep-exam-select'){ goto('reports',{examId:e.target.value||null}); return; }
  if(e.target.id==='rep-subject-select'){ gotoKeep('reports',{...STATE.params, subjectId:e.target.value||null}); return; }
  if(e.target.id==='rep-student-select'){ gotoKeep('reports',{...STATE.params, studentId:e.target.value||null}); return; }
  if(e.target.id==='f-ranking'){
    if(!(isSuperAdmin(CURRENT_USER)||isSchoolAdmin(CURRENT_USER))){ e.target.checked=rankingOn(); return toast('Only an administrator can change ranking'); }
    DATA.settings.rankingEnabled=e.target.checked; persist();
    if(!DATA.settings.rankingEnabled && STATE.view==='ranking') STATE.view='school';
    render(); toast(DATA.settings.rankingEnabled?'Ranking enabled':'Ranking disabled');
    return;
  }
  if(e.target.dataset && e.target.dataset.cmpf){
    const k=e.target.dataset.cmpf, p={...STATE.params, ids:undefined, base:null};
    p[k]=e.target.value||null; if(k==='classId') p.streamId=null;
    gotoKeep('compare',p); return;
  }
  if(e.target.classList && e.target.classList.contains('cmp-chk')){
    const ids=[...document.querySelectorAll('.cmp-chk:checked')].map(c=>c.value);
    gotoKeep('compare',{...STATE.params, ids}); return;
  }
  if(e.target.id==='cmp-base'){ gotoKeep('compare',{...STATE.params, base:e.target.value}); return; }
  if(e.target.dataset && e.target.dataset.rkparam){
    const k=e.target.dataset.rkparam, p={...STATE.params};
    p[k]=e.target.value||null;
    if(k==='examId'){ p.subjectId=null; p.streamId=null; }
    gotoKeep('ranking',p); return;
  }
  if(e.target.id==='f-logo'){
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=200;
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        DATA.settings.logo=canvas.toDataURL('image/png');
        persist(); render(); toast('Logo updated');
      };
      img.onerror=()=>toast('Could not read that image');
      img.src=String(reader.result);
    };
    reader.readAsDataURL(f);
    return;
  }
  if(e.target.id==='import-json'){
    if(!isSuperAdmin(CURRENT_USER)) return toast('Only a super admin can restore a backup');
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const txt=String(reader.result||'');
      e.target.value='';
      if(!txt.trim()) return problem(`"${f.name}" is empty.`,'Choose a backup that was created with Export backup. Nothing on this device has been changed.',null,'Backup file problem');
      let parsed;
      try{ parsed=JSON.parse(txt); }
      catch(err){ return problem(`"${f.name}" cannot be read as an CBE.School backup. The file is damaged, or it was not made by CBE.School${/\.(xlsx?|csv)$/i.test(f.name)?' (spreadsheets and CSV files are not backups)':''}.`,'Use a file created with Export backup — it ends in .json. If you have another copy of the backup, try that one. Nothing on this device has been changed.',null,'Backup file problem'); }
      const why=validateBackup(parsed);
      if(why) return problem(`"${f.name}" is not a complete CBE.School backup: ${why}.`,'Use a file created with Export backup. Nothing on this device has been changed.',null,'Backup file problem');
      modalConfirmRestore(f.name, ()=>{ applyRestoredData(parsed); });
    };
    reader.onerror=()=>problem(`CBE.School could not open "${f.name}".`,'Make sure the file is not open in another program, then try again.',null,'Backup file problem');
    reader.readAsText(f);
    return;
  }
  const mkS=e.target.closest('[data-mk-student]');
  if(mkS){
    const exam=examById(STATE.params.examId); if(!exam) return;
    const studentId=mkS.dataset.mkStudent, subjectId=mkS.dataset.mkSubject;
    if(!canEnterSubject(subjectId,exam.classId)){ toast('You can only enter marks for the subjects you teach, or for a class you have paid for.','error'); return; }
    if(mkS.validity && mkS.validity.badInput){
      mkS.classList.add('bad-mark');
      toast('That is not a number. Type digits only, for example 67, or leave the box blank if the learner missed this paper.','error');
      return;
    }
    let v=mkS.value===''?null:Number(mkS.value);
    if(v!=null && (v<0 || v>maxFor(exam,subjectId))){
      mkS.classList.add('bad-mark');
      toast(`${mkS.value} is not allowed. Marks for “${exam.name}” must be between 0 and ${maxFor(exam,subjectId)}. Correct the red box — nothing was saved for it.`,'error');
      return;
    }
    mkS.classList.remove('bad-mark');
    exam.results=exam.results||{}; exam.results[studentId]=exam.results[studentId]||{};
    exam.results[studentId][subjectId]=v; stampMarks(exam,subjectId,'manual');
    MARKS_DIRTY.add(markKey(exam.id,studentId,subjectId)); updateSaveBar();
    // update row total/mean without full re-render (grid mode only has these cells)
    const row=mkS.closest('tr');
    const inputs=[...row.querySelectorAll('input[data-mk-subject]')];
    let total=0,cnt=0;
    inputs.forEach(inp=>{ if(inp.value!=='' && !inp.classList.contains('bad-mark')){ total+=Number(inp.value); cnt++; } });
    const totalCell=row.querySelector('.total-cell'), meanCell=row.querySelector('.mean-cell');
    if(totalCell) totalCell.textContent= cnt?total:'—';
    if(meanCell) meanCell.textContent= cnt? round1(total/cnt):'—';
    return;
  }
});

    const exam=examById(STATE.params.examId), sid=STATE.params.studentId;
    if(exam && sid){ exam.comments=exam.comments||{}; exam.comments[sid]=e.target.value; persist(); }

function printDocHTML(innerHtml,title){
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title||'CBE.School — Print')}</title>
    <style>

// Each report page is drawn to an image and packed into a small PDF built right here, so it works offline.
async function renderHTMLToCanvas(html,width,minH,scale){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-99999px;top:0;width:'+width+'px;';
  host.innerHTML=`<div><style>${DOC_CSS}</style><div style="width:${width}px;box-sizing:border-box;padding:36px;background:#fff;color:#111;font-family:Georgia,serif;font-size:13px;">${html}</div></div>`;
  document.body.appendChild(host);
  const inner=host.querySelector('div > div'), hh=Math.max(minH,inner.scrollHeight);
  inner.style.minHeight=hh+'px';
  const xml=new XMLSerializer().serializeToString(host.firstElementChild);
  host.remove();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${hh}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((ok,bad)=>{ img.onload=ok; img.onerror=()=>bad(new Error('render')); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
  const c=document.createElement('canvas'); c.width=Math.round(width*scale); c.height=Math.round(hh*scale);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c;
}
function buildPdf(pages){
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); chunks.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(n+' 0 obj\n'); fn(); push('\nendobj\n'); };
  const N=pages.length;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Count '+N+' /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
  pages.forEach((p,i)=>{
    const pn=3+3*i, cn=pn+1, im=pn+2;
    const s=Math.min(p.pw/p.w,p.ph/p.h), dw=p.w*s, dh=p.h*s, x=(p.pw-dw)/2, y=p.ph-dh;
    obj(pn,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pw.toFixed(2)} ${p.ph.toFixed(2)}] /Contents ${cn} 0 R /Resources << /XObject << /Im0 ${im} 0 R >> >> >>`));
    const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
    obj(cn,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(im,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`); push(p.jpeg); push('\nendstream'); });
  });
  const xref=len, total=3*N+3;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let n=1;n<total;n++) push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}

async function downloadReportPdf(html,title){
  toast('Preparing PDF…');
  try{
    const land=html.includes('data-landscape');
    const W=land?1123:794, H=land?794:1123, pw=land?841.89:595.28, ph=land?595.28:841.89, S=1.5;
    const tmp=document.createElement('div'); tmp.innerHTML=html;
    const pbs=[...tmp.children].filter(c=>c.classList&&c.classList.contains('pb'));
    const pages=[];
    const add=(c)=>{ const url=c.toDataURL('image/jpeg',0.9), bin=atob(url.split(',')[1]), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); pages.push({jpeg:u,url,w:c.width,h:c.height,pw,ph}); };
    if(pbs.length){ for(const pb of pbs){ add(await renderHTMLToCanvas(pb.innerHTML,W,H,S)); await new Promise(r=>setTimeout(r,0)); } }
    else{
      const c=await renderHTMLToCanvas(html,W,H,S), sh=Math.round(H*S);
      for(let y=0;y<c.height;y+=sh){
        const pc=document.createElement('canvas'); pc.width=c.width; pc.height=sh;
        const x=pc.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,pc.width,sh);
        x.drawImage(c,0,y,c.width,Math.min(sh,c.height-y),0,0,c.width,Math.min(sh,c.height-y)); add(pc);
      }
    }
    showPdfReady(buildPdf(pages),(title||'CBE.School report').replace(/[\\/:*?"<>|]+/g,'').trim()+'.pdf',pages.length,pages.map(x=>x.url));
  }catch(err){
    console.error(err);

  }
}

// ---- Excel (.xlsx) reader: built in, works offline (no add-on needed) ----
async function inflateRaw(bytes){
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzipEntries(buf,wanted){
  const u8=new Uint8Array(buf), dv=new DataView(buf), td=new TextDecoder();
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not a zip file');
  const count=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const out={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('damaged zip directory');
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));
    p+=46+nlen+elen+clen;
    if(!wanted(name)) continue;
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    const data=u8.subarray(start,start+csize);
    out[name]= method===0 ? data : await inflateRaw(data);
  }
  return out;
}
async function readXlsxRows(buf){
  if(typeof DecompressionStream==='undefined') throw new Error('nodecomp');
  const files=await unzipEntries(buf,n=>n==='xl/workbook.xml'||n==='xl/_rels/workbook.xml.rels'||n==='xl/sharedStrings.xml'||/^xl\/worksheets\/[^\/]+\.xml$/.test(n));
  if(!files['xl/workbook.xml']) throw new Error('not an xlsx workbook');
  const td=new TextDecoder(), parse=b=>new DOMParser().parseFromString(td.decode(b),'application/xml');
  const q=(node,name)=>[...node.getElementsByTagNameNS('*',name)];
  let sheetPath=null;
  const first=q(parse(files['xl/workbook.xml']),'sheet')[0];
  if(first && files['xl/_rels/workbook.xml.rels']){
    const rid=first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const rel=q(parse(files['xl/_rels/workbook.xml.rels']),'Relationship').find(r=>r.getAttribute('Id')===rid);
    if(rel){ const t=rel.getAttribute('Target')||''; sheetPath=t.startsWith('/')?t.slice(1):'xl/'+t; }
  }
  if(!sheetPath || !files[sheetPath]) sheetPath=Object.keys(files).filter(n=>n.startsWith('xl/worksheets/')).sort()[0];
  if(!sheetPath) throw new Error('no worksheet');
  const shared=[];
  if(files['xl/sharedStrings.xml']) q(parse(files['xl/sharedStrings.xml']),'si').forEach(si=>shared.push(q(si,'t').filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')));
  const sheet=parse(files[sheetPath]);
  if(sheet.getElementsByTagName('parsererror').length) throw new Error('damaged worksheet');
  const colIdx=ref=>{ const m=/^([A-Z]+)/.exec(ref||''); if(!m) return -1; let n=0; for(const ch of m[1]) n=n*26+ch.charCodeAt(0)-64; return n-1; };
  const rows=[];
  q(sheet,'row').forEach(r=>{
    const row=[]; let next=0;
    q(r,'c').forEach(c=>{
      let ci=colIdx(c.getAttribute('r')); if(ci<0) ci=next; next=ci+1;
      const t=c.getAttribute('t'), vEl=q(c,'v')[0]; let val='';
      if(t==='s') val=shared[Number(vEl?vEl.textContent:-1)]||'';
      else if(t==='inlineStr') val=q(c,'t').map(x=>x.textContent).join('');
      else if(t==='e') val='';
      else if(t==='b') val=(vEl&&vEl.textContent==='1')?'TRUE':'FALSE';
      else { val=vEl?vEl.textContent:''; if(/^-?\d*\.\d{10,}$/.test(val)) val=String(parseFloat(Number(val).toPrecision(12))); }
      row[ci]=String(val).trim();
    });
    for(let i=0;i<row.length;i++) if(row[i]===undefined) row[i]='';
    rows.push(row);
  });
  return rows.filter(r=>r.some(c=>c!==''));
}
// Reads an Excel (.xlsx) or CSV file safely. Calls onRows(rows) when usable, otherwise onFail(what, fix).
function readCsvFile(file,onRows,onFail){
  if(!file) return onFail('No file has been chosen.','Click "Choose file", pick your Excel or CSV file, then press the button again.');
  const nm=(file.name||'').toLowerCase();
  const isX=/\.(xlsx|xlsm)$/.test(nm);
  if(/\.(xls|xlsb|ods|numbers)$/.test(nm)) return onFail(`"${file.name}" is an older or different spreadsheet format that CBE.School cannot open.`,'Open it in Excel, choose File → Save As, and pick "Excel Workbook (.xlsx)" or "CSV (Comma delimited)". Then choose the new file here.');
  if(!isX && !/\.(csv|txt|tsv)$/.test(nm)) return onFail(`"${file.name}" is not an Excel or CSV file.`,'Choose a file ending in .xlsx or .csv.');
  if(file.size===0) return onFail(`"${file.name}" is empty.`,'Open the file, check the information is there, save it and try again.');
  if(file.size>(isX?10:5)*1024*1024) return onFail(`"${file.name}" is unusually large (${fmtBytes(file.size)}) for a class list or marks sheet.`,'Check you chose the right file. A list of learners or marks is normally well under 1 MB.');
  const finish=rows=>{
    rows=(rows||[]).filter(r=>r.some(c=>String(c).trim()!==''));
    if(!rows.length) return onFail(`"${file.name}" has no rows of information.`,'The first row should hold column headings, with one learner (or one set of marks) per row underneath. For Excel files, CBE.School reads the first sheet.');
    if(rows.some(r=>r.length>60)) return onFail(`"${file.name}" has far too many columns to be a class list or marks sheet.`,'Check you chose the right file, and that commas inside names or comments are inside quotation marks.');
    onRows(rows);
  };
  const reader=new FileReader();
  reader.onerror=()=>onFail(`CBE.School could not read "${file.name}".`,'If the file is open in Excel, close it and try again. If it still fails, save a fresh copy and try again.');
  if(isX){
    reader.onload=()=>{
      readXlsxRows(reader.result).then(finish).catch(err=>{
        if(err && err.message==='nodecomp') return onFail('This browser is too old to read Excel files directly.','Open the file in Excel, choose File → Save As → "CSV (Comma delimited)", and choose that .csv file instead.');
        onFail(`"${file.name}" could not be opened as an Excel workbook. It may be damaged, password-protected, or not really an .xlsx file.`,'Open it in Excel. If it opens normally, remove any password and use File → Save As → "Excel Workbook (.xlsx)" (or "CSV (Comma delimited)"), then choose the new file.');
      });
    };
    reader.readAsArrayBuffer(file);
    return;
  }
  reader.onload=()=>{
    let text=String(reader.result||'');
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const bad=(text.match(/\uFFFD/g)||[]).length;
    if(text.indexOf('\u0000')>=0 || text.slice(0,4)==='PK\u0003\u0004' || bad>Math.max(5,text.length*0.02))
      return onFail(`"${file.name}" does not look like a plain CSV file. It may be damaged, or it may be an Excel file that was only renamed to .csv.`,'Open the original in Excel, choose File → Save As → "CSV (Comma delimited)", and use the new file.');
    let rows;
    try{ rows=parseCSV(text); }catch(err){ return onFail(`"${file.name}" could not be read as a table.`,'Save it again as "CSV (Comma delimited)" and try again.'); }
    finish(rows);
  };
  reader.readAsText(file);
}
function validateScale(scale){
  if(!scale.length) return {what:'There are no grade bands to save.',fix:'Add at least one band with a grade name (for example EE1), its minimum and maximum mark, and its points.'};
  const seen=new Set();
  for(const g of scale){
    const k=g.grade.toLowerCase();
    if(seen.has(k)) return {what:`The grade "${g.grade}" appears more than once.`,fix:'Each grade name can be used only once. Rename or remove the duplicate row.'};
    seen.add(k);
    if(!isFinite(g.min) || (g.max!=null && !isFinite(g.max))) return {what:`"${g.grade}" has a minimum or maximum mark that is not a number.`,fix:'Type numbers from 0 to 100 in the Min % and Max % boxes.'};
    if(g.min<0 || g.min>100 || (g.max!=null && (g.max<0 || g.max>100))) return {what:`"${g.grade}" has a mark outside the range 0–100.`,fix:'Grade ranges are percentages, so use numbers from 0 to 100 only.'};
    if(g.max!=null && g.max<g.min) return {what:`For "${g.grade}", the maximum (${g.max}) is lower than the minimum (${g.min}).`,fix:'Swap the two numbers, or correct the one that was mistyped.'};
    if(!isFinite(g.points)) return {what:`"${g.grade}" has no points value.`,fix:'Type the points for this grade (for example 8 for the top level). Points are used to work out mean grades.'};
  }
  const sorted=[...scale].sort((a,b)=>a.min-b.min);
  for(let i=1;i<sorted.length;i++){
    const a=sorted[i-1], b=sorted[i], aMax=a.max!=null?a.max:100;
    if(b.min<=aMax) return {what:`"${a.grade}" (${a.min}–${aMax}) overlaps with "${b.grade}" (${b.min}–${b.max!=null?b.max:100}).`,fix:`A mark can belong to only one grade. Lower the maximum of "${a.grade}" to below ${b.min}, or raise the minimum of "${b.grade}".`};
  }
  return null;
}
function scaleWarnings(scale){
  const sorted=[...scale].sort((a,b)=>a.min-b.min), notes=[];
  if(sorted[0].min>0) notes.push(`marks below ${sorted[0].min}% have no band of their own`);
  for(let i=1;i<sorted.length;i++){
    const aMax=sorted[i-1].max!=null?sorted[i-1].max:100;
    if(sorted[i].min-aMax>1) notes.push(`marks between ${aMax} and ${sorted[i].min} are not covered`);
  }
  return notes.join('; ');
}
function missingMarksInfo(exam){
  const subs=(exam.subjects||[]).filter(id=>subjectById(id));
  const stus=examStudents(exam);
  let cells=0, people=0;
  stus.forEach(st=>{
    const row=(exam.results&&exam.results[st.id])||{}; let m=0;
    subs.forEach(id=>{ const v=row[id]; if(v==null||v==='') m++; });
    if(m){ cells+=m; people++; }
  });
  return {cells,people,total:stus.length*subs.length};
}

  const n=(err&&err.name)||'';
  let what, fix;
  if(n==='QuotaExceededError'){ what='Your latest changes could not be saved because this device has run out of storage space.'; fix='Go to Backup & Restore and press Export backup now to keep a safe copy. Then delete old backups on that page and free some space on the device.'; }
  else if(n==='Unavailable'){ what='CBE.School could not reach its cloud storage, so your work is only kept until this page is closed.'; fix='Check your internet connection and reload the page. Meanwhile, use Backup & Restore → Export backup to keep a copy of your work.'; }
  else if(err&&(err.code==='42501'||/row-level security|permission|not allowed|only the platform owner/i.test(String(err.message||'')))){ what='That change was not saved because your account does not have permission for it.'; fix='Sign out and sign in again. If you were just invited to a class, the Class Teacher can confirm your invitation.'; }
  else { what='Something went wrong while saving your changes on this device.'; fix='Your work is still on the screen. Go to Backup & Restore, press Export backup now, then reload the page. If it keeps happening, ask whoever supports CBE.School at your school.'; }
  problem(what,fix,null,'Could not save');
}
function safeSave(key,val){
  if(!IS_PLATFORM_ADMIN) return;   // only the platform owner may write the owner-only rows
  if(!dbHandle){ reportDbError({name:'Unavailable'}); return; }
  try{ dbSet(key,val).catch(reportDbError); }catch(err){ reportDbError(err); }
}

// Repairs damaged saved data instead of crashing. Returns how many problems were fixed.
function repairData(){
  let fixed=0;
  if(!DATA || typeof DATA!=='object' || Array.isArray(DATA)){ DATA=blankData(); return 1; }
  ['classes','streams','subjects','students','exams','users','teacherClassAccess','schoolClassSubs','schools','auditLogs'].forEach(k=>{
    if(!Array.isArray(DATA[k])){ DATA[k]=(k==='classes')?classesForSection('junior'):[]; fixed++; }
    else { const n=DATA[k].length; DATA[k]=DATA[k].filter(x=>x&&typeof x==='object'&&x.id); fixed+=n-DATA[k].length; }
  });
  if(!DATA.settings || typeof DATA.settings!=='object'){ DATA.settings=blankData().settings; fixed++; }
  if(!Array.isArray(DATA.settings.scale)){ DATA.settings.scale=[]; fixed++; }
  if(!SECTIONS[DATA.settings.section]) DATA.settings.section='junior';   // saved data from before Primary support was Junior School
  syncClassesToSection();
  if(!DATA.settings.termDates || typeof DATA.settings.termDates!=='object') DATA.settings.termDates={};
  scopedExams().forEach(e=>{
    if(!e.results || typeof e.results!=='object'){ e.results={}; fixed++; }
    if(!Array.isArray(e.subjects)){ e.subjects=[]; fixed++; }
  });
  (DATA.users||[]).forEach(u=>{
    if(u.role!=='teacher' || u.classSubjects) return;
    const hadAllSubjects=u.allSubjects===true, hadAllClasses=u.allClasses===true;
    const oldSubjectIds=Array.isArray(u.subjectIds)?u.subjectIds:[];
    const oldClassIds=Array.isArray(u.classIds)?u.classIds:[];
    if(hadAllSubjects && hadAllClasses){ u.classSubjects={}; fixed++; return; }
    const classIdsToUse = hadAllClasses ? (DATA.classes||[]).filter(c=>c.schoolId===u.schoolId).map(c=>c.id) : oldClassIds;
    const cs={};
    classIdsToUse.forEach(cid=>{
      if(hadAllSubjects) cs[cid]={all:true};
      else if(oldSubjectIds.length) cs[cid]={all:false, subjects:oldSubjectIds.slice()};
    });
    u.classSubjects=cs;
    u.allSubjects=false; u.allClasses=false;
    fixed++;
  });
  return fixed;
}
function validateBackup(o){
  if(!o || typeof o!=='object' || Array.isArray(o)) return 'it does not contain a school database';
  const need=['settings','classes','streams','subjects','students','exams'];
  const miss=need.filter(k=>o[k]==null);
  if(miss.length) return 'these parts are missing: '+miss.join(', ');
  if(['classes','streams','subjects','students','exams'].some(k=>!Array.isArray(o[k]))) return 'some of its lists are damaged';
  return null;
}
