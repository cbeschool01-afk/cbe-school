  if(!allTeachers.length){
    wrap.appendChild(el(`<div class="empty"><h3>No teacher accounts yet</h3><p>Create teachers under Staff Accounts first, then grant them class access here.</p></div>`));
    return wrap;
  }

  // ---- Teachers granted class access (overview, filterable by school)
  const schoolFilter=window.__caSchool||'';
  const teachers=schoolFilter?allTeachers.filter(t=>t.schoolId===schoolFilter):allTeachers;
  const grantedTeachers=teachers.filter(t=>records.some(a=>a.teacherId===t.id && a.status!=='revoked'));
  const activeGrants=records.filter(a=>teachers.some(t=>t.id===a.teacherId) && isAccessActive(a)).length;
  const ov=el(`<div class="panel" style="margin-bottom:14px;"></div>`);
  ov.appendChild(el(`<div class="panel-title"><h2>Teachers granted class access</h2>
    <div class="small">${grantedTeachers.length} teacher(s) · ${activeGrants} active class(es)</div></div>`));
  ov.appendChild(el(`<div class="field" style="max-width:320px;"><label>Filter by school</label>
    <select id="ca-school-filter"><option value="">All schools</option>${allSchools().map(sc=>`<option value="${sc.id}" ${sc.id===schoolFilter?'selected':''}>${esc(sc.name)}</option>`).join('')}</select></div>`));
  if(!grantedTeachers.length){
    ov.appendChild(el(`<p class="small">No teacher has been granted class access${schoolFilter?' in this school':''} yet. Use “+ Grant class access”.</p>`));
  } else {
    const ot=el(`<table class="data"><thead><tr><th>Teacher</th><th>School</th><th>Classes granted <span class="small">(tap to open)</span></th><th>Active</th></tr></thead><tbody></tbody></table>`);
    grantedTeachers.forEach(t=>{
      const mine=records.filter(a=>a.teacherId===t.id && a.status!=='revoked')
        .sort((a,b)=>(anyClassById(a.classId)?gradeNumberOfClass(anyClassById(a.classId)):0)-(anyClassById(b.classId)?gradeNumberOfClass(anyClassById(b.classId)):0));
      const names=[...new Set(mine.map(a=>a.schoolName).filter(Boolean))];
      const schoolTxt=names.length?names.join(', '):((schoolById(t.schoolId)||{}).name||'—');
      const badges=mine.map(a=>teacherClassBadgeHtml(t.id,a)).join('');
      ot.querySelector('tbody').appendChild(el(`<tr><td><strong>${esc(t.name)}</strong><div class="small">${esc(t.username)}</div></td><td>${esc(schoolTxt)}</td><td>${badges}</td><td class="num">${mine.filter(isAccessActive).length}</td></tr>`));
    });
    ov.appendChild(ot);
  }
  wrap.appendChild(ov);

  // ---- Paid classes: which classes are paid for, and by whom
  const tIds=new Set(teachers.map(t=>t.id));
  const byClass=new Map();
  records.filter(a=>tIds.has(a.teacherId) && a.status!=='revoked').forEach(a=>{
    if(!byClass.has(a.classId)) byClass.set(a.classId,[]);
    byClass.get(a.classId).push(a);
  });
  const pc=el(`<div class="panel" style="margin-bottom:14px;"></div>`);
  const paidCount=[...byClass.values()].filter(list=>list.some(isAccessActive)).length;
  pc.appendChild(el(`<div class="panel-title"><h2>Paid classes</h2><div class="small">${paidCount} class(es) currently paid · a paid class gives the teacher all its subjects for marks upload and report printing</div></div>`));
  if(!byClass.size){
    pc.appendChild(el(`<p class="small">No class has been granted yet.</p>`));
  } else {
    const pt=el(`<table class="data"><thead><tr><th>School</th><th>Class</th><th>Paid &amp; active</th><th>Not active</th><th>Next expiry</th></tr></thead><tbody></tbody></table>`);
    [...byClass.entries()].sort((x,y)=>{
      const cx=anyClassById(x[0]), cy=anyClassById(y[0]);
      return ((schoolById(cx&&cx.schoolId)||{}).name||'').localeCompare((schoolById(cy&&cy.schoolId)||{}).name||'') || (cx?gradeNumberOfClass(cx):0)-(cy?gradeNumberOfClass(cy):0);
    }).forEach(([cid,list])=>{
      const cls=anyClassById(cid);
      const act=list.filter(isAccessActive), off=list.filter(a=>!isAccessActive(a));
      const nm=a=>(userById(a.teacherId)||{}).name||'?';
      const exp=act.map(a=>a.expiryDate).filter(Boolean).sort()[0]||'—';
      pt.querySelector('tbody').appendChild(el(`<tr>
        <td>${esc((schoolById(cls&&cls.schoolId)||{}).name||'—')}</td>
        <td><strong>${esc(cls?cls.name:'?')}</strong><div style="margin-top:4px;"><button class="btn sm" data-sa-teacher-class="${esc((act[0]||list[0]).teacherId)}|${esc(cid)}">Open class</button></div></td>
        <td>${act.length?act.map(a=>`<span class="badge good" style="margin:1px 3px 1px 0;">${esc(nm(a))}</span>`).join(''):'<span class="small">Not paid</span>'}</td>
        <td>${off.length?off.map(a=>`<span class="badge mid" style="margin:1px 3px 1px 0;">${esc(nm(a))} · ${esc(a.status!=='active'?a.status:(a.paymentStatus&&!['paid','active'].includes(a.paymentStatus)?'payment '+a.paymentStatus:'expired'))}</span>`).join(''):'—'}</td>
        <td>${esc(exp)}</td></tr>`));
    });
    pc.appendChild(pt);
  }
  wrap.appendChild(pc);

  // Summary by teacher
  teachers.forEach(t=>{
    const mine=records.filter(a=>a.teacherId===t.id);
    const panel=el(`<div class="panel"></div>`);
    panel.appendChild(el(`<div class="panel-title"><h2>${esc(t.name)}</h2><div class="small">${esc(t.username)} · ${mine.filter(isAccessActive).length} active class(es)</div></div>`));
    if(!mine.length){
      panel.appendChild(el(`<p class="small">No class access granted yet. This teacher cannot enter marks or view class data until a class is paid and activated.</p>`));
    } else {
      const tbl=el(`<table class="data"><thead><tr>
        <th>School</th><th>Class</th><th>Section</th><th>Payment</th><th>Amount</th><th>Start</th><th>Expiry</th><th>Status</th><th>Subjects</th><th></th>
      </tr></thead><tbody></tbody></table>`);
      const tb=tbl.querySelector('tbody');
      mine.forEach(a=>{
        const cls=anyClassById(a.classId);
        const active=isAccessActive(a);
        const subs=subjectsForClassLabel(a.classId);
        const statusBadge=active?'good':(a.status==='suspended'||a.status==='revoked'?'low':'mid');
        tb.appendChild(el(`<tr>
          <td>${esc(a.schoolName||(schoolById(a.schoolId)||{}).name||'—')}</td>
          <td><strong>${esc(cls?cls.name:a.classId)}</strong></td>
          <td>${esc(a.section||sectionForClassId(a.classId)||'—')}</td>
          <td>${esc(a.paymentStatus||'—')}${a.paymentReference?' <span class="small">('+esc(a.paymentReference)+')</span>':''}</td>
          <td class="num">${a.amountPaid!=null?esc(String(a.amountPaid)):'—'}</td>
          <td>${esc(a.startDate||'—')}</td>
          <td>${esc(a.expiryDate||'—')}</td>
          <td><span class="badge ${statusBadge}">${esc(a.status)}</span></td>
          <td><span class="small" title="${esc(subs.map(s=>s.name).join(', '))}">All ${subs.length} subject(s) ✓</span></td>
          <td style="text-align:right;white-space:nowrap;">
            ${a.status!=='revoked'?`<button class="btn sm" data-sa-teacher-class="${esc(t.id)}|${esc(a.classId)}">Open class</button>`:''}
            ${a.status!=='active'?`<button class="btn ghost sm" data-access-activate="${a.id}">Activate</button>`:''}
            ${a.status==='active'?`<button class="btn ghost sm" data-access-suspend="${a.id}">Suspend</button>`:''}
            <button class="btn ghost sm" data-access-renew="${a.id}">Renew</button>
            ${a.status!=='revoked'?`<button class="btn ghost sm danger" data-access-revoke="${a.id}">Revoke</button>`:''}
          </td>
        </tr>`));
      });
      panel.appendChild(tbl);
    }
    wrap.appendChild(panel);
  });
  return wrap;
}
function modalGrantClassAccess(existingId){

  if(!teachers.length){ toast('Add a teacher account first'); return; }
  // Only the classes of the selected teacher's own school are offered
  const classesOfTeacher=tid=>{ const sid=(userById(tid)||{}).schoolId; return DATA.classes.filter(c=>!sid||c.schoolId===sid).sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b)); };
  const classOptions=(tid,sel)=>classesOfTeacher(tid).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} · ${esc(sectionForClassId(c.id))}</option>`).join('');
  const firstTeacherId=existing?existing.teacherId:teachers[0].id;
  openModal(`

    <p class="hint">Payment is for the <strong>whole class</strong>. The teacher receives every subject configured for that grade — no separate subject fees.</p>

    <div class="field"><label>School name</label>

    <div class="field"><label>Class / Grade</label>

      <div class="field"><label>Amount paid (optional)</label>

      <div class="field"><label>Status</label>
        <select id="m-tca-status">
          ${['active','suspended','expired','pending'].map(s=>`<option value="${s}" ${(existing?existing.status:'active')===s?'selected':''}>${s}</option>`).join('')}
        </select></div>

      <div class="field"><label>Expiry date</label>
        <input type="date" id="m-tca-expiry" value="${esc(existing&&existing.expiryDate||'')}"></div>

  `, true);

    const classId=document.getElementById('m-tca-class').value;

    const box=document.getElementById('m-tca-subjects-hint');

  };
  document.getElementById('m-tca-class').onchange=updateHint;
  updateHint();
  // Suggest the teacher's registered school when the teacher changes (admin can still overwrite it)
  const tSel=document.getElementById('m-tca-teacher');
  if(tSel && !existing) tSel.onchange=()=>{
    const sch=schoolById((userById(tSel.value)||{}).schoolId);
    document.getElementById('m-tca-school').value=sch?sch.name:'';

  document.getElementById('m-tca-save').onclick=()=>{

      status: document.getElementById('m-tca-status').value
    });

  };

function gradeNumberOfClass(c){
  if(c.grade_number) return c.grade_number;
  return parseInt(String(c.name||'').replace(/\D/g,''),10)||0;
}
/** Merge duplicate classes (e.g. two "Grade 7" in one school) into one, moving learners, exams,
 *  streams, subject assignments and teacher access across so nothing is lost. Returns number merged. */
function dedupeClasses(){
  const classes=DATA.classes||[]; if(!classes.length) return 0;
  const usage=id=>(DATA.students||[]).filter(x=>x.classId===id).length+(DATA.exams||[]).filter(x=>x.classId===id).length;
  const groups=new Map();
  classes.forEach(c=>{ const g=gradeNumberOfClass(c); if(!g) return; const k=(c.schoolId||'')+'|'+g; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(c); });
  let merged=0; const drop=new Set();
  groups.forEach(list=>{
    if(list.length<2) return;
    list.sort((a,b)=>usage(b.id)-usage(a.id));           // keep the one that already holds learners / exams
    const keep=list[0];
    if(!keep.grade_number) keep.grade_number=gradeNumberOfClass(keep);
    list.slice(1).forEach(dup=>{
      (DATA.students||[]).forEach(x=>{ if(x.classId===dup.id) x.classId=keep.id; });
      (DATA.exams||[]).forEach(x=>{ if(x.classId===dup.id) x.classId=keep.id; });
      (DATA.streams||[]).forEach(x=>{ if(x.classId===dup.id) x.classId=keep.id; });
      (DATA.subjects||[]).forEach(sub=>{
        if(!Array.isArray(sub.assignments)) return;
        sub.assignments.forEach(a=>{ if(a.classId===dup.id) a.classId=keep.id; });
        const seen=new Set(); sub.assignments=sub.assignments.filter(a=>{ if(seen.has(a.classId)) return false; seen.add(a.classId); return true; });
      });
      (DATA.teacherClassAccess||[]).forEach(a=>{ if(a.classId===dup.id) a.classId=keep.id; });
      (DATA.schoolClassSubs||[]).forEach(r=>{ if(r.classId===dup.id) r.classId=keep.id; });
      drop.add(dup.id); merged++;
    });
    // de-dupe any class-subscription record left doubled up on the kept class
    const seenSub=new Set();
    DATA.schoolClassSubs=(DATA.schoolClassSubs||[]).filter(r=>{
      const k=r.schoolId+'|'+r.classId;
      if(r.classId!==keep.id) return true;
      if(seenSub.has(k)) return false;
      seenSub.add(k); return true;
    });
    // streams of the kept class that now share a name: merge them too
    const byName=new Map();
    (DATA.streams||[]).filter(x=>x.classId===keep.id).forEach(st=>{
      const n=String(st.name||'').trim().toLowerCase();
      if(!byName.has(n)){ byName.set(n,st); return; }
      const first=byName.get(n);
      (DATA.students||[]).forEach(x=>{ if(x.streamId===st.id) x.streamId=first.id; });
      (DATA.exams||[]).forEach(x=>{ if(x.streamId===st.id) x.streamId=first.id; });
      st.__drop=true;
    });
    DATA.streams=(DATA.streams||[]).filter(x=>!x.__drop);
  });
  if(!merged) return 0;
  DATA.classes=classes.filter(c=>!drop.has(c.id));
  // one access record per teacher+class: keep the active / newest one
  const seenAcc=new Map();
  (DATA.teacherClassAccess||[]).slice().sort((a,b)=>(isAccessActive(b)-isAccessActive(a))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).forEach(a=>{
    if(a.status==='revoked') return;
    const k=a.teacherId+'|'+a.classId;
    if(seenAcc.has(k)) a.__drop=true; else seenAcc.set(k,a);
  });
  DATA.teacherClassAccess=(DATA.teacherClassAccess||[]).filter(a=>!a.__drop);
  DATA.classes.sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b));
  return merged;
}
function syncSchoolClasses(sch){
  const want=new Set((SECTIONS[sch.section]||SECTIONS.junior).grades);
  const have=DATA.classes.filter(c=>c.schoolId===sch.id);
  have.forEach(c=>{
    if(!want.has(gradeNumberOfClass(c))){
      const used=DATA.students.some(s=>s.classId===c.id)||DATA.exams.some(e=>e.classId===c.id);
      if(!used) DATA.classes=DATA.classes.filter(x=>x.id!==c.id);
    }
  });
  want.forEach(g=>{
    if(!DATA.classes.some(c=>c.schoolId===sch.id && gradeNumberOfClass(c)===g)){
      DATA.classes.push({id:uid('cls'), schoolId:sch.id, name:'Grade '+g, grade_number:g});
    }
  });
  dedupeClasses();
  // keep Grade order
  DATA.classes.sort((a,b)=>gradeNumberOfClass(a)-gradeNumberOfClass(b));
}

/** Find the class + school behind a teacher's grant, repairing older records that lack a school. */

  const t=userById(teacherId);

  let cls=(DATA.classes||[]).find(c=>c.id===classId) || null;

  if(!schoolId && (DATA.schools||[]).length===1) schoolId=DATA.schools[0].id;
  if(cls && !cls.schoolId && schoolId){ cls.schoolId=schoolId; persist(); }   // older record: attach it to its school
  return {t,rec,cls,schoolId,sch:schoolId?schoolById(schoolId):null};
}

// Step 1: a plain confirmation that spells out what will be lost.
// Step 2: the Super Admin must type the exact name/username shown before the delete button unlocks.
function askDoubleConfirm(o){
  askConfirm(o.summary,()=>{
    openModal(`
      <div class="modal-head"><h2>${esc(o.title)} — final check</h2><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="confirm-body">This cannot be undone. To confirm, type <strong>${esc(o.typeText)}</strong> exactly as shown.</div>
      <div class="field"><input id="dc-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(o.typeText)}"></div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger-solid" id="dc-yes" disabled>${esc(o.yes||'Delete permanently')}</button></div>
    `);
    const inp=document.getElementById('dc-input'), yes=document.getElementById('dc-yes');
    const norm=x=>String(x||'').trim().replace(/\s+/g,' ').toLowerCase();
    const ok=()=>norm(inp.value)===norm(o.typeText);
    inp.addEventListener('input',()=>{ yes.disabled=!ok(); });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(ok()) yes.click(); } });
    yes.onclick=()=>{ if(!ok()) return; closeModal(); o.onYes(); };
    inp.focus();
  },{title:o.title+' — step 1 of 2', yes:'Continue'});
}
function requestDeleteUser(id){
  const u=userById(id); if(!u) return;
  if(!canManageUser(u)) return toast('You are not allowed to delete this account');
  if(u.id===CURRENT_USER.id) return toast('You cannot delete the account you are signed in with');
  if(u.role==='superadmin' && superAdminCount()<=1) return toast('At least one super admin is required');
  const isSA=u.role==='superadmin', isAdm=isSchoolAdmin(u);
  const roleTxt=isSA?'Super Admin':(isAdm?'School Admin':'Teacher');
  const sch=schoolById(u.schoolId);
  const grants=accessRecordsForTeacher(u.id).length;
  const lines=[`You are about to delete the ${roleTxt} account for ${u.name} (${u.username})${sch?' at '+sch.name:''}.`,''];
  lines.push('• Their login is removed and they can no longer sign in.');
  if(u.role==='teacher') lines.push(`• ${grants} class access record(s) granted to this teacher are removed.`);
  if(isAdm) lines.push('• The school will have no School Admin until you register a new one.');
  lines.push('• Learners, marks and examinations are NOT deleted.');
  askDoubleConfirm({
    title:'Delete '+roleTxt.toLowerCase()+' account',
    summary:lines.join('\n'),
    typeText:u.username,

function deleteSchoolCascade(id){
  if(!isSuperAdmin(CURRENT_USER)) return;
  const sch=schoolById(id); if(!sch) return;
  const n=schoolDeleteCounts(id);
  try{ createManualBackup('Before deleting '+sch.name); }
  catch(err){ toast('Could not save the safety backup, so nothing was deleted'); return; }
  const staffIds=new Set((DATA.users||[]).filter(u=>u.schoolId===id && u.role!=='superadmin').map(u=>u.id));
  ['students','exams','streams','subjects','classes'].forEach(k=>{ DATA[k]=(DATA[k]||[]).filter(x=>x.schoolId!==id); });
  DATA.teacherClassAccess=(DATA.teacherClassAccess||[]).filter(a=>a.schoolId!==id && !staffIds.has(a.teacherId));
  DATA.schoolClassSubs=(DATA.schoolClassSubs||[]).filter(r=>r.schoolId!==id);
  DATA.users=(DATA.users||[]).filter(u=>!staffIds.has(u.id));
  DATA.schools=(DATA.schools||[]).filter(x=>x.id!==id);
  if(CURRENT_SCHOOL_ID===id) CURRENT_SCHOOL_ID=null;
  if(window.__caSchool===id) window.__caSchool='';
  if(window.__scsSchool===id) window.__scsSchool='';
  audit('school_deleted',{schoolId:null,deletedSchoolId:id,name:sch.name,code:sch.code,counts:n});
  persistNow(); render(); toast('School "'+sch.name+'" deleted');
}

function modalSubject(existing){
  const rows=scopedClasses().map(c=>{
    const assign=existing?subjectAssignments(existing).find(x=>x.classId===c.id):null;
    return `<div class="checkline" data-class-row="${c.id}">
      <input type="checkbox" class="sub-class-chk" data-class="${c.id}" ${assign?'checked':''}>
      <span style="width:76px; display:inline-block;">${esc(c.name)}</span>
      <input type="text" class="sub-class-teacher" data-class="${c.id}" placeholder="Teacher name (optional)" style="flex:1; ${assign?'':'display:none;'}" value="${assign&&assign.teacher?esc(assign.teacher):''}">
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h2>${existing?'Edit subject':'Add subject'}</h2><button class="x" data-close>✕</button></div>
    <div class="field"><label>Subject name</label><input id="m-sub-name" type="text" value="${existing?esc(existing.name):''}" placeholder="e.g. Mathematics"></div>
    <div class="field"><label>Short code (optional)</label><input id="m-sub-code" type="text" value="${existing?esc(existing.code||''):''}" placeholder="e.g. MAT"></div>
    <div class="field">
      <label>Classes & teachers</label>

      <div id="m-sub-classes">${rows}</div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-sub-save">Save</button></div>
  `,true);
  document.querySelectorAll('.sub-class-chk').forEach(chk=>{
    chk.addEventListener('change',()=>{
      const teacherInput=chk.closest('.checkline').querySelector('.sub-class-teacher');
      teacherInput.style.display=chk.checked?'':'none';
      if(!chk.checked) teacherInput.value='';
    });
  });
  document.getElementById('m-sub-save').onclick=()=>{
    const name=document.getElementById('m-sub-name').value.trim();
    const code=document.getElementById('m-sub-code').value.trim();
    if(!name) return problem('The subject name is empty.','Type the subject name, for example Mathematics, then press Save.','m-sub-name');
    const dupSub=scopedSubjects().find(x=>normName(x.name)===normName(name) && (!existing || x.id!==existing.id));
    if(dupSub) return problem(`A subject called “${dupSub.name}” already exists.`,'Use the existing subject, or give this one a different name (for example “Mathematics B”).','m-sub-name');
    const assignments=[];
    document.querySelectorAll('.sub-class-chk').forEach(chk=>{
      if(chk.checked){
        const teacher=chk.closest('.checkline').querySelector('.sub-class-teacher').value.trim();
        assignments.push({classId:chk.dataset.class, teacher});
      }
    });
    // A section-scoped admin only sees (and can edit) classes in their own section — keep any assignments
    // to classes outside their section exactly as they were, so a Primary Admin editing this subject can
    // never wipe out its Junior Secondary assignments, and vice versa.
    const editableClassIds=new Set(scopedClasses().map(c=>c.id));
    const keptOutOfScope=(existing&&Array.isArray(existing.assignments))?existing.assignments.filter(a=>!editableClassIds.has(a.classId)):[];
    const finalAssignments=[...keptOutOfScope,...assignments];
    if(existing){ existing.name=name; existing.code=code; existing.assignments=finalAssignments; }
    else DATA.subjects.push({id:uid('sub'),schoolId:userSchoolId(),name,code,assignments:finalAssignments});
    persist(); closeModal(); render(); toast('Subject saved');
  };
}

    const streamId=document.getElementById('m-st-stream').value;
    if(!name) return problem('The learner’s name is empty.','Type the learner’s full name, then press Save.','m-st-name');
    if(!classId) return problem('No class has been chosen.','Pick a class from the Class list.','m-st-class');
    const dupSt=scopedStudents().find(x=>(!existing||x.id!==existing.id) && normName(x.name)===normName(name) && x.classId===classId && (x.streamId||'')===(streamId||''));
    const dupKey=normName(name)+'|'+classId+'|'+streamId;
    if(dupSt && dupAck!==dupKey){
      dupAck=dupKey;
      return problem(`A learner called “${dupSt.name}” is already in ${(classById(classId)||{}).name}${streamId?' '+((streamById(streamId)||{}).name||''):''}.`,'If this is a different child, add a middle name or initial to tell them apart (for example “Amina W. Otieno”) and press Save. If they really share the same name, press Save again to keep both.','m-st-name');
    }
    if(existing){ Object.assign(existing,{name,classId,streamId}); }
    else DATA.students.push({id:uid('stu'),schoolId:userSchoolId(),name,classId,streamId});
    persist(); closeModal(); render(); toast('Student saved');
  };
}

  function refreshStreams(){

  }
  function refreshSubjects(){
    const classId=document.getElementById('m-ex-class').value;
    const sel=document.getElementById('m-ex-subjects');
    const keep=new Set([...sel.options].filter(o=>o.selected).map(o=>o.value));
    if(existing && sel.options.length===0){ existing.subjects.forEach(id=>keep.add(id)); }
    const available=scopedSubjects().filter(s=> subjectAvailableForClass(s,classId) || keep.has(s.id));
    sel.innerHTML=available.map(s=>{
      const t=classId?subjectTeacherFor(s,classId):'';
      return `<option value="${s.id}" ${keep.has(s.id)?'selected':''}>${esc(s.name)}${t?' — '+esc(t):''}</option>`;
    }).join('');
  }
  function onClassChange(){ refreshStreams(); refreshSubjects(); }
  document.getElementById('m-ex-class').onchange=onClassChange;
  refreshStreams(); refreshSubjects();
  document.getElementById('m-ex-save').onclick=()=>{

    if(!existing && !canCreateExamForClass(classId)) return problem('You are not the Class Teacher for this class.','You can only create examinations for a class you are formally recognised as Class Teacher of.','m-ex-class');
    if(!subjects.length) return problem('No subjects have been chosen.','Select at least one subject (hold Ctrl to select several).','m-ex-subjects');
    if(outRaw!=='' && !(Number(outRaw)>0)) return problem('“Total marks” must be a number greater than zero.','Type the maximum mark for each subject, for example 100.','m-ex-outof');
    if(year<2000 || year>2100) return problem('The year does not look right.','Type a four-digit year such as 2026.','m-ex-year');

    if(dupEx) return problem(`“${dupEx.name}” already exists for ${(classById(classId)||{}).name}${streamId?' '+((streamById(streamId)||{}).name||''):''}, ${term} ${year}.`,'Open the existing examination to enter or edit its marks, or give this one a different name (for example “Mid-Term Examination B”).','m-ex-name');
    if(existing){

function marksTemplateRows(exam){
  const subjects=enterableSubjects(exam);
  const students=studentsForClass(exam.classId, exam.streamId).sort((a,b)=>a.name.localeCompare(b.name));
  const header=['Student Name','Class','Stream',...subjects.map(s=>s.name)];
  const rows=[header];
  exam.results=exam.results||{};
  students.forEach(st=>{
    const existing=exam.results[st.id]||{};
    rows.push([
      st.name,
      classById(exam.classId)?.name||'',
      st.streamId?(streamById(st.streamId)?.name||''):'',
      ...subjects.map(s=>{ const v=existing[s.id]; return v==null?'':v; })
    ]);
  });
  return rows;
}
function modalImportMarks(examId){
  const exam=examById(examId);
  if(!exam) return;
  const subjects=enterableSubjects(exam);
  const skippedSubjects=(exam.subjects||[]).map(subjectById).filter(Boolean).filter(s=>!canEnterSubject(s.id,exam.classId));
  const classStudents=studentsForClass(exam.classId, exam.streamId);
  if(!subjects.length || !classStudents.length){ toast('This examination needs subjects and students before importing'); return; }

  openModal(`
    <div class="modal-head"><h2>Import marks — ${esc(exam.name)}</h2><button class="x" data-close>✕</button></div>
    <p class="hint">Expected columns: <strong>Student Name, Class, Stream</strong>, then one column per subject — e.g. ${esc(subjects.slice(0,3).map(s=>s.name).join(' | '))}${subjects.length>3?' | …':''}. Class/Stream are shown for reference; marks are matched to students already recorded in ${esc(classById(exam.classId)?.name||'this class')}${exam.streamId?', '+esc(streamById(exam.streamId)?.name||''):''}.</p>
    <p class="hint">You can choose an Excel workbook (.xlsx) or a CSV file. Excel files are read from their first sheet, and the first row should hold the column headings. Everything is read on this device — no internet needed.</p>
    <div class="field"><label>Marks must be between 0 and ${exam.outOf} (this examination's maximum) — anything else is flagged as invalid.</label>
      <input type="file" id="m-imp-marks-file" accept=".xlsx,.xlsm,.csv,text/csv"></div>
    ${skippedSubjects.length?`<p class="hint">You teach ${esc(subjects.map(s=>s.name).join(', '))}. Columns for other subjects (${esc(skippedSubjects.map(s=>s.name).join(', '))}) are ignored.</p>`:''}
    <div id="imp-marks-preview"></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-imp-marks-go" disabled>Import valid marks</button></div>
  `, true);

  let parsed=null;

  function matchSubject(header){
    const norm=String(header||'').trim().toLowerCase();
    return subjects.find(s=>s.name.toLowerCase()===norm || (s.code&&s.code.toLowerCase()===norm));
  }
  function matchStudent(name){
    const hits=classStudents.filter(s=>normName(s.name)===normName(name));
    return hits.length===1 ? hits[0] : null;   // if two learners share a name, the teacher picks the right one in the preview
  }
  function validateCell(raw){
    if(raw==null || String(raw).trim()===''){ return {value:null, status:'missing'}; }
    const n=Number(String(raw).trim());
    if(isNaN(n)) return {value:null, status:'invalid'};
    if(n<0 || n>exam.outOf) return {value:null, status:'invalid'};
    return {value:n, status:'ok'};
  }
  function counts(){
    let ok=0, invalid=0, missing=0, unmatched=0;
    parsed.rows.forEach(r=>{
      if(!r.student) unmatched++;
      r.cells.forEach(c=>{
        if(c.status==='ok' && r.student) ok++;
        else if(c.status==='invalid') invalid++;
        else if(c.status==='missing') missing++;
      });
    });
    return {ok, invalid, missing, unmatched};
  }
  function renderPreview(){
    const box=document.getElementById('imp-marks-preview');
    box.innerHTML='';
    if(!parsed){ document.getElementById('m-imp-marks-go').disabled=true; return; }
    const c=counts();
    box.appendChild(el(`<div class="grid cols-4" style="margin:12px 0;">
      <div class="stat"><div class="n">${c.ok}</div><div class="l">Valid marks ready</div></div>
      <div class="stat"><div class="n">${c.invalid}</div><div class="l">Invalid marks</div></div>
      <div class="stat"><div class="n">${c.missing}</div><div class="l">Blank / missing</div></div>
      <div class="stat"><div class="n">${c.unmatched}</div><div class="l">Unmatched students</div></div>
    </div>`));
    if(c.unmatched){ box.appendChild(el(`<p class="hint" style="color:var(--danger);">Rows highlighted below need a student picked from the dropdown, or they will be skipped.</p>`)); }
    if(c.invalid){ box.appendChild(el(`<p class="hint" style="color:var(--danger);">Cells highlighted below are outside 0–${exam.outOf} or not numbers — correct them here or leave blank to skip.</p>`)); }
    const tbl=el(`<table class="data"><thead><tr><th>Row</th><th>Student</th>${parsed.subjectCols.map(c=>`<th class="center">${esc(c.subject.name)}</th>`).join('')}</tr></thead><tbody></tbody></table>`);
    const tb=tbl.querySelector('tbody');
    parsed.rows.forEach((r,ri)=>{
      const tr=document.createElement('tr');
      let studentCell;
      if(r.student){
        studentCell=`<td>${esc(r.student.name)}</td>`;
      } else {
        studentCell=`<td style="background:var(--danger-soft);"><div class="small">"${esc(r.name)}" — not found</div>
          <select data-imp-remap="${ri}"><option value="">— skip this row —</option>${classStudents.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></td>`;
      }
      let rowHtml=studentCell;
      r.cells.forEach((cell,ci)=>{
        const bg = cell.status==='invalid' ? 'background:var(--danger-soft);' : '';
        rowHtml+=`<td class="center" style="${bg}"><input type="number" style="width:64px; text-align:center;" data-imp-row="${ri}" data-imp-cell="${ci}" value="${cell.raw==null?'':cell.raw}"></td>`;
      });
      tr.innerHTML=rowHtml;
      tb.appendChild(tr);
    });
    box.appendChild(tbl);
    document.getElementById('m-imp-marks-go').disabled = counts().ok===0;
    box.querySelectorAll('[data-imp-remap]').forEach(sel=>{
      sel.onchange=()=>{
        const ri=Number(sel.dataset.impRemap);
        parsed.rows[ri].student = sel.value ? classStudents.find(s=>s.id===sel.value) : null;
        renderPreview();
      };
    });
    box.querySelectorAll('[data-imp-row]').forEach(inp=>{
      inp.oninput=()=>{
        const ri=Number(inp.dataset.impRow), ci=Number(inp.dataset.impCell);
        const v=validateCell(inp.value);
        parsed.rows[ri].cells[ci]={...parsed.rows[ri].cells[ci], raw:inp.value, value:v.value, status:v.status};
        inp.closest('td').style.background = v.status==='invalid' ? 'var(--danger-soft)' : '';
        document.getElementById('m-imp-marks-go').disabled = counts().ok===0;
      };
    });
  }

  document.getElementById('m-imp-marks-file').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    readCsvFile(f, rows=>{
      const header=rows[0];
      let subjectCols=[];
      header.forEach((h,idx)=>{ if(idx<3) return; const sub=matchSubject(h); if(sub) subjectCols.push({idx, subject:sub}); });
      if(!subjectCols.length){
        header.forEach((h,idx)=>{ if(idx===0) return; const sub=matchSubject(h); if(sub && !subjectCols.find(c=>c.idx===idx)) subjectCols.push({idx, subject:sub}); });
      }
      if(!subjectCols.length){
        parsed=null; document.getElementById('m-imp-marks-go').disabled=true; document.getElementById('imp-marks-preview').innerHTML='';
        return problem('None of the column headings match the subjects in this examination.',`Row 1 of the file must contain the subject names: ${subjects.map(x=>x.name).join(', ')}. The easiest way is to use "Download template (CSV)" on the Marks Entry page, fill it in, and import that file.`);
      }
      const dataRows=rows.slice(1).filter(r=>r[0]&&r[0].trim());
      if(!dataRows.length){
        parsed=null; document.getElementById('m-imp-marks-go').disabled=true; document.getElementById('imp-marks-preview').innerHTML='';
        return problem('The file has column headings but no learners underneath.','Add one learner per row — the name in column A, then their marks — and try again.');
      }
      const parsedRows=dataRows.map(r=>{
        const name=r[0].trim();
        const student=matchStudent(name);
        const cells=subjectCols.map(c=>{
          const raw=r[c.idx];
          const v=validateCell(raw);
          return {subject:c.subject, raw: raw==null?'':raw, value:v.value, status:v.status};
        });
        return {name, student, cells};
      });
      parsed={rows:parsedRows, subjectCols};
      document.querySelectorAll('#modal-root .inline-error').forEach(x=>x.remove());
      renderPreview();
      const seenIds={}, dups=[];
      parsedRows.forEach(r=>{ if(!r.student) return; if(seenIds[r.student.id]) dups.push(r.name); seenIds[r.student.id]=1; });
      if(dups.length) problem(`These learners appear more than once in the file: ${[...new Set(dups)].join(', ')}.`,'Only the last row for each learner will be kept. Delete the extra rows and re-import if that is not what you want.');
    }, (what,fix)=>{
      parsed=null; document.getElementById('m-imp-marks-go').disabled=true; document.getElementById('imp-marks-preview').innerHTML='';
      problem(what,fix);
    });
  };

  document.getElementById('m-imp-marks-go').onclick=()=>{
    if(!parsed) return;
    exam.results=exam.results||{};
    let imported=0; const students=new Set();
    parsed.rows.forEach(r=>{
      if(!r.student) return;
      exam.results[r.student.id]=exam.results[r.student.id]||{};
      r.cells.forEach(c=>{
        if(c.status==='ok'){ exam.results[r.student.id][c.subject.id]=c.value; imported++; students.add(r.student.id); }
      });
    });
    persist(); closeModal();
    goto('marks',{examId:exam.id, mode:'grid'});
    toast(`${imported} mark(s) imported for ${students.size} student(s)`);
  };
}
function modalImportStudents(){
  openModal(`
    <div class="modal-head"><h2>Import students (Excel / CSV)</h2><button class="x" data-close>✕</button></div>
    <p class="hint">Columns: <strong>Name, Class, Stream</strong> (Stream optional). Class must be one of ${esc(classNamesText())}. Streams that don't exist yet will be created automatically.</p>
    <p class="hint">You can choose an Excel workbook (.xlsx) or a CSV file. Excel files are read from their first sheet, and the first row should hold the column headings. Everything is read on this device — no internet needed.</p>
    <div class="field"><input type="file" id="m-imp-file" accept=".xlsx,.xlsm,.csv,text/csv"></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-imp-go">Import</button></div>
  `);
  document.getElementById('m-imp-go').onclick=()=>{
    const f=document.getElementById('m-imp-file').files[0];
    readCsvFile(f, rows=>{
      let start=0;
      if(rows[0] && /name/i.test(rows[0][0]||'')) start=1;
      if(rows.length<=start) return problem('The file has column headings but no learners underneath.','Put one learner on each row — Name in column A, Class in column B, Stream in column C (optional) — save as CSV and try again.');
      let added=0; const issues=[], seen=new Set(), newStreams=[];
      for(let i=start;i<rows.length;i++){
        const [name,className,streamName]=rows[i]; const rowNo=i+1;
        if(!name||!name.trim()){ issues.push(`Row ${rowNo}: the name is empty`); continue; }
        const nm=name.trim();
        const norm=String(className||'').toLowerCase().replace(/[^a-z0-9]/g,'');
        const digits=String(className||'').replace(/\D/g,'');
        const cls=scopedClasses().find(c=>{
          const cn=c.name.toLowerCase().replace(/[^a-z0-9]/g,'');
          return cn===norm || (digits!=='' && c.name.replace(/\D/g,'')===digits);
        });
        if(!cls){ issues.push(`Row ${rowNo}: ${nm} — class “${(className||'').trim()||'(blank)'}” is not one of ${classNamesText()}`); continue; }
        let str=null;
        if(streamName && streamName.trim()){
          str=scopedStreams().find(x=>x.classId===cls.id && normName(x.name)===normName(streamName));
          if(!str){ str={id:uid('str'),classId:cls.id,name:streamName.trim().replace(/\s+/g,' ')}; newStreams.push(str); }
        }
        const key=normName(nm)+'|'+cls.id+'|'+(str?str.id:'');
        const exists=seen.has(key) || scopedStudents().some(x=>normName(x.name)===normName(nm) && x.classId===cls.id && (x.streamId||'')===(str?str.id:''));
        if(exists){ issues.push(`Row ${rowNo}: ${nm} is already in ${cls.name}${str?' '+str.name:''} — skipped`); continue; }
        seen.add(key);
        if(str && !scopedStreams().includes(str)) DATA.streams.push(str);
        DATA.students.push({id:uid('stu'),schoolId:userSchoolId()||cls.schoolId,name:nm.replace(/\s+/g,' '),classId:cls.id,streamId:str?str.id:''});
        added++;
      }
      if(!added){
        return problem('No learners were imported.',`Nothing in the file could be used. ${issues.slice(0,4).join('; ')}${issues.length>4?'; …':''}. Correct the file — Class must be one of ${classNamesText()} — and try again.`);
      }
      persist(); closeModal(); render();
      if(issues.length){
        showNotice(`${added} learner${added===1?'':'s'} imported — ${issues.length} row${issues.length===1?'':'s'} skipped`,
          `<p>The rows below were <strong>not</strong> imported.</p><ul class="notice-list">${issues.slice(0,50).map(x=>`<li>${esc(x)}</li>`).join('')}${issues.length>50?`<li>…and ${issues.length-50} more</li>`:''}</ul><p><strong>How to fix it:</strong> correct those rows in your file (or add the learners one by one with “Add student”) and import again. Learners already imported will be recognised and skipped, so nobody is added twice.</p>`);
      } else toast(added+' learner'+(added===1?'':'s')+' imported');
    }, (what,fix)=>problem(what,fix));
  };
}

document.addEventListener('click',(e)=>{
  if(e.target.closest('#sb-toggle')){ toggleSidebarDrawer(); return; }
  if(e.target.id==='sidebar-backdrop'){ closeSidebarDrawer(); return; }

  const gsItem=e.target.closest('[data-gs-type]');
  if(gsItem){ goToGlobalSearchResult(gsItem.dataset.gsType, gsItem.dataset.gsId); return; }
  if(!e.target.closest('.gsearch')){ closeGlobalSearch(); }

  if(e.target.id==='btn-logout' || e.target.closest('#btn-logout')){
    askConfirm('Sign out of AMBROH?',()=>{ doLogout(); },{title:'Logout',yes:'Sign out',danger:false});
    return;
  }
  if(e.target.id==='btn-mypass' || e.target.closest('#btn-mypass')){
    if(CURRENT_USER) modalResetPassword(CURRENT_USER);
    return;
  }


  const nav=e.target.closest('[data-nav]');
  if(nav && !nav.dataset.exam){
    if(nav.dataset.nav==='users' && !canManageStaff(CURRENT_USER)) return;
    if(nav.closest('#sidebar')) closeSidebarDrawer();
    goto(nav.dataset.nav); return;
  }
  if(nav && nav.dataset.exam){ if(nav.closest('#sidebar')) closeSidebarDrawer(); goto('analysis',{examId:nav.dataset.exam}); return; }

  if(e.target.closest('[data-close]')){ closeModal(); return; }

  if(e.target.id==='add-teacher'){ modalUser(null); return; }
  if(e.target.id==='add-school-admin'){ modalAddSchoolAdmin(); return; }

  
  if(e.target.id==='sa-add-school'){ modalRegisterSchool(null); return; }
  if(e.target.closest('[data-sa-edit]')){
    modalRegisterSchool(schoolById(e.target.closest('[data-sa-edit]').dataset.saEdit)); return;
  }
  if(e.target.closest('[data-sa-teacher-class]')){
    const [tid,cid]=e.target.closest('[data-sa-teacher-class]').dataset.saTeacherClass.split('|');
    modalOpenTeacherClass(tid,cid); return;
  }
  if(e.target.closest('[data-sa-go]')){
    const b=e.target.closest('[data-sa-go]');
    openTeacherClassAsSuper(b.dataset.saGo,b.dataset.sch,b.dataset.cls,b.dataset.tch); return;
  }

// Report cards: shrink any card that is taller than one page so each learner always prints on ONE page.

/* ---------- PDF download (works on phones: no print dialog needed) ---------- */
// Each report page is drawn to an image and packed into a small PDF built right here, so it works offline.
async function renderHTMLToCanvas(html,width,minH,scale){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-99999px;top:0;width:'+width+'px;';
  host.innerHTML=`<div><style>${DOC_CSS}</style><div style="width:${width}px;box-sizing:border-box;padding:36px;background:#fff;color:#111;font-family:Georgia,serif;font-size:13px;">${html}</div></div>`;
  document.body.appendChild(host);
  const inner=host.querySelector('div > div'), hh=Math.max(minH,inner.scrollHeight);
  inner.style.minHeight=hh+'px';
  const xml=new XMLSerializer().serializeToString(host.firstElementChild);
  host.remove();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${hh}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((ok,bad)=>{ img.onload=ok; img.onerror=()=>bad(new Error('render')); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
  const c=document.createElement('canvas'); c.width=Math.round(width*scale); c.height=Math.round(hh*scale);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c;
}
function buildPdf(pages){
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); chunks.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(n+' 0 obj\n'); fn(); push('\nendobj\n'); };
  const N=pages.length;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Count '+N+' /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
  pages.forEach((p,i)=>{
    const pn=3+3*i, cn=pn+1, im=pn+2;
    const s=Math.min(p.pw/p.w,p.ph/p.h), dw=p.w*s, dh=p.h*s, x=(p.pw-dw)/2, y=p.ph-dh;
    obj(pn,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pw.toFixed(2)} ${p.ph.toFixed(2)}] /Contents ${cn} 0 R /Resources << /XObject << /Im0 ${im} 0 R >> >> >>`));
    const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
    obj(cn,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(im,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`); push(p.jpeg); push('\nendstream'); });
  });
  const xref=len, total=3*N+3;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let n=1;n<total;n++) push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}

let PDF_BLOB=null;
function dataUrlToFile(u,name){ const bin=atob(u.split(',')[1]), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new File([a],name,{type:'image/jpeg'}); }
// Opens the phone's share sheet (WhatsApp, Drive, Email, Bluetooth…) with the PDF; falls back to the pages as pictures.
async function shareReport(){
  const base=PDF_NAME.replace(/\.pdf$/i,'');
  const tryShare=async files=>{ if(navigator.share&&navigator.canShare&&navigator.canShare({files})){ await navigator.share({files,title:base}); return true; } return false; };
  try{
    if(PDF_BLOB && await tryShare([new File([PDF_BLOB],PDF_NAME,{type:'application/pdf'})])) return;
    const imgs=PDF_PAGE_URLS.map((u,i)=>dataUrlToFile(u,base+' - page '+(i+1)+'.jpg'));
    if(imgs.length && await tryShare(imgs)) return;
    toast('Sharing is not available in this browser. Use “Save as pictures”, or open AMBROH in Chrome.','error');
  }catch(err){ if(err&&err.name==='AbortError') return; toast('Could not open sharing. Try “Save as pictures”.','error'); }
}
let PDF_URL=null;
let PDF_PAGE_URLS=[], PDF_NAME='', PDF_FROM_PREVIEW=false;
function showPdfReady(blob,name,count,urls){
  PDF_PAGE_URLS=urls||[]; PDF_NAME=name;
  if(PDF_URL) URL.revokeObjectURL(PDF_URL);
  PDF_URL=URL.createObjectURL(blob); PDF_BLOB=blob;
  const links=`<a class="btn primary" id="pdf-save" href="${PDF_URL}" download="${esc(name)}">⬇ Save PDF (${count} page${count===1?'':'s'})</a><button class="btn" id="pdf-share">Share</button> <button class="btn" id="pdf-pages">Save as pictures</button>`;
  const foot=document.querySelector('#modal-root .modal-foot');
  PDF_FROM_PREVIEW=!!foot;
  if(foot){ const old=document.getElementById('pdf-ready'); if(old) old.remove(); foot.insertAdjacentHTML('afterbegin',`<span id="pdf-ready" style="display:flex;gap:8px;flex-wrap:wrap;margin-right:auto;">${links}</span>`); }
  else openModal(`<div class="modal-head"><h2>PDF ready</h2><button class="x" data-close>✕</button></div><p>Tap the button to save the PDF to your phone.</p><div class="modal-foot" style="justify-content:flex-start;">${links} <button class="btn" data-close>Close</button></div>`);
  const sh=document.getElementById('pdf-share');
  if(sh) sh.onclick=shareReport;
  const pg=document.getElementById('pdf-pages');
  if(pg) pg.onclick=showPdfPages;
  toast('PDF ready — tap “Save PDF”, or “Save as pictures” if the download does nothing');
}
async function downloadReportPdf(html,title){
  toast('Preparing PDF…');
  try{
    const land=html.includes('data-landscape');
    const W=land?1123:794, H=land?794:1123, pw=land?841.89:595.28, ph=land?595.28:841.89, S=1.5;
    const tmp=document.createElement('div'); tmp.innerHTML=html;
    const pbs=[...tmp.children].filter(c=>c.classList&&c.classList.contains('pb'));
    const pages=[];
    const add=(c)=>{ const url=c.toDataURL('image/jpeg',0.9), bin=atob(url.split(',')[1]), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); pages.push({jpeg:u,url,w:c.width,h:c.height,pw,ph}); };
    if(pbs.length){ for(const pb of pbs){ add(await renderHTMLToCanvas(pb.innerHTML,W,H,S)); await new Promise(r=>setTimeout(r,0)); } }
    else{
      const c=await renderHTMLToCanvas(html,W,H,S), sh=Math.round(H*S);
      for(let y=0;y<c.height;y+=sh){
        const pc=document.createElement('canvas'); pc.width=c.width; pc.height=sh;

// ---- Excel (.xlsx) reader: built in, works offline (no add-on needed) ----
async function inflateRaw(bytes){
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzipEntries(buf,wanted){
  const u8=new Uint8Array(buf), dv=new DataView(buf), td=new TextDecoder();
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not a zip file');
  const count=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const out={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('damaged zip directory');
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));
    p+=46+nlen+elen+clen;
    if(!wanted(name)) continue;
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    const data=u8.subarray(start,start+csize);
    out[name]= method===0 ? data : await inflateRaw(data);
  }
  return out;
}
async function readXlsxRows(buf){
  if(typeof DecompressionStream==='undefined') throw new Error('nodecomp');
  const files=await unzipEntries(buf,n=>n==='xl/workbook.xml'||n==='xl/_rels/workbook.xml.rels'||n==='xl/sharedStrings.xml'||/^xl\/worksheets\/[^\/]+\.xml$/.test(n));
  if(!files['xl/workbook.xml']) throw new Error('not an xlsx workbook');
  const td=new TextDecoder(), parse=b=>new DOMParser().parseFromString(td.decode(b),'application/xml');
  const q=(node,name)=>[...node.getElementsByTagNameNS('*',name)];
  let sheetPath=null;
  const first=q(parse(files['xl/workbook.xml']),'sheet')[0];
  if(first && files['xl/_rels/workbook.xml.rels']){
    const rid=first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const rel=q(parse(files['xl/_rels/workbook.xml.rels']),'Relationship').find(r=>r.getAttribute('Id')===rid);
    if(rel){ const t=rel.getAttribute('Target')||''; sheetPath=t.startsWith('/')?t.slice(1):'xl/'+t; }
  }
  if(!sheetPath || !files[sheetPath]) sheetPath=Object.keys(files).filter(n=>n.startsWith('xl/worksheets/')).sort()[0];
  if(!sheetPath) throw new Error('no worksheet');
  const shared=[];
  if(files['xl/sharedStrings.xml']) q(parse(files['xl/sharedStrings.xml']),'si').forEach(si=>shared.push(q(si,'t').filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')));
  const sheet=parse(files[sheetPath]);
  if(sheet.getElementsByTagName('parsererror').length) throw new Error('damaged worksheet');
  const colIdx=ref=>{ const m=/^([A-Z]+)/.exec(ref||''); if(!m) return -1; let n=0; for(const ch of m[1]) n=n*26+ch.charCodeAt(0)-64; return n-1; };
  const rows=[];
  q(sheet,'row').forEach(r=>{
    const row=[]; let next=0;
    q(r,'c').forEach(c=>{
      let ci=colIdx(c.getAttribute('r')); if(ci<0) ci=next; next=ci+1;
      const t=c.getAttribute('t'), vEl=q(c,'v')[0]; let val='';
      if(t==='s') val=shared[Number(vEl?vEl.textContent:-1)]||'';
      else if(t==='inlineStr') val=q(c,'t').map(x=>x.textContent).join('');
      else if(t==='e') val='';
      else if(t==='b') val=(vEl&&vEl.textContent==='1')?'TRUE':'FALSE';
      else { val=vEl?vEl.textContent:''; if(/^-?\d*\.\d{10,}$/.test(val)) val=String(parseFloat(Number(val).toPrecision(12))); }
      row[ci]=String(val).trim();
    });
    for(let i=0;i<row.length;i++) if(row[i]===undefined) row[i]='';
    rows.push(row);
  });
  return rows.filter(r=>r.some(c=>c!==''));
}
// Reads an Excel (.xlsx) or CSV file safely. Calls onRows(rows) when usable, otherwise onFail(what, fix).
function readCsvFile(file,onRows,onFail){
  if(!file) return onFail('No file has been chosen.','Click "Choose file", pick your Excel or CSV file, then press the button again.');
  const nm=(file.name||'').toLowerCase();
  const isX=/\.(xlsx|xlsm)$/.test(nm);
  if(/\.(xls|xlsb|ods|numbers)$/.test(nm)) return onFail(`"${file.name}" is an older or different spreadsheet format that AMBROH cannot open.`,'Open it in Excel, choose File → Save As, and pick "Excel Workbook (.xlsx)" or "CSV (Comma delimited)". Then choose the new file here.');
  if(!isX && !/\.(csv|txt|tsv)$/.test(nm)) return onFail(`"${file.name}" is not an Excel or CSV file.`,'Choose a file ending in .xlsx or .csv.');
  if(file.size===0) return onFail(`"${file.name}" is empty.`,'Open the file, check the information is there, save it and try again.');
  if(file.size>(isX?10:5)*1024*1024) return onFail(`"${file.name}" is unusually large (${fmtBytes(file.size)}) for a class list or marks sheet.`,'Check you chose the right file. A list of learners or marks is normally well under 1 MB.');
  const finish=rows=>{
    rows=(rows||[]).filter(r=>r.some(c=>String(c).trim()!==''));
    if(!rows.length) return onFail(`"${file.name}" has no rows of information.`,'The first row should hold column headings, with one learner (or one set of marks) per row underneath. For Excel files, AMBROH reads the first sheet.');
    if(rows.some(r=>r.length>60)) return onFail(`"${file.name}" has far too many columns to be a class list or marks sheet.`,'Check you chose the right file, and that commas inside names or comments are inside quotation marks.');
    onRows(rows);
  };
  const reader=new FileReader();
  reader.onerror=()=>onFail(`AMBROH could not read "${file.name}".`,'If the file is open in Excel, close it and try again. If it still fails, save a fresh copy and try again.');
  if(isX){
    reader.onload=()=>{
      readXlsxRows(reader.result).then(finish).catch(err=>{
        if(err && err.message==='nodecomp') return onFail('This browser is too old to read Excel files directly.','Open the file in Excel, choose File → Save As → "CSV (Comma delimited)", and choose that .csv file instead.');
        onFail(`"${file.name}" could not be opened as an Excel workbook. It may be damaged, password-protected, or not really an .xlsx file.`,'Open it in Excel. If it opens normally, remove any password and use File → Save As → "Excel Workbook (.xlsx)" (or "CSV (Comma delimited)"), then choose the new file.');
      });
    };
    reader.readAsArrayBuffer(file);
    return;
  }
  reader.onload=()=>{
    let text=String(reader.result||'');
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const bad=(text.match(/\uFFFD/g)||[]).length;
    if(text.indexOf('\u0000')>=0 || text.slice(0,4)==='PK\u0003\u0004' || bad>Math.max(5,text.length*0.02))
      return onFail(`"${file.name}" does not look like a plain CSV file. It may be damaged, or it may be an Excel file that was only renamed to .csv.`,'Open the original in Excel, choose File → Save As → "CSV (Comma delimited)", and use the new file.');
    let rows;
    try{ rows=parseCSV(text); }catch(err){ return onFail(`"${file.name}" could not be read as a table.`,'Save it again as "CSV (Comma delimited)" and try again.'); }
    finish(rows);
  };
  reader.readAsText(file);
}
function validateScale(scale){
  if(!scale.length) return {what:'There are no grade bands to save.',fix:'Add at least one band with a grade name (for example EE1), its minimum and maximum mark, and its points.'};
  const seen=new Set();
  for(const g of scale){
    const k=g.grade.toLowerCase();
    if(seen.has(k)) return {what:`The grade "${g.grade}" appears more than once.`,fix:'Each grade name can be used only once. Rename or remove the duplicate row.'};
    seen.add(k);
    if(!isFinite(g.min) || (g.max!=null && !isFinite(g.max))) return {what:`"${g.grade}" has a minimum or maximum mark that is not a number.`,fix:'Type numbers from 0 to 100 in the Min % and Max % boxes.'};
    if(g.min<0 || g.min>100 || (g.max!=null && (g.max<0 || g.max>100))) return {what:`"${g.grade}" has a mark outside the range 0–100.`,fix:'Grade ranges are percentages, so use numbers from 0 to 100 only.'};
    if(g.max!=null && g.max<g.min) return {what:`For "${g.grade}", the maximum (${g.max}) is lower than the minimum (${g.min}).`,fix:'Swap the two numbers, or correct the one that was mistyped.'};
    if(!isFinite(g.points)) return {what:`"${g.grade}" has no points value.`,fix:'Type the points for this grade (for example 8 for the top level). Points are used to work out mean grades.'};
  }
  const sorted=[...scale].sort((a,b)=>a.min-b.min);
  for(let i=1;i<sorted.length;i++){
    const a=sorted[i-1], b=sorted[i], aMax=a.max!=null?a.max:100;
    if(b.min<=aMax) return {what:`"${a.grade}" (${a.min}–${aMax}) overlaps with "${b.grade}" (${b.min}–${b.max!=null?b.max:100}).`,fix:`A mark can belong to only one grade. Lower the maximum of "${a.grade}" to below ${b.min}, or raise the minimum of "${b.grade}".`};
  }
  return null;
}
function scaleWarnings(scale){
  const sorted=[...scale].sort((a,b)=>a.min-b.min), notes=[];
  if(sorted[0].min>0) notes.push(`marks below ${sorted[0].min}% have no band of their own`);
  for(let i=1;i<sorted.length;i++){
    const aMax=sorted[i-1].max!=null?sorted[i-1].max:100;
    if(sorted[i].min-aMax>1) notes.push(`marks between ${aMax} and ${sorted[i].min} are not covered`);
  }
  return notes.join('; ');
}

// Repairs damaged saved data instead of crashing. Returns how many problems were fixed.
function repairData(){
  let fixed=0;
  if(!DATA || typeof DATA!=='object' || Array.isArray(DATA)){ DATA=blankData(); return 1; }
  ['classes','streams','subjects','students','exams','users','teacherClassAccess','schoolClassSubs','schools','auditLogs'].forEach(k=>{
    if(!Array.isArray(DATA[k])){ DATA[k]=(k==='classes')?classesForSection('junior'):[]; fixed++; }
    else { const n=DATA[k].length; DATA[k]=DATA[k].filter(x=>x&&typeof x==='object'&&x.id); fixed+=n-DATA[k].length; }
  });
  if(!DATA.settings || typeof DATA.settings!=='object'){ DATA.settings=blankData().settings; fixed++; }
  if(!Array.isArray(DATA.settings.scale)){ DATA.settings.scale=[]; fixed++; }
  if(!SECTIONS[DATA.settings.section]) DATA.settings.section='junior';   // saved data from before Primary support was Junior School
  syncClassesToSection();
  if(!DATA.settings.termDates || typeof DATA.settings.termDates!=='object') DATA.settings.termDates={};
  scopedExams().forEach(e=>{
    if(!e.results || typeof e.results!=='object'){ e.results={}; fixed++; }
    if(!Array.isArray(e.subjects)){ e.subjects=[]; fixed++; }
  });
  (DATA.users||[]).forEach(u=>{
    if(u.role!=='teacher' || u.classSubjects) return;
    const hadAllSubjects=u.allSubjects===true, hadAllClasses=u.allClasses===true;
    const oldSubjectIds=Array.isArray(u.subjectIds)?u.subjectIds:[];
    const oldClassIds=Array.isArray(u.classIds)?u.classIds:[];
    if(hadAllSubjects && hadAllClasses){ u.classSubjects={}; fixed++; return; }
    const classIdsToUse = hadAllClasses ? (DATA.classes||[]).filter(c=>c.schoolId===u.schoolId).map(c=>c.id) : oldClassIds;
    const cs={};
    classIdsToUse.forEach(cid=>{
      if(hadAllSubjects) cs[cid]={all:true};
      else if(oldSubjectIds.length) cs[cid]={all:false, subjects:oldSubjectIds.slice()};
    });
    u.classSubjects=cs;
    u.allSubjects=false; u.allClasses=false;
    fixed++;
  });
  return fixed;
}
function validateBackup(o){
  if(!o || typeof o!=='object' || Array.isArray(o)) return 'it does not contain a school database';
  const need=['settings','classes','streams','subjects','students','exams'];
  const miss=need.filter(k=>o[k]==null);
  if(miss.length) return 'these parts are missing: '+miss.join(', ');
  if(['classes','streams','subjects','students','exams'].some(k=>!Array.isArray(o[k]))) return 'some of its lists are damaged';
  return null;
}

  else go();
}

/* ============================= SQLITE DATABASE STRUCTURE ============================= */
// AMBROH keeps working data in the browser, but its data follows this normalized SQLite design.
// "Export SQLite database" writes a .sql file that builds the full database in any SQLite tool.
const SCHEMA_SQL = `-- AMBROH database schema (SQLite 3)
-- Students are identified only by their internal id. There are no admission
-- numbers, gender, parent/guardian tables or stored pass/fail data:
-- grades and pass rates are always calculated from marks + grading_system.
PRAGMA foreign_keys = ON;

CREATE TABLE IF NOT EXISTS schools (
  id            INTEGER PRIMARY KEY AUTOINCREMENT,
  name          TEXT    NOT NULL,
  motto         TEXT    NOT NULL DEFAULT '',
  logo          TEXT,
  current_year  INTEGER NOT NULL,
  current_term  TEXT    NOT NULL
);

CREATE TABLE IF NOT EXISTS classes (
  id           INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id    INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name         TEXT    NOT NULL,
  level_order  INTEGER NOT NULL DEFAULT 0,
  UNIQUE (school_id, name)
);

CREATE TABLE IF NOT EXISTS streams (
  id        INTEGER PRIMARY KEY AUTOINCREMENT,
  class_id  INTEGER NOT NULL REFERENCES classes(id) ON DELETE CASCADE,
  name      TEXT    NOT NULL,
  UNIQUE (class_id, name)
);

CREATE TABLE IF NOT EXISTS students (
  id               INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id        INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name             TEXT    NOT NULL,
  class_id         INTEGER NOT NULL REFERENCES classes(id),
  stream_id        INTEGER REFERENCES streams(id) ON DELETE SET NULL,
  is_graduated     INTEGER NOT NULL DEFAULT 0 CHECK (is_graduated IN (0,1)),
  graduation_year  INTEGER
);

CREATE TABLE IF NOT EXISTS subjects (
  id         INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id  INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name       TEXT    NOT NULL,
  code       TEXT    NOT NULL DEFAULT '',
  UNIQUE (school_id, name)
);

-- Which subjects a class takes, and who teaches it. A subject with no rows
-- here is treated by AMBROH as available to every class.
CREATE TABLE IF NOT EXISTS class_subjects (
  class_id      INTEGER NOT NULL REFERENCES classes(id)  ON DELETE CASCADE,
  subject_id    INTEGER NOT NULL REFERENCES subjects(id) ON DELETE CASCADE,
  teacher_name  TEXT    NOT NULL DEFAULT '',
  PRIMARY KEY (class_id, subject_id)
);

CREATE TABLE IF NOT EXISTS examinations (
  id          INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id   INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  name        TEXT    NOT NULL,
  class_id    INTEGER NOT NULL REFERENCES classes(id),
  stream_id   INTEGER REFERENCES streams(id) ON DELETE SET NULL,
  term        TEXT    NOT NULL,
  year        INTEGER NOT NULL,
  out_of      REAL    NOT NULL DEFAULT 100 CHECK (out_of > 0),
  exam_date   TEXT
);

CREATE TABLE IF NOT EXISTS examination_subjects (
  examination_id  INTEGER NOT NULL REFERENCES examinations(id) ON DELETE CASCADE,
  subject_id      INTEGER NOT NULL REFERENCES subjects(id)     ON DELETE CASCADE,
  PRIMARY KEY (examination_id, subject_id)
);

-- One raw mark per student, per subject, per examination.
CREATE TABLE IF NOT EXISTS marks (
  id              INTEGER PRIMARY KEY AUTOINCREMENT,
  examination_id  INTEGER NOT NULL,
  student_id      INTEGER NOT NULL REFERENCES students(id) ON DELETE CASCADE,
  subject_id      INTEGER NOT NULL,
  mark            REAL    NOT NULL CHECK (mark >= 0),
  UNIQUE (examination_id, student_id, subject_id),
  FOREIGN KEY (examination_id, subject_id)
    REFERENCES examination_subjects(examination_id, subject_id) ON DELETE CASCADE
);

CREATE TABLE IF NOT EXISTS grading_system (
  id           INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id    INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  grade        TEXT    NOT NULL,
  min_mark     REAL    NOT NULL,
  max_mark     REAL,
  points       REAL,
  description  TEXT    NOT NULL DEFAULT '',
  sort_order   INTEGER NOT NULL DEFAULT 0,
  UNIQUE (school_id, grade)
);

-- Comment wording by percentage range (kind: 'teacher' or 'head').
CREATE TABLE IF NOT EXISTS comment_bands (
  id         INTEGER PRIMARY KEY AUTOINCREMENT,
  school_id  INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  kind       TEXT    NOT NULL CHECK (kind IN ('teacher','head')),
  min_mark   REAL    NOT NULL,
  max_mark   REAL,
  comment    TEXT    NOT NULL
);

-- Comments a teacher edited by hand on report cards.
CREATE TABLE IF NOT EXISTS subject_comments (
  examination_id  INTEGER NOT NULL REFERENCES examinations(id) ON DELETE CASCADE,
  student_id      INTEGER NOT NULL REFERENCES students(id)     ON DELETE CASCADE,
  subject_id      INTEGER NOT NULL REFERENCES subjects(id)     ON DELETE CASCADE,
  comment         TEXT    NOT NULL,
  PRIMARY KEY (examination_id, student_id, subject_id)
);

CREATE TABLE IF NOT EXISTS report_comments (
  examination_id  INTEGER NOT NULL REFERENCES examinations(id) ON DELETE CASCADE,
  student_id      INTEGER NOT NULL REFERENCES students(id)     ON DELETE CASCADE,
  comment         TEXT    NOT NULL,
  PRIMARY KEY (examination_id, student_id)
);

CREATE TABLE IF NOT EXISTS term_dates (
  school_id     INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  year          INTEGER NOT NULL,
  term          TEXT    NOT NULL,
  closing_date  TEXT,
  opening_date  TEXT,
  PRIMARY KEY (school_id, year, term)
);


CREATE TABLE IF NOT EXISTS teacher_class_access (
  id                 INTEGER PRIMARY KEY AUTOINCREMENT,
  teacher_id         INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
  school_id          INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  class_id           INTEGER NOT NULL REFERENCES classes(id) ON DELETE CASCADE,
  section            TEXT,
  payment_status     TEXT NOT NULL DEFAULT 'pending',
  amount_paid        REAL,
  payment_reference  TEXT,
  start_date         TEXT,
  expiry_date        TEXT,
  status             TEXT NOT NULL DEFAULT 'pending',
  created_at         TEXT,
  updated_at         TEXT,
  revoked_at         TEXT
);
-- CORE RULE: one row per teacher+class. ALL subjects in that class are included.

CREATE TABLE IF NOT EXISTS users (
  id             INTEGER PRIMARY KEY AUTOINCREMENT,
  username       TEXT NOT NULL UNIQUE,
  full_name      TEXT NOT NULL,
  role           TEXT NOT NULL CHECK (role IN ('superadmin','teacher')),
  password_hash  TEXT NOT NULL,
  created_at     TEXT
);

CREATE TABLE IF NOT EXISTS settings (
  school_id  INTEGER NOT NULL REFERENCES schools(id) ON DELETE CASCADE,
  key        TEXT    NOT NULL,
  value      TEXT,
  PRIMARY KEY (school_id, key)
);

CREATE TABLE IF NOT EXISTS backups (
  id             INTEGER PRIMARY KEY AUTOINCREMENT,
  label          TEXT    NOT NULL,
  created_at     TEXT    NOT NULL,
  size_bytes     INTEGER NOT NULL DEFAULT 0,
  student_count  INTEGER NOT NULL DEFAULT 0,
  class_count    INTEGER NOT NULL DEFAULT 0,
  stream_count   INTEGER NOT NULL DEFAULT 0,
  subject_count  INTEGER NOT NULL DEFAULT 0,
  exam_count     INTEGER NOT NULL DEFAULT 0,
  snapshot       TEXT
);

CREATE INDEX IF NOT EXISTS idx_students_class   ON students(class_id, stream_id);
CREATE INDEX IF NOT EXISTS idx_exams_class_term ON examinations(class_id, year, term);
CREATE INDEX IF NOT EXISTS idx_marks_exam       ON marks(examination_id);
CREATE INDEX IF NOT EXISTS idx_marks_student    ON marks(student_id);
`;

const DB_TABLES=[
  ['schools','School name, motto, logo, current year and term'],
  ['classes','Grade 1 to Grade 9 (those enabled for the school section)'],
  ['streams','Streams inside each class'],
  ['students','Learner name, class and stream (internal ID only)'],
  ['subjects','Subject names and codes'],
  ['class_subjects','Which class takes which subject, and the teacher'],
  ['examinations','Each examination: term, year, class, total marks'],
  ['examination_subjects','Subjects sat in each examination'],
  ['marks','Every mark scored'],
  ['grading_system','Grade bands and points'],
  ['comment_bands','Automatic comment wording by mark range'],
  ['subject_comments','Subject comments edited by hand'],
  ['report_comments','Report card comments edited by hand'],
  ['term_dates','Closing and opening dates for each term'],
  ['users','Staff accounts'],
  ['settings','Other school settings'],
  ['backups','List of saved backups']
];
function buildDbRows(){
  const S=DATA.settings, T={}, skipped={students:0,marks:0};
  DB_TABLES.forEach(t=>T[t[0]]=[]);
  const ids={cls:{},stm:{},stu:{},sub:{},exm:{}};
  const nid=(m,k)=>{ if(!(k in m)) m[k]=Object.keys(m).length+1; return m[k]; };
  const has=(m,k)=>k!=null && k in m;
  T.schools.push({id:1,name:S.schoolName||'School',motto:S.motto||'',logo:S.logo||null,current_year:Number(S.currentYear)||new Date().getFullYear(),current_term:S.currentTerm||'Term 1'});
  scopedClasses().forEach((c,i)=>T.classes.push({id:nid(ids.cls,c.id),school_id:1,name:c.name,level_order:i+1}));
  scopedStreams().forEach(st=>{ if(has(ids.cls,st.classId)) T.streams.push({id:nid(ids.stm,st.id),class_id:ids.cls[st.classId],name:st.name}); });
  scopedStudents().forEach(st=>{
    if(!has(ids.cls,st.classId)){ skipped.students++; return; }
    T.students.push({id:nid(ids.stu,st.id),school_id:1,name:st.name,class_id:ids.cls[st.classId],stream_id:has(ids.stm,st.streamId)?ids.stm[st.streamId]:null,is_graduated:st.graduated?1:0,graduation_year:st.graduationYear!=null?Number(st.graduationYear):null});
  });
  scopedSubjects().forEach(su=>T.subjects.push({id:nid(ids.sub,su.id),school_id:1,name:su.name,code:su.code||''}));
  scopedSubjects().forEach(su=>(su.assignments||[]).forEach(a=>{
    if(has(ids.cls,a.classId)) T.class_subjects.push({class_id:ids.cls[a.classId],subject_id:ids.sub[su.id],teacher_name:a.teacher||''});
  }));
  scopedExams().forEach(e=>{
    if(!has(ids.cls,e.classId)) return;
    const eid=nid(ids.exm,e.id);
    T.examinations.push({id:eid,school_id:1,name:e.name,class_id:ids.cls[e.classId],stream_id:has(ids.stm,e.streamId)?ids.stm[e.streamId]:null,term:e.term,year:Number(e.year),out_of:Number(e.outOf)||100,exam_date:e.date||null});
    const subs=new Set((e.subjects||[]).filter(x=>has(ids.sub,x)));
    subs.forEach(x=>T.examination_subjects.push({examination_id:eid,subject_id:ids.sub[x]}));
    Object.keys(e.results||{}).forEach(stuId=>{
      if(!has(ids.stu,stuId)) return;
      const row=e.results[stuId]||{};
      Object.keys(row).forEach(subId=>{
        const v=row[subId];
        if(v==null||v==='') return;
        const n=Number(v);
        if(!subs.has(subId)||!isFinite(n)||n<0){ skipped.marks++; return; }
        T.marks.push({id:T.marks.length+1,examination_id:eid,student_id:ids.stu[stuId],subject_id:ids.sub[subId],mark:n});
      });
    });
    const putC=(src,withSubject)=>Object.keys(src||{}).forEach(stuId=>{
      if(!has(ids.stu,stuId)) return;
      if(withSubject){
        Object.keys(src[stuId]||{}).forEach(subId=>{
          const t=src[stuId][subId];
          if(t!=null && subs.has(subId)) T.subject_comments.push({examination_id:eid,student_id:ids.stu[stuId],subject_id:ids.sub[subId],comment:String(t)});
        });
      } else if(src[stuId]!=null){
        T.report_comments.push({examination_id:eid,student_id:ids.stu[stuId],comment:String(src[stuId])});
      }
    });
    putC(e.subjectComments,true); putC(e.comments,false);
  });
  [...(S.scale||[])].sort((a,b)=>b.min-a.min).forEach((g,i)=>T.grading_system.push({id:i+1,school_id:1,grade:g.grade,min_mark:Number(g.min),max_mark:g.max!=null?Number(g.max):null,points:g.points!=null?Number(g.points):null,description:g.description||'',sort_order:i+1}));
  (S.comments||[]).forEach(b=>T.comment_bands.push({id:T.comment_bands.length+1,school_id:1,kind:'teacher',min_mark:Number(b.min),max_mark:b.max!=null?Number(b.max):null,comment:b.text}));
  (S.headComments||[]).forEach(b=>T.comment_bands.push({id:T.comment_bands.length+1,school_id:1,kind:'head',min_mark:Number(b.min),max_mark:b.max!=null?Number(b.max):null,comment:b.text}));
  Object.keys(S.termDates||{}).forEach(k=>{
    const i=k.indexOf('|'), d=S.termDates[k]||{};
    T.term_dates.push({school_id:1,year:Number(k.slice(0,i)),term:k.slice(i+1),closing_date:d.closing||null,opening_date:d.opening||null});
  });
  (DATA.users||[]).forEach((u,i)=>T.users.push({id:i+1,username:u.username,full_name:u.name,role:u.role==='superadmin'?'superadmin':'teacher',password_hash:u.passwordHash||'',created_at:u.createdAt||null}));
  T.settings.push({school_id:1,key:'ranking_enabled',value:rankingOn()?'1':'0'});
  T.settings.push({school_id:1,key:'head_comment_handwritten',value:S.headCommentHandwritten?'1':'0'});
  (typeof BACKUPS!=='undefined'?BACKUPS:[]).forEach((b,i)=>T.backups.push({id:i+1,label:b.label,created_at:b.createdAt,size_bytes:b.size||0,student_count:(b.counts&&b.counts.students)||0,class_count:(b.counts&&b.counts.classes)||0,stream_count:(b.counts&&b.counts.streams)||0,subject_count:(b.counts&&b.counts.subjects)||0,exam_count:(b.counts&&b.counts.exams)||0,snapshot:null}));
  return {tables:T,skipped};
}
function sqlQ(v){
  if(v==null) return 'NULL';
  if(typeof v==='number') return isFinite(v)?String(v):'NULL';
  return "'"+String(v).replace(/'/g,"''")+"'";
}
function buildSqlDump(){
  const {tables,skipped}=buildDbRows();
  let out='-- AMBROH database export · '+new Date().toISOString()+'\n-- Load into an EMPTY database, e.g.:  sqlite3 ambroh.db < this_file.sql\n\n'+SCHEMA_SQL+'\nBEGIN TRANSACTION;\n';
  DB_TABLES.forEach(([name])=>{
    tables[name].forEach(r=>{
      const cols=Object.keys(r);
      out+='INSERT INTO '+name+' ('+cols.join(', ')+') VALUES ('+cols.map(c=>sqlQ(r[c])).join(', ')+');\n';
    });
  });
  out+='COMMIT;\n';
  return {sql:out,skipped,tables};
}

/* ============================= INIT ============================= */
let INIT_REPAIRED=0;
(async function init(){
  try{
    dbHandle=await openDB();
    const platform=await dbGet('platform');
    if(platform){
      // New split storage: shared platform row + one row per school.
      DATA=blankData();
      DATA.schools=platform.schools||[];
      DATA.users=platform.users||[];
      DATA.auditLogs=platform.auditLogs||[];
      DATA.teacherClassAccess=platform.teacherClassAccess||[];
      DATA.schoolClassSubs=platform.schoolClassSubs||[];
      DATA.settings=Object.assign(blankData().settings, platform.settings||{});
      for(const sch of DATA.schools){
        let sd;
        try{ sd=await dbGet(schoolRowKey(sch.id)); }catch(err){ sd=null; }
        if(sd){ ACADEMIC_KEYS.forEach(k=>{ DATA[k]=(DATA[k]||[]).concat(sd[k]||[]); }); }
      }
    } else {
      // Legacy fallback: pre-split installs kept everything in one 'data' row.
      // Loaded once here, then the very next save (further down in init, or
      // any edit after) writes it back out in the new split shape.
      const saved=await dbGet('data');
      if(saved){
        DATA=Object.assign(blankData(), saved);
        DATA.settings=Object.assign(blankData().settings, saved.settings||{});
        DATA.users=saved.users||[];
      }
    }
    INIT_REPAIRED=repairData();
  }catch(err){ console.error('Supabase storage unavailable, using in-memory session only.',err); DB_FAILED=true; dbHandle=null; }
  await loadBackups();
  await ensureDefaultAdmin();

  // Multi-school migration (idempotent)
  try{ if(migrateToMultiSchool()) console.info('AMBROH: migrated legacy data to multi-school'); }catch(err){ console.warn(err); }
  try{ if(dedupeClasses()>0){ persist(); console.info('AMBROH: merged duplicate classes'); } }catch(err){ console.warn(err); }
  refreshSchoolSubscriptions();
  // Login required — restore session if the tab still has one, otherwise show the gate.
  bindLoginForm();
  const sid=readSessionUserId();
  const sessionUser=sid ? userById(sid) : null;
  if(sessionUser && !sessionUser.disabled){
    CURRENT_USER=sessionUser;
    // School admin / teacher: bind school context; block if school suspended
    if(!isSuperAdmin(sessionUser)){
      const sch=schoolById(sessionUser.schoolId);
      if(!sch){ clearSession(); CURRENT_USER=null; showLoginGate(); toast('No school linked to this account','error'); }
      else if(!schoolIsAccessible(sch) && !isSuperAdmin(sessionUser)){
        clearSession(); CURRENT_USER=null; showLoginGate();
        // show message on gate
        const err=document.getElementById('login-error');
        if(err){ err.textContent='This school is suspended or expired. Contact AMBROH Super Admin after payment.'; err.classList.add('show'); }
      } else {
        applySchoolContext(sessionUser.schoolId);
        hideLoginGate(); resetNavAnchor('dashboard'); render();
      }
    } else {
      CURRENT_SCHOOL_ID=null;
      hideLoginGate(); resetNavAnchor('superDash'); render();
    }
  } else {
    clearSession(); CURRENT_USER=null; showLoginGate();
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(err){}
  // When AMBROH is run from the Windows app, the local helper closes itself once this page stops checking in.
  if(/^https?:$/.test(location.protocol)) setInterval(()=>{ fetch('/__ping',{cache:'no-store'}).catch(()=>{}); },5000);
  if(DB_FAILED) reportDbError({name:'Unavailable'});
  else if(INIT_REPAIRED>0) problem('Some saved information was damaged, and AMBROH repaired it so you can carry on.','Check your learners, subjects and marks look right. If something is missing, open Backup & Restore and restore your latest backup.',null,'Saved data repaired');
})();
