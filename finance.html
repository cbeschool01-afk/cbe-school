<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#003B70">
<title>CBE.School — Financial Management</title>
<style>
:root{
  --bg:#EAF6FF; --paper:#FFFFFF; --ink:#0E2A44; --ink-soft:#5A7791;
  --line:#C9E4F5; --line-soft:#EAF6FF; --primary:#003B70; --primary-light:#0056A6;
  --primary-soft:#E3F1FC; --accent:#00A86B; --accent-soft:#DFF7EB; --brightgreen:#39D353;
  --gold:#FFC107; --gold-soft:#FFF6DA; --good:#00A86B; --danger:#C0392B; --danger-soft:#FBE2DE;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --radius:10px; --topbar-h:78px;
}
[data-theme="dark"]{
  --bg:#0B1B2B; --paper:#122539; --ink:#EAF3FB; --ink-soft:#93AEC4;
  --line:#1F3A54; --line-soft:#16293D; --accent-soft:#0F3B2C; --danger-soft:#3A2323;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B2B; --paper:#122539; --ink:#EAF3FB; --ink-soft:#93AEC4;
    --line:#1F3A54; --line-soft:#16293D; --accent-soft:#0F3B2C; --danger-soft:#3A2323;
  }
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0 0 4px;color:var(--primary);}
h1{font-size:26px;} h2{font-size:19px;} h3{font-size:15px;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);font-size:13.5px;}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}

#shell{display:flex;flex-direction:column;min-height:100vh;}
#shell-body{display:flex;flex:1;min-height:0;}

#topbar{
  display:flex;align-items:center;gap:16px;padding:14px 26px;min-height:var(--topbar-h);
  background:linear-gradient(100deg,var(--primary) 0%,#00335F 45%,#00603F 88%,#00A86B 100%);
  color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(0,20,45,.22);
}
#topbar .mark{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.5px;line-height:1.1;}
#topbar .tagline{font-size:11.5px;color:#D6F3E6;margin-top:2px;}
#topbar .school{font-size:11px;color:#BFE3FF;margin-top:3px;}
#topbar .brand-text{flex:1;min-width:0;}
#sb-toggle{
  display:none;width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:0;
}
#sb-toggle span{display:block;width:18px;height:2px;background:#fff;border-radius:2px;}

#sidebar{
  width:220px;flex:0 0 220px;color:#F2FAFF;
  background:linear-gradient(190deg,var(--primary) 0%,#00294F 55%,#012B22 100%);
  padding:14px 0 0;display:flex;flex-direction:column;position:sticky;top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h));box-shadow:2px 0 18px rgba(0,20,45,.18);
}
#sidebar::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:linear-gradient(180deg,var(--brightgreen),var(--accent) 45%,var(--gold) 100%);opacity:.9;}
nav.navlist{flex:1;overflow-y:auto;padding:8px 12px;}
.navsec{font-size:10px;color:#7FB6D8;letter-spacing:.8px;padding:14px 6px 6px;}
.navitem{
  display:flex;align-items:center;gap:11px;padding:11px 14px;color:#DCEEFA;text-decoration:none;
  font-size:13.5px;cursor:pointer;border-radius:10px;margin-bottom:3px;
  border-bottom:1px solid rgba(255,255,255,.06);transition:background .15s;
}
.navitem:hover{background:rgba(255,255,255,.08);}
.navitem.active{
  background:linear-gradient(90deg,#00A86B,#39D353 130%);
  box-shadow:inset 3px 0 0 var(--gold),0 4px 12px rgba(0,168,107,.35);
  color:#fff;font-weight:700;
}
.navitem .ico{width:17px;height:17px;flex:0 0 auto;opacity:.85;}
.navitem .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.user-card{margin:8px 12px 0;padding:14px;border-top:1px solid rgba(255,255,255,.14);}
.user-card .uname{font-weight:700;color:#fff;font-size:14px;}
.role-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;background:var(--gold);color:#5C3E00;margin-top:4px;}
.u-logout{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;
  background:rgba(0,20,45,.5);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;
  font-size:13px;padding:10px 12px;border-radius:12px;cursor:pointer;
}
.u-logout:hover{background:rgba(0,20,45,.78);}
.back-link{
  display:block;margin:10px 12px;padding:10px 12px;border-radius:10px;text-align:center;
  background:rgba(255,255,255,.1);color:#DCEEFA;font-size:12.5px;font-weight:600;text-decoration:none;
}
.back-link:hover{background:rgba(255,255,255,.18);}

#main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--primary) 0%,var(--accent) 55%,var(--brightgreen) 100%) 1;}
.pagehead .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  border:1px solid var(--primary-light);background:var(--paper);color:var(--primary-light);padding:8px 14px;
  border-radius:var(--radius);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  transition:background .16s,border-color .16s,transform .1s,box-shadow .16s;
}
.btn:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,59,112,.12);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:#00925C;border-color:#00925C;}
.btn.accent{background:var(--primary-light);border-color:var(--primary-light);color:#fff;}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 12px rgba(0,59,112,.06);}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
.field{margin-bottom:12px;}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}

table.data{font-size:13px;}
table.data th{text-align:left;font-size:10.5px;letter-spacing:.3px;color:var(--ink-soft);font-weight:700;padding:7px 10px;border-bottom:2px solid var(--primary);}
table.data td{padding:8px 10px;border-bottom:1px solid var(--line-soft);}
table.data tbody tr:hover{background:var(--line-soft);}
table.data tfoot td{border-top:2px solid var(--primary);font-weight:700;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.center{text-align:center;}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
.badge.good{background:var(--accent-soft);color:#046A38;}
.badge.mid{background:var(--gold-soft);color:#5C3E00;}
.badge.low{background:var(--danger-soft);color:var(--danger);}
.badge.pending{background:var(--primary-soft);color:var(--primary);}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
@media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 2px 12px rgba(0,59,112,.06);}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--primary);}
.stat .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.stat.accent .n{color:var(--accent);}
.stat.warn .n{color:#B78103;}
.stat.danger .n{color:var(--danger);}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;}
.searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.searchbar input{flex:1;min-width:160px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filters .field{margin-bottom:0;min-width:120px;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--primary);border-bottom-color:var(--accent);}

.modal-bg{position:fixed;inset:0;background:rgba(0,20,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
.modal{background:var(--paper);border-radius:12px;width:100%;max-width:520px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,20,45,.3);}
.modal.wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head .x{cursor:pointer;font-size:18px;color:var(--ink-soft);border:none;background:none;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);}

.toast{position:fixed;bottom:22px;right:22px;max-width:380px;background:var(--primary);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,20,45,.3);display:flex;gap:10px;border-left:5px solid var(--accent);cursor:pointer;}
.toast.success{border-left-color:var(--brightgreen);}
.toast.error{background:#8E2F2F;border-left-color:#FFB4B4;}
.toast.warn{border-left-color:var(--gold);}

#login-gate{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--bg) 0%,#DCEFFB 100%);display:flex;align-items:center;justify-content:center;padding:24px 16px;}
#login-gate.hidden{display:none;}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 40px 28px;width:100%;max-width:400px;box-shadow:0 16px 44px rgba(0,59,112,.16);border-top:5px solid var(--accent);}
.login-card .brand{text-align:center;margin-bottom:26px;}
.login-card .brand .mark{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--primary);}
.login-card .brand .tagline{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
.login-error{background:var(--danger-soft);color:var(--danger);border-left:4px solid var(--danger);padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:14px;display:none;}
.login-error.show{display:block;}
#shell.locked{display:none;}

.small{font-size:12px;color:var(--ink-soft);}
.mono{font-variant-numeric:tabular-nums;}
.right{text-align:right;}
.hint{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.warn-box{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px;}
.ok-box{background:var(--accent-soft);color:#046A38;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px;}
.banner-warn{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;}

@media(max-width:860px){
  :root{--topbar-h:64px;}
  #sb-toggle{display:flex;}
  #sidebar{width:240px;position:fixed;left:0;top:var(--topbar-h);z-index:60;height:calc(100vh - var(--topbar-h));transform:translateX(-100%);transition:transform .22s;}
  #sidebar.open{transform:translateX(0);}
  #sidebar-backdrop{display:none;position:fixed;left:0;right:0;top:var(--topbar-h);bottom:0;z-index:59;background:rgba(3,15,12,.5);}
  #sidebar-backdrop.show{display:block;}
  #main{padding:18px 16px 40px;max-width:100%;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  :root{--topbar-h:56px;}
  #topbar{padding:10px 12px;}
  #topbar .mark{font-size:16px;}
  #main{padding:14px 10px 32px;}
  .stat-row{grid-template-columns:1fr;}
  .pagehead{flex-direction:column;align-items:flex-start;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<body>

<div id="login-gate" class="no-print">
  <div class="login-card" id="login-card-main">
    <div class="brand">
      <div class="mark">CBE.School</div>
      <div class="tagline">Financial Management</div>
    </div>
    <div class="login-error" id="login-error" role="alert"></div>
    <p class="small" style="text-align:center;margin-bottom:14px;">Use the same email and password you use for CBE.School Analytics.</p>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="login-user">Email address</label>
        <input type="email" id="login-user" name="username" required autocomplete="email" placeholder="Enter your email" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn primary" id="login-btn" style="width:100%;justify-content:center;padding:11px;font-size:14px;">Sign in</button>
    </form>
    <p class="small" style="text-align:center;margin-top:16px;">
      <a href="index.html" id="link-analytics" style="color:var(--primary-light);font-weight:600;">← Back to Analytics</a>
    </p>
  </div>
</div>

<div id="shell" class="locked">
  <div id="topbar" class="no-print">
    <button id="sb-toggle" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
    <div class="brand-text">
      <div class="mark">CBE.School Finance</div>
      <div class="tagline">School Fees · Remedial Fees</div>
      <div class="school" id="sb-school">—</div>
    </div>
  </div>

      <nav class="navlist" id="navlist"></nav>

      <div class="user-card" id="user-chip"></div>
    </aside>

    <main id="main"></main>
  </div>
</div>

<div id="toast-root"></div>

<script>
/* ============================================================
   CBE.School Finance Module
   Separate HTML – shares Supabase, Clerk, schools, learners,
   classes and permissions with the Analytics system.
   ============================================================ */

const SUPABASE_URL = 'https://enlgjmtmytwcafugldxp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PsrcRetHOg9cgxVNG-Ztgw_CAlYCzaV';
/* Where Analytics lives relative to this file. finance/index.html -> '../index.html'; same folder -> './index.html' */
const ANALYTICS_URL = './index.html';

let dbHandle = null;
let CURRENT_USER = null;          // { id, email, name }
let IS_PLATFORM_ADMIN = false;
let PLATFORM_ROLE = null;
let MY_SCHOOL_ROLE = {};          // schoolId -> role
let MY_CLASS_ROLE = {};           // classId -> role
let DATA = { schools: [], classes: [], students: [], streams: [] };
let DATA_LOADED = false;
let STATE = { page: 'dashboard', params: {} };
let ACCESS = {};                   // schoolId -> finance_school_access row (owner-controlled)
let FILTERS = { schoolId: '', classId: '', year: '', term: '', feeType: '' };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const money = n => Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);

function toast(msg, type='info'){
  const root = $('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='error'?'error':type==='success'?'success':type==='warn'?'warn':'');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.onclick = () => el.remove();
  root.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

function openModal(html, wide){
  const root = $('modal-root');
  root.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal ${wide?'wide':''}">${html}</div></div>`;
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  $('modal-bg').onclick = e => { if(e.target.id==='modal-bg') closeModal(); };
}
function closeModal(){ $('modal-root').innerHTML = ''; }

/* ---------- Supabase + Clerk ---------- */
function openDB(){
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    accessToken: async () => {
      try { return (window.Clerk && window.Clerk.session) ? await window.Clerk.session.getToken() : null; }
      catch(e){ return null; }
    }
  });
}
async function sbOk(q){ const r = await q; if(r.error) throw r.error; return r.data; }

async function loadMemberships(userId){
  const [sm, cm, pa, pr] = await Promise.all([
    sbOk(dbHandle.from('app_school_members').select('school_id,role').eq('user_id', userId)),
    sbOk(dbHandle.from('app_class_members').select('class_id,role').eq('user_id', userId)),
    sbOk(dbHandle.from('platform_admins').select('user_id').eq('user_id', userId).maybeSingle()),
    sbOk(dbHandle.from('platform_roles').select('role,permissions,active').eq('user_id', userId).maybeSingle()).catch(()=>null)
  ]);
  MY_SCHOOL_ROLE = {}; (sm||[]).forEach(m => MY_SCHOOL_ROLE[m.school_id] = m.role);
  MY_CLASS_ROLE = {}; (cm||[]).forEach(m => MY_CLASS_ROLE[m.class_id] = m.role);
  IS_PLATFORM_ADMIN = !!pa;
  PLATFORM_ROLE = pr;
}

async function loadSchoolsAndLearners(){
  /* Reuse the exact same tables the Analytics app uses.
     We only need school metadata + class/learner lists. */
  const [schools, classes] = await Promise.all([
    sbOk(dbHandle.from('app_schools').select('id,value')),
    sbOk(dbHandle.from('app_classes').select('id,school_id,value'))
  ]);
  DATA.schools = [];
  DATA.classes = [];
  DATA.students = [];
  DATA.streams = [];
  (schools||[]).forEach(r => {
    const v = r.value || {};
    if(v.school) DATA.schools.push(Object.assign({id:r.id}, v.school));
  });
  (classes||[]).forEach(r => {
    const v = r.value || {};
    if(!v.class) return;
    const cls = Object.assign({id:r.id, schoolId:r.school_id}, v.class);
    DATA.classes.push(cls);
    (v.students||[]).forEach(s => {
      if(s && !s.schoolId) s.schoolId = r.school_id;
      if(s) DATA.students.push(s);
    });
    (v.streams||[]).forEach(st => {
      if(st && !st.schoolId) st.schoolId = r.school_id;
      if(st) DATA.streams.push(st);
    });
  });
  DATA.classes.sort((a,b) => String(a.name||'').localeCompare(String(b.name||'')));
}

/* ---------- Permission helpers (mirror Analytics) ---------- */
function platformRole(){
  if(PLATFORM_ROLE) return PLATFORM_ROLE.active ? PLATFORM_ROLE.role : null;
  return IS_PLATFORM_ADMIN ? 'owner' : null;
}
function isPlatformAdmin(){ return !!platformRole(); }
function isOwner(){ return ['owner','platform_owner'].includes(String(platformRole()||'').trim().toLowerCase().replace(/\s+/g,'_')); }
function financeEnabled(sid){ return !!(ACCESS[sid] && ACCESS[sid].enabled); }
function schoolRole(sid){ return MY_SCHOOL_ROLE[sid] || null; }
function isSchoolAdminFor(sid){
  if(isPlatformAdmin()) return true;
  const r = schoolRole(sid);
  return r === 'owner' || r === 'school_admin';
}
function isClassTeacherFor(cid){
  if(isPlatformAdmin()) return true;
  return MY_CLASS_ROLE[cid] === 'class_teacher' || MY_CLASS_ROLE[cid] === 'subject_teacher' || !!MY_CLASS_ROLE[cid];
}
function canAccessSchoolFees(sid){
  return financeEnabled(sid) && isSchoolAdminFor(sid);
}
function canAccessRemedial(sid, cid){
  if(!financeEnabled(sid)) return false;
  if(isSchoolAdminFor(sid)) return true;

/* ---------- Finance data access ---------- */
/* Supabase caps every request at 1,000 rows. Page through the results so
   dashboard totals and reports are never silently truncated. */
async function fetchPaged(build){
  const size = 1000; let from = 0; const out = [];
  for(;;){
    const rows = await sbOk(build().range(from, from + size - 1));
    out.push(...(rows || []));
    if(!rows || rows.length < size) break;
    from += size;
    if(from > 500000) break;           // safety stop
  }
  return out;
}

/**
 * Balance formula (section 7):
 * Outstanding = Total Charges + Adjustments − Approved/Confirmed Payments
 * Pending and rejected remedial submissions do NOT reduce the balance.
 * Negative outstanding is shown as Credit / Overpayment (never forced to 0).
 */
function computeBalances(learners, charges, payments, adjustments){
  const map = {};
  learners.forEach(l => {
    map[l.id] = {
      learner: l,
      schoolCharged: 0, schoolPaid: 0, schoolAdj: 0,
      remedialCharged: 0, remedialPaid: 0, remedialAdj: 0
    };
  });
  charges.forEach(c => {
    if(!map[c.learner_id]) return;
    if(c.fee_type === 'school') map[c.learner_id].schoolCharged += Number(c.amount)||0;
    else map[c.learner_id].remedialCharged += Number(c.amount)||0;
  });
  payments.forEach(p => {
    if(!map[p.learner_id]) return;
    if(p.fee_type === 'school') map[p.learner_id].schoolPaid += Number(p.amount)||0;
    else map[p.learner_id].remedialPaid += Number(p.amount)||0;
  });
  adjustments.forEach(a => {
    if(!map[a.learner_id]) return;
    if(a.fee_type === 'school') map[a.learner_id].schoolAdj += Number(a.amount)||0;
    else map[a.learner_id].remedialAdj += Number(a.amount)||0;
  });
  Object.values(map).forEach(r => {
    r.schoolOutstanding = r.schoolCharged + r.schoolAdj - r.schoolPaid;
    r.remedialOutstanding = r.remedialCharged + r.remedialAdj - r.remedialPaid;
    r.schoolStatus = balanceStatus(r.schoolCharged + r.schoolAdj, r.schoolPaid, r.schoolOutstanding);
    r.remedialStatus = balanceStatus(r.remedialCharged + r.remedialAdj, r.remedialPaid, r.remedialOutstanding);
  });
  return map;
}
/** Fully Paid | Partially Paid | Unpaid | Credit (overpayment) */
function balanceStatus(charged, paid, outstanding){
  if(charged <= 0 && paid <= 0) return 'Unpaid';
  if(outstanding < -0.009) return 'Credit';
  if(Math.abs(outstanding) <= 0.009) return 'Fully Paid';
  if(paid > 0.009) return 'Partially Paid';
  return 'Unpaid';
}
function statusBadge(status){
  const map = {
    'Fully Paid': 'good',
    'Partially Paid': 'mid',
    'Unpaid': 'low',
    'Credit': 'pending',
    'Pending Approval': 'pending',
    'Approved': 'good',
    'Rejected': 'low'
  };
  return '<span class="badge '+(map[status]||'mid')+'">'+esc(status)+'</span>';
}
function downloadCsv(filename, rows){
  if(!rows || !rows.length){ toast('Nothing to export','warn'); return; }
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')].concat(rows.map(r =>
    headers.map(h => {
      const v = r[h]==null ? '' : String(r[h]);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(',')
  ));
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function showLearnerRecord(learnerId){
  const l = studentById(learnerId);
  if(!l) return toast('Learner not found','error');
  const canSF = canAccessSchoolFees(l.schoolId);
  const canRem = canAccessRemedial(l.schoolId, l.classId);
  if(!canSF && !canRem) return toast('Not authorised','error');

  const year = FILTERS.year || '', term = FILTERS.term || '';
  const opts = { learnerId, schoolId: l.schoolId, year: year||undefined, term: term||undefined };
  let charges=[], payments=[], adjustments=[], pending=[];
  try{
    [charges, payments, adjustments, pending] = await Promise.all([
      fetchCharges(opts),
      fetchPayments(opts),
      fetchAdjustments(opts),
      canRem ? fetchSubmissions({ schoolId:l.schoolId, learnerId, status:'pending' }).catch(()=>[]) : []
    ]);
  }catch(e){ toast(e.message,'error'); return; }

  const schoolCh = charges.filter(c=>c.fee_type==='school');
  const schoolPay = payments.filter(p=>p.fee_type==='school');
  const schoolAdj = adjustments.filter(a=>a.fee_type==='school');
  const remCh = charges.filter(c=>c.fee_type==='remedial');
  const remPay = payments.filter(p=>p.fee_type==='remedial');
  const remAdj = adjustments.filter(a=>a.fee_type==='remedial');

  const sCharged = schoolCh.reduce((n,c)=>n+Number(c.amount),0) + schoolAdj.reduce((n,a)=>n+Number(a.amount),0);
  const sPaid = schoolPay.reduce((n,p)=>n+Number(p.amount),0);
  const rCharged = remCh.reduce((n,c)=>n+Number(c.amount),0) + remAdj.reduce((n,a)=>n+Number(a.amount),0);
  const rPaid = remPay.reduce((n,p)=>n+Number(p.amount),0);

  openModal(`<div class="modal-head"><h2>${esc(l.name)}</h2><button class="x" data-close>✕</button></div>
    <p class="small">${esc(schoolById(l.schoolId)?.name||'')} · ${esc(classById(l.classId)?.name||'')} · ID ${esc(l.id)}${l.admNo?' · Adm '+esc(l.admNo):''}</p>
    <div class="grid cols-2" style="margin:14px 0;">
      ${canSF?`<div class="stat"><div class="n" style="font-size:20px;">${money(sCharged-sPaid)}</div><div class="l">School fees outstanding</div>
        <div class="small" style="margin-top:6px;">Charged ${money(sCharged)} · Paid ${money(sPaid)}</div></div>`:''}
      ${canRem?`<div class="stat"><div class="n" style="font-size:20px;">${money(rCharged-rPaid)}</div><div class="l">Remedial outstanding</div>
        <div class="small" style="margin-top:6px;">Charged ${money(rCharged)} · Paid ${money(rPaid)}</div></div>`:''}
    </div>
    ${canSF?`<h3 style="margin-top:12px;">School fee payments</h3>
      <table class="data"><thead><tr><th>Date</th><th class="num">Amount</th><th>Method</th><th>Ref</th></tr></thead>
      <tbody>${schoolPay.map(p=>`<tr><td>${esc(p.payment_date)}</td><td class="num">${money(p.amount)}</td><td>${esc(p.method||'—')}</td><td>${esc(p.reference||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="small">No payments yet.</td></tr>'}</tbody></table>`:''}
    ${canRem?`<h3 style="margin-top:12px;">Approved remedial payments</h3>
      <table class="data"><thead><tr><th>Date</th><th class="num">Amount</th><th>Method</th><th>Ref</th></tr></thead>
      <tbody>${remPay.map(p=>`<tr><td>${esc(p.payment_date)}</td><td class="num">${money(p.amount)}</td><td>${esc(p.method||'—')}</td><td>${esc(p.reference||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="small">No approved payments yet.</td></tr>'}</tbody></table>
      ${pending.length?`<p class="small" style="margin-top:8px;"><span class="badge pending">${pending.length} pending submission(s)</span></p>`:''}`:''}

function modalSetFees(feeType){
  const schools = accessibleSchools().filter(s => canAccessSchoolFees(s.id));
  const sid = FILTERS.schoolId || schools[0]?.id;
  const classes = accessibleClasses(sid);
  openModal(`<div class="modal-head"><h2>Set ${feeType==='remedial'?'remedial':'school'} fees</h2><button class="x" data-close>✕</button></div>
    <div class="field"><label>School</label><select id="m-school">${schools.map(s=>`<option value="${esc(s.id)}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Class (leave blank for school-wide)</label>
      <select id="m-class"><option value="">All classes / school default</option>
      ${classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="grid cols-2">
      <div class="field"><label>Academic year</label><select id="m-year">${yearsAvailable().map(y=>`<option value="${esc(y)}" ${FILTERS.year===y?'selected':''}>${esc(y)}</option>`).join('')}</select></div>
      <div class="field"><label>Term</label><select id="m-term">${termsAvailable().map(t=>`<option value="${esc(t)}" ${FILTERS.term===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Amount</label><input type="number" id="m-amount" min="0" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>Description (optional)</label><input type="text" id="m-desc" placeholder="e.g. Term 1 school fees"></div>
    <div class="field"><label>Apply to</label>
      <select id="m-scope"><option value="structure">Fee structure (default for class / school)</option>
      <option value="all-learners">Create charge for every current learner in the class</option></select></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m-save">Save</button></div>`);
  $('m-save').onclick = async () => {
    const schoolId = $('m-school').value;
    const classId = $('m-class').value || null;
    const year = $('m-year').value;
    const term = $('m-term').value;
    const amount = Number($('m-amount').value);
    const desc = $('m-desc').value.trim();
    const scope = $('m-scope').value;
    if(!year || !term || !(amount>=0)) return toast('Year, term and amount are required','error');
    try{
      const structId = uid('fs');
      await sbOk(dbHandle.from('finance_fee_structures').upsert({
        id: structId, school_id: schoolId, academic_year: year, term, fee_type: feeType,
        class_id: classId, amount, description: desc||null, created_by: CURRENT_USER.id, updated_at: new Date().toISOString()
      }, { onConflict: 'school_id,academic_year,term,fee_type,class_id' }));
      if(scope === 'all-learners'){
        const learners = accessibleStudents(schoolId, classId||undefined);
        if(!learners.length) toast('No learners found for that class','warn');
        else {
          const rows = learners.map(l => ({
            id: uid('ch'), school_id: schoolId, learner_id: l.id, class_id: l.classId,
            academic_year: year, term, fee_type: feeType, amount, description: desc||null, created_by: CURRENT_USER.id
          }));
          /* One base charge per learner/term/fee type (DB-enforced).
             Existing charges are skipped; use Adjustment to change them. */
          let created = 0;
          for(let i=0;i<rows.length;i+=40){
            const done = await sbOk(dbHandle.from('finance_charges')
              .upsert(rows.slice(i,i+40), { onConflict:'learner_id,academic_year,term,fee_type', ignoreDuplicates:true })
              .select('id'));
            created += (done||[]).length;
          }
          const skipped = rows.length - created;
          toast(`Fees set for ${created} learner(s)` + (skipped ? ` · ${skipped} already charged (use Adjustment to change)` : ''), skipped && !created ? 'warn' : 'success');
        }
      } else toast('Fee structure saved','success');
      closeModal(); render();
    }catch(e){ toast(e.message||'Save failed','error'); }
  };
}

async function reviewSubmission(id, action){
  if(action==='reject'){
    const reason = prompt('Rejection reason (visible to the teacher):');
    if(reason===null) return;
    try{
      await sbOk(dbHandle.rpc('finance_review_submission', { p_submission_id: id, p_action: 'reject', p_reason: reason||'Rejected' }));
      toast('Submission rejected','success'); render();
    }catch(e){ toast(e.message||'Failed','error'); }
    return;
  }
  try{
    await sbOk(dbHandle.rpc('finance_review_submission', { p_submission_id: id, p_action: 'approve', p_reason: null }));
    toast('Payment approved — balance updated','success'); render();
  }catch(e){ toast(e.message||'Failed','error'); }
}

        return `<tr><td><strong>${esc(s.name||s.id)}</strong></td>
          <td>${on ? '<span class="badge good">Enabled</span>' : '<span class="badge low">Not enabled</span>'}</td>
          <td>${on ? esc(at) : '—'}</td>
          <td>${on
            ? `<button class="btn sm danger" data-access="${esc(s.id)}" data-enable="0">Disable</button>`
            : `<button class="btn sm primary" data-access="${esc(s.id)}" data-enable="1">Enable</button>`}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="small">No schools found.</td></tr>'}</tbody></table>
    </div>`;
}
async function toggleAccess(sid, enable){
  const name = schoolById(sid)?.name || sid;
  if(!enable && !confirm(`Disable Finance for ${name}? Its admins and teachers will lose access immediately. Existing records are kept.`)) return;
  try{
    await sbOk(dbHandle.rpc('finance_set_school_access', { p_school_id: sid, p_enabled: enable, p_note: null }));
    await loadAccess();
    if(FILTERS.schoolId && !financeEnabled(FILTERS.schoolId)) FILTERS.schoolId = '';
    renderNav();
    toast(`Finance ${enable ? 'enabled' : 'disabled'} for ${name}`, 'success');
    render();
  }catch(e){ toast(e.message || 'Failed', 'error'); }
}

async function render(){

  main.innerHTML = `<div class="panel" style="text-align:center;padding:40px;"><div class="small">Loading…</div></div>`;
  let html = '';
  try{
    if(STATE.page==='dashboard') html = await pageDashboard();
    else if(STATE.page==='school-fees') html = await pageSchoolFees();
    else if(STATE.page==='remedial') html = await pageRemedial();
    else if(STATE.page==='learner') html = await pageLearner();
    else if(STATE.page==='reports') html = await pageReports();
    else if(STATE.page==='access') html = await pageAccess();
    else html = await pageDashboard();

const CLERK_PUBLISHABLE_KEY = 'pk_test_aGFybWxlc3MtbW9sZS0zMjgzLmNsZXJrLmFjY291bnRzLmRldiQ';

let clerkPromise = null;
function loadClerk(){
  if(clerkPromise) return clerkPromise;
  clerkPromise = new Promise((resolve, reject) => {
    if(window.Clerk){
      window.Clerk.load().then(() => resolve(window.Clerk)).catch(reject);
      return;
    }
    let host = '';
    try{ host = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).replace(/\$$/,''); }catch(e){}
    if(!host || /REPLACE/.test(CLERK_PUBLISHABLE_KEY)){
      return reject(new Error('Sign-in is not configured. The Clerk publishable key is missing.'));
    }
    const s = document.createElement('script');
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.setAttribute('data-clerk-publishable-key', CLERK_PUBLISHABLE_KEY);
    s.src = 'https://' + host + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
    s.onload = async () => {
      try{ await window.Clerk.load(); resolve(window.Clerk); }
      catch(e){ reject(e); }

    s.onerror = () => reject(new Error('Cannot reach the sign-in service. Check your internet connection.'));

function showLoginError(msg){
  const el = $('login-error');
  if(!el) return;
  if(!msg){ el.classList.remove('show'); el.textContent = ''; return; }
  el.textContent = msg;
  el.classList.add('show');
}

async function afterSignIn(user){
  CURRENT_USER = {
    id: user.id,
    email: (user.primaryEmailAddress && user.primaryEmailAddress.emailAddress)
        || (user.emailAddresses && user.emailAddresses[0] && user.emailAddresses[0].emailAddress)
        || '',
    name: user.fullName || user.firstName || user.username || 'User'
  };
  dbHandle = openDB();
  try{
    await loadMemberships(CURRENT_USER.id);
    await loadSchoolsAndLearners();
    await loadAccess().catch(e => { console.warn('finance_school_access', e); ACCESS = {}; });
    DATA_LOADED = true;
  }catch(e){
    console.error(e);
    showLoginError('Signed in, but school data could not be loaded: ' + (e.message || e));
    return;
  }
  $('login-gate').classList.add('hidden');
  $('shell').classList.remove('locked');
  renderUserChip();
  renderNav();
  goto('dashboard');
}

async function signOut(){
  try{
    const Cl = await loadClerk();
    if(Cl) await Cl.signOut();
  }catch(e){}
  CURRENT_USER = null;
  DATA_LOADED = false;
  DATA = { schools:[], classes:[], students:[], streams:[] };
  MY_SCHOOL_ROLE = {};
  MY_CLASS_ROLE = {};
  $('shell').classList.add('locked');
  $('login-gate').classList.remove('hidden');
  location.reload();
}

async function doPasswordSignIn(email, password){
  const Cl = await loadClerk();
  if(Cl.session) await Cl.signOut();
  const result = await Cl.client.signIn.create({
    identifier: email,
    password: password
  });
  if(result.status === 'complete'){
    await Cl.setActive({ session: result.createdSessionId });
    return { ok: true, user: Cl.user };
  }
  /* Handle extra steps (e.g. 2FA) if configured later */
  if(result.status === 'needs_second_factor'){
    return { ok: false, msg: 'Two-factor authentication is required. Complete it in Analytics first, then open Finance.' };
  }
  return { ok: false, msg: 'Sign-in could not be completed. Check your email and password.' };
}

function friendlyAuthError(err){
  const code = (err && err.errors && err.errors[0] && err.errors[0].code) || '';
  const msg = (err && err.errors && err.errors[0] && (err.errors[0].longMessage || err.errors[0].message))
           || (err && err.message) || '';
  if(code === 'form_identifier_not_found' || code === 'form_password_incorrect')
    return 'Incorrect email or password.';
  if(code === 'too_many_requests' || (err && err.status === 429))
    return 'Too many attempts. Please wait a minute and try again.';
  if(code === 'session_exists')
    return 'You already have an active session. Refresh the page.';
  return msg || 'Sign-in failed. Please try again.';
}

async function onLoginSubmit(e){
  e.preventDefault();
  showLoginError('');
  const email = ($('login-user').value || '').trim().toLowerCase();
  const password = $('login-pass').value || '';
  if(!email || !password){
    showLoginError('Enter your email and password.');
    return;
  }
  const btn = $('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try{
    const r = await doPasswordSignIn(email, password);
    if(!r.ok){
      showLoginError(r.msg || 'Sign-in failed.');
      return;
    }
    await afterSignIn(r.user || (await loadClerk()).user);
  }catch(err){
    console.error(err);
    showLoginError(friendlyAuthError(err));
  }finally{
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

async function initAuth(){
  try{
    const Cl = await loadClerk();
    /* Already signed in (same browser session as Analytics) → enter Finance immediately */
    if(Cl.user && Cl.session){
      await afterSignIn(Cl.user);
      return;
    }
  }catch(e){
    console.warn('Clerk load', e);
    showLoginError(e.message || 'Could not load sign-in service.');
  }
  /* Show email/password form (same credentials as Analytics) */
  const form = $('login-form');
  if(form) form.addEventListener('submit', onLoginSubmit);
}
